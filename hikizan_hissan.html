<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひき算の ひっ算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;}
body{background:#f5f0e8;font-family:'Noto Sans JP',sans-serif;position:relative;}
#app-stage{position:absolute;top:0;left:0;width:1040px;transform-origin:0 0;opacity:0;}

.app-header{background:linear-gradient(135deg,#ff8a5c,#e35d3a);color:#fff;text-align:center;
  padding:10px 16px 8px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.app-header h1{font-size:20px;font-weight:900;letter-spacing:2px;}

.input-area{background:#fff;border-bottom:2px solid #ddd;padding:10px 12px;}
.input-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}
.input-row label{font-size:13px;font-weight:bold;color:#555;}
.num-input{width:72px;padding:6px 8px;font-size:18px;font-weight:bold;text-align:center;
  border:2px solid #aaa;border-radius:8px;font-family:'Noto Sans JP',sans-serif;}
.num-input:focus{border-color:#e35d3a;outline:none;}
.minus-label{font-size:22px;font-weight:bold;color:#e35d3a;}
.gen-btn{padding:7px 20px;font-size:14px;font-weight:bold;border:none;border-radius:20px;
  background:linear-gradient(135deg,#ff8a5c,#e35d3a);color:#fff;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;box-shadow:0 2px 6px rgba(227,93,58,.3);transition:all .2s;}
.gen-btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(227,93,58,.4);}
.preset-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px;}
.problem-btn{padding:4px 11px;font-size:12px;font-weight:bold;border:2px solid #ccc;
  border-radius:16px;background:#fff;cursor:pointer;transition:all .2s;
  font-family:'Noto Sans JP',sans-serif;}
.problem-btn.active{background:#e35d3a;color:#fff;border-color:#c44a2a;}
.problem-btn:hover:not(.active){background:#ffe9e0;border-color:#e35d3a;}
.settings-open-btn{padding:7px 16px;font-size:14px;font-weight:bold;border:2px solid #cbd5e1;border-radius:20px;
  background:#fff;color:#475569;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  font-family:'Noto Sans JP',sans-serif;box-shadow:0 2px 5px rgba(0,0,0,.06);transition:all .2s;margin-left:8px;}
.settings-open-btn:hover{background:#f1f5f9;border-color:#94a3b8;color:#1e293b;transform:translateY(-1px);}

/* 設定モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:9999;opacity:0;transition:opacity .2s ease;}
.modal-overlay.open{display:flex;opacity:1;}
.modal-card{background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(0,0,0,.22);width:90%;max-width:560px;
  overflow:hidden;transform:scale(.92);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;}
.modal-overlay.open .modal-card{transform:scale(1);}
.modal-header{background:linear-gradient(135deg,#ff8a5c,#e35d3a);color:#fff;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;}
.modal-header h2{font-size:17px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.modal-close-btn{background:none;border:none;color:#fff;font-size:24px;line-height:1;cursor:pointer;
  padding:2px 8px;border-radius:50%;transition:background .2s;display:flex;align-items:center;justify-content:center;}
.modal-close-btn:hover{background:rgba(255,255,255,.2);}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:18px;max-height:80vh;overflow-y:auto;}
.setting-section{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid #edf2f7;}
.setting-section:last-child{border-bottom:none;padding-bottom:0;}
.setting-title{font-size:14px;font-weight:bold;color:#334155;display:flex;align-items:center;gap:6px;}
.setting-desc{font-size:12px;color:#64748b;line-height:1.5;}
.setting-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.setting-btn{padding:8px 16px;font-size:13px;font-weight:bold;border:2px solid #cbd5e1;
  border-radius:12px;background:#fff;color:#475569;cursor:pointer;transition:all .18s;
  font-family:'Noto Sans JP',sans-serif;display:inline-flex;align-items:center;gap:6px;}
.setting-btn.active{background:#e35d3a;color:#fff;border-color:#c44a2a;box-shadow:0 3px 8px rgba(227,93,58,.3);}
.setting-btn:hover:not(.active){background:#f8fafc;border-color:#94a3b8;}

.gap-setting-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding:8px 12px;background:#f8fafc;border-radius:10px;}
.gap-setting-label{font-size:12px;color:#64748b;font-weight:bold;}
.gap-input{width:60px;padding:4px 8px;font-size:14px;font-weight:bold;text-align:center;
  border:2px solid #cbd5e1;border-radius:8px;font-family:'Noto Sans JP',sans-serif;}
.gap-input:focus{border-color:#e35d3a;outline:none;}
.err-msg{color:#e74c3c;font-size:12px;font-weight:bold;text-align:center;margin-top:4px;display:none;}

.main-area{display:flex;gap:12px;padding:12px 8px;width:100%;max-width:none;margin:0;
  align-items:flex-start;justify-content:center;overflow:visible;}

/* 数図ブロックは問題ごとに縦横同比率で拡大する。transformはレイアウト寸法を
   変えないため、tile-slotが拡大後の実占有幅・高さを受け持つ。 */
.tile-slot{flex:0 0 auto;position:relative;overflow:visible;}

/* ===== タイル図エリア：<table>で列位置を保証 ===== */
.tile-area{display:inline-block;width:max-content;background:#fff;border-radius:12px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative;overflow:visible;transform-origin:top left;}

#tile-table{border-collapse:collapse;table-layout:fixed;border-radius:12px;overflow:hidden;}

/* col要素は表示/非表示と幅をJSが一括設定する。
   theadとtbodyが同じ<col>を共有するため、列のズレは構造的に発生しない。*/
#tile-table col.col-label{width:28px;}
#tile-table col.col-sen{width:143px;}
#tile-table col.col-hyaku{width:161px;}
#tile-table col.col-juu{width:161px;}
#tile-table col.col-ichi{width:143px;}

#tile-table thead th{
  font-size:10px;font-weight:bold;padding:6px 0;height:30px;
  box-sizing:border-box;border-bottom:2px solid #ddd;
}
#tile-table th.th-label{background:#fafafa;}
#tile-table th.th-sen  {background:#ffffff;color:#555;}
#tile-table th.th-hyaku{background:#cce8f4;color:#1a5276;}
#tile-table th.th-juu  {background:#fff9cc;color:#6b5700;}
#tile-table th.th-ichi {background:#fce4ec;color:#880e4f;}

#tile-table tbody td{
  position:relative;text-align:center;vertical-align:middle;
  box-sizing:border-box;height:112px;border-bottom:1px dashed #e0e0e0;
}
#tile-table tbody tr:last-child td{border-bottom:none;}
#tile-table tbody tr.tile-result-row td{border-top:3px solid #444;height:122px;}

#tile-table td.td-label{font-size:15px;font-weight:bold;color:#4a9eff;background:#fff;}
#tile-table td.td-label.minus{color:#e35d3a;}
#tile-table td.td-label.equals{color:#27ae60;font-size:17px;}

#tile-table td.td-hyaku{background:#e8f4fb;}
#tile-table td.td-juu  {background:#fffde7;}
#tile-table td.td-ichi {background:#fce4ec;}
#tile-table td.td-sen  {background:#ffffff;}

/* 列の縦の仕切り線（border-rightをセル単位で。theadとtbodyの両方に同じ値を指定）*/
#tile-table th.th-sen,#tile-table td.td-sen{border-right:2px solid #999;}
#tile-table th.th-hyaku,#tile-table td.td-hyaku{border-right:2px solid #85c1e9;}
#tile-table th.th-juu,  #tile-table td.td-juu  {border-right:2px solid #f0d800;}

#anim-layer{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:100;}

/* 一の位に繰り下げた「10の塊」の半透明な痕跡表示用レイヤー。
   anim-layerと違い、ステップを進めても内容をクリアしない永続レイヤーとして扱う
   （paintTiles()がステップの状態に応じて毎回描き直す）。*/
#bridge10-layer{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:90;}

/* 百の位から十の位へくり下げた「10本の10」の半透明な痕跡表示用レイヤー。
   bridge10-layerと同じ考え方の永続レイヤー。 */
#bridge100-layer{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:90;}

/* せんのくらいから百のくらいへくり下げた「10まいの100」の半透明な痕跡表示用レイヤー。
   bridge10-layer／bridge100-layerと同じ考え方の永続レイヤー。 */
#bridge1000-layer{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:90;}

.right-panel{flex:0 0 auto;width:auto;display:flex;flex-direction:column;gap:10px;min-width:0;}
/* ===== 筆算＋テキストの可変ズーム =====
   数図ブロックの表（.tile-area）が桁数やくり下げの都合で縦に大きくなったとき、
   筆算・テキストの中身が相対的に小さく見えるのを防ぐため、JS(syncRightPanelZoom)で
   ひっ算svgとテキスト部分の中身だけをtransform:scale()で拡大する。
   hissan-box・step-box自体の幅は今まで通り右カラムいっぱいに広がったままにし、
   拡大の必要がない問題（表があまり大きくならない問題）では今までとまったく同じ
   大きさのまま（＝縮み込むことはない）にするのがポイント。 */
#hissan-scale-outer{position:relative;}
#step-scale-outer{position:relative;}
#step-scale-inner{width:230px;margin:0 auto;}
.hissan-box{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);
  padding:10px 14px 14px;}
.hissan-title{font-size:12px;font-weight:bold;color:#666;margin-bottom:4px;text-align:center;}
.hissan-inner{display:flex;justify-content:center;align-items:center;}
#hissan-svg{display:block;}

.step-box{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);
  padding:12px 14px;min-height:100px;}
.step-number{display:inline-block;background:#4a9eff;color:#fff;border-radius:50%;
  width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;
  font-weight:bold;margin-right:6px;}
.step-title{font-size:14px;font-weight:bold;color:#333;margin-bottom:8px;display:flex;align-items:center;}
.step-desc{font-size:13px;color:#444;line-height:1.9;min-height:100px;height:auto;overflow:visible;
  padding-right:4px;}
.step-desc .ic{color:#c2185b;font-weight:bold;}
.step-desc .jc{color:#b7950b;font-weight:bold;}
.step-desc .hc{color:#1a5276;font-weight:bold;}
.step-desc .sc{color:#555;font-weight:bold;}
.step-desc .cc{color:#e74c3c;font-weight:bold;}
.step-desc .ac{color:#1a7f37;font-weight:bold;}
.step-desc .rc{color:#7f3fbf;font-weight:bold;}

.nav-area{display:flex;justify-content:center;align-items:center;gap:12px;
  padding:10px 12px;background:#fff;border-top:2px solid #eee;}
.nav-btn{padding:10px 24px;font-size:15px;font-weight:bold;border:none;border-radius:25px;
  cursor:pointer;transition:all .2s;font-family:'Noto Sans JP',sans-serif;
  box-shadow:0 3px 8px rgba(0,0,0,.12);}
.nav-btn.prev{background:#eee;color:#666;}
.nav-btn.prev:hover{background:#ddd;}
.nav-btn.next{background:linear-gradient(135deg,#4a9eff,#2d7dd2);color:#fff;}
.nav-btn.next:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(74,158,255,.35);}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.voice-btn{font-size:22px;line-height:1;border:none;background:none;cursor:pointer;
  padding:6px 10px;border-radius:50%;transition:all .2s;filter:none;opacity:1;}
.voice-btn:hover{background:#f0f0f0;}
.voice-btn.off{filter:grayscale(1);opacity:.45;}
.step-indicator{font-size:13px;color:#888;font-weight:bold;min-width:80px;text-align:center;}

@keyframes popIn{
  0%{opacity:0;transform:scale(.2);}
  65%{opacity:1;transform:scale(1.2);}
  100%{opacity:1;transform:scale(1);}
}
.pop-in{animation:popIn .4s cubic-bezier(.34,1.56,.64,1) forwards;}

@keyframes glowPulse{
  0%{filter:drop-shadow(0 0 0px #fff176) brightness(1);}
  40%{filter:drop-shadow(0 0 14px #fff176) drop-shadow(0 0 22px #ffeb3b) brightness(1.6);}
  100%{filter:drop-shadow(0 0 0px #fff176) brightness(1);}
}
.glow-pop{animation:glowPulse .5s ease-out forwards;}

/* 「この位は0で、くり下げに使えない」を示す、赤く点滅する枠・数字。
   波及的繰り下がり（0の位をまたいで、さらに上の位から借りる）のとき、
   筆算の黒字の0、および図解の空っぽの枠の両方に同じ見た目で使う。 */
@keyframes zeroPulse{
  0%{opacity:.5;filter:drop-shadow(0 0 0px #e53935);}
  50%{opacity:1;filter:drop-shadow(0 0 8px #e53935) drop-shadow(0 0 16px #ff8a80);}
  100%{opacity:.5;filter:drop-shadow(0 0 0px #e53935);}
}
.zero-glow-frame,.zero-glow-text{animation:zeroPulse 1.1s ease-in-out infinite;}

/* 別ウィンドウ（iframe）埋め込み時は入力欄・見出しを隠して解説だけ表示 */
html.embed .app-header,html.embed .input-area{display:none !important;}
</style>
</head>
<body>
<!-- 設定モーダルダイアログ -->
<div id="settings-modal" class="modal-overlay" onclick="onModalOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h2>⚙ 設定</h2>
      <button class="modal-close-btn" onclick="closeSettingsModal()" title="とじる">×</button>
    </div>
    <div class="modal-body">
      <!-- くり下がりの計算方法（補助計算） -->
      <div class="setting-section">
        <div class="setting-title">✏️ くり下がりの計算方法（補助計算）</div>
        <div class="setting-desc">繰り下がった「10」または「1」を書く位置と、計算の進め方を選べます。</div>
        <div class="setting-options">
          <button class="setting-btn" id="sub-btn-top10" onclick="setSubNotation('top10')">
            <span>上に「10」を書く（通常）</span>
          </button>
          <button class="setting-btn" id="sub-btn-small1" onclick="setSubNotation('small1')">
            <span>左上に小さく「1」を書く</span>
          </button>
          <button class="setting-btn" id="sub-btn-bridge" onclick="setSubNotation('bridge')">
            <span>上に「10」＋ブリッジ計算</span>
          </button>
        </div>
      </div>

      <!-- 波及的繰り下がり（0をまたぐ繰り下がり）のオプション -->
      <div class="setting-section">
        <div class="setting-title">🔄 0をまたぐ繰り下がり（波及的繰り下がり）</div>
        <div class="setting-desc">0の位をまたいで繰り下げる場合の補助計算の書き方を選べます。</div>
        <div class="setting-options">
          <button class="setting-btn" id="cascade-btn-seq" onclick="setCascadeMode('sequential')">
            <span>1けたずつ繰り下げる（順次）</span>
          </button>
          <button class="setting-btn" id="cascade-btn-col" onclick="setCascadeMode('collective')">
            <span>まとめて繰り下げる（複数桁一括）</span>
          </button>
        </div>
      </div>

      <!-- 図の表示 -->
      <div class="setting-section">
        <div class="setting-title">🟨 図のひょうじ</div>
        <div class="setting-desc">数図の表示スタイルを選べます。</div>
        <div class="setting-options">
          <button class="setting-btn" id="mode-btn-tile" onclick="setDisplayMode('tile')">🟨 タイル</button>
          <button class="setting-btn" id="mode-btn-card" onclick="setDisplayMode('card')">🔢 カード</button>
        </div>
      </div>

      <!-- 動くタイミング -->
      <div class="setting-section">
        <div class="setting-title">⏱️ うごくタイミング</div>
        <div class="setting-desc">図と筆算のアニメーションの順序を設定します。</div>
        <div class="setting-options">
          <button class="setting-btn" id="timing-btn-sync" onclick="setTimingMode('sync')">同時</button>
          <button class="setting-btn" id="timing-btn-tile-first" onclick="setTimingMode('tile-first')">図 → 筆算</button>
          <button class="setting-btn" id="timing-btn-hissan-first" onclick="setTimingMode('hissan-first')">筆算 → 図</button>
        </div>
        <div class="gap-setting-row" id="seq-gap-row" style="display:none;">
          <span class="gap-setting-label">アニメーションの間（ま）：</span>
          <input type="number" id="seq-gap-input" class="gap-input" value="0.4" min="0" max="5" step="0.1" onchange="setSeqGap(this.value)">
          <span class="gap-setting-label">秒</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="app-stage">
<div class="app-header"><h1>ひき算の ひっ算</h1></div>

<div class="input-area">
  <div class="input-row">
    <label>ひかれる数：</label>
    <input type="number" id="inp-a" class="num-input" value="47" min="1" max="1000">
    <span class="minus-label">－</span>
    <label>ひく数：</label>
    <input type="number" id="inp-b" class="num-input" value="18" min="1" max="999">
    <button class="gen-btn" onclick="generateFromInput()">説明生成 ▶</button>
    <button class="settings-open-btn" onclick="openSettingsModal()" title="せっていをひらく">⚙ 設定</button>
  </div>
  <div id="err-msg" class="err-msg">1〜1000の整数を入力してください（ひく数はひかれる数より小さくしてください）</div>
  <div class="preset-row">
    <span style="font-size:12px;color:#888;align-self:center;">れい：</span>
    <button class="problem-btn active" onclick="setProblem(47,18)">47－18</button>
    <button class="problem-btn" onclick="setProblem(35,12)">35－12</button>
    <button class="problem-btn" onclick="setProblem(63,27)">63－27</button>
    <button class="problem-btn" onclick="setProblem(243,127)">243－127</button>
    <button class="problem-btn" onclick="setProblem(305,148)">305－148</button>
    <button class="problem-btn" onclick="setProblem(623,378)">623－378</button>
    <button class="problem-btn" onclick="setProblem(1000,437)">1000－437</button>
    <button class="problem-btn" onclick="setProblem(1000,40)">1000－40</button>
  </div>
</div>

<div class="main-area">
  <div class="tile-slot" id="tile-slot">
  <div class="tile-area" id="tile-area">
    <table id="tile-table">
      <colgroup>
        <col class="col-label">
        <col class="col-sen" id="colgrp-sen">
        <col class="col-hyaku" id="colgrp-hyaku">
        <col class="col-juu">
        <col class="col-ichi">
      </colgroup>
      <thead>
        <tr>
          <th class="th-label"></th>
          <th class="th-sen" id="hdr-sen">せんのくらい</th>
          <th class="th-hyaku" id="hdr-hyaku">ひゃくのくらい</th>
          <th class="th-juu"   id="hdr-juu">じゅうのくらい</th>
          <th class="th-ichi" id="hdr-ichi">いちのくらい</th>
        </tr>
      </thead>
      <tbody>
        <!-- A行：ひかれる数 -->
        <tr id="row-a">
          <td class="td-label" id="lbl-a"></td>
          <td class="td-sen" id="col-sen-a">    <svg id="svg-sen-a"   width="143" height="112" viewBox="0 0 143 112"></svg></td>
          <td class="td-hyaku" id="col-hyaku-a"><svg id="svg-hyaku-a" width="161" height="112" viewBox="0 0 161 112"></svg></td>
          <td class="td-juu">                   <svg id="svg-juu-a"   width="161" height="112" viewBox="0 0 161 112"></svg></td>
          <td class="td-ichi">                  <svg id="svg-ichi-a"  width="143" height="112" viewBox="0 0 143 112"></svg></td>
        </tr>
        <!-- B行：ひく数 -->
        <tr id="row-b">
          <td class="td-label minus">－</td>
          <td class="td-sen" id="col-sen-b">    <svg id="svg-sen-b"   width="143" height="112" viewBox="0 0 143 112"></svg></td>
          <td class="td-hyaku" id="col-hyaku-b"><svg id="svg-hyaku-b" width="161" height="112" viewBox="0 0 161 112"></svg></td>
          <td class="td-juu">                   <svg id="svg-juu-b"   width="161" height="112" viewBox="0 0 161 112"></svg></td>
          <td class="td-ichi">                  <svg id="svg-ichi-b"  width="143" height="112" viewBox="0 0 143 112"></svg></td>
        </tr>
        <!-- 答え行 -->
        <tr class="tile-result-row" id="row-ans">
          <td class="td-label equals">＝</td>

<script>
// ============================================================
// SVG ユーティリティ
// ============================================================
const NS='http://www.w3.org/2000/svg';
const U=7.15;
const FC='#f5c542', SC='#c8960a', SC5='#7a5500';
// 百の位タイルを、縦横どちらにも少しずつずらして斜めに並べる際の間隔。
// 静的表示(renderHyakus)・出現アニメ(appear-hyaku)・くり下げアニメ(borrow-h-to-j系)・
// 対消滅アニメ(annihilate-hyaku)のすべてで、この値と並べ方の計算式を統一して使うことで、
// アニメ前後の表示位置のずれを防ぐ。枠が広がってもタイル自体の大きさは変えたくないため、
// タイルの縮尺だけは常にHYAKU_TILE_REF_H基準で計算する（枠の高さ自体はupdateLayoutで動的に広げる）。
const HYAKU_STEP_X=31.2, HYAKU_STEP_Y=26, HYAKU_TILE_REF_H=112;
// 1列目(1〜5枚目)の最大枚数。6枚目以降は2列目として右にHYAKU_ROW2_OFFSET_TILES枚分ずらして開始する。
const HYAKU_ROW1_MAX=5;
const HYAKU_ROW2_OFFSET_TILES=2;

// 百の位タイルの「相対」配置(まだ中心寄せしていない生の座標)を計算する。
// ・1〜5枚目(i<HYAKU_ROW1_MAX)は「5枚のときの配置」に固定する。
//   総数(total)が6枚以上に増えても、row1Totalは常に5になるため1〜5枚目の位置は動かない
//   （総数が5枚以下の間は row1Total===total となり、これまでの中央寄せ配置と完全に一致する）。
// ・6枚目以降(i>=HYAKU_ROW1_MAX)は、1枚目(index 0)と同じ高さ・そこからHYAKU_ROW2_OFFSET_TILES枚分
//   右の位置を起点(2列目)とし、そこから同じ斜めの間隔(HYAKU_STEP_X/Y)でずらしながら並べる。
function hyakuRawPos(i,total,su){
  const side2=10*su+9*su*.15;
  const row1Total=Math.min(total,HYAKU_ROW1_MAX);
  if(i<HYAKU_ROW1_MAX){
    const off=i-(row1Total-1)/2;
    return{x:off*HYAKU_STEP_X, y:-off*HYAKU_STEP_Y};
  }
  const off0=0-(row1Total-1)/2; // 1枚目(index0)の位置。total>5のときrow1Totalは常に5固定
  const x0=off0*HYAKU_STEP_X, y0=-off0*HYAKU_STEP_Y;
  const rowStartX=x0+HYAKU_ROW2_OFFSET_TILES*side2, rowStartY=y0;
  const j=i-HYAKU_ROW1_MAX;
  return{x:rowStartX+j*HYAKU_STEP_X, y:rowStartY-j*HYAKU_STEP_Y};
}
// total枚を配置したときの、生座標(hyakuRawPos)でのバウンディングボックス
// (=全タイルを囲む青い破線の矩形と同じ範囲)を求める。
function hyakuBBox(total,su){
  const side2=10*su+9*su*.15;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(let i=0;i<total;i++){
    const p=hyakuRawPos(i,total,su);
    minX=Math.min(minX,p.x-side2/2);maxX=Math.max(maxX,p.x+side2/2);
    minY=Math.min(minY,p.y-side2/2);maxY=Math.max(maxY,p.y+side2/2);
  }
  return{minX,maxX,minY,maxY};
}
// 百の位タイルの配置を計算する共通関数。
// 全タイルのバウンディングボックス(hyakuBBox、＝青い破線で囲む範囲そのもの)の中心が
// 枠の中心(W/2,H/2)にちょうど来るように、生座標(hyakuRawPos)をシフトして返す。
// これにより、6枚目以降が増えて右に伸びても、見た目全体が常に枠内で中央寄せされる。
// renderHyakus(静止表示)・出現アニメ・くり下げアニメ・対消滅アニメの全てで必ずこの関数を
// 使うことで、アニメ前後の表示位置のズレを防ぐ。
function hyakuTilePos(i,total,W,H,su){
  const bbox=hyakuBBox(total,su);
  const shiftX=W/2-(bbox.minX+bbox.maxX)/2;
  const shiftY=H/2-(bbox.minY+bbox.maxY)/2;
  const p=hyakuRawPos(i,total,su);
  return{cx:p.x+shiftX, cy:p.y+shiftY};
}
// 枠の幅に依存しない、高さ基準の百タイル縮尺(su)。updateLayoutで枠サイズを
// 決める際、まだsvgの幅が確定していない段階でも使えるようにするための基準値。
function hyakuRefSu(){
  const side=10*U+9*U*.15;
  return U*(HYAKU_TILE_REF_H-8)/side;
}
// total枚のタイルを配置したときに必要な、バウンディングボックスの幅・高さを返す。
// updateLayoutでの枠の自動サイズ計算に使う（中心寄せされるので、この幅・高さの枠を
// 用意すればちょうど全タイルが収まる）。
function hyakuFootprint(total,su){
  const bbox=hyakuBBox(total,su);
  return{width:bbox.maxX-bbox.minX, height:bbox.maxY-bbox.minY};
}

function mk(tag,a,parent){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(a))e.setAttribute(k,v);
  if(parent)parent.appendChild(e);
  return e;
}

// 「この位は0で、くり下げに使えない」ことを、図解（タイル／カード）側でも示す共通ヘルパー。
// その位にタイルが1枚も無い（count+ghost===0）ときに、svgEl中央へ赤い破線の点滅する
// 空枠だけを描く（「0」の文字は出さない＝「この箱（位）がまるごと空っぽ」であることを
// 枠の大きさだけで示す。筆算側の数字は別途zero-glow-textで赤く点滅表示される）。
function renderZeroGlowFrame(svgEl){
  if(!svgEl)return;
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2])||143;
  const H=parseInt(svgEl.getAttribute('height'))||112;
  mk('rect',{x:W/2-39,y:H/2-31.2,width:78,height:62.4,rx:13,fill:'none',
    stroke:'#e53935','stroke-width':3,'stroke-dasharray':'6,4',class:'zero-glow-frame'},svgEl);
}
function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

// 繰り下がりで「貸した」ため半透明ghostになっているタイル/カードにだけ、対角線の斜線を重ねて描く。
// 対消滅で薄くなっただけのghost（引かれて消えた分）にはこの斜線を付けないことで、
// 「くり下げて貸した」のか「対消滅で引かれた」のかを見た目で区別できるようにする。
function drawLentSlash(parent,cx,cy,halfW,halfH){
  mk('line',{x1:cx-halfW,y1:cy-halfH,x2:cx+halfW,y2:cy+halfH,
    stroke:'#e35d3a','stroke-width':1.6,'stroke-linecap':'round',opacity:.85},parent);
}

// ===== 十の位：棒1本 =====
function drawStick(parent,cx,cy,u,alpha,strokeColor){
  alpha=alpha??1; u=u??U; strokeColor=strokeColor??SC;
  const G=u*.15,S=u+G,H=10*u+9*G;
  const ox=cx-u/2,oy=cy-H/2;
  for(let i=0;i<10;i++)
    mk('rect',{x:ox,y:oy+i*S,width:u,height:u,fill:FC,stroke:strokeColor,'stroke-width':.6,rx:.3,opacity:alpha},parent);
  mk('line',{x1:ox-1,x2:ox+u+1,y1:oy+5*S-G/2,y2:oy+5*S-G/2,stroke:SC5,'stroke-width':1.2,opacity:alpha},parent);
  mk('rect',{x:ox-1,y:oy-1,width:u+2,height:H+2,fill:'none',stroke:strokeColor,'stroke-width':.8,rx:1,opacity:alpha},parent);
}

// ===== 百の位：正方形タイル1枚 =====
// PNG画像を<image>1枚で配置（格子100個のSVG描画をやめて軽量化）。
// くり上がりの強調表示(strokeColor指定時)は、画像の外周にreact枠を重ねて表現する。
function drawHyakuScaled(parent,cx,cy,u,alpha,strokeColor){
  alpha=alpha??1;
  const G=u*.15,TW=10*u+9*G,TH=10*u+9*G;
  const ox=cx-TW/2,oy=cy-TH/2;
  mk('image',{href:IMG_HYAKU,x:ox,y:oy,width:TW,height:TH,opacity:alpha,
    'preserveAspectRatio':'none'},parent);
  if(strokeColor && strokeColor!==SC){
    // くり上がり等の強調色が指定された場合のみ、外枠を重ねて目立たせる
    mk('rect',{x:ox-1,y:oy-1,width:TW+2,height:TH+2,fill:'none',
      stroke:strokeColor,'stroke-width':2,rx:3,opacity:alpha},parent);
  }
}

// ===== 千の位：百タイル10枚重ねの束 =====
// PNG画像(立体的な重なり・テープを描き込み済み)を<image>1枚で配置。
function drawSenScaled(parent,cx,cy,u,alpha,strokeColor){
  alpha=alpha??1;
  // 画像自体に奥行き(重なり)が含まれているため、表示領域は正方形(10u分)より
  // やや大きく取る必要がある。元のdrawSenScaledの見た目に合わせて1.34倍を確保。
  const G=u*.15,baseSide=10*u+9*G;
  const side=baseSide*1.34;
  const ox=cx-side/2*0.94, oy=cy-side/2*1.06; // 画像内の重心が右下寄りなので微調整
  mk('image',{href:IMG_SEN,x:ox,y:oy,width:side,height:side,opacity:alpha,
    'preserveAspectRatio':'none'},parent);
  if(strokeColor && strokeColor!==SC){
    mk('rect',{x:ox+side*0.06,y:oy+side*0.1,width:side*0.6,height:side*0.6,
      fill:'none',stroke:strokeColor,'stroke-width':2,rx:3,opacity:alpha},parent);
  }
}

// ===== 一の位：個別ブロック =====
function drawIchi(parent,count,svgW,svgH,alpha,hColor,ghostCount,lentGhostCount){
  ghostCount=ghostCount||0;
  lentGhostCount=lentGhostCount||0;
  const total=count+ghostCount;
  if(!total)return[];
  const u=U,gap=u*.18,S=u+gap,rGap=u*.7,BW=5*u+4*gap;
  // 5個を横一列に並べ、6個目以降は下の行に積む（対消滅アニメで見やすい横並び）
  const nRows=Math.ceil(total/5);
  const totH=nRows*u+(nRows-1)*rGap;
  const sy=svgH/2-totH/2+u/2;
  const pos=[];let drawn=0;
  for(let r=0;r<nRows&&drawn<total;r++){
    const inRow=(r===nRows-1)?(total-drawn):5;
    // 各行は中央寄せ（5個未満の行は中央に詰める）
    const rowW=inRow*u+(inRow-1)*gap;
    const sx=svgW/2-rowW/2+u/2;
    const cy=sy+r*(u+rGap);
    for(let i=0;i<inRow&&drawn<total;i++){
      const cx=sx+i*S;
      const isGhost=drawn>=count;
      const isLent=isGhost&&drawn>=total-lentGhostCount;
      const a=isGhost?.45:alpha;
      mk('rect',{x:cx-u/2,y:cy-u/2,width:u,height:u,fill:FC,
        stroke:isGhost?'#8a8a8a':SC,'stroke-width':1,'stroke-dasharray':isGhost?'2,1.5':'0',rx:.6,opacity:a},parent);
      if(isLent)drawLentSlash(parent,cx,cy,u*.4,u*.4);
      pos.push({cx,cy});drawn++;
    }
  }
  if(hColor){
    const xs=pos.map(p=>p.cx),ys=pos.map(p=>p.cy),m=5;
    mk('rect',{x:Math.min(...xs)-u/2-m,y:Math.min(...ys)-u/2-m,
      width:Math.max(...xs)-Math.min(...xs)+u+m*2,
      height:Math.max(...ys)-Math.min(...ys)+u+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},parent);
  }
  return pos;
}

// ===== render系（SVGに静的描画）=====
// じゅうの棒を「5本・すきま・5本」とグルーピングして並べたときのx座標(先頭からの相対オフセット)を返す。
// renderSticksと、くり下げアニメーション側（複数箇所）で同じ式を使うことで、見た目の食い違いを防ぐ。
const STICK_W=U+1.3, STICK_GAP=6.5, STICK_GROUP_GAP=20.8;
function stickLayout(count){
  const xs=[0];
  for(let i=1;i<count;i++){
    const g=(i%5===0)?STICK_GROUP_GAP:STICK_GAP;
    xs.push(xs[i-1]+STICK_W+g);
  }
  const totW=count>0?(xs[xs.length-1]+STICK_W):0;
  return{xs,totW};
}
// count本の棒を、幅W・高さHの枠内に中心寄せして並べたときの中心座標配列（{cx,cy}）を返す。
function stickCenters(count,W,H){
  if(!count)return[];
  const{xs,totW}=stickLayout(count);
  const sx=(W-totW)/2+STICK_W/2;
  return xs.map(x=>({cx:sx+x,cy:H/2}));
}
// 棒(十の位)
function renderSticks(svgEl,count,alpha,hColor,strokeColor,ghostCount,lentGhostCount){
  svgEl.innerHTML='';
  ghostCount=ghostCount||0;
  lentGhostCount=lentGhostCount||0;
  const total=count+ghostCount;
  if(!total)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||112;
  const centers=stickCenters(total,W,H);
  for(let i=0;i<total;i++){
    const isGhost=i>=count;
    const isLent=isGhost&&i>=total-lentGhostCount;
    const g=mk('g',{},svgEl);
    drawStick(g,centers[i].cx,centers[i].cy,U,isGhost?.45:(alpha??1),strokeColor||SC);
    if(isGhost){
      const G=U*.15,TH=10*U+9*G;
      mk('rect',{x:centers[i].cx-U/2-2,y:H/2-TH/2-2,width:U+4,height:TH+4,
        fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},svgEl);
      if(isLent)drawLentSlash(svgEl,centers[i].cx,H/2,U/2,TH/2);
    }
  }
  if(hColor){
    const{totW}=stickLayout(total);
    const G=U*.15,TH=10*U+9*G,m=4;
    mk('rect',{x:(W-totW)/2-m,y:H/2-TH/2-m,width:totW+m*2,height:TH+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return centers;
}

// 百タイル
function renderHyakus(svgEl,count,alpha,hColor,strokeColor,ghostCount,lentGhostCount){
  svgEl.innerHTML='';
  ghostCount=ghostCount||0;
  lentGhostCount=lentGhostCount||0;
  const total=count+ghostCount;
  if(!total)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||112;
  const u=U,G=u*.15,side=10*u+9*G;
  // タイル自体の縮尺は、枠の高さ(H)ではなく常に基準の高さ(HYAKU_TILE_REF_H)で計算する。
  // こうしておくことで、枚数が増えて枠(H)が縦に広がっても、タイル1枚1枚の大きさは変わらない。
  const sc=Math.min((W-8)/side,(HYAKU_TILE_REF_H-8)/side);
  const su=u*sc,centers=[];
  for(let i=0;i<total;i++){
    const isGhost=i>=count;
    const isLent=isGhost&&i>=total-lentGhostCount;
    const{cx,cy}=hyakuTilePos(i,total,W,H,su);
    const g=mk('g',{},svgEl);
    drawHyakuScaled(g,cx,cy,su,isGhost?.45:(alpha??1),strokeColor||SC);
    if(isGhost){
      const side2=10*su+9*su*.15;
      mk('rect',{x:cx-side2/2-2,y:cy-side2/2-2,width:side2+4,height:side2+4,
        fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},svgEl);
      if(isLent)drawLentSlash(svgEl,cx,cy,side2/2,side2/2);
    }
    centers.push({cx,cy});
  }
  if(hColor){
    // 全タイルが収まるバウンディングボックスを求めて囲む(1枚分しか囲めていなかったバグの修正)
    const side2=10*su+9*su*.15,m=4;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    centers.forEach(({cx,cy})=>{
      minX=Math.min(minX,cx-side2/2);maxX=Math.max(maxX,cx+side2/2);
      minY=Math.min(minY,cy-side2/2);maxY=Math.max(maxY,cy+side2/2);
    });
    mk('rect',{x:minX-m,y:minY-m,width:(maxX-minX)+m*2,height:(maxY-minY)+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return centers;
}

// 千タイル
function renderSens(svgEl,count,alpha,hColor,strokeColor,ghostCount,lentGhostCount){
  svgEl.innerHTML='';
  ghostCount=ghostCount||0;
  lentGhostCount=lentGhostCount||0;
  const total=count+ghostCount;
  if(!total)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||112;
  const u=U,G=u*.15,W10=10*u+9*G,H10=10*u+9*G;
  const OX=u*.35,OY=u*.35;
  // スケールをセルに収める
  const needW=W10+(9)*OX,needH=H10+(9)*OY;
  const sc=Math.min((W-8)/needW,(H-8)/needH);
  const su=u*sc,centers=[];
  // 1枚ずつ横に並べる（最大は通常1枚）
  for(let i=0;i<total;i++){
    const isGhost=i>=count;
    const isLent=isGhost&&i>=total-lentGhostCount;
    const cx=W/2+(i-(total-1)/2)*(10*su+9*su*.15+4);
    const cy=H/2;
    const g=mk('g',{},svgEl);
    drawSenScaled(g,cx,cy,su,isGhost?.45:(alpha??1),strokeColor||SC);
    if(isGhost){
      const side2=10*su+9*su*.15;
      mk('rect',{x:cx-side2/2-2,y:cy-side2/2-2,width:side2+4,height:side2+4,
        fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},svgEl);
      if(isLent)drawLentSlash(svgEl,cx,cy,side2/2,side2/2);
    }
    centers.push({cx,cy});
  }
  if(hColor){
    const side2=10*su+9*su*.15,m=4;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    centers.forEach(({cx,cy})=>{
      minX=Math.min(minX,cx-side2/2);maxX=Math.max(maxX,cx+side2/2);
      minY=Math.min(minY,cy-side2/2);maxY=Math.max(maxY,cy+side2/2);
    });
    mk('rect',{x:minX-m,y:minY-m,width:(maxX-minX)+m*2,height:(maxY-minY)+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return centers;
}

// 一の位
function renderIchi(svgEl,count,alpha,hColor,ghostCount,lentGhostCount){
  svgEl.innerHTML='';
  if(!count && !ghostCount)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||112;
  return drawIchi(svgEl,count,W,H,alpha??1,hColor,ghostCount,lentGhostCount);
}

// ============================================================
// カード方式（タイルの代わりに「1」「10」「100」と書かれた数字カードで表す）
// 並べ方は、タイル方式の一の位(drawIchi)にならい「5枚を横一列、6枚目からは
// 下の段」というカード専用レイアウトにする。10枚なら5枚×2段にそろえる。くり下げてきた「10」のかたまりの
// 表示（bridge10-layer／bridge100-layer）も同じ並べ方にそろえる。
// ============================================================
let DISPLAY_MODE = localStorage.getItem('hikizan_display_mode') || 'tile'; // 'tile'：実物タイル／'card'：数字カード

// カード方式はタイル方式と横幅の性質がかなり違うため、専用の寸法・折り返し数を使う。
// 5枚/段。10枚のくり下げを必ず5枚×2段で見せる。
// 旧4枚/段とほぼ同じ列幅に収まるよう、カード本体と間隔を少し小さくする。
const CARD_LAYOUT={perRow:5,gapX:5,rowGap:7,margin:8};
const CARD_CFG={
  ichi : {label:'1',   w:31,h:26,fs:13,bg:'#fce4ec',stroke:'#e91e63',tc:'#880e4f'},
  juu  : {label:'10',  w:31,h:26,fs:13,bg:'#fff9cc',stroke:'#d4ac0d',tc:'#6b5700'},
  hyaku: {label:'100', w:31,h:26,fs:12,bg:'#cce8f4',stroke:'#2980b9',tc:'#1a5276'},
  sen  : {label:'1000',w:31,h:26,fs:10.5,bg:'#e8e8e8',stroke:'#555',   tc:'#333'}
};

// カード1枚を描く（中心座標cx,cy基準。drawStick/drawHyakuScaled等と座標系をそろえる）
function drawCardSingle(parent,cx,cy,place,scale,alpha,strokeColor,isGhost,isLent){
  const cfg=CARD_CFG[place];
  scale=scale??1;alpha=alpha??1;
  const w=cfg.w*scale,h=cfg.h*scale;
  mk('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,fill:cfg.bg,
    stroke:strokeColor||(isGhost?'#8a8a8a':cfg.stroke),'stroke-width':1.6*scale,
    'stroke-dasharray':isGhost?(2.4*scale)+','+(1.8*scale):'0',
    rx:3*scale,opacity:alpha},parent);
  mk('text',{x:cx,y:cy+cfg.fs*scale*.36,'text-anchor':'middle',
    'font-size':cfg.fs*scale,'font-weight':'bold',fill:cfg.tc,
    'font-family':"'Noto Sans JP',sans-serif",opacity:alpha},parent).textContent=cfg.label;
  // 繰り下がりで「貸した」カードだけに斜線を重ねる（対消滅で消えたカードには付けない）
  if(isGhost&&isLent)drawLentSlash(parent,cx,cy,w/2,h/2);
}

// count+ghostCount枚を「5枚ずつ横一列・あふれたら次の段」で並べ、box(svgW,svgH)に
// 収まるように必要ならスケールを縮小する。中心座標配列（scale込み）を返す（描画はしない）。
function cardBoxPositions(count,ghostCount,place,svgW,svgH){
  ghostCount=ghostCount||0;
  const total=count+ghostCount;
  if(!total)return{pos:[],scale:1};
  const cfg=CARD_CFG[place];
  const {perRow,gapX,rowGap:rGap,margin}=CARD_LAYOUT;
  const nRows=Math.ceil(total/perRow);
  let maxRowW=0;
  for(let r=0;r<nRows;r++){
    const inRow=(r===nRows-1)?(total-r*perRow):perRow;
    maxRowW=Math.max(maxRowW,inRow*cfg.w+(inRow-1)*gapX);
  }
  const needH=nRows*cfg.h+(nRows-1)*rGap;
  let scale=1;
  if(maxRowW>svgW-margin*2)scale=Math.min(scale,(svgW-margin*2)/maxRowW);
  if(needH>svgH-margin*2)scale=Math.min(scale,(svgH-margin*2)/needH);
  scale=Math.max(scale,.4); // 縮小しすぎて数字が読めなくなるのを防ぐ下限
  const w=cfg.w*scale,h=cfg.h*scale,gx=gapX*scale,gy=rGap*scale;
  const totH=nRows*h+(nRows-1)*gy;
  const sy=svgH/2-totH/2+h/2;
  const pos=[];let drawn=0;
  for(let r=0;r<nRows&&drawn<total;r++){
    const inRow=Math.min(perRow,total-drawn);
    const rowW=inRow*w+(inRow-1)*gx;
    const sx=svgW/2-rowW/2+w/2;
    const cy=sy+r*(h+gy);
    for(let i=0;i<inRow&&drawn<total;i++){pos.push({cx:sx+i*(w+gx),cy,scale});drawn++;}
  }
  return{pos,scale};
}

// セル(svg-xxx-a/b/ans)へのカード描画。renderSticks/renderHyakus/renderIchiと同じ使い方ができるようにする。
function renderCardGeneric(svgEl,count,place,alpha,hColor,ghostCount,lentGhostCount){
  svgEl.innerHTML='';
  ghostCount=ghostCount||0;
  lentGhostCount=lentGhostCount||0;
  const total=count+ghostCount;
  if(!total)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||112;
  const{pos}=cardBoxPositions(count,ghostCount,place,W,H);
  pos.forEach((p,i)=>{
    const isGhost=i>=count;
    const isLent=isGhost&&i>=total-lentGhostCount;
    drawCardSingle(svgEl,p.cx,p.cy,place,p.scale,isGhost?.45:(alpha??1),null,isGhost,isLent);
  });
  const visible=pos.slice(0,count);
  if(hColor&&visible.length){
    const cfg=CARD_CFG[place],sc=visible[0].scale,m=5;
    const xs=visible.map(p=>p.cx),ys=visible.map(p=>p.cy);
    mk('rect',{x:Math.min(...xs)-cfg.w*sc/2-m,y:Math.min(...ys)-cfg.h*sc/2-m,
      width:Math.max(...xs)-Math.min(...xs)+cfg.w*sc+m*2,
      height:Math.max(...ys)-Math.min(...ys)+cfg.h*sc+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return visible.map(p=>({cx:p.cx,cy:p.cy}));
}
// タイル版render系（renderHyakus/renderSticks/renderIchi）と引数の並びをそろえた別名
function renderHyakusCard(svgEl,count,alpha,hColor,strokeColor,ghostCount,lentGhostCount){return renderCardGeneric(svgEl,count,'hyaku',alpha,hColor,ghostCount,lentGhostCount);}
function renderSensCard(svgEl,count,alpha,hColor,strokeColor,ghostCount,lentGhostCount){return renderCardGeneric(svgEl,count,'sen',alpha,hColor,ghostCount,lentGhostCount);}
function renderSticksCard(svgEl,count,alpha,hColor,strokeColor,ghostCount,lentGhostCount){return renderCardGeneric(svgEl,count,'juu',alpha,hColor,ghostCount,lentGhostCount);}
function renderIchiCard(svgEl,count,alpha,hColor,ghostCount,lentGhostCount){return renderCardGeneric(svgEl,count,'ichi',alpha,hColor,ghostCount,lentGhostCount);}

// bridge10-layer／bridge100-layer用：box幅に収める必要がなく、中心(hc)まわりに
// 自然な大きさで「5枚ずつ横一列」に並べる（tile版のbridgeIchiPositions/bridgeStickPositionsに対応）。
function bridgeCardPositions(total,hc,place){
  const cfg=CARD_CFG[place];
  const {perRow,gapX,rowGap:rGap}=CARD_LAYOUT;
  const nRows=Math.ceil(total/perRow);
  const totH=nRows*cfg.h+(nRows-1)*rGap;
  const sy=hc.y-totH/2+cfg.h/2;
  const pos=[];let drawn=0;
  for(let r=0;r<nRows&&drawn<total;r++){
    const inRow=Math.min(perRow,total-drawn);
    const rowW=inRow*cfg.w+(inRow-1)*gapX;
    const sx=hc.x-rowW/2+cfg.w/2;
    const cy=sy+r*(cfg.h+rGap);
    for(let i=0;i<inRow&&drawn<total;i++){pos.push({x:sx+i*(cfg.w+gapX),y:cy});drawn++;}
  }
  return pos;
}

// カード方式のとき、列の幅／高さを何枚分確保すればよいかを逆算するためのヘルパー
// （updateLayoutから呼ばれる。桁数が増えても同じ式で対応できる）。
function cardNeedWidth(maxCount,place){
  const cfg=CARD_CFG[place];
  const cols=Math.min(CARD_LAYOUT.perRow,Math.max(1,maxCount));
  return cols*cfg.w+(cols-1)*CARD_LAYOUT.gapX+CARD_LAYOUT.margin*2;
}
function cardNeedHeight(maxCount,place){
  const cfg=CARD_CFG[place];
  const nRows=Math.max(1,Math.ceil(maxCount/CARD_LAYOUT.perRow));
  return nRows*cfg.h+(nRows-1)*CARD_LAYOUT.rowGap+CARD_LAYOUT.margin*2;
}

// ============================================================
// カード方式のアニメーション共通ヘルパー
// タイル方式が「1個ずつ動く・対消滅する」といった専用アニメーションを
// 位ごとに持っているのと同じ考え方を、カードでも共通化して再現する。
// ============================================================

// place一律のrender呼び出し（タイル版renderIchi/renderSticks/renderHyakusの
// カード版をまとめて同じ引数の並びで呼べるようにする）。
function renderCardPlace(place,svgEl,count,alpha,hColor,ghostCount,lentGhostCount){
  if(place==='ichi')return renderIchiCard(svgEl,count,alpha,hColor,ghostCount,lentGhostCount);
  if(place==='juu')return renderSticksCard(svgEl,count,alpha,hColor,null,ghostCount,lentGhostCount);
  return renderHyakusCard(svgEl,count,alpha,hColor,null,ghostCount,lentGhostCount);
}
// タイル/カード両対応のplace一律render（対消滅エンジンrunAnnihilationから使う）。
function renderPlace(place,svgEl,count,alpha,hColor,ghostCount,lentGhostCount){
  if(DISPLAY_MODE==='card')return renderCardPlace(place,svgEl,count,alpha,hColor,ghostCount,lentGhostCount);
  if(place==='ichi')return renderIchi(svgEl,count,alpha,hColor,ghostCount,lentGhostCount);
  if(place==='juu')return renderSticks(svgEl,count,alpha,hColor,null,ghostCount,lentGhostCount);
  return renderHyakus(svgEl,count,alpha,hColor,null,ghostCount,lentGhostCount);
}
// svgEl内にcount枚のカードを並べたときの中心座標配列を返す（cardBoxPositionsのラッパー）。
// 対消滅エンジン(runAnnihilation)のgetPositionsにそのまま渡せる形にする。
function cardGetPositions(place){
  return (svgEl,count)=>{
    if(!count)return[];
    const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]);
    const H=parseInt(svgEl.getAttribute('height'))||112;
    const{pos}=cardBoxPositions(count,0,place,W,H);
    return pos.map(p=>({cx:p.cx,cy:p.cy}));
  };
}
// カード1枚をsrc→dest（どちらもtile-area基準のlayer座標）へ移動させる。
function cardFly(destLayer,src,dest,place,color,duration,onDone){
  const g=mk('g',{},destLayer);
  drawCardSingle(g,src.x,src.y,place,1,1,color||null,false);
  tween(duration||500,t=>{
    const tx=src.x+(dest.x-src.x)*t, ty=src.y+(dest.y-src.y)*t;
    g.setAttribute('transform',`translate(${tx-src.x},${ty-src.y})`);
  },()=>{g.remove();onDone&&onDone();});
}
// 複数枚のカードをsrcs[]→dests[]へ同時に移動させる（対応数が合わない場合は最後のdestを使い回す）。
function cardFlyMany(destLayer,srcs,dests,place,color,duration,onDone){
  if(!srcs.length){onDone&&onDone();return;}
  const gs=srcs.map(p=>{const g=mk('g',{},destLayer);drawCardSingle(g,p.x,p.y,place,1,1,color||null,false);return g;});
  tween(duration||550,t=>{
    gs.forEach((g,i)=>{
      const dest=dests[i]||dests[dests.length-1];
      const dx=(dest.x-srcs[i].x)*t, dy=(dest.y-srcs[i].y)*t;
      g.setAttribute('transform',`translate(${dx},${dy})`);
    });
  },()=>{gs.forEach(g=>g.remove());onDone&&onDone();});
}
// カード版の対消滅（1組ずつ：線でむすぶ→光る→濃い分身が右上へ飛んで消える／元の場所は半透明ghostに）。
// タイル方式のrunAnnihilation内のrunPairと同じ演出をカードに合わせて再現する。
function cardAnnihilatePairs(opts){
  const {posA,posB,realA,realB,place,color,onAllDone}=opts;
  const layer=document.getElementById('anim-layer');
  const n=Math.min(posA.length,posB.length);
  if(n===0){onAllDone&&onAllDone();return;}
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const destX=tileRect.width/(currentScale*stableTilePanelFactor)-20, destY=20;
  const STAGGER=230;
  let doneCount=0;
  function runPair(i){
    const a=posA[i], b=posB[i];
    const ra=realA[i], rb=realB[i];
    const line=mk('line',{x1:b.x,y1:b.y,x2:b.x,y2:b.y,stroke:'#ff7043','stroke-width':2.5,'stroke-linecap':'round'},layer);
    tween(220,t=>{
      const cx=b.x+(a.x-b.x)*t, cy=b.y+(a.y-b.y)*t;
      line.setAttribute('x2',cx); line.setAttribute('y2',cy);
    },()=>{
      ra.setAttribute('class','glow-pop'); rb.setAttribute('class','glow-pop');
      setTimeout(()=>{
        ra.innerHTML=''; drawCardSingle(ra,a.x,a.y,place,1,.45,null,true);
        rb.innerHTML=''; drawCardSingle(rb,b.x,b.y,place,1,.45,null,true);
        ra.removeAttribute('class'); rb.removeAttribute('class');
        const ga=mk('g',{},layer); drawCardSingle(ga,a.x,a.y,place,1,1,color||null,false);
        const gb=mk('g',{},layer); drawCardSingle(gb,b.x,b.y,place,1,1,null,false);
        tween(550,t=>{
          const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
          const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
          ga.setAttribute('transform',`translate(${dxA},${dyA})`);
          gb.setAttribute('transform',`translate(${dxB},${dyB})`);
          const op=1-t;
          ga.setAttribute('opacity',op); gb.setAttribute('opacity',op); line.setAttribute('opacity',op);
          line.setAttribute('x1',b.x+dxB); line.setAttribute('y1',b.y+dyB);
          line.setAttribute('x2',a.x+dxA); line.setAttribute('y2',a.y+dyA);
        },()=>{
          line.remove(); ga.remove(); gb.remove();
          doneCount++;
          if(doneCount>=n) onAllDone&&onAllDone();
        });
      },250);
    });
  }
  for(let i=0;i<n;i++) setTimeout(()=>runPair(i), i*STAGGER);
}

// ============================================================
// 筆算SVG描画（ひき算版）  viewBox="0 0 210 230"
// 位置: 千=35, 百=73, 十=111, 一=149
// ============================================================
const HSX=35,H2X=73,HJX=111,HIX=149;
const HG=38; // ノートのマス目1個分の大きさ（数字1つ・記号1つがちょうど1マスに収まる。列の間隔と同じ38pxにしている）
const HBORROW_Y=26,HROW1_Y=70,HROW2_Y=108,HLINE_Y=114,HROW3_Y=146;

function drawHissan(svgEl,state){
  svgEl.innerHTML='';
  const S=state;

  // 実際に使う桁＋「－」記号の1マスだけをviewBoxに含める。
  // 2桁・3桁の問題で未使用列の白い余白を残さず、縦長の筆算として見せる。
  const aDigits=numA>=1000?4:(numA>=100?3:(numA>=10?2:1));
  const leftmostCol=aDigits>=4?HSX:(aDigits===3?H2X:(aDigits===2?HJX:HIX));
  const VBX=leftmostCol-HG*1.5;
  const VB_RIGHT=210,VBH=230,VBW=VB_RIGHT-VBX;
  const gx0=VBX;
  svgEl.setAttribute('viewBox',`${VBX} 0 ${VBW} ${VBH}`);
  svgEl.setAttribute('width',VBW);
  svgEl.setAttribute('height',VBH);
  for(let gx=gx0;gx<=VB_RIGHT;gx+=HG)mk('line',{x1:gx,y1:0,x2:gx,y2:VBH,stroke:'#000','stroke-width':.5,opacity:.08},svgEl);
  for(let gy=0;gy<=VBH;gy+=HG)mk('line',{x1:VBX,y1:gy,x2:VB_RIGHT,y2:gy,stroke:'#000','stroke-width':.5,opacity:.08},svgEl);

  function txt(content,x,y,fs,fw,color,cls){
    const t=mk('text',{x,y,'font-size':fs||34,'font-weight':fw||'bold',
      fill:color||'#222','text-anchor':'middle','font-family':'Noto Sans JP,sans-serif'},svgEl);
    t.textContent=content;
    if(cls)t.setAttribute('class',cls);
    return t;
  }
  function hl(x,y,w,h,color,a){
    mk('rect',{x,y,width:w,height:h,rx:5,fill:color,opacity:a||.18},svgEl);
  }

  // － 記号（ひく数の、いちばん大きい位の1つ左のマスに書く。addition app の＋記号と同じルール）
  const minusX=leftmostCol-HG;
  if(S.showMinus) txt('－',minusX,HROW2_Y-6,20,'bold','#e35d3a');

  // 横線（－記号の下のマスも含めて、グリッド線に重ねて伸ばす）
  if(S.showLine){
    const lx1=minusX-HG/2;
    mk('line',{x1:lx1,y1:HLINE_Y,x2:168,y2:HLINE_Y,stroke:'#333','stroke-width':2.5},svgEl);
  }

  // ハイライト
  if(S.hlIchi){hl(HIX-18,HROW1_Y-32,38,38,'#fce4ec');hl(HIX-18,HROW2_Y-32,38,38,'#fce4ec');}
  if(S.hlJuu){hl(HJX-18,HROW1_Y-32,38,38,'#fff9cc');hl(HJX-18,HROW2_Y-32,38,38,'#fff9cc');}
  if(S.hlHyaku&&S.has3){hl(H2X-18,HROW1_Y-32,38,38,'#cce8f4');hl(H2X-18,HROW2_Y-32,38,38,'#cce8f4');}
  if(S.hlSen&&S.has4){hl(HSX-18,HROW1_Y-32,38,38,'#e8e8e8');}
  // 「この位は0で、くり下げに使えない」の強調：赤い破線の点滅する枠を、
  // ひかれる数（A行）のその位の数字に重ねて描く。
  if(S.zeroGlowJuu) mk('rect',{x:HJX-19,y:HROW1_Y-33,width:38,height:40,rx:6,fill:'none',stroke:'#e53935','stroke-width':3,'stroke-dasharray':'5,3',class:'zero-glow-frame'},svgEl);
  if(S.zeroGlowHyaku&&S.has3) mk('rect',{x:H2X-19,y:HROW1_Y-33,width:38,height:40,rx:6,fill:'none',stroke:'#e53935','stroke-width':3,'stroke-dasharray':'5,3',class:'zero-glow-frame'},svgEl);

  const isSmall1 = (SUB_NOTATION === 'small1');
  const isCollective = (CASCADE_MODE === 'collective');

  // 波及的繰り下がり（0をまたぐ繰り下がり）の検出
  // Case 1: 一の位の引き算で十の位が0のため上位から借りるケース (例: 305-148, 901-208, 1004-758, 1000-437)
  const isCascadeForI = (S.aI < S.bI) && S.has3 && (S.aJ === 0);
  // Case 2: 十の位の引き算で百の位が0のため千の位から借りるケース (例: 1000-40)
  const isCascadeForJ = (!isCascadeForI) && S.has4 && (S.jAfterBorrow < S.bJ) && (S.aH === 0);

  // まとめて繰り下げる（collective）モードで、実際に繰り下がりが発動しているか
  const isCascadeActive = (isCascadeForI && (S.borrowFromS || S.borrowFromH || S.borrowFromJ)) ||
                          (isCascadeForJ && (S.borrowFromS || S.borrowFromH));

  if(isCollective && isCascadeActive){
    // ============================================================
    // 【まとめて繰り下げる（collective）方式】
    // 複数の位にまたがって1本の斜線を引き、1引いた数字を上に書く（参考画像1・2の方式）
    // ============================================================
    if(isCascadeForI){
      if(S.has4 && S.aH === 0){
        // 4桁（例: 1004-758, 1000-437）：千・百・十の位「1 0 0」をまとめて斜線し、百・十の上に「9」「9」と書く
        if(S.showAS) txt(S.aS, HSX, HROW1_Y, 34, 'bold', '#bbb');
        if(S.showAH) txt(S.aH, H2X, HROW1_Y, 34, 'bold', '#bbb');
        if(S.showAJ) txt(S.aJ, HJX, HROW1_Y, 34, 'bold', '#bbb');
        // 千・百・十にまたがる1本の斜線
        mk('line', {x1: HSX - 15, y1: HROW1_Y - 24, x2: HJX + 15, y2: HROW1_Y + 10, stroke: '#e35d3a', 'stroke-width': 2.5}, svgEl);
        // 百の位・十の位の上に赤字で9を書く（千の位の0は先頭なので書かない）
        const ctH = txt('9', H2X, HROW1_Y - 26, 17, 'bold', '#e35d3a');
        const ctJ = txt('9', HJX, HROW1_Y - 26, 17, 'bold', '#e35d3a');
        if(S.borrowHPop || S.borrowSPop) ctH.setAttribute('class', 'pop-in');
        if(S.borrowJPop) ctJ.setAttribute('class', 'pop-in');
      } else if(S.has3){
        // 3桁（例: 901-208, 305-148）：百・十の位「9 0」などをまとめて斜線し、上に「8」「9」と書く
        const val = S.aH * 10 + S.aJ;
        const decVal = val - 1;
        const decH = Math.floor(decVal / 10);
        const decJ = decVal % 10;
        if(S.showAS && S.has4) txt(S.aS, HSX, HROW1_Y, 34, 'bold', '#222');
        if(S.showAH) txt(S.aH, H2X, HROW1_Y, 34, 'bold', '#bbb');
        if(S.showAJ) txt(S.aJ, HJX, HROW1_Y, 34, 'bold', '#bbb');
        // 百・十にまたがる1本の斜線
        mk('line', {x1: H2X - 15, y1: HROW1_Y - 22, x2: HJX + 15, y2: HROW1_Y + 8, stroke: '#e35d3a', 'stroke-width': 2.4}, svgEl);
        const ctH = txt(decH, H2X, HROW1_Y - 26, 17, 'bold', '#e35d3a');
        const ctJ = txt(decJ, HJX, HROW1_Y - 26, 17, 'bold', '#e35d3a');
        if(S.borrowHPop) ctH.setAttribute('class', 'pop-in');
        if(S.borrowJPop) ctJ.setAttribute('class', 'pop-in');
      }
    } else if(isCascadeForJ){
      // 十の位の借用（例: 1000-40）：千・百の位「1 0」をまとめて斜線し、百の上に「9」と書く
      if(S.showAS) txt(S.aS, HSX, HROW1_Y, 34, 'bold', '#bbb');

let animId=null;
// 逐次モードで「一呼吸」を待っている間のsetTimeout ID。
// cancelAnim()でtweenと一緒に確実に止められるようにする。
let breathTimer=null;
function cancelAnim(){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(breathTimer){clearTimeout(breathTimer);breathTimer=null;}
}
// SVG要素の現在のviewBox幅を取得（updateLayoutで動的変更されるため都度取得）
function vbW(id){
  const svg=document.getElementById(id);
  return parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
}
// SVG要素の現在のviewBox高さを取得（百の位のように縦方向も動的に広がる列で使用）
function vbH(id){
  const svg=document.getElementById(id);
  return parseFloat(svg.getAttribute('viewBox').split(' ')[3]);
}

function tween(ms,onFrame,onDone){
  const t0=performance.now();
  function loop(now){
    const t=Math.min((now-t0)/ms,1);
    onFrame(eio(t));
    if(t<1){animId=requestAnimationFrame(loop);}
    else{animId=null;if(onDone)onDone();}
  }
  animId=requestAnimationFrame(loop);
}

// SVG座標 → アニメレイヤー座標
// 【重要】getBoundingClientRect()はscale適用後の「画面ピクセル」を返すが、
// anim-layerはviewBoxを持たない「設計ピクセル」座標系。ここで計算している値は
// すべて画面ピクセル差分どうしの比・差なので、最後にcurrentScale×数図ローカル倍率で割って
// 設計ピクセルへ変換してから返す。
function svgToLayer(svgEl,svgX,svgY){
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const svgRect=svgEl.getBoundingClientRect();
  const vbW=parseFloat(svgEl.getAttribute('viewBox').split(' ')[2]);
  const vbH=parseFloat(svgEl.getAttribute('viewBox').split(' ')[3]);
  return{
    x:((svgRect.left-tileRect.left)+svgX*(svgRect.width/vbW))/(currentScale*stableTilePanelFactor),
    y:((svgRect.top-tileRect.top)+svgY*(svgRect.height/vbH))/(currentScale*stableTilePanelFactor)
  };
}

// ヘッダー要素の中心座標（layer基準）
// ここも全項が画面ピクセル差分のみで構成されているため、丸ごとcurrentScaleで割る。
function hdrCenter(id){
  const el=document.getElementById(id);
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  return{x:(r.left-tileRect.left+r.width/2)/(currentScale*stableTilePanelFactor), y:(r.top-tileRect.top+r.height/2)/(currentScale*stableTilePanelFactor)};
}

// ヘッダー要素の「真上」座標（ヘッダー上辺のすぐ外）
// x成分は画面ピクセル差分のみなのでcurrentScaleで割る。y成分は
// 「ヘッダー上辺(画面ピクセル差分→設計ピクセル)」に、固定オフセット定数-18
// （すでに設計ピクセル単位の値）を後から足すので、-18自体は割ってはいけない。
function aboveHdr(id){
  const el=document.getElementById(id);
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  return{x:(r.left-tileRect.left+r.width/2)/(currentScale*stableTilePanelFactor), y:(r.top-tileRect.top)/(currentScale*stableTilePanelFactor)-18};
}

// ============================================================
// くり下げ「ブリッジ」共通レイアウト
// ------------------------------------------------------------
// 波及的繰り下がり(borrow-h-to-j-cascade)は、借りてきた10本をタイトル位置
// (hdr-juu)中心・通常サイズでsvg-juu-aにそのまま描画している。この2関数は、
// 十の位「通常時」のbridge100-layerと、一の位のbridge10-layerの両方を、
// 同じ「タイトル位置中心・通常サイズ」ロジックに揃えるための共通座標計算。
// ============================================================
// 棒10本(百→十のブリッジ)：renderSticksと同じ間隔計算で、hc中心に横一列。
function bridgeStickPositions(total,hc){
  const{xs,totW}=stickLayout(total);
  const sx=hc.x-totW/2+STICK_W/2;
  return xs.map(x=>({x:sx+x,y:hc.y}));
}
// タイル10個(十→一のブリッジ)：drawIchiと同じ「5個ずつ2段」の並べ方で、hc中心に配置。
function bridgeIchiPositions(total,hc){
  const u=U,gap=u*.18,S=u+gap,rGap=u*.7;
  const nRows=Math.ceil(total/5);
  const totH=nRows*u+(nRows-1)*rGap;
  const sy=hc.y-totH/2+u/2;
  const pos=[];let drawn=0;
  for(let r=0;r<nRows&&drawn<total;r++){
    const inRow=(r===nRows-1)?(total-drawn):5;
    const rowW=inRow*u+(inRow-1)*gap;
    const sx=hc.x-rowW/2+u/2;
    const cy=sy+r*(u+rGap);
    for(let i=0;i<inRow&&drawn<total;i++){pos.push({x:sx+i*S,y:cy});drawn++;}
  }
  return pos;
}
// 百タイル10枚(せん→百のブリッジ)：hyakuRawPos/hyakuBBoxと同じ斜め配置で、hc中心に配置。
function bridgeHyakuPositions(total,hc,su){
  const bbox=hyakuBBox(total,su);
  const shiftX=hc.x-(bbox.minX+bbox.maxX)/2;
  const shiftY=hc.y-(bbox.minY+bbox.maxY)/2;
  const pos=[];
  for(let i=0;i<total;i++){
    const p=hyakuRawPos(i,total,su);
    pos.push({x:p.x+shiftX,y:p.y+shiftY});
  }
  return pos;
}

let timingMode = localStorage.getItem('hikizan_timing_mode') || 'sync';
// 逐次モードの間（ms）

// ============================================================
// 音声読み上げ（すべての数字・演算記号を日本語の読みに変換してから話す）
// ============================================================
let voiceOn=true,ttsWarmedUp=false,currentUtter=null;

// 0〜9999の整数を日本語の読み（ひらがな）に変換する
function numToYomi(n){
  n=Math.round(n);
  if(n===0)return'ぜろ';
  if(n<0)return'まいなす '+numToYomi(-n);
  const ichiMap=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
  const juuMap  =['','じゅう','にじゅう','さんじゅう','よんじゅう','ごじゅう','ろくじゅう','ななじゅう','はちじゅう','きゅうじゅう'];
  const hyakuMap=['','ひゃく','にひゃく','さんびゃく','よんひゃく','ごひゃく','ろっぴゃく','ななひゃく','はっぴゃく','きゅうひゃく'];
  const senMap  =['','せん','にせん','さんぜん','よんせん','ごせん','ろくせん','ななせん','はっせん','きゅうせん'];
  const sen=Math.floor(n/1000)%10, hyaku=Math.floor(n/100)%10, juu=Math.floor(n/10)%10, ichi=n%10;
  let s='';
  s+=senMap[sen];
  s+=hyakuMap[hyaku];
  s+=juuMap[juu];
  s+=ichiMap[ichi];
  return s;
}

// 助数詞つきの数（0〜10）を、正しい読み（音の変化込み）に変換する
const HON_MAP=['ぜろほん','いっぽん','にほん','さんぼん','よんほん','ごほん','ろっぽん','ななほん','はっぽん','きゅうほん','じゅっぽん'];
const KO_MAP =['ぜろこ','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];
const MAI_MAP=['ぜろまい','いちまい','にまい','さんまい','よんまい','ごまい','ろくまい','ななまい','はちまい','きゅうまい','じゅうまい'];

// HTML（タグ・数字・演算記号入り）を読み上げ用の日本語テキストに変換する
function toSpeechText(html){
  let s=String(html);
  s=s.replace(/<br\s*\/?>/gi,'。');     // 改行は「、」のように一拍おく
  s=s.replace(/<[^>]+>/g,'');           // 残りのタグは除去
  // 読み間違えやすい言葉は先に決まった読みへ置き換える（数字変換より前に処理する）
  s=s.replace(/1つ/g,'ひとつ');
  // 助数詞（本／こ／まい）がつく数字は、音の変化（いっぽん・じゅっこ等）を考慮して先に変換する
  s=s.replace(/(\d+)本/g,(m,d)=>HON_MAP[parseInt(d,10)]??(numToYomi(parseInt(d,10))+'ほん'));
  s=s.replace(/(\d+)こ/g,(m,d)=>KO_MAP[parseInt(d,10)]??(numToYomi(parseInt(d,10))+'こ'));
  s=s.replace(/(\d+)まい/g,(m,d)=>MAI_MAP[parseInt(d,10)]??(numToYomi(parseInt(d,10))+'まい'));
  s=s.replace(/ひき算/g,'ひきざん');     // 「ひき算」を「ひきざん」と正しく読ませる
  s=s.replace(/くり上/g,'くりあ');
  s=s.replace(/くり下/g,'くりさ');       // 「くり下げ」を「くりさげ」と正しく読ませる
  s=s.replace(/入らない/g,'はいらない');
  s=s.replace(/＋|\+/g,' たす ');
  s=s.replace(/－|-/g,' ひく ');
  s=s.replace(/×/g,' かける ');
  s=s.replace(/÷/g,' わる ');
  s=s.replace(/＝|=/g,' は ');
  s=s.replace(/▶|◀/g,'');
  s=s.replace(/\d+/g,m=>numToYomi(parseInt(m,10))); // 残りの数字をすべて日本語の読みに変換
  s=s.replace(/\s+/g,' ').trim();
  return s;
}

// 無音のウォームアップ発話（一部のブラウザは最初の発話が無視されることがあるため、
// 起動直後（や音声ON直後）に1音だけ無音で読み上げてエンジンを起こしておく）
function warmupTTS(){
  if(ttsWarmedUp)return;
  if(!('speechSynthesis'in window))return;
  try{
    const u=new SpeechSynthesisUtterance('ん');
    u.lang='ja-JP';u.volume=0;
    window.speechSynthesis.speak(u);
    ttsWarmedUp=true;
  }catch(e){/* 読み上げ非対応環境では無視 */}
}

function speakText(text){
  if(!voiceOn)return;
  if(!('speechSynthesis'in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=.95;u.pitch=1.05;
    currentUtter=u;
    window.speechSynthesis.speak(u);
  }catch(e){/* 読み上げ非対応環境では無視 */}
}

function speakStep(descHtml){
  speakText(toSpeechText(descHtml));
}

function toggleVoice(){
  voiceOn=!voiceOn;
  const btn=document.getElementById('btn-voice');
  btn.classList.toggle('off',!voiceOn);
  if(voiceOn){
    warmupTTS();
  } else if('speechSynthesis'in window){
    window.speechSynthesis.cancel();
  }
}

// ============================================================
// ステップ定義
// ============================================================
function buildSteps(){
  const aS=Math.floor(numA/1000)%10,aH=Math.floor(numA/100)%10,aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bS=0,bH=Math.floor(numB/100)%10,bJ=Math.floor((numB%100)/10),bI=numB%10;
  const ans=numA-numB;

  // 桁の判定：ひき算では答えがひかれる数より大きくならないので、
  // 表示する桁数はひかれる数(A)の桁数で決まる。
  // has4：ひかれる数が1000（せんのくらいを持つ）のとき。
  const has4=(aS>0);
  const has3=(aH>0)||has4;

  // ============================================================
  // 繰り下がり計算（カスケード対応）
  // 十の位が0などで「一の位への借用」のために、さらに百の位から
  // 十の位へ先に借りておく必要があるケース（例：305-148）に対応する。
  // ============================================================
  const needBorrowI = (aI < bI); // 一の位で繰り下がりが必要か

  // 一の位が十の位から1借りようとした時、十の位がもともと0なら、
  // 先に百の位から十の位へ1借りておく必要がある（カスケード）。
  const needCascadeForI = needBorrowI && has3 && (aJ===0);
  // カスケードした場合の「十の位の値（百から借りた直後、まだ一の位に貸す前）」
  // 例：305-148 → 十の位はもともと0。百から1借りて 0+10=10 になる。
  const jBeforeLendToI = needCascadeForI ? (aJ+10) : aJ;

  // 一の位へ1渡した後の十の位の値
  const jAfterBorrowI = jBeforeLendToI - (needBorrowI?1:0);
  const iAns = needBorrowI ? (aI+10-bI) : (aI-bI);

  // ---- 十の位 ----
  const needBorrowJ = has3 && (jAfterBorrowI < bJ);   // 十の位で繰り下がりが必要か(3桁のとき)
  const jAns = needBorrowJ ? (jAfterBorrowI+10-bJ) : (jAfterBorrowI-bJ);

  // ---- 百の位 ----
  // 百の位は、カスケードで十の位に貸した分(needCascadeForI)と、
  // 十の位の引き算で貸した分(needBorrowJ)の両方を考慮する。
  // ただしカスケードと十の位借用は同時には起こらない
  // （カスケードする時点でjBeforeLendToI=9になり、9から更に借りる(needBorrowJ)ことは無い設計のため）。
  // has4のとき、百の位はもともと0なので、まず「せんのくらい」から1くり下げて10にしてから使う(aHb)。
  // ひかれる数が1000の場合、ひく数(1〜999)は必ず何かしらの位が0でないため、このくり下げは常に発生する。
  const needBorrowH = has4; // せんのくらいから百のくらいへのくり下げが必要か
  const aHb = has4 ? (aH+10) : aH;
  const hAfterBorrowJ = has3 ? (aHb - ((needCascadeForI||needBorrowJ)?1:0)) : 0;
  const hAns = has3 ? (hAfterBorrowJ - bH) : 0;
  // ---- 千の位 ----
  // ひく数は1000未満なので、せんのくらいは借りたら必ず0になる。
  const sAns = has4 ? (aS - (needBorrowH?1:0)) : 0;

  const hBase={
    aS,aH,aJ,aI,bS,bH,bJ,bI,iAns,jAns,hAns,sAns,has3,has4,
    showAS:false,showAH:false,showAJ:false,showAI:false,
    showBS:false,showBH:false,showBJ:false,showBI:false,
    showMinus:false,showLine:false,
    borrowFromS:false,borrowFromH:false,borrowFromJ:false,
    hAfterBorrow:hAfterBorrowJ,jAfterBorrow:jAfterBorrowI,sAfterBorrow:sAns,
    jBeforeLend:jBeforeLendToI,
    jDisplayOverride:null, // カスケードで十の位がまだ「中間値(9等)」のときに表示する値
    hDisplayOverride:null, // せんのくらいからのくり下げで百の位がまだ「中間値(10等)」のときに表示する値
    borrowHPop:false,borrowJPop:false,borrowSPop:false,
    showBridge10:false,bridge10Pop:false,
    // 百の位から十の位へ「くり下げた後の十の位」がさらに繰り下がる場合に、
    // 十の位の斜線つき小さい赤字数字のさらに上へ表示する「10」の赤字表示。
    showBridge100:false,bridge100Pop:false,
    // せんのくらいから百のくらいへくり下げた「10」の赤字表示（百の位の数字の上）。
    showBridge1000:false,bridge1000Pop:false,
    // ブリッジ計算（真のブリッジ）：一の位の「10」と「7」を結ぶコの字線、
    // ひかれる数の横に書く補助計算の答え、「＋」記号。
    showBridgeLineI:false,bridgeLineIPop:false,
    showBridgeAnsI:false,bridgeAnsIPop:false,bridgeAnsIVal:0,
    showBridgePlusI:false,bridgePlusIPop:false,
    // 同様に、十の位（百の位からのくり下がり）用。
    showBridgeLineJ:false,bridgeLineJPop:false,
    showBridgeAnsJ:false,bridgeAnsJPop:false,bridgeAnsJVal:0,
    showBridgePlusJ:false,bridgePlusJPop:false,
    showAnsI:false,showAnsJ:false,showAnsH:false,showAnsS:false,
    hlIchi:false,hlJuu:false,hlHyaku:false,hlSen:false,ansBox:false,
    // 波及的繰り下がりで「この位は0だから、さらに上の位から借りよう」と
    // なったとき、その0の位を筆算の数字上で赤く点滅させて強調する。
    zeroGlowJuu:false,zeroGlowHyaku:false
  };

  const tBase={
    senA:{count:0,alpha:1,hl:null,ghost:0},
    // zeroGlow: 波及的繰り下がりで「この位は0で貸せない」ことを図解でも強調するためのフラグ。
    hyakuA:{count:0,alpha:1,hl:null,ghost:0,zeroGlow:false}, juuA:{count:0,alpha:1,hl:null,ghost:0,zeroGlow:false}, ichiA:{count:0,alpha:1,hl:null,ghost:0},
    hyakuB:{count:0,alpha:1,hl:null,ghost:0}, juuB:{count:0,alpha:1,hl:null,ghost:0}, ichiB:{count:0,alpha:1,hl:null,ghost:0},
    hyakuAns:{count:0,alpha:1,hl:null,ghost:0}, juuAns:{count:0,alpha:1,hl:null,ghost:0}, ichiAns:{count:0,alpha:1,hl:null,ghost:0},
    showAnsRow:false,
    // 対消滅エフェクト用：今まさに消えるペアの個数（A側・B側それぞれ何個が消滅対象か）
    annihilateIchi:0, annihilateJuu:0, annihilateHyaku:0,
    // 一の位へ繰り下げた「10の塊」の半透明痕跡。show=trueの間、bridge10-layerに
    // count個は通常表示、残り(10-count)個は半透明ghostとして常に描画され続ける。
    // アニメーション終了後もステップを跨いで(cloneStateで)引き継がれるため、
    // 計算の最後まで痕跡が消えない。
    bridgeTen:{show:false,count:0},
    // 百の位から十の位へ追加でくり下げた「10本の10」の半透明な痕跡。
    // bridgeTenと同じ考え方で、bridge100-layer（永続レイヤー）に描画される。
    // count個は通常表示、残り(10-count)個は半透明ghostとして描画され続ける。
    bridgeHyaku:{show:false,count:0},
    // せんの位から百の位へくり下げた「10まいの100」の半透明な痕跡。
    // bridgeTen/bridgeHyakuと同じ考え方で、bridge1000-layer（永続レイヤー）に
    // ひゃくのくらいのタイトル位置(hdr-hyaku)を中心に、枠を無視したフルサイズで描画される。
    // count個は通常表示、残り(10-count)個は半透明ghostとして描画され続ける。
    bridgeSen:{show:false,count:0}
  };

  const list=[];
  function prev(){return list.length?cloneState(list[list.length-1]):{h:cloneState(hBase),t:cloneState(tBase),title:'',desc:'',anim:null};}

  // ============================================================
  // 波及的繰り下がり共通ヘルパー：「この位は0だから、くり下げに使えない」を
  // 筆算の数字（p.h側）と、タイル/カード図解の空っぽの枠（p.t側）の
  // 両方に、同じ赤い点滅表示で反映する。呼び出し側は、この位が実際に
  // 貸し出されて0でなくなるステップで、対応するp.h.zeroGlowXxxをfalseに
  // 戻すこと（p.tの方はオブジェクトを丸ごと差し替えると自然に消える）。
  // ============================================================
  function markZeroCantLend(p,place){
    if(place==='juu'){
      p.h.zeroGlowJuu=true;
      if(p.t.juuA)p.t.juuA.zeroGlow=true;
    } else if(place==='hyaku'){
      p.h.zeroGlowHyaku=true;
      if(p.t.hyakuA)p.t.hyakuA.zeroGlow=true;
    }
  }

  // Step0: 空スタート
  {
    const p=prev();
    p.title='はじめましょう！';
    p.desc=`<span class="ac">${numA} － ${numB}</span> を ひっ算で けいさんします。<br>じゅんばんに すうじを かいていきましょう。`;
    list.push(p);
  }

  // 千の位A（1000のとき）
  if(has4){
    const p=prev();
    p.title=`<span class="sc">${aS}</span> を書く（せんのくらい）`;
    p.desc=`<span class="sc">せんのくらい</span>の <span class="sc">${aS}</span> を書きます。<br>大きな1000のかたまりが <span class="sc">${aS}こ</span> あります。`;
    p.h.showAS=true;
    p.t.senA={count:aS,alpha:1,hl:'#555555'};
    p.anim='appear-sen-a';
    list.push(p);
  }

  // 百の位A（3桁のとき）
  if(has3){
    const p=prev();
    p.title=`<span class="hc">${aH}</span> を書く（ひゃくのくらい）`;
    p.desc=`<span class="hc">ひゃくのくらい</span>の <span class="hc">${aH}</span> を書きます。<br>大きな正方形タイルが <span class="hc">${aH}まい</span> あります。`;
    p.h.showAS=has4;
    p.h.showAH=true;
    p.t.senA={count:aS,alpha:1,hl:null};
    p.t.hyakuA={count:aH,alpha:1,hl:'#2980b9'};
    p.anim='appear-hyaku-a';
    list.push(p);
  }

  // 十の位A
  {
    const p=prev();
    p.title=`<span class="jc">${aJ}</span> を書く（じゅうのくらい）`;
    p.desc=`<span class="jc">じゅうのくらい</span>の <span class="jc">${aJ}</span> を書きます。`;
    p.h.showAJ=true;
    p.t.hyakuA={count:aH,alpha:1,hl:null};
    p.t.juuA={count:aJ,alpha:1,hl:'#f39c12'};
    p.anim='appear-juu-a';
    list.push(p);
  }

  // 一の位A
  {
    const p=prev();
    p.title=`<span class="ic">${aI}</span> を書く（いちのくらい）`;
    p.desc=`<span class="ic">いちのくらい</span>の <span class="ic">${aI}</span> を書きます。`;
    p.h.showAI=true;
    p.t.juuA={count:aJ,alpha:1,hl:null};
    p.t.ichiA={count:aI,alpha:1,hl:'#e91e63'};
    p.anim='appear-ichi-a';
    list.push(p);
  }

  // － 記号
  {
    const p=prev();
    p.title='－ を書く';
    p.desc='ひき算の きごうを 書きます。';
    p.h.showMinus=true;
    p.t.ichiA={count:aI,alpha:1,hl:null};
    p.anim=null;
    list.push(p);
  }

  // 百の位B（ひく数も3桁のときだけ。ひく数が2桁以下なら百の位は空白のままにする＝
  // 147－18のような問題で「147－018」のように0を書いてしまうのを防ぐ）
  if(has3 && bH>0){
    const p=prev();
    p.title=`<span class="hc">${bH}</span> を書く（ひゃくのくらい）`;
    p.desc=`ひく数の <span class="hc">ひゃくのくらい</span> の <span class="hc">${bH}</span> を書きます。`;
    p.h.showBH=true;
    p.t.hyakuB={count:bH,alpha:1,hl:'#2980b9'};
    p.anim='appear-hyaku-b';
    list.push(p);
  }

  // 十の位B（ひく数の十の位が無い意味での0のとき(bJ===0 かつ bH===0)は、
  // 百の位Bと同じ理由で空白のままにする＝「1000－09」のように0を書いてしまうのを防ぐ）
  if(bJ>0 || bH>0){
    const p=prev();
    p.title=`<span class="jc">${bJ}</span> を書く（じゅうのくらい）`;
    p.desc=`ひく数の <span class="jc">じゅうのくらい</span> の <span class="jc">${bJ}</span> を書きます。`;
    p.h.showBJ=true;
    p.t.hyakuB={count:bH,alpha:1,hl:null};
    p.t.juuB={count:bJ,alpha:1,hl:'#f39c12'};
    p.anim='appear-juu-b';
    list.push(p);
  }

  // 一の位B
  {
    const p=prev();
    p.title=`<span class="ic">${bI}</span> を書く（いちのくらい）`;
    p.desc=`ひく数の <span class="ic">いちのくらい</span> の <span class="ic">${bI}</span> を書きます。`;
    p.h.showBI=true;
    p.t.juuB={count:bJ,alpha:1,hl:null};
    p.t.ichiB={count:bI,alpha:1,hl:'#e91e63'};
    p.anim='appear-ichi-b';
    list.push(p);
  }

  // 横線
  {
    const p=prev();
    p.title='横線を引く';
    p.desc='<span class="rc">定規でまっすぐ 線を引きます。</span><br>この線の下に こたえを書きます。';
    p.h.showLine=true;
    p.t.ichiB={count:bI,alpha:1,hl:null};
    p.anim=null;
    list.push(p);
  }

  // ============================================================
  // 一の位の計算
  // ============================================================
  if(!needBorrowI){
    // 繰り下がり不要：そのまま対消滅
    const p=prev();
    p.title=`いちのくらいの けいさん：${aI}－${bI}＝${iAns}`;
    p.desc=`<span class="ic">いちのくらい</span>を けいさんします。<br>`
      +`<span class="ic">${aI} － ${bI} ＝ ${iAns}</span>`;
    p.h.hlIchi=true;p.h.showAnsI=true;
    p.t.ichiA={count:0,alpha:1,hl:null,ghost:aI};
    p.t.ichiB={count:0,alpha:1,hl:null,ghost:bI};
    p.t.ichiAns={count:iAns,alpha:1,hl:null,ghost:0};
    p.t.showAnsRow=true;
    p.t.annihilateIchi=bI;
    p.anim='annihilate-ichi';
    list.push(p);
  } else {
    // 繰り下がりが必要
    // ステップ1: 7から8はひけないと気づく
    {
      const p=prev();
      p.title=`${aI}から${bI}は ひけない…`;
      p.desc=`<span class="ic">いちのくらい</span>を 見てみましょう。<br>`
        +`<span class="ic">${aI}</span> から <span class="ic">${bI}</span> は ひけません。<br>`
        +`<span class="jc">じゅうのくらい</span>から <span class="cc">1</span> くり下げます。`;
      p.h.hlIchi=true;
      p.anim=null;
      list.push(p);
    }
    // カスケード：十の位がもともと0で貸せないので、先に百の位から十の位へ1借りる
