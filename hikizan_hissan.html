    // すでに(繰り下げ前から)十の位A列に表示されている棒(jAfterBorrowI本、+既存ghost分)の座標
    const posAExistingFull=juuPos(jAfterBorrowI+existingGhostA,W,112);
    const posAExistingActive=posAExistingFull.slice(0,jAfterBorrowI);
    const posAExistingLayer=posAExistingActive.map(p=>svgToLayer(svgJA,p.cx,p.cy));

    const n=Math.min(10,bJ);
    const remainTen=10-n; // 借りてきた10本のうち、まだ使われず残る本数
    const usedTen=pos10.slice(remainTen); // 対消滅に使う側(右＝末尾n本)
    const bOrder=Array.from({length:n},(_,i)=>i).sort((i,j)=>posB[j].x-posB[i].x);

    layer.innerHTML='';
    // 借りてきた10本を、個別の<g>要素としてlayerに描く(ヘッダー上の実体をそのまま動かす)
    const elTen=pos10.map(p=>{
      const g=mk('g',{},layer);
      drawStick(g,p.x,p.y,su2,1,'#e35d3a');
      return g;
    });
    const elUsedTen=elTen.slice(remainTen);
    // Bの十の位も、個別の<g>要素として通常表示で描く
    svgJB.innerHTML='';
    const elBReal=posBLocal.map(p=>{
      const g=mk('g',{},svgJB);
      drawStick(g,p.cx,p.cy,U,1,SC);
      return g;
    });

    const tileRect=document.getElementById('tile-area').getBoundingClientRect();
    const destX=tileRect.width/(currentScale*stableTilePanelFactor)-20, destY=20;
    const STAGGER=230;
    let doneCount=0;

    function runPair(i){
      const a=usedTen[i], b=posB[bOrder[i]];
      const bLocal=posBLocal[bOrder[i]];
      const realA=elUsedTen[i], realB=elBReal[bOrder[i]];
      const line=mk('line',{x1:b.x,y1:b.y,x2:b.x,y2:b.y,stroke:'#ff7043','stroke-width':2.5,'stroke-linecap':'round'},layer);
      tween(220,t=>{
        const cx2=b.x+(a.x-b.x)*t, cy2=b.y+(a.y-b.y)*t;
        line.setAttribute('x2',cx2); line.setAttribute('y2',cy2);
      },()=>{
        realA.setAttribute('class','glow-pop');
        realB.setAttribute('class','glow-pop');
        setTimeout(()=>{
          const GHOST_A=.45;
          realA.innerHTML=''; drawStick(realA,a.x,a.y,su2,GHOST_A,'#8a8a8a');
          realB.innerHTML=''; drawStick(realB,bLocal.cx,bLocal.cy,U,GHOST_A,'#8a8a8a');
          realA.removeAttribute('class'); realB.removeAttribute('class');
          const ga=mk('g',{},layer); drawStick(ga,a.x,a.y,su2,1,'#e35d3a');
          const gb=mk('g',{},layer); drawStick(gb,b.x,b.y,U,1,SC);
          tween(550,t=>{
            const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
            const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
            ga.setAttribute('transform',`translate(${dxA},${dyA})`);
            gb.setAttribute('transform',`translate(${dxB},${dyB})`);
            const op=1-t;
            ga.setAttribute('opacity',op);
            gb.setAttribute('opacity',op);
            line.setAttribute('opacity',op);
            line.setAttribute('x1',b.x+dxB); line.setAttribute('y1',b.y+dyB);
            line.setAttribute('x2',a.x+dxA); line.setAttribute('y2',a.y+dyA);
          },()=>{
            line.remove(); ga.remove(); gb.remove();
            doneCount++;
            if(doneCount>=n) afterAllPairs();
          });
        },250);
      });
    }
    for(let i=0;i<n;i++) setTimeout(()=>runPair(i), i*STAGGER);

    function afterAllPairs(){
      layer.innerHTML='';
      // 「10本の10」の半透明痕跡は、この後の答え欄への移動アニメーション中も
      // 消えずに残り続けてほしいので、ここでbridge100-layer（永続レイヤー）に
      // 最終状態(count:0=10本すべてghost)を先に描いておく。こうしておけば、
      // このあとlayer側で移動アニメーションを行っている間も痕跡が途切れず、
      // onDone()後のpaintTilesでも同じ見た目のまま引き継がれる。
      renderBridgeHyaku(nextState);
      // Bの十の位はghostとして痕跡を残す
      renderSticks(svgJB,0,1,null,null,bJ);

      // 残った借用分(remainTen本)＋もとから十の位にあった分(jAfterBorrowI本)を、
      // まとめて答え欄(jAns本)へ移動する。
      document.getElementById('row-ans').style.display='table-row';
      const jAns2=remainTen+jAfterBorrowI;
      const posAns=juuPos(jAns2,W,122);
      const lDestAll=posAns.map(p=>svgToLayer(svgJAns,p.cx,p.cy));

      // 移動開始時に、元の位置(A列/ヘッダー上)は全てghost化して残しておく
      svgJA.innerHTML='';
      renderSticks(svgJA,0,1,null,null,jAfterBorrowI+existingGhostA,existingGhostA);

      const remainSrc=pos10.slice(0,remainTen); // 既にlayer座標
      const allSrc=[...remainSrc,...posAExistingLayer];
      const remainGroup=remainSrc.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,su2,1,SC);return g;});
      const aGroup=posAExistingLayer.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,U,1,SC);return g;});
      const allG=[...remainGroup,...aGroup];

      svgJAns.innerHTML='';
      setTimeout(()=>{
        tween(550,t=>{
          allG.forEach((g,i)=>{
            const dest=lDestAll[i]||lDestAll[lDestAll.length-1];
            const dx=(dest.x-allSrc[i].x)*t, dy=(dest.y-allSrc[i].y)*t;
            g.setAttribute('transform',`translate(${dx},${dy})`);
          });
        },()=>{
          layer.innerHTML='';
          renderSticks(svgJAns,jAns2,1,null);
          onDone();
        });
      },350);
    }
    return;
  }

  // --- annihilate-hyaku: 百の位の対消滅 ---
  // --- annihilate-hyaku-cascade: せんのくらいから借りた「10まいの100」(bridgeSen)を
  // 使って百の位自身の引き算をする。ひかれる数の枠(svg-hyaku-a)は一切使わず、
  // ひゃくのくらいのタイトル位置(hdr-hyaku)中心のまま、Bの百の位と対消滅→残りを答え欄へ移動する。
  if(animType==='annihilate-hyaku-cascade'){
    document.getElementById('bridge1000-layer').innerHTML='';
    const hc=hdrCenter('hdr-hyaku');
    const existingGhostA=(needCascadeForI||needBorrowJ)?1:0;
    const available=hAfterBorrowJ; // 10 - existingGhostA
    const n=bH;
    const remainTen=available-n; // =hAns
    if(DISPLAY_MODE==='card'){
      const svgHB=document.getElementById('svg-hyaku-b');
      const svgHAns=document.getElementById('svg-hyaku-ans');
      const pos10=bridgeCardPositions(10,hc,'hyaku');
      const WB=vbW('svg-hyaku-b'),HB=vbH('svg-hyaku-b');
      const{pos:posBLocal}=cardBoxPositions(bH,0,'hyaku',WB,HB);
      const posB=posBLocal.map(p=>svgToLayer(svgHB,p.cx,p.cy));
      const usedTen=pos10.slice(available-n,available);

      // 既に十の位へ渡した使用済み分(existingGhostA枚)は、renderBridgeSenと全く同じ
      // 見た目（点線の枠付き半透明カード）で永続レイヤー(bridge1000-layer)側に描き、
      // このステップが終わるまで一切触らない（対消滅中も移動中もずっと表示され続ける）。
      // タイル方式と違いカード方式では、これまでこの部分もanim-layer(layer)に
      // 混ぜて描いていたため、layerをクリアするたびに一緒に消えてしまっていた。
      const bl1000c=document.getElementById('bridge1000-layer');
      for(let i=available;i<10;i++){
        drawCardSingle(bl1000c,pos10[i].x,pos10[i].y,'hyaku',1,.45,null,true,true);
      }

      layer.innerHTML='';
      // ここではavailable枚（今回使う／答えへ移動する分）だけをanim-layerに描く。
      // 既存ghost(existingGhostA分)はbridge1000-layer側に任せるので、ここには含めない。
      const elTen=pos10.slice(0,available).map(p=>{const g=mk('g',{},layer);drawCardSingle(g,p.x,p.y,'hyaku',1,1,'#e35d3a',false);return g;});
      const elUsedTen=elTen.slice(available-n,available);
      svgHB.innerHTML='';
      const elBReal=posBLocal.map(p=>{const g=mk('g',{},svgHB);drawCardSingle(g,p.cx,p.cy,'hyaku',1,1,null,false);return g;});

      function finishRemainderCard(){
        document.getElementById('row-ans').style.display='table-row';
        const WAns=vbW('svg-hyaku-ans'),HAns=vbH('svg-hyaku-ans');
        const{pos:posAnsLocal}=cardBoxPositions(remainTen,0,'hyaku',WAns,HAns);
        const lDestAll=posAnsLocal.map(p=>svgToLayer(svgHAns,p.cx,p.cy));
        const remainSrc=pos10.slice(0,remainTen);
        svgHAns.innerHTML='';
        // 対消滅で使った分(usedTen)のghostは対消滅アニメーション中にlayer上へ描かれて
        // いたが、呼び出し元のlayer.innerHTML=''で消えてしまっている。remainSrc分と
        // 合わせてavailable枚全体をここで改めてghostとして描き直す。これにより、
        // 答え欄への移動アニメーション中もずっとghostが表示され続ける。
        pos10.slice(0,available).forEach(p=>drawCardSingle(layer,p.x,p.y,'hyaku',1,.45,null,true));
        // 移動が始まるまでの間も、濃い実物カードがその場に静止して見え続けるよう
        // すぐに描いておく（空白の瞬間を作らない）。350ms後にこれを片付けて
        // cardFlyManyで実際に飛ばす（ghostは飛ばさずその場に残す）。
        const holdGroup=remainSrc.map(p=>{const g=mk('g',{},layer);drawCardSingle(g,p.x,p.y,'hyaku',1,1,'#e35d3a',false);return g;});
        setTimeout(()=>{
          holdGroup.forEach(g=>g.remove());
          cardFlyMany(layer,remainSrc,lDestAll,'hyaku',null,550,()=>{
            layer.innerHTML='';
            renderCardPlace('hyaku',svgHAns,remainTen,1,null,0);
            onDone();
          });
        },350);
      }
      if(n===0){
        layer.innerHTML='';
        renderCardPlace('hyaku',svgHB,0,1,null,bH);
        finishRemainderCard();
        return;
      }
      cardAnnihilatePairs({
        posA:usedTen, posB, realA:elUsedTen, realB:elBReal,
        place:'hyaku', color:'#e35d3a',
        onAllDone:()=>{
          layer.innerHTML='';
          renderCardPlace('hyaku',svgHB,0,1,null,bH);
          finishRemainderCard();
        }
      });
      return;
    }
    const svgHB=document.getElementById('svg-hyaku-b');
    const svgHAns=document.getElementById('svg-hyaku-ans');
    const pos10=bridgeHyakuPositions(10,hc,su);
    const WB=vbW('svg-hyaku-b'),HB=vbH('svg-hyaku-b');
    const posBLocal=Array.from({length:bH},(_,i)=>hyakuTilePos(i,bH,WB,HB,su));
    const posB=posBLocal.map(p=>svgToLayer(svgHB,p.cx,p.cy));
    const usedTen=pos10.slice(available-n,available);
    const bOrder=Array.from({length:n},(_,i)=>i).sort((i,j)=>posB[j].x-posB[i].x);

    // 既に十の位へ渡した使用済み分(existingGhostA枚)は、renderBridgeSenと全く同じ見た目
    // （点線の枠付き半透明タイル）で永続レイヤー(bridge1000-layer)側に描き、
    // このステップが終わるまで一切触らない（対消滅中も移動中もずっと表示され続ける）。
    const bl1000=document.getElementById('bridge1000-layer');
    bl1000.innerHTML='';
    const side1000=10*su+9*su*.15;
    for(let i=available;i<10;i++){
      const p=pos10[i];
      const g=mk('g',{},bl1000);
      drawHyakuScaled(g,p.x,p.y,su,.45,'#8a8a8a');
      mk('rect',{x:p.x-side1000/2-2,y:p.y-side1000/2-2,width:side1000+4,height:side1000+4,
        fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},bl1000);
      drawLentSlash(bl1000,p.x,p.y,side1000/2,side1000/2);
    }

    layer.innerHTML='';
    // ここではavailableまい（今回使う／答えへ移動する分）だけをanim-layerに描く。
    // 既存ghost(existingGhostA分)はbridge1000-layer側に任せるので、ここには含めない。
    const elTen=pos10.slice(0,available).map((p)=>{
      const g=mk('g',{},layer);
      drawHyakuScaled(g,p.x,p.y,su,1,'#e35d3a');
      return g;
    });
    const elUsedTen=elTen.slice(available-n,available);
    svgHB.innerHTML='';
    const elBReal=posBLocal.map(p=>{
      const g=mk('g',{},svgHB);
      drawHyakuScaled(g,p.cx,p.cy,su,1,SC);
      return g;
    });

    const tileRect=document.getElementById('tile-area').getBoundingClientRect();
    const destX=tileRect.width/(currentScale*stableTilePanelFactor)-20, destY=20;
    const STAGGER=230;
    let doneCount=0;

    function runPair(i){
      const a=usedTen[i], b=posB[bOrder[i]];
      const bLocal=posBLocal[bOrder[i]];
      const realA=elUsedTen[i], realB=elBReal[bOrder[i]];
      const line=mk('line',{x1:b.x,y1:b.y,x2:b.x,y2:b.y,stroke:'#ff7043','stroke-width':2.5,'stroke-linecap':'round'},layer);
      tween(220,t=>{
        const cx2=b.x+(a.x-b.x)*t, cy2=b.y+(a.y-b.y)*t;
        line.setAttribute('x2',cx2); line.setAttribute('y2',cy2);
      },()=>{
        realA.setAttribute('class','glow-pop');
        realB.setAttribute('class','glow-pop');
        setTimeout(()=>{
          const GHOST_A=.45;
          realA.innerHTML=''; drawHyakuScaled(realA,a.x,a.y,su,GHOST_A,'#8a8a8a');
          realB.innerHTML=''; drawHyakuScaled(realB,bLocal.cx,bLocal.cy,su,GHOST_A,'#8a8a8a');
          realA.removeAttribute('class'); realB.removeAttribute('class');
          const ga=mk('g',{},layer); drawHyakuScaled(ga,a.x,a.y,su,1,'#e35d3a');
          const gb=mk('g',{},layer); drawHyakuScaled(gb,b.x,b.y,su,1,SC);
          tween(550,t=>{
            const dxA=(destX-a.x)*t, dyA=(destY-a.y)*t;
            const dxB=(destX-b.x)*t, dyB=(destY-b.y)*t;
            ga.setAttribute('transform',`translate(${dxA},${dyA})`);
            gb.setAttribute('transform',`translate(${dxB},${dyB})`);
            const op=1-t;
            ga.setAttribute('opacity',op);
            gb.setAttribute('opacity',op);
            line.setAttribute('opacity',op);
            line.setAttribute('x1',b.x+dxB); line.setAttribute('y1',b.y+dyB);
            line.setAttribute('x2',a.x+dxA); line.setAttribute('y2',a.y+dyA);
          },()=>{
            line.remove(); ga.remove(); gb.remove();
            doneCount++;
            if(doneCount>=n) afterAllPairs();
          });
        },250);
      });
    }
    if(n===0){ afterAllPairs(); } else {
      for(let i=0;i<n;i++) setTimeout(()=>runPair(i), i*STAGGER);
    }

    function afterAllPairs(){
      layer.innerHTML='';
      renderHyakus(svgHB,0,1,null,null,bH);
      document.getElementById('row-ans').style.display='table-row';
      const WAns=vbW('svg-hyaku-ans'),HAns=vbH('svg-hyaku-ans');
      const posAns=Array.from({length:remainTen},(_,i)=>hyakuTilePos(i,remainTen,WAns,HAns,su));
      const lDestAll=posAns.map(p=>svgToLayer(svgHAns,p.cx,p.cy));

      const remainSrc=pos10.slice(0,remainTen);

      // 対消滅で使った分(usedTen)のghostは対消滅アニメーション中にlayer上へ描かれていたが、
      // 直前のlayer.innerHTML=''で消えてしまっている。remainSrc分と合わせてavailable枚
      // 全体をここで改めてghostとして描き直す（見た目はrenderBridgeSenと同じ）。
      // これにより、答え欄への移動アニメーション中もずっとghostが表示され続ける。
      pos10.slice(0,available).forEach(p=>{
        const g=mk('g',{},layer);
        drawHyakuScaled(g,p.x,p.y,su,.45,'#8a8a8a');
        mk('rect',{x:p.x-side1000/2-2,y:p.y-side1000/2-2,width:side1000+4,height:side1000+4,
          fill:'none',stroke:'#8a8a8a','stroke-width':1,'stroke-dasharray':'3,2',rx:2},layer);
      });

      const remainGroup=remainSrc.map(p=>{const g=mk('g',{},layer);drawHyakuScaled(g,p.x,p.y,su,1,'#e35d3a');return g;});

      svgHAns.innerHTML='';
      setTimeout(()=>{
        tween(550,t=>{
          remainGroup.forEach((g,i)=>{
            const dest=lDestAll[i]||lDestAll[lDestAll.length-1];
            const dx=(dest.x-remainSrc[i].x)*t, dy=(dest.y-remainSrc[i].y)*t;
            g.setAttribute('transform',`translate(${dx},${dy})`);
          });
        },()=>{
          layer.innerHTML='';
          renderHyakus(svgHAns,remainTen,1,null);
          onDone();
        });
      },350);
    }
    return;
  }

  if(animType==='annihilate-hyaku'){
    runAnnihilation({
      svgA: document.getElementById('svg-hyaku-a'),
      svgB: document.getElementById('svg-hyaku-b'),
      svgAns: document.getElementById('svg-hyaku-ans'),
      countA: hAfterBorrowJ, countB: bH,
      existingGhostA: (needCascadeForI||needBorrowJ) ? 1 : 0,
      drawUnit:'hyaku', unitSize:su,
      getPositions:(svgEl,count)=>{
        if(!count) return [];
        if(DISPLAY_MODE==='card') return cardGetPositions('hyaku')(svgEl,count);
        const W=vbW('svg-hyaku-a'),H=parseInt(svgEl.getAttribute('height'))||112;
        return Array.from({length:count},(_,i)=>hyakuTilePos(i,count,W,H,su));
      }
    });
    return;
  }

  // ここまでのどの専用アニメーションにも一致しなかった場合のフォールバック。
  // カード方式では、個別演出をまだ用意していないanimTypeでも見た目が固まらないよう、
  // 簡易クロスフェードで確実に次の状態へ切り替える。
  if(DISPLAY_MODE==='card'){runCardTransition(nextState,onDone);return;}

  layer.innerHTML='';
  onDone();
}

// 千タイルスケール計算
function getSenScale(){
  const W=143,H=112,u=U,G=u*.15,W10=10*u+9*G,H10=10*u+9*G,OX=u*.35,OY=u*.35;
  const needW=W10+9*OX,needH=H10+9*OY;
  return u*Math.min((W-6)/needW,(H-6)/needH);
}

// ============================================================
// レイアウト更新（列の表示/非表示・幅の動的拡張）
// <col>要素を1つ操作するだけで thead/tbody 両方の対応列が同時に
// 表示/非表示・幅変更される（tableの仕様）ため、ヘッダーとデータの
// ズレは構造的に発生しない。
// ============================================================
function updateLayout(){
  const aS=Math.floor(numA/1000)%10,aH=Math.floor(numA/100)%10,aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100)%10,bJ=Math.floor((numB%100)/10),bI=numB%10;
  // ひき算では桁が増えることはなく、ひかれる数(A)の桁数がそのまま最大桁数になる
  const has4=(aS>0);
  const has3=(aH>0)||has4;

  // せんの位列（1000のときだけ表示）
  const senDisp=has4?'':'none';
  document.getElementById('colgrp-sen').style.display=has4?'table-column':'none';
  document.querySelectorAll('.th-sen, .td-sen').forEach(el=>{el.style.display=senDisp;});

  // 百の位列（col要素の表示切替＋ th/td も同じ値で連動させ二重に保証する）
  const hyakuDisp=has3?'':'none';
  document.getElementById('colgrp-hyaku').style.display=has3?'table-column':'none';
  document.querySelectorAll('.th-hyaku, .td-hyaku').forEach(el=>{el.style.display=hyakuDisp;});

  // ---- 十の位の幅・高さ：実際に起こり得るくり下げだけを考慮 ----
  // 以前は常に「10+aJ」ぶんを確保していたため、カード表示では不要な高さまで大きくなっていた。
  // 一の位で借りるか／さらに百の位から十の位へ借りるかを先に判定し、必要なときだけ増やす。
  const borrowToIchi=(bI>aI);
  let juuForSub=aJ;
  if(borrowToIchi){
    if(aJ>0)juuForSub=aJ-1;
    else if(has3)juuForSub=9; // 0の十の位をまたぐ連続くり下げ後
  }
  const borrowToJuu=has3&&(bJ>juuForSub);
  const passThroughJuu=has3&&borrowToIchi&&aJ===0;
  // カード方式では、借りてきた10枚はbridge100-layer側に別グループで描くため、
  // 「今ある十のカード＋10」を同じセルに押し込む必要はない。セル本体とbridgeの大きい方だけ確保する。
  const maxJuuCountCard=Math.max(aJ,bJ,juuForSub,(borrowToJuu||passThroughJuu)?10:0,1);
  // タイル方式は既存挙動を変えないため、従来どおり十分な幅を確保する。
  const maxJuuCountTile=Math.max(aJ,bJ,10+aJ,1);
  let juuWidth,juuHeight,juuHeightAns;
  if(DISPLAY_MODE==='card'){
    // カード方式：4枚で1段・あふれたら次の段という固定レイアウトなので、
    // cardNeedWidth/cardNeedHeightで実際に必要な幅・高さを逆算する。
    juuWidth=Math.max(161,Math.round(cardNeedWidth(maxJuuCountCard,'juu')));
    juuHeight=Math.max(112,Math.round(cardNeedHeight(maxJuuCountCard,'juu')));
    juuHeightAns=juuHeight+10;
  } else {
    const juuNeedW=stickLayout(Math.min(maxJuuCountTile,19)).totW+21; // renderSticksと同じ計算式（5本グループ間隔込み）＋余白
    juuWidth=Math.max(161,Math.round(juuNeedW));
    juuHeight=112;juuHeightAns=122;
  }
  document.querySelector('col.col-juu').style.width=juuWidth+'px';
  ['svg-juu-a','svg-juu-b'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',juuWidth);
    svg.setAttribute('height',juuHeight);
    svg.setAttribute('viewBox',`0 0 ${juuWidth} ${juuHeight}`);
  });
  {
    const svg=document.getElementById('svg-juu-ans');
    svg.setAttribute('width',juuWidth);
    svg.setAttribute('height',juuHeightAns);
    svg.setAttribute('viewBox',`0 0 ${juuWidth} ${juuHeightAns}`);
  }

  // ---- 百の位の幅・高さ：A行の枚数が多い場合に大きく広げる ----
  // タイル方式では hyakuFootprint（実際のタイル配置の共通関数）から逆算し、
  // カード方式では cardNeedWidth/cardNeedHeight（5枚ずつ横一列の固定レイアウト）から逆算する。
  // せんのくらいから借りた「10まい」はbridgeSen（タイトル位置の永続レイヤー）に表示され、
  // svg-hyaku-aの枠は使わないため、ここでは実際の百の位の桁(aH、0〜9)だけを考慮すればよい。
  // has4(せんのくらいがある)のときは、必ずどこかのタイミングで「せんのくらい→ひゃくのくらい」の
  // くり下げが発生し、借りてきた10まいがひゃくのくらいのタイトル位置(hdr-hyaku)にrenderBridgeSenで
  // 表示される（実データの桁aHとは別に、常に10まいぶんの見た目が出る）。この10まいはsvg-hyaku-aの
  // 枠を使わず・無視してタイトル中心に描かれるが、位置はhdr-hyaku（＝この列の真上）なので、
  // 列の幅(hyakuWidth)が10まいぶんより狭いと、はみ出して隣の列にかぶってしまう。
  // そのため、has4のときはaHだけでなく10も考慮して、あらかじめ枠(列)を広げておく。
  const maxHyakuCount=has4?Math.max(aH,1,10):Math.max(aH,1);
  let hyakuWidth,hyakuHeight,hyakuHeightAns;
  if(DISPLAY_MODE==='card'){
    hyakuWidth=Math.max(161,Math.round(cardNeedWidth(maxHyakuCount,'hyaku')));
    hyakuHeight=Math.max(112,Math.round(cardNeedHeight(maxHyakuCount,'hyaku')));
    hyakuHeightAns=hyakuHeight+10;
  } else {
    const hyakuFp=hyakuFootprint(maxHyakuCount,hyakuRefSu());
    const hyakuNeedW=hyakuFp.width+21; // 左右の余白
    hyakuWidth=Math.max(161,Math.round(hyakuNeedW));
    const hyakuNeedH=hyakuFp.height+10; // 上下の余白
    hyakuHeight=Math.max(112,Math.round(hyakuNeedH));
    hyakuHeightAns=hyakuHeight+10; // 答え行はもともと112→122のように+10高くする慣例に合わせる
  }
  document.getElementById('colgrp-hyaku').style.width=hyakuWidth+'px';
  ['svg-hyaku-a','svg-hyaku-b'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',hyakuWidth);
    svg.setAttribute('height',hyakuHeight);
    svg.setAttribute('viewBox',`0 0 ${hyakuWidth} ${hyakuHeight}`);
  });
  {
    const svg=document.getElementById('svg-hyaku-ans');
    svg.setAttribute('width',hyakuWidth);
    svg.setAttribute('height',hyakuHeightAns);
    svg.setAttribute('viewBox',`0 0 ${hyakuWidth} ${hyakuHeightAns}`);
  }

  // ---- 一の位の幅・高さ：カード方式では、じゅうのくらいから借りてきた「10このカード」が
  // bridge10-layer（ヘッダー中心・4枚基準で折り返す固定レイアウト）にあふれずに収まるよう、
  // あらかじめ列の幅を広げておく。cardNeedWidth(5枚ぶん)を確保しておけば、
  // カードは常に縮小されない一定サイズのまま表示され、枠からはみ出すこともない。
  // タイル方式は今まで通り固定サイズ(143×112)のままでよい。
  const maxIchiCount=Math.max(aI,bI,borrowToIchi?10:0,1);
  let ichiWidth,ichiHeight,ichiHeightAns;
  if(DISPLAY_MODE==='card'){
    ichiWidth=Math.max(143,Math.round(cardNeedWidth(maxIchiCount,'ichi')));
    ichiHeight=Math.max(112,Math.round(cardNeedHeight(maxIchiCount,'ichi')));
    ichiHeightAns=ichiHeight+10;
  } else {
    ichiWidth=143;ichiHeight=112;ichiHeightAns=122;
  }
  document.querySelector('col.col-ichi').style.width=ichiWidth+'px';
  ['svg-ichi-a','svg-ichi-b'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',ichiWidth);
    svg.setAttribute('height',ichiHeight);
    svg.setAttribute('viewBox',`0 0 ${ichiWidth} ${ichiHeight}`);
  });
  {
    const svg=document.getElementById('svg-ichi-ans');
    svg.setAttribute('width',ichiWidth);
    svg.setAttribute('height',ichiHeightAns);
    svg.setAttribute('viewBox',`0 0 ${ichiWidth} ${ichiHeightAns}`);
  }

  relayoutResponsiveCanvas();
}

// ============================================================
// 右カラム（筆算＋テキスト）の「問題全体で固定」ズーム
// ============================================================
// 【コンパクト縦長レイアウトの方針】
// ・右パネルは画面の余り幅を吸収しない。筆算＋説明に必要な幅だけ使う。
// ・全ステップの説明文と筆算外形を問題生成時に測り、倍率は問題内で固定する。
// ・数図が高い場合だけ右欄の中身を拡大し、その倍率に必要な幅だけ増やす。
// ・右欄を広げたせいで全体倍率（＝数図の見た目）が下がる拡大はしない。
// ・小さい問題は2つの縦長カードを中央へ寄せ、最終fitは高さを最大限使う。
// ============================================================
const STEP_CONTENT_W=230;
const HISSAN_CONTENT_W=210;
const RP_ZOOM_MAX=2.2;
const BASE_STAGE_W=1040;
const MAX_STAGE_W=1600;
const RIGHT_PANEL_BOX_HPAD=28; // hissan-box / step-box の左右padding 14px×2
const MAIN_AREA_HPAD=16;      // .main-area の左右padding 8px×2
const MAIN_AREA_VPAD=24;      // .main-area の上下padding 12px×2
const MAIN_AREA_GAP=12;
let stableRightPanelFactor=1;
let stableRightPanelHeightFactor=1;
let stableStepNaturalH=132;
let stableHissanNaturalW=HISSAN_CONTENT_W;
let stableHissanNaturalH=230;
let stableRightPanelW=258;
let stageDesignWidth=BASE_STAGE_W;
const TILE_ZOOM_MAX=2.4;
let stableTilePanelFactor=1;
let stableTileNaturalW=1;
let stableTileNaturalH=1;

function measureMaxStepNaturalHeight(){
  const stepInner=document.getElementById('step-scale-inner');
  const titleEl=document.getElementById('step-title-text');
  const descEl=document.getElementById('step-desc');
  if(!stepInner||!titleEl||!descEl)return 132;

  stepInner.style.transform='none';
  stepInner.style.width=STEP_CONTENT_W+'px';
  stepInner.style.height='auto';
  descEl.style.height='auto';
  descEl.style.overflow='visible';

  const current=steps[stepIdx]||steps[0];
  let maxH=0;
  const list=steps.length?steps:[{title:titleEl.innerHTML,desc:descEl.innerHTML}];
  for(const st of list){
    titleEl.innerHTML=st.title||'';
    descEl.innerHTML=st.desc||'';
    maxH=Math.max(maxH,stepInner.offsetHeight,stepInner.scrollHeight);
  }
  if(current){
    titleEl.innerHTML=current.title||'';
    descEl.innerHTML=current.desc||'';
  }
  return Math.max(100,Math.ceil(maxH));
}

function measureHissanNaturalEnvelope(){
  if(!steps.length)return{w:HISSAN_CONTENT_W,h:230};
  let maxW=0,maxH=0;
  for(const st of steps){
    const probe=document.createElementNS(NS,'svg');
    drawHissan(probe,st.h);
    maxW=Math.max(maxW,parseFloat(probe.getAttribute('width'))||HISSAN_CONTENT_W);
    maxH=Math.max(maxH,parseFloat(probe.getAttribute('height'))||230);
  }
  return{w:Math.max(1,maxW),h:Math.max(1,maxH)};
}

function usefulBasePanelWidth(){
  return Math.ceil(Math.max(stableHissanNaturalW,STEP_CONTENT_W)+RIGHT_PANEL_BOX_HPAD);
}

function applyStableRightPanelScale(panelW){
  const hissanOuter=document.getElementById('hissan-scale-outer');
  const hissanSvg=document.getElementById('hissan-svg');
  const stepOuter=document.getElementById('step-scale-outer');
  const stepInner=document.getElementById('step-scale-inner');
  const rightPanel=document.querySelector('.right-panel');
  const tileArea=document.querySelector('.tile-area');
  if(!hissanOuter||!hissanSvg||!stepOuter||!stepInner||!rightPanel||!tileArea)return;

  hissanSvg.style.transform='none';
  stepInner.style.transform='none';
  hissanOuter.style.height='';
  stepOuter.style.height='';
  stepInner.style.height='auto';
  stepInner.style.width=STEP_CONTENT_W+'px';

  stableStepNaturalH=measureMaxStepNaturalHeight();
  const env=measureHissanNaturalEnvelope();
  stableHissanNaturalW=env.w;
  stableHissanNaturalH=env.h;

  const basePanelW=usefulBasePanelWidth();
  stableRightPanelW=Math.max(basePanelW,Math.ceil(panelW||basePanelW));
  rightPanel.style.width=stableRightPanelW+'px';

  hissanOuter.style.height=stableHissanNaturalH+'px';
  stepInner.style.height=stableStepNaturalH+'px';
  stepOuter.style.height=stableStepNaturalH+'px';

  const basePanelH=rightPanel.offsetHeight;
  const naturalContentH=stableHissanNaturalH+stableStepNaturalH;
  const fixedChromeH=Math.max(0,basePanelH-naturalContentH);
  const tileH=tileArea.offsetHeight;

  const targetPanelH=Math.max(basePanelH,tileH);
  const factorHeightRaw=(targetPanelH-fixedChromeH)/Math.max(1,naturalContentH);
  stableRightPanelHeightFactor=Math.min(RP_ZOOM_MAX,Math.max(1,factorHeightRaw));

  const factorWidth=Math.min(
    hissanOuter.clientWidth/stableHissanNaturalW,
    stepOuter.clientWidth/STEP_CONTENT_W
  );
  let factor=Math.min(stableRightPanelHeightFactor,factorWidth,RP_ZOOM_MAX);
  factor=Math.max(0.1,factor);
  stableRightPanelFactor=factor;

  hissanSvg.style.transformOrigin='top center';
  hissanSvg.style.transform=`scale(${factor})`;
  hissanOuter.style.height=(stableHissanNaturalH*factor)+'px';

  stepInner.style.transformOrigin='top center';
  stepInner.style.transform=`scale(${factor})`;
  stepOuter.style.height=(stableStepNaturalH*factor)+'px';
}

function resetTilePanelScale(){
  const tileArea=document.getElementById('tile-area');
  const tileSlot=document.getElementById('tile-slot');
  if(!tileArea||!tileSlot)return;

  // 前回の拡大後サイズを測定に混ぜない。
  // tile-areaは表そのものにぴったり縮むため、ここで一度slotの固定寸法を解除してから
  // 自然幅・自然高を取り直す。これをしないと、前回のslot幅をtile-areaが吸収して
  // 「表の横の謎の余白」が自然幅として蓄積される。
  tileArea.style.transform='none';
  tileArea.style.width='max-content';
  tileSlot.style.width='auto';
  tileSlot.style.height='auto';
  stableTilePanelFactor=1;

  const table=document.getElementById('tile-table');
  stableTileNaturalW=Math.max(1,Math.ceil(table?table.offsetWidth:tileArea.offsetWidth));
  stableTileNaturalH=Math.max(1,Math.ceil(tileArea.offsetHeight));
  tileSlot.style.width=stableTileNaturalW+'px';
  tileSlot.style.height=stableTileNaturalH+'px';
}

function applyTilePanelScale(factor){
  const tileArea=document.getElementById('tile-area');
  const tileSlot=document.getElementById('tile-slot');
  if(!tileArea||!tileSlot)return;
  stableTilePanelFactor=Math.max(1,Math.min(TILE_ZOOM_MAX,factor||1));
  tileArea.style.transformOrigin='top left';
  tileArea.style.transform=`scale(${stableTilePanelFactor})`;
  tileSlot.style.width=(stableTileNaturalW*stableTilePanelFactor)+'px';
  tileSlot.style.height=(stableTileNaturalH*stableTilePanelFactor)+'px';
}

function currentTableWidth(){
  const tileSlot=document.getElementById('tile-slot');
  return tileSlot?Math.ceil(tileSlot.offsetWidth):0;
}

function stageWidthForPanel(panelW){
  return Math.max(BASE_STAGE_W,currentTableWidth()+MAIN_AREA_GAP+MAIN_AREA_HPAD+panelW);
}

function relayoutResponsiveCanvas(){
  const stage=document.getElementById('app-stage');
  const rightPanel=document.querySelector('.right-panel');
  const tileArea=document.getElementById('tile-area');
  if(!stage||!rightPanel||!tileArea||!steps.length)return;

  // 毎回まず数図のローカル拡大を解除し、問題そのものの自然寸法を基準に計算する。
  resetTilePanelScale();

  stage.style.width=BASE_STAGE_W+'px';
  applyStableRightPanelScale();
  const basePanelW=usefulBasePanelWidth();
  const baselineW=Math.min(MAX_STAGE_W,stageWidthForPanel(basePanelW));
  stageDesignWidth=baselineW;
  stage.style.width=baselineW+'px';
  applyStableRightPanelScale(basePanelW);

  const baselineH=Math.max(1,stage.scrollHeight);
  const scaleByHeight=window.innerHeight/baselineH;
  const noShrinkMaxW=Math.min(MAX_STAGE_W,window.innerWidth/Math.max(.01,scaleByHeight));

  const desiredPanelW=Math.ceil(
    Math.max(stableHissanNaturalW,STEP_CONTENT_W)*stableRightPanelHeightFactor+RIGHT_PANEL_BOX_HPAD
  );
  const maxPanelWithoutShrink=Math.max(
    basePanelW,
    Math.floor(noShrinkMaxW-stableTileNaturalW-MAIN_AREA_GAP-MAIN_AREA_HPAD)
  );
  const targetPanelW=Math.max(basePanelW,Math.min(desiredPanelW,maxPanelWithoutShrink));
  rightPanel.style.width=targetPanelW+'px';
  applyStableRightPanelScale(targetPanelW);

  // 右側が高い2桁・3桁問題では、数図も同じ高さまで縦横同比率で拡大する。
  // 横幅制約で全体倍率が下がる直前を上限とし、不要な空白ではなく中身を大きくする。
  const desiredTileFactor=Math.max(1,rightPanel.offsetHeight/stableTileNaturalH);
  const availableTileW=Math.max(
    stableTileNaturalW,
    noShrinkMaxW-targetPanelW-MAIN_AREA_GAP-MAIN_AREA_HPAD
  );
  const maxTileFactorByWidth=Math.max(1,availableTileW/stableTileNaturalW);
  const targetTileFactor=Math.min(TILE_ZOOM_MAX,desiredTileFactor,maxTileFactorByWidth);
  applyTilePanelScale(targetTileFactor);

  stableRightPanelW=targetPanelW;
  const targetW=Math.min(MAX_STAGE_W,stageWidthForPanel(targetPanelW));
  stageDesignWidth=targetW;
  stage.style.width=targetW+'px';
  fitStage();
}

// ============================================================
// UI更新
// ============================================================
// ============================================================
// 筆算側・図解側を独立した2つのアクションとして扱うための共通インターフェース。
// ============================================================
// 筆算側：たし算アプリのhissanSplitに相当する「借りの分割アニメ」は、
// この引き算アプリのdrawHissanには存在しない（借りの見せ方はCSSのpop-in演出のみで、
// JS側で完了を待つ必要がある多段アニメーションではない）。そのため、このアプリでは
// 常に「即座に最終形を描いてonDone」の分岐のみを通る。prevHは今は使わないが、
// 将来の拡張やたし算アプリとの対称性のために引数として残す。
function runHissanSide(step,prevH,onDone){
  drawHissan(document.getElementById('hissan-svg'),step.h);
  onDone();
}

// 図解側：step.animがあればrunAnimで再生して完了後に最終状態を描き、
// なければ即座に最終状態を描いてonDoneを呼ぶ。
function runTileSide(step,prevT,onDone){
  if(!step.anim){
    paintTiles(step.t);
    onDone();
    return;
  }
  paintTiles(prevT);
  runAnim(step.anim,prevT,step.t,()=>{
    paintTiles(step.t);
    onDone();
  });
}

function updateUI(skipAnim){
  const step=steps[stepIdx];
  const total=steps.length;
  document.getElementById('step-num').textContent=stepIdx+1;
  document.getElementById('step-title-text').innerHTML=step.title;
  document.getElementById('step-desc').innerHTML=step.desc;
  // 右パネルの倍率は問題生成時に全ステップを測って固定済み。
  // ステップ送りでは倍率・箱の高さを変更しない。
  speakStep(step.desc);
  document.getElementById('step-ind').textContent=`${stepIdx+1} / ${total}`;

  if(skipAnim){
    document.getElementById('btn-prev').disabled=(stepIdx===0);
    document.getElementById('btn-next').disabled=(stepIdx===total-1);
    drawHissan(document.getElementById('hissan-svg'),step.h);
    paintTiles(step.t);
    return;
  }

  const prevH=stepIdx>0?steps[stepIdx-1].h:step.h;
  const prevT=stepIdx>0?steps[stepIdx-1].t:step.t;

  // anim・分割アニメの有無に関わらず、逐次モードでは「一呼吸」の間を挟むため、
  // 全ステップで一律にanimBusyをロックする（漏れなく統一管理する）。
  animBusy=true;
  document.getElementById('btn-prev').disabled=true;
  document.getElementById('btn-next').disabled=true;

  function finish(){
    animBusy=false;
    document.getElementById('btn-prev').disabled=(stepIdx===0);
    document.getElementById('btn-next').disabled=(stepIdx===total-1);
  }

  if(timingMode==='tile-first'){
    // 図→筆算：図解側が終わってから一呼吸おいて筆算側
    runTileSide(step,prevT,()=>{
      breathTimer=setTimeout(()=>{
        breathTimer=null;
        runHissanSide(step,prevH,finish);
      },breathMs);
    });
  } else if(timingMode==='hissan-first'){
    // 筆算→図：筆算側が終わってから一呼吸おいて図解側
    runHissanSide(step,prevH,()=>{
      breathTimer=setTimeout(()=>{
        breathTimer=null;
        runTileSide(step,prevT,finish);
      },breathMs);
    });
  } else {
    // 同時：両方を間を入れずに同時開始
    let doneCount=0;
    function onOneDone(){doneCount++;if(doneCount>=2)finish();}
    runHissanSide(step,prevH,onOneDone);
    runTileSide(step,prevT,onOneDone);
  }
}

// くり下がりの計算方法（補助計算）の切り替え

  if(animBusy||mode===SUB_NOTATION)return;
  cancelAnim();
  SUB_NOTATION=mode;
  calcMethod=(mode==='bridge')?'bridge':'normal';
  try{localStorage.setItem('hikizan_sub_notation',mode);}catch(e){}
  syncSettingsUI();
  document.getElementById('anim-layer').innerHTML='';
  stepIdx=0;
  steps=buildSteps();
  updateLayout();
  updateUI(true);
}

// 間隔調整ボックス
function setSeqGap(val){
  let sec=parseFloat(val);
  if(!Number.isFinite(sec))sec=0.4;
  sec=Math.min(5,Math.max(0,Math.round(sec*10)/10));
  document.getElementById('seq-gap-input').value=sec;
  breathMs=Math.round(sec*1000);
  try{localStorage.setItem('hikizan_seq_gap',sec.toString());}catch(e){}
}

function goStep(dir){
  if(animBusy)return;
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  const newIdx=stepIdx+dir;
  if(newIdx<0||newIdx>=steps.length)return;
  stepIdx=newIdx;
  updateUI(dir<0);
}

function setProblem(a,b){
  if(animBusy)return;
  cancelAnim();
  numA=a;numB=b;stepIdx=0;
  document.getElementById('inp-a').value=a;
  document.getElementById('inp-b').value=b;
  document.querySelectorAll('.problem-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.textContent.replace(/\s/g,'')==`${a}－${b}`);
  });
  document.getElementById('anim-layer').innerHTML='';
  steps=buildSteps();
  updateLayout();
  updateUI(true);
}

function generateFromInput(){
  const va=parseInt(document.getElementById('inp-a').value);
  const vb=parseInt(document.getElementById('inp-b').value);
  const err=document.getElementById('err-msg');
  if(!Number.isInteger(va)||!Number.isInteger(vb)||va<1||va>1000||vb<1||vb>999||vb>=va){
    err.style.display='block';setTimeout(()=>err.style.display='none',3000);return;
  }
  err.style.display='none';
  document.querySelectorAll('.problem-btn').forEach(btn=>btn.classList.remove('active'));
  numA=va;numB=vb;stepIdx=0;
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  steps=buildSteps();
  updateLayout();
  updateUI(true);
}

document.getElementById('inp-a').addEventListener('keydown',e=>{if(e.key==='Enter')generateFromInput();});
document.getElementById('inp-b').addEventListener('keydown',e=>{if(e.key==='Enter')generateFromInput();});

// キーボードの矢印キーで「すすむ／もどる」、Escキーで設定モーダルを閉じる
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeSettingsModal();
    return;
  }
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  e.preventDefault();
  goStep(e.key==='ArrowRight'?1:-1);
});

// ============================================================
// 画面フィット表示（16:9などの想定比率にぴったり、それ以外の比率でも
// レイアウトを組み替えず「そのまま」拡大縮小して画面内に収める）
// ------------------------------------------------------------
// #app-stageは幅STAGE_Wの固定デザインキャンバス。fitStage()はその自然な
// 高さ(scrollHeight)を測り、画面いっぱいに収まる倍率scaleを計算して
// transform:scale()で拡大縮小する。
//
// 【重要】この倍率(currentScale)は、getBoundingClientRect()を使って
// アニメーションの移動先などを計算している関数（svgToLayer/hdrCenter/
// aboveHdrや、各ステップ関数内のtileRect差分計算など）でも使われる。
// getBoundingClientRect()はscale適用後の「画面ピクセル」を返すが、
// anim-layer/bridge10-layer/bridge100-layer/bridge1000-layerはviewBoxを
// 持たないため、その内部座標は「拡大縮小前の設計ピクセル」のまま。
// そのため、画面ピクセルの差分はcurrentScale×数図ローカル倍率で割ってから使う必要がある
// （固定オフセット定数まで割ってしまわないよう、割り算は
// 画面ピクセル由来の部分にだけ適用すること）。
// ============================================================
let currentScale=1;
function fitStage(){
  const stage=document.getElementById('app-stage');
  // transform:scale()はレイアウト上のボックスサイズ自体は変えないため、
  // scrollHeightは常に「拡大縮小前の自然な高さ」を返す。
  const stageH=stage.scrollHeight;
  const stageW=stage.offsetWidth||stageDesignWidth||BASE_STAGE_W;
  const scale=Math.min(window.innerWidth/stageW, window.innerHeight/stageH);
  currentScale=scale;
  const left=(window.innerWidth-stageW*scale)/2;
  const top=(window.innerHeight-stageH*scale)/2;
  stage.style.transform=`translate(${left}px,${top}px) scale(${scale})`;
  stage.style.opacity='1';
}

// 初期化
syncSettingsUI();
steps=buildSteps();
updateLayout();
warmupTTS();
updateUI(true);
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,warmupTTS,{once:true}));

fitStage();
window.addEventListener('resize',relayoutResponsiveCanvas);
new ResizeObserver(fitStage).observe(document.getElementById('app-stage'));
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(()=>{relayoutResponsiveCanvas();});
}
</script>
