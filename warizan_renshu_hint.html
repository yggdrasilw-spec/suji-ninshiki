          'hl-new-blue', 'hl-new-green', 'hl-new-red', 'hl-new-orange'
        );
      });
    },

    drawDivisionCurve: function() {
      var svg = document.getElementById('hissan-hint-svg');
      var container = document.getElementById('hissan-notebook-container');
      if(!svg || !container || !this.appState) return;

      var targetCell = document.getElementById("cell-1-" + this.appState.M);
      if (!targetCell) return;

      var containerRect = container.getBoundingClientRect();
      var cellRect = targetCell.getBoundingClientRect();
      var s = window.__stageScale || 1;
      var x = (cellRect.left - containerRect.left) / s;
      var yTop = (cellRect.top - containerRect.top) / s;
      var yBottom = (cellRect.bottom - containerRect.top) / s;

      // ★日本の正しい筆算円弧：割られる数の左側で右（内側）へ膨らむ曲線！
      var path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", "M " + x + " " + yTop + " Q " + (x + 12) + " " + ((yTop + yBottom)/2) + " " + x + " " + yBottom);
      path.setAttribute("stroke", "#1e293b");
      path.setAttribute("stroke-width", "3");
      path.setAttribute("fill", "none");
      svg.appendChild(path);
    },

    updateStepFlow: function(step) {
      var panel = document.getElementById('hissanStepPanel');
      var badge = document.getElementById('hissanStatusBadge');
      if(!panel || !badge) return;

      var phase = step.phase;
      var activeKey = "none";
      var bg = "rgba(255, 255, 255, 0.92)";
      var accent = "#64748b";
      var soft = "#ffffff";
      var label = "じゅんび";

      if (["cover", "build", "build-zero", "skip", "hide", "trial-build", "trial-fix"].includes(phase)) {
        activeKey = "tateru";
        bg = "rgba(219, 234, 254, 0.85)";
        accent = "#2563eb";
        soft = "#eff6ff";
        label = "たてる";
      } else if (phase === "multiply" || phase === "trial-multiply") {
        activeKey = "kakeru";
        bg = "rgba(220, 252, 231, 0.85)";
        accent = "#16a34a";
        soft = "#f0fdf4";
        label = "かける";
      } else if (phase === "subtract") {
        activeKey = "hiku";
        bg = "rgba(254, 226, 226, 0.85)";
        accent = "#dc2626";
        soft = "#fff1f2";
        label = "ひく";
      } else if (phase === "drop") {
        activeKey = "orosu";
        bg = "rgba(255, 237, 213, 0.85)";
        accent = "#ea580c";
        soft = "#fff7ed";
        label = "おろす";
      } else if (phase === "complete") {
        activeKey = "none";
        bg = "rgba(255, 255, 255, 0.95)";
        accent = "#64748b";
        soft = "#ffffff";
        label = "完成！";
      }

      panel.classList.remove("phase-tateru", "phase-kakeru", "phase-hiku", "phase-orosu", "phase-neutral");
      panel.classList.add(activeKey === "none" ? "phase-neutral" : "phase-" + activeKey);
      panel.style.setProperty("--phase-accent", accent);
      panel.style.setProperty("--phase-soft", soft);
      badge.textContent = "いまの工程：" + label;

      panel.querySelectorAll(".step-node").forEach(function(node){
        node.classList.toggle("active", activeKey !== "none" && node.getAttribute("data-step") === activeKey);
      });
    },

    applyStepUI: function(renderDom) {
      if(!this.appState || this.appState.steps.length === 0) return;
      this.clearAllHighlightClasses();
      this.clearSvg();

      var fusen = document.getElementById('hissan-fusen');
      if(fusen) fusen.style.display = "none";

      for (var r = 0; r < this.appState.totalRows; r++) {
        for (var c = 0; c < this.appState.totalCols; c++) {
          if (this.gridData[r] && this.gridData[r][c]) {
            this.gridData[r][c].isDropping = false;
          }
        }
      }

      var step = this.appState.steps[this.currentStepIdx];
      if(!step) return;

      var inputModeForHint = isHissanInputLevel(state.problem) && !state.answered;
      var activeFlowItem = currentHissanFlowItem();
      var isActiveInputStep = !!(inputModeForHint && activeFlowItem && activeFlowItem.stepIdx === this.currentStepIdx && activeFlowItem.cells && activeFlowItem.cells.length);
      var hintDepth = isActiveInputStep ? state.hissanHintDepth : 2;
      var narrationEl = document.getElementById('hissan-narration');
      if(narrationEl){
        var narrationText;
        var formulaPart = "";
        if(isActiveInputStep && hintDepth === 0){
          narrationText = "自分で考えて、光っているマスをこの工程ぶん全部うめよう。";
        } else if(isActiveInputStep && hintDepth === 1){
          narrationText = hissanConceptHint(step);
        } else {
          narrationText = String(step.description);
          formulaPart = step.formulaHtml || "";
        }
        var escapedDesc = String(narrationText)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        narrationEl.innerHTML = escapedDesc + formulaPart;
      }

      this.updateStepFlow(step);

      var brainCard = document.getElementById('hissan-brain-work');
      if(brainCard){
        if (step.brainHtml && (!isActiveInputStep || hintDepth >= 2)) {
          brainCard.innerHTML = step.brainHtml;
          brainCard.style.display = "block";
        } else {
          brainCard.style.display = "none";
        }
      }

      var illusPanel = document.getElementById('hissanIllustrationPanel');
      // 「ヒントをとばす」中は、図解そのものも強制表示しない。
      // 必要な児童が「ヒント▶」を押した時だけ再表示する。
      var minimalHideIllus = (state.hissanSkipHints || hissanSupportMode() === "minimal") && isActiveInputStep && hintDepth === 0;
      if (step.hissanRound && !minimalHideIllus) {
        if (illusPanel) illusPanel.style.display = "flex";
        buildHissanIllustration(step);
      } else {
        if (illusPanel) illusPanel.style.display = "none";
        clearHissanIllusTimers();
        clearHissanRoundTimers();
        clearHissanRevealTimers();
      }

      var self = this;
      var inputMode = isHissanInputLevel(state.problem);
      if (step.writeCells) {
        step.writeCells.forEach(function(wc){
          if (self.gridData[wc.r] && self.gridData[wc.r][wc.c]) {
            var isRealInputCell = inputMode && hissanCellIsInput(wc, step, state.problem);
            var useChar = wc.char;
            if (isRealInputCell) {
              var key = hissanEntryKey(self.currentStepIdx, wc);
              useChar = state.hissanEntries[key] || "";
              if(useChar === "" && activeFlowItem && activeFlowItem.stepIdx === self.currentStepIdx){
                var activeCellIdx = -1;
                for(var aci = 0; aci < activeFlowItem.cells.length; aci++){
                  if(activeFlowItem.cells[aci].r === wc.r && activeFlowItem.cells[aci].c === wc.c){ activeCellIdx = aci; break; }
                }
                if(activeCellIdx >= 0 && activeCellIdx < state.hissanBuffer.length) useChar = state.hissanBuffer[activeCellIdx];
              }
            }
            self.gridData[wc.r][wc.c].char = useChar;
            self.gridData[wc.r][wc.c].isGuide = !!wc.isGuide;
            if (wc.borderBottom) self.gridData[wc.r][wc.c].borderBottom = true;
            if (step.phase === "drop" && wc.r > 1 && useChar !== "") {
              self.gridData[wc.r][wc.c].isDropping = true;
              self.gridData[wc.r][wc.c].dropDistance = (wc.r - 1) * computeHissanCellSize(self.appState.totalCols);
            }
          }
        });
      }

      if(renderDom){
        this.renderGridStructure();

        requestAnimationFrame(function(){
          self.drawDivisionCurve();

          if (step.phase === "drop" && step.writeCells) {
            step.writeCells.forEach(function(wc){
              if (wc.r > 1) {
                self.drawDropArrow(1, wc.c, wc.r, wc.c);
              }
            });
          }

          if (step.maskFromCol !== null && step.maskFromCol < self.appState.totalCols && fusen) {
            var container = document.getElementById('hissan-notebook-container');
            var startCell = document.getElementById("cell-0-" + step.maskFromCol);
            var endCell = document.getElementById("cell-" + (self.appState.totalRows-1) + "-" + (self.appState.totalCols-1));
            if(container && startCell && endCell){
              var containerRect = container.getBoundingClientRect();
              var startRect = startCell.getBoundingClientRect();
              var endRect = endCell.getBoundingClientRect();
              var s = window.__stageScale || 1;
              fusen.style.left = ((startRect.left - containerRect.left) / s) + "px";
              fusen.style.top = ((startRect.top - containerRect.top) / s) + "px";
              fusen.style.width = ((endRect.right - startRect.left) / s) + "px";
              fusen.style.height = ((endRect.bottom - startRect.top) / s) + "px";
              fusen.style.display = "block";
            }
          }
        });

        if (step.highlightCells && step.highlightCells.length > 0) {
          step.highlightCells.forEach(function(hc){
            var target = document.getElementById("cell-" + hc.r + "-" + hc.c);
            if (!target) return;
            var cls = hc.isNew ? "hl-new-" + hc.color : "hl-ref-" + hc.color;
            target.classList.add(cls);
          });
        } else if (step.pulseBoxes && step.pulseBoxes.length > 0) {
          step.pulseBoxes.forEach(function(box){
            var target = document.getElementById("cell-" + box.r + "-" + box.c);
            if (target) target.classList.add('active-target');
          });
        }
      }
    },

    gotoStep: function(targetIdx) {
      if(!this.appState) return;
      var target = Math.max(0, Math.min(targetIdx, this.appState.steps.length - 1));
      this.initGridData();
      for(var s = 0; s <= target; s++){
        this.currentStepIdx = s;
        this.applyStepUI(s === target);
      }
    }
  };

      var item = currentHissanFlowItem();
      if(item && ((!item.cells || item.cells.length === 0) || hissanFlowItemCompleted(item))){
        playSound('step');
        advanceHissanFlow();
        return;
      }
      if(state.hissanHintDepth >= 2) return;
      playSound('step');
      state.hissanHintDepth++;
      if(state.hissanHintDepth >= 2) state.usedConcreteHint = true;
      renderAll(false);
      return;
    }
    if(state.hintStage >= state.maxHint) return;
    playSound('step');
    state.hintStage++;
    markConcreteHintIfRevealed();
    renderAll(true);
  });

      if(state.hissanHintDepth <= 0) return;
      playSound('step');
      state.hissanHintDepth--;
      renderAll(false);
      return;
    }
    if(state.hintStage <= 0) return;
    playSound('step');
    state.hintStage--;

  document.addEventListener("keydown", function(e){
    var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
    if(tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    if(!document.getElementById("problemScreen").classList.contains("show")) return;
    if(e.key >= "0" && e.key <= "9"){
      e.preventDefault();
      pressDigit(parseInt(e.key,10));
      return;
    }
    if(e.key === "Backspace" || e.key === "Delete"){
      e.preventDefault();
      clearDigit();
      return;
    }
    if(isHissanInputLevel(state.problem) && !state.answered){
      var ki = currentHissanFlowItem();
      if((e.key === "Enter" || e.key === "ArrowRight") && (!currentHissanHasInput() || hissanFlowItemCompleted(ki))){
        e.preventDefault();
        advanceHissanFlow();
        return;
      }
      if(e.key === "ArrowLeft" && state.hissanFlowPos > 0){
        e.preventDefault();
        backHissanFlow();

  // ==============================================================
  // 先生支援（TeacherBridge）連携
  // ==============================================================
  (function initTeacherBridge() {
    if (!window.TeacherBridge) return;

    // 1. 初期化
    TeacherBridge.init({
      appId: 'warizan-renshu-hint',
      appName: 'わり算れんしゅう ヒントつき'
    });

    // 2. UI要素
    var tbCodeInput  = document.getElementById('teacherCodeInput');
    var tbConnBtn    = document.getElementById('teacherConnectBtn');
    var tbIndicator  = document.getElementById('teacherConnIndicator');
    var tbSubText    = document.getElementById('teacherConnSubText');
    var tbBanner     = document.getElementById('teacherNoticeBanner');
    var tbBannerIcon = document.getElementById('teacherNoticeIcon');
    var tbBannerMain = document.getElementById('teacherNoticeMain');
    var tbBannerSub  = document.getElementById('teacherNoticeSub');

    // 3. インジケーター更新
    function updateTbIndicator(status, code) {
      if (status === 'connected') {
        if (tbIndicator) { tbIndicator.textContent = '🟢'; tbIndicator.title = '先生に接続中: ' + code; }
        if (tbConnBtn)   tbConnBtn.textContent = '切断';
        if (tbSubText)   tbSubText.textContent = '先生: ' + code;
      } else if (status === 'connecting') {
        if (tbIndicator) { tbIndicator.textContent = '🟡'; tbIndicator.title = '接続確認中...'; }
        if (tbConnBtn)   tbConnBtn.textContent = '確認中';
        if (tbSubText)   tbSubText.textContent = '接続確認中...';
      } else {
        if (tbIndicator) { tbIndicator.textContent = '⚪'; tbIndicator.title = '先生未接続'; }
        if (tbConnBtn)   tbConnBtn.textContent = 'つなぐ';
        if (tbSubText)   tbSubText.textContent = '先生コード';
      }
    }

    // 4. 接続・切断ハンドラ
    async function handleTbConnect() {
      if (!window.TeacherBridge) return;
      var code = tbCodeInput ? tbCodeInput.value.trim() : '';
      var sess = TeacherBridge.getSessionState();

      if (sess.connected) {
        TeacherBridge.leaveSession(true);
        updateTbIndicator('none');
        if (tbCodeInput) tbCodeInput.value = '';
        return;
      }

      if (!code) { alert('先生コードを入力してください。'); return; }

      updateTbIndicator('connecting');
      var res = await TeacherBridge.joinSession(code);
      if (res.success) {
        updateTbIndicator('connected', res.code);
      } else {
        updateTbIndicator('none');
        alert(res.message);
      }
    }

    if (tbConnBtn) tbConnBtn.addEventListener('click', handleTbConnect);
    if (tbCodeInput) {
      tbCodeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleTbConnect();
      });
    }

    // 5. ニックネーム・前回コードの復元
    (function() {
      if (window.StudentProfile) {
        var urlParams = new URLSearchParams(window.location.search);
        var codeFromUrl = urlParams.get('teacherCode') || urlParams.get('tcode');
        var lastCode = codeFromUrl || StudentProfile.getLastTeacherCode();
        if (lastCode && tbCodeInput) {
          tbCodeInput.value = lastCode;
          if (codeFromUrl) handleTbConnect();
        }
      }
    })();

    // 6. 先生からのステータス変化バナー
    TeacherBridge.onTeacherStatusChange(function(e) {
      if (!tbBanner) return;
      if (e.status === 'teacher_coming') {
        tbBanner.style.display    = 'flex';
        tbBanner.style.borderColor = '#f59e0b';
        tbBanner.style.background  = '#fffbeb';
        tbBanner.style.color       = '#92400e';
        if (tbBannerIcon) tbBannerIcon.textContent = '🏃';
        if (tbBannerMain) tbBannerMain.textContent = '先生が見に来ます';
        if (tbBannerSub)  tbBannerSub.textContent  = 'この画面で待っていてね';
      } else if (e.status === 'teacher_supporting') {
        tbBanner.style.display    = 'flex';
        tbBanner.style.borderColor = '#3b82f6';
        tbBanner.style.background  = '#eff6ff';
        tbBanner.style.color       = '#1e40af';
        if (tbBannerIcon) tbBannerIcon.textContent = '👀';
        if (tbBannerMain) tbBannerMain.textContent = '先生といっしょに見ているよ';
        if (tbBannerSub)  tbBannerSub.textContent  = '';
      } else {
        tbBanner.style.display = 'none';
      }
    });

    TeacherBridge.onSessionEnded(function() {
      updateTbIndicator('none');
      if (tbBanner) tbBanner.style.display = 'none';
      alert('この先生コードの時間は終了しました。\n教材はこのまま続けられます。先生に新しいコードを聞いてください。');
    });

    // 7. 学習イベントフック
    // 7-a. newProblem：問題開始時に進捗・支援レベルリセット
    var _origNewProblem = newProblem;
    newProblem = function() {
      _origNewProblem();
      if (TeacherBridge.getSessionState().connected) {
        var lvl = String(state.level || '1');
        TeacherBridge.updateProgress({
          step: 'レベル' + lvl,
          screenId: 'level-' + lvl,
          screenName: 'わり算レベル' + lvl
        });
        TeacherBridge.updateSupportLevel(0);
        TeacherBridge.resume();
      }
    };

    // 7-b. ヒント段階変化フック
    var hintNextBtnEl = document.getElementById('hintNextBtn');
    var hintBackBtnEl = document.getElementById('hintBackBtn');
    if (hintNextBtnEl) {
      hintNextBtnEl.addEventListener('click', function() {
        TeacherBridge.updateSupportLevel(state.hintStage);
      }, true);
    }
    if (hintBackBtnEl) {
      hintBackBtnEl.addEventListener('click', function() {
        TeacherBridge.updateSupportLevel(state.hintStage);
      }, true);
    }

    // 7-c. 正解時フック（resolveHelp）
    var _origCheck = checkCurrentAnswer;
    checkCurrentAnswer = function() {
      var prevAnswered = state.answered;
      _origCheck();
      if (!prevAnswered && state.answered) {
        TeacherBridge.resolveHelp();
      }
    };

    // 7-d. ホームに戻る時（pause）
    var backToLevelsEl = document.getElementById('backToLevels');
    if (backToLevelsEl) {
      backToLevelsEl.addEventListener('click', function() {
        TeacherBridge.updateProgress({ step: 'ホーム', screenId: 'home', screenName: 'レベルせんたく' });
        TeacherBridge.pause();
      }, true);
    }

  })();


  var handwriting = window.createDivisionHandwriting({
    loadScript: loadExternalScript,
    digit: pressDigit,
    removeDigit: clearDigit,
    target: function(){
      var p = state.problem;
      if(!document.getElementById('problemScreen').classList.contains('show')) return {problem:p, key:'home', enabled:false, label:'もんだいをえらんでね'};
      if(!p || state.answered) return {problem:p, key:'done', enabled:false, label:state.answered ? 'せいかい！ つぎのもんだいへ進もう' : 'もんだいをえらんでね'};
      if(isHissanInputLevel(p)){
        var item = currentHissanFlowItem();
        var enabled = !!(item && item.cells && item.cells.length && !hissanFlowItemCompleted(item));
        var position = state.isWrongState ? 0 : state.hissanBuffer.length;
        return {problem:p, key:state.hissanFlowPos + ':' + state.hissanBuffer + ':' + state.isWrongState,
          enabled:enabled, label:enabled ? '「' + hissanPhaseLabel(currentHissanStep()) + '」の' + (position+1) + 'けた目を書こう' : '見直したら「つぎの工程」へ'};
      }
      var field = state.isWrongState ? 'q' : state.activeField;
      var digits = field === 'q' ? state.inputDigits : state.inputRemainder;
      var limit = field === 'q' ? (p.targetQuotientDigits || 1) : 1;
      return {problem:p, key:state.activeField + ':' + state.inputDigits + ':' + state.inputRemainder + ':' + state.isWrongState,
        enabled:state.isWrongState || digits.length < limit, label:(p.hasRemainder ? (field === 'q' ? 'しょう' : 'あまり') : 'こたえ') + 'を1けたずつ書こう'};
    }
  });

  // Test hooks
  window.__warizan = {
    state: state,
    handwriting: handwriting,
    HissanSim: HissanSim,
    pressDigit: pressDigit,
    clearDigit: clearDigit,
    currentHissanFlowItem: currentHissanFlowItem,
    advanceHissanFlow: advanceHissanFlow,
    backHissanFlow: backHissanFlow,
    buildHissanFlow: buildHissanFlow,
    maxTrialAdjustmentForDivision: maxTrialAdjustmentForDivision,
    masteryTier: masteryTier,
    hissanSupportMode: hissanSupportMode,
    toggleHissanSkipHints: toggleHissanSkipHints,
    findHissanRequiredPos: findHissanRequiredPos,
    restoreMasteryForLevel: restoreMasteryForLevel,
    saveCurrentMastery: saveCurrentMastery,
    resetAllMastery: resetAllMastery,
    markConcreteHintIfRevealed: markConcreteHintIfRevealed,
    newProblem: newProblem,
    checkCurrentAnswer: checkCurrentAnswer,
    problemKey: problemKey,
    alternateProblemForLevel: alternateProblemForLevel,
    generators: {
      "1": genLevel1, "2": genLevel2, "3-1": genLevel3_1, "3-2": genLevel3_2,
      "4-1": genLevel4_1, "4-2": genLevel4_2, "4-3": genLevel4_3,
      "5-1": genLevel5_1, "5-2": genLevel5_2, "5-3": genLevel5_3, "5-4": genLevel5_4,
      "6-1": genLevel6_1, "6-2": genLevel6_2, "6-3": genLevel6_3, "7-1": genLevel7_1,
      "8-1": genLevel8_1, "8-2": genLevel8_2, "8-3": genLevel8_3, "8-4": genLevel8_4
    }
  };

})();
</script>

var F=function(key,label,options,get,set,multiple){return {key:key,label:label,options:options,get:get,set:set,multiple:!!multiple};}; var S=LessonShare.select,C=LessonShare.checkbox;

var buttons=Array.from(document.querySelectorAll('[data-level]')),levelOptions=buttons.map(function(b){return [b.dataset.level,b.querySelector('strong').textContent];});
LessonShare.init({id:'warizan-renshu',mount:'#divisionShareSettings',name:'わり算練習',nativeTeacher:true,raid:true,fields:[F('input','入力方法',[['keypad','数字ボタン'],['handwriting','手書き']],function(){return __warizan.handwriting.getMode();},function(v){__warizan.handwriting.setMode(v);}),F('levels','出題するレベル（複数選択可）',levelOptions,function(){return buttons.filter(function(b){return !b.hidden;}).map(function(b){return b.dataset.level;});},function(v){buttons.forEach(function(b){b.hidden=v.indexOf(b.dataset.level)<0;});},true)]});
