<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>わり算れんしゅう ヒントつき もんだいしゅう</title>
<!-- Firebase SDK is loaded lazily only when Raid Boss connection is requested. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

  :root{
    --paper:#FBF3E1;
    --paper-line:#E4D6AE;
    --ink:#2B2A4C;
    --ink-soft:#6b6a8c;
    --accent:#FF8C42;
    --accent-soft:#FFE7CC;
    --accent-deep:#E06B1F;
    --good:#2FAE8B;
    --good-soft:#DBF3EA;
    --bad:#E8505B;
    --bad-soft:#FDE3E1;
    --card:#FFFFFF;
    --blue:#3E6D9C;
    --blue-soft:#E4EEF8;
  }

  *{ box-sizing: border-box; }

  html, body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    margin:0;
    min-height:100vh;
    background: #d8cfa9;
    font-family:'M PLUS Rounded 1c', sans-serif;
    color: var(--ink);
  }

  /* ---------- fixed 16:9 stage ----------
     #app is always laid out at a fixed 1280x720 (16:9) logical size,
     so its internal layout never reflows. #stageOuter fills the real
     viewport and scales #app down/up (transform: scale) so the whole
     16:9 canvas fits, letterboxed, on any screen size. */
  #stageOuter{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #d8cfa9;
    overflow: hidden;
  }

  #app{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1280px;
    height: 720px;
    margin-top: -360px;
    margin-left: -640px;
    transform: scale(1);
    transform-origin: center center;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 40px;
    padding: 10px 12px;
    box-sizing: border-box;
    overflow: hidden;
    display:flex;
    flex-direction:column;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    flex:0 0 auto;
    gap:8px;
  }

  header.top h1{
    font-size: 1.3rem;
    font-weight:800;
    margin:0;
    letter-spacing: .02em;
  }

  #scoreBox{
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 6px 16px;
    font-weight:700;
    font-size:.95rem;
    color: var(--ink-soft);
    display:none;
    align-items:center;
    gap:6px;
  }
  #scoreBox.show{ display:flex; }
  #scoreBox b{ color: var(--good); font-size:1.05rem; }

  .sound-btn{
    background: var(--card);
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    user-select: none;
    flex-shrink: 0;
  }
  .sound-btn:hover{
    transform: scale(1.08);
    border-color: var(--accent);
  }
  .sound-btn.sound-off{
    filter: grayscale(1) opacity(0.45);
  }

  /* ---------- raid boss controls ---------- */
  .raid-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    position:relative;
  }
  .raid-code-box{
    display:flex;
    align-items:center;
    gap:4px;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .raid-code-box input{
    width: 64px;
    border: none;
    outline: none;
    background: transparent;
    font-family: monospace, inherit;
    font-weight: 800;
    font-size: .9rem;
    text-align: center;
    color: var(--blue);
  }
  .raid-btn{
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: .8rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .15s;
  }
  .raid-btn:hover{ opacity: .9; }
  .conn-status{
    font-size: .85rem;
    cursor: default;
  }
  .boss-mini-status{
    display: none;
    align-items: center;
    gap: 4px;
    background: #fff8e6;
    border: 2px solid #ffd166;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: .85rem;
    font-weight: 800;
    color: #b45309;
    box-shadow: 0 2px 6px rgba(180,83,9,.1);
    animation: fadeInAnim .3s ease;
  }
  .boss-mini-status.show{ display: flex; }
  .streak-badge{
    display: none;
    align-items: center;
    gap: 4px;
    background: #fff1f2;
    border: 2px solid #fda4af;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: .85rem;
    font-weight: 800;
    color: #e11d48;
  }
  .streak-badge.show{ display: flex; }
  .user-profile-box{
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 999px;
    padding: 2px 6px;
    position: relative;
  }
  .avatar-select-btn{
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 1px 3px;
    border-radius: 8px;
    transition: transform .1s;
  }
  .avatar-select-btn:hover{ transform: scale(1.15); }
  .avatar-picker-popover{
    position: absolute;
    top: 38px;
    left: 0;
    background: #fff;
    border: 2px solid var(--paper-line);
    border-radius: 12px;
    padding: 6px 8px;
    display: none;
    gap: 6px;
    z-index: 1000;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .avatar-picker-popover.show{ display: flex; }
  .avatar-option{
    font-size: 1.4rem;
    cursor: pointer;
    padding: 3px;
    border-radius: 6px;
    transition: background .15s;
  }
  .avatar-option:hover{ background: var(--accent-soft); }
  .name-input-box input{
    width: 60px;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-weight: 700;
    font-size: .85rem;
    text-align: center;
    color: var(--ink);
  }
  .raid-msg{
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    font-size: .8rem;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    border: 2px solid var(--paper-line);
    white-space: nowrap;
    z-index: 1000;
    display: none;
    animation: fadeInAnim .2s ease;
  }
  .raid-msg.show{ display: block; }
  .raid-msg.error{ color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .raid-msg.good{ color: var(--good); border-color: var(--good); background: var(--good-soft); }
  .raid-msg.warn{ color: var(--accent-deep); border-color: var(--accent); background: var(--accent-soft); }

  .card{
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 6px 0 var(--paper-line), 0 8px 20px rgba(43,42,76,.08);
    padding: 16px;
  }

  /* ---------- level select accordion ---------- */
  #levelSelect {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 10px;
  }
  #levelSelect::-webkit-scrollbar {
    width: 8px;
  }
  #levelSelect::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.04);
    border-radius: 999px;
  }
  #levelSelect::-webkit-scrollbar-thumb {
    background: var(--paper-line);
    border-radius: 999px;
  }
  #levelSelect::-webkit-scrollbar-thumb:hover {
    background: var(--ink-soft);
  }

  .mastery-tools{
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    margin:0 2px 10px;
  }
  .mastery-tools button{
    border:2px solid var(--paper-line); background:#fff; color:var(--ink-soft);
    border-radius:999px; padding:6px 12px; font-family:inherit; font-weight:800;
    cursor:pointer; font-size:.8rem;
  }
  .mastery-tools button:hover{ background:var(--paper-line); }

  .level-category {
    margin-bottom: 12px;
    border: 2px solid var(--paper-line);
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
  }
  .category-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--card);
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background .15s;
  }
  .category-header:hover {
    background: var(--paper-line);
  }
  .category-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ink);
  }
  .category-arrow {
    font-size: 0.85rem;
    color: var(--ink-soft);
    transition: transform .2s ease;
  }
  .level-category.open .category-arrow {
    transform: rotate(180deg);
  }
  .category-content {
    display: none;
    padding: 12px;
    gap: 10px;
    flex-direction: column;
    border-top: 2px solid var(--paper-line);
  }
  .level-category.open .category-content {
    display: flex;
  }

  #levelSelect .level-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    border: 2px solid var(--paper-line);
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    cursor:pointer;
    font-family: inherit;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  #levelSelect .level-btn:hover{
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 140, 66, 0.15);
  }
  #levelSelect .level-btn:active{ transform: translateY(0); }
  #levelSelect .badge{
    flex: 0 0 auto;
    min-width: 48px;
    height: 44px;
    padding: 0 6px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.15rem; font-weight:800; color:#fff;
  }
  #levelSelect .lv1 .badge{ background: var(--blue); }
  #levelSelect .lv2 .badge{ background: var(--accent); }
  #levelSelect .lv3 .badge{ background: #10b981; }
  #levelSelect .lv4 .badge{ background: #8b5cf6; }
  #levelSelect .lv5 .badge{ background: #f97316; }
  #levelSelect .lv6 .badge{ background: #ec4899; }
  #levelSelect .lv7 .badge{ background: #6366f1; }
  #levelSelect .lv8 .badge{ background: #0891b2; }
  #levelSelect .txt strong{ display:block; font-size:.96rem; margin-bottom:2px; }
  #levelSelect .txt span{ color: var(--ink-soft); font-size:.82rem; }

  /* ---------- problem screen ---------- */
  #problemScreen{ display:none; flex:1 1 auto; min-height:0; }
  #problemScreen.show{ display:flex; flex-direction:column; min-height:0; }

  #problemScreen .card{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0, 1fr) 300px;
    gap:16px;
    align-items:stretch;
  }

  .problem-left{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
  }

  .input-panel{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    border-left:2px dashed var(--paper-line);
    padding-left:14px;
  }

  .input-panel #hintControls{ margin-top:auto; }

  #backToLevels{
    background:none; border:none; color: var(--ink-soft);
    font-family:inherit; font-size:.85rem; cursor:pointer;
    padding:2px 0; margin-bottom:5px; display:inline-flex; align-items:center; gap:4px;
    flex:0 0 auto;
  }
  #backToLevels:hover{ color: var(--ink); }

  #stageSvgWrap{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    overflow: hidden;
    border-radius: 14px;
    background: linear-gradient(180deg, #fff, #fffdf7);
    border: 2px dashed var(--paper-line);
    margin-bottom: 6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stageSvg{ display:block; width:100%; height:100%; }

  /* ---------- hissan digital notebook area ---------- */
  #hissanStageWrap {
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 4px 6px;
  }
  #hissanStageWrap::-webkit-scrollbar {
    width: 6px;
  }
  #hissanStageWrap::-webkit-scrollbar-thumb {
    background: var(--paper-line);
    border-radius: 999px;
  }

  /* ---------- 筆算(左) / 図解(右) の2分割レイアウト ---------- */
  .hissan-main-row {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 10px;
  }
  .hissan-main-row .notebook-wrapper {
    flex: 0 1 auto;
    max-width: 240px;
  }
  .hissan-illustration-panel {
    flex: 2 1 320px;
    min-width: 260px;
    max-width: 460px;
    min-height: 220px;
    box-sizing: border-box;
    border-radius: 14px;
    background: linear-gradient(180deg, #fff, #fffdf7);
    border: 2px dashed var(--paper-line);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .hissan-illustration-panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* NOTE: #app is now a fixed 1280x720 (16:9) canvas that is scaled as a
     whole to fit the real viewport (see #stageOuter / fitStage()) instead
     of reflowing internally, so the old max-width:640px reflow rule that
     used to target narrow phone viewports has been removed. */

  /* ステップ循環カード */
  .step-panel {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.88);
    border: 2px solid rgba(148, 163, 184, 0.35);
    border-radius: 16px;
    padding: 10px 14px 12px;
    box-shadow: 0 6px 18px rgba(43, 42, 76, 0.05);
    box-sizing: border-box;
    transition: background-color 0.25s ease;
  }
  .step-status {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }
  .step-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(148,163,184,0.4);
    font-size: 13px;
    font-weight: 800;
    color: #334155;
  }
  .step-cycle {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 155px;
    margin: 0 auto;
  }
  .step-node {
    position: absolute;
    width: 96px;
    height: 38px;
    border-radius: 12px;
    border: 2px solid #94a3b8;
    background: rgba(255, 255, 255, 0.96);
    color: #0f172a;
    font-weight: 900;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(15, 23, 42, 0.06);
    transform: translate(var(--tx, 0), var(--ty, 0)) scale(1);
    transform-origin: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    user-select: none;
  }
  .step-node.active {
    animation: step-node-pulse 1.1s ease-in-out infinite;
    z-index: 2;
  }
  @keyframes step-node-pulse {
    0% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); }
    50% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1.10); }
    100% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); }
  }
  .step-node.tateru { top: 0; left: 50%; --tx: -50%; }
  .step-node.kakeru { top: 58px; right: 0; }
  .step-node.hiku { bottom: 0; left: 50%; --tx: -50%; }
  .step-node.orosu { top: 58px; left: 0; }

  .step-arrow {
    position: absolute;
    font-size: 22px;
    line-height: 1;
    color: #64748b;
    opacity: 0.9;
    pointer-events: none;
  }
  .step-arrow.a1 { top: 24px; right: 98px; transform: rotate(38deg); }
  .step-arrow.a2 { top: 96px; right: 98px; transform: rotate(142deg); }
  .step-arrow.a3 { bottom: 24px; left: 98px; transform: rotate(218deg); }
  .step-arrow.a4 { top: 24px; left: 98px; transform: rotate(-38deg); }

  .step-panel.phase-tateru { background: rgba(219, 234, 254, 0.85); }
  .step-panel.phase-kakeru { background: rgba(220, 252, 231, 0.85); }
  .step-panel.phase-hiku { background: rgba(254, 226, 226, 0.85); }
  .step-panel.phase-orosu { background: rgba(255, 237, 213, 0.85); }
  .step-panel.phase-neutral { background: rgba(255, 255, 255, 0.92); }

  .step-panel.phase-tateru .step-node.tateru,
  .step-panel.phase-kakeru .step-node.kakeru,
  .step-panel.phase-hiku .step-node.hiku,
  .step-panel.phase-orosu .step-node.orosu {
    border-color: var(--phase-accent, #3b82f6);
    background: var(--phase-soft, rgba(255,255,255,0.96));
    color: #0f172a;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.45), 0 6px 14px rgba(15, 23, 42, 0.12);
  }
  .step-panel.phase-tateru .step-node.tateru.active,
  .step-panel.phase-kakeru .step-node.kakeru.active,
  .step-panel.phase-hiku .step-node.hiku.active,
  .step-panel.phase-orosu .step-node.orosu.active {
    box-shadow: 0 0 0 3px rgba(255,255,255,0.5), 0 0 0 6px rgba(255,255,255,0.3), 0 10px 20px rgba(15,23,42,0.16);
  }

  /* 筆算ノート */
  .notebook-wrapper {
    background: #fff;
    border: 2px solid #b8c6d2;
    border-radius: 14px;
    padding: 18px 24px;
    position: relative;
    box-shadow: 0 6px 20px rgba(43,42,76,0.06);
    box-sizing: border-box;
    display: inline-block;
  }
  #hissan-hint-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }
  .division-grid {
    display: grid;
    position: relative;
  }
  .grid-cell {
    width: var(--cell-size, 42px);
    height: var(--cell-size, 42px);
    box-sizing: border-box;
    position: relative;
    z-index: 2;
    border-right: 1px dashed #e2e8f0;
    border-bottom: 1px dashed #e2e8f0;
    transition: all 0.2s ease;
  }
  .cell-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .main-num {
    font-size: calc(var(--cell-size, 42px) * 0.6);
    font-weight: 800;
    color: #334155;
    line-height: var(--cell-size, 42px);
  }
  @keyframes digit-drop {
    0% {
      transform: translateY(var(--drop-start-y));
      color: #cbd5e1;
      opacity: 0.4;
    }
    40% {
      color: #cbd5e1;
      opacity: 0.7;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }
  .digit-dropping {
    animation: digit-drop 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .top-num {
    position: absolute;
    top: -4px;
    font-size: calc(var(--cell-size, 42px) * 0.333);
    font-weight: bold;
    z-index: 5;
  }
  .slash-line {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 130%;
    height: 3px;
    background: #ef4444;
    transform: translate(-50%, -50%) rotate(45deg);
    transform-origin: center;
    display: none;
    z-index: 4;
    pointer-events: none;
  }
  .red-border {
    box-shadow: inset 0 0 0 3px #ef4444 !important;
    border-radius: 4px;
  }
  .border-top-solid { border-top: 3px solid #1e293b !important; }
  .border-bottom-solid { border-bottom: 3px solid #1e293b !important; }
  .hissan-input-cell {
    cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(62, 109, 156, 0.35);
    border-radius: 4px;
  }
  .gray-guide { color: #cbd5e1; font-size: calc(var(--cell-size, 42px) * 0.48); }
  .added-zero { color: #0284c7; }

  /* マスハイライト */
  .active-target {
    background-color: rgba(255, 152, 0, 0.2) !important;
    box-shadow: inset 0 0 0 3px #ff9800, 0 3px 10px rgba(255, 152, 0, 0.35) !important;
    border-radius: 6px;
    z-index: 10 !important;
    animation: rich-pulse-animation 1.2s infinite ease-in-out;
  }
  @keyframes rich-pulse-animation {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #ff9800, 0 3px 8px rgba(255, 152, 0, 0.25); background-color: rgba(255, 152, 0, 0.15) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #f97316, 0 6px 16px rgba(249, 115, 22, 0.45); background-color: rgba(255, 152, 0, 0.32) !important; }
  }

  .current-input-cell {
    box-shadow: inset 0 0 0 4px #f97316, 0 0 0 4px rgba(249,115,22,.18), 0 6px 16px rgba(249,115,22,.35) !important;
    transform: scale(1.08);

  .hl-ref-blue   .main-num { color: #1d4ed8; font-weight: 900; }
  .hl-ref-green  .main-num { color: #15803d; font-weight: 900; }
  .hl-ref-red    .main-num { color: #b91c1c; font-weight: 900; }
  .hl-ref-orange .main-num { color: #c2410c; font-weight: 900; }

  .hl-new-blue, .hl-new-green, .hl-new-red, .hl-new-orange {
    border-radius: 6px;
    z-index: 10 !important;
  }
  .hl-new-blue   .main-num { color: #1d4ed8; font-weight: 900; }
  .hl-new-green  .main-num { color: #15803d; font-weight: 900; }
  .hl-new-red    .main-num { color: #b91c1c; font-weight: 900; }
  .hl-new-orange .main-num { color: #c2410c; font-weight: 900; }

  .hl-new-blue {
    background-color: rgba(37, 99, 235, 0.12) !important;
    box-shadow: inset 0 0 0 3px #2563eb, 0 3px 10px rgba(37, 99, 235, 0.35) !important;
    animation: hl-pulse-blue 1.2s infinite ease-in-out;
  }
  .hl-new-green {
    background-color: rgba(22, 163, 74, 0.12) !important;
    box-shadow: inset 0 0 0 3px #16a34a, 0 3px 10px rgba(22, 163, 74, 0.35) !important;
    animation: hl-pulse-green 1.2s infinite ease-in-out;
  }
  .hl-new-red {
    background-color: rgba(220, 38, 38, 0.12) !important;
    box-shadow: inset 0 0 0 3px #dc2626, 0 3px 10px rgba(220, 38, 38, 0.35) !important;
    animation: hl-pulse-red 1.2s infinite ease-in-out;
  }
  .hl-new-orange {
    background-color: rgba(234, 88, 12, 0.12) !important;
    box-shadow: inset 0 0 0 3px #ea580c, 0 3px 10px rgba(234, 88, 12, 0.35) !important;
    animation: hl-pulse-orange 1.2s infinite ease-in-out;
  }

  @keyframes hl-pulse-blue {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #2563eb, 0 3px 8px rgba(37, 99, 235, 0.25); background-color: rgba(37, 99, 235, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #1d4ed8, 0 6px 16px rgba(37, 99, 235, 0.45); background-color: rgba(37, 99, 235, 0.22) !important; }
  }
  @keyframes hl-pulse-green {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #16a34a, 0 3px 8px rgba(22, 163, 74, 0.25); background-color: rgba(22, 163, 74, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #15803d, 0 6px 16px rgba(22, 163, 74, 0.45); background-color: rgba(22, 163, 74, 0.22) !important; }
  }
  @keyframes hl-pulse-red {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #dc2626, 0 3px 8px rgba(220, 38, 38, 0.25); background-color: rgba(220, 38, 38, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #b91c1c, 0 6px 16px rgba(220, 38, 38, 0.45); background-color: rgba(220, 38, 38, 0.22) !important; }
  }
  @keyframes hl-pulse-orange {
    0%, 100% { transform: scale(1); box-shadow: inset 0 0 0 3px #ea580c, 0 3px 8px rgba(234, 88, 12, 0.25); background-color: rgba(234, 88, 12, 0.10) !important; }
    50% { transform: scale(1.06); box-shadow: inset 0 0 0 3.5px #c2410c, 0 6px 16px rgba(234, 88, 12, 0.45); background-color: rgba(234, 88, 12, 0.22) !important; }
  }

  .fusen-mask {
    position: absolute;
    background-color: rgba(253, 224, 71, 0.45);
    border-left: 3px dashed #eab308;
    z-index: 8;
    pointer-events: none;
    display: none;
    transition: all 0.3s ease;
  }

  .narration-card {
    width: 100%;
    max-width: 480px;
    background-color: #f0fdf4;
    border-left: 5px solid #22c55e;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #166534;
    min-height: 48px;
    line-height: 1.6;
    box-sizing: border-box;
    box-shadow: 0 2px 8px rgba(34, 197, 94, 0.08);
  }

  .brain-card {
    width: 100%;
    max-width: 480px;
    background-color: #fff;
    border: 2px dashed #94a3b8;
    padding: 10px 14px;
    border-radius: 10px;
    box-sizing: border-box;
  }

  #hintCaption{
    min-height: 28px;
    text-align:center;
    color: var(--ink-soft);
    font-weight:700;
    font-size:.9rem;
    margin-bottom:0;
    flex:0 0 auto;
  }

  .slot-blue{ fill: var(--blue); }
  .slot-orange{ fill: var(--accent-deep); }
  .slot-wait{ fill: #b9b6d6; }

  /* ---------- keypad / answer ---------- */
  #answerArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:100%;
    margin-bottom:0;
  }

  .answer-display{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:1.1rem;
    font-weight:700;
    color: var(--ink-soft);
  }
  .answer-display .chip{
    min-width:52px;
    padding:6px 10px;
    text-align:center;
    background: var(--blue-soft);
    color: var(--blue);
    border-radius:10px;
    font-size:1.3rem;
    font-weight:800;
    cursor: pointer;
    user-select: none;
    transition: transform .1s, outline .1s, background .1s;
  }
  .answer-display .chip:hover{
    transform: scale(1.06);
  }
  .answer-display .chip.active{
    outline:3px solid var(--accent);
    background: #fff;
    box-shadow: 0 2px 8px rgba(255, 140, 66, 0.25);
  }
  .answer-display .chip.wrong{
    outline:3px solid var(--bad) !important;
    background: var(--bad-soft) !important;
    color: var(--bad) !important;
  }
  .answer-display .label-clickable{
    cursor: pointer;
    user-select: none;
    transition: color .15s;
  }
  .answer-display .label-clickable:hover{
    color: var(--accent-deep);
  }
  .answer-display .label-clickable.active{
    color: var(--accent-deep);
    font-weight: 800;
  }

  #keypad{
    display:grid;
    grid-template-columns: repeat(3, minmax(52px, 72px));
    gap:7px;
    justify-content:center;
    width:100%;
    max-width:250px;
  }
  #keypad button{
    width:100%; height:44px;
    border-radius:12px;
    border:2px solid var(--paper-line);
    background:#fff;
    font-family:inherit;
    font-size:1.15rem;
    font-weight:700;
    color: var(--ink);
    cursor:pointer;
  }
  #keypad button:active{ background: var(--accent-soft); border-color: var(--accent); }
  #keypad button.wide{ grid-column: span 3; width:auto; }
  #keypad button.clear{ color: var(--bad); }

  #submitBtn{
    display: none !important;
  }

  /* ---------- hint controls ---------- */
  #hintControls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom: 0;
    flex:0 0 auto;
  }
  #hintControls button{
    border-radius: 999px;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-family: inherit;
    font-weight:800;
    font-size:.95rem;
    padding: 9px 18px;
    cursor:pointer;
  }
  #hintControls button:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  #hintBackBtn, #hissanPrevBtn{ background:#fff; color: var(--ink-soft); border-color: var(--paper-line); }
  #hissanPrevBtn{ display:none; }
  #hissanSkipHintBtn{ display:none; background:#fff; color:#166534; border-color:#86efac; }
  #hissanSkipHintBtn.on{ background:#dcfce7; color:#166534; border-color:#22c55e; box-shadow:0 0 0 2px rgba(34,197,94,.10) inset; }

  #hintDots{ display:flex; gap:4px; flex-wrap:wrap; justify-content:center; max-width:140px; }
  #hintDots span{
    width:7px; height:7px; border-radius:50%;
    background: var(--paper-line);
    display:inline-block;
  }
  #hintDots span.on{ background: var(--accent); }

  /* ---------- feedback ---------- */
  #feedback{
    text-align:center;
    min-height: 28px;
    font-weight:800;
    font-size:1.15rem;
    margin-bottom:10px;
  }
  #feedback.good{ color: var(--good); }
  #feedback.bad{ color: var(--bad); }

  #nextProblemBtn{
    display:none;
    width: 100%;
    max-width: 250px;
    margin: 8px auto 0;
    padding: 11px 20px;
    border-radius: 12px;
    border:none;
    background: var(--good);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:1.1rem;
    cursor:pointer;
    box-shadow: 0 4px 0 #1f8e70;
    animation: popAnim .3s ease;
  }
  #nextProblemBtn.show{ display:block; }
  #nextProblemBtn:active{ transform: translateY(2px); box-shadow: 0 2px 0 #1f8e70; }

  .shake{ animation: shakeAnim .4s; }
  @keyframes shakeAnim{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-6px); }
    80%{ transform: translateX(6px); }
  }

  .fade-in{ animation: fadeInAnim .35s ease both; }
  @keyframes fadeInAnim{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .pop{ animation: popAnim .4s ease both; }
  @keyframes popAnim{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.35); }
    100%{ transform: scale(1); }
  }

  .wrong-row .strike-line{
    stroke:#E8505B;
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    opacity:0;
  }
  .wrong-row.strike .strike-line{
    opacity:1;
    animation: strikeAnim .42s ease forwards;
  }
  .wrong-row.gray{
    opacity:.38;
    transition:opacity .25s ease;
  }
  .wrong-row.shatter{
    animation: shatterAnim .48s cubic-bezier(.55,.05,.68,.53) forwards;
    transform-box:fill-box;
    transform-origin:center;
  }
  .correct-row{
    transition: transform .45s ease;
    transform-box:fill-box;
    transform-origin:center;
  }
  @keyframes strikeAnim{
    from{ stroke-dashoffset:340; }
    to{ stroke-dashoffset:0; }
  }
  @keyframes shatterAnim{
    0%{ opacity:.38; transform:scale(1); filter:blur(0); }
    55%{ opacity:.24; transform:scale(1.08) rotate(1deg); filter:blur(.2px); }
    100%{ opacity:0; transform:scale(.72) rotate(-4deg) translateY(5px); filter:blur(2px); }
  }

  /* Level 4 Bundle Burst & Unbundle Animation */
  @keyframes tenRemPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(249, 115, 22, 0.4)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.85)); }
  }
  .ten-rem-pulse {
    animation: tenRemPulse 1.2s infinite ease-in-out;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes tenMultiplyPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(22, 163, 74, 0.4)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(22, 163, 74, 0.85)); }
  }
  .ten-multiply-pulse {
    animation: tenMultiplyPulse 1.2s infinite ease-in-out;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes burstPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 14px #fbbf24); }
    70% { transform: scale(1.6) rotate(6deg); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  .bundle-burst {
    animation: burstPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes sparkFly {
    0% { transform: translate(0, 0) scale(0.3); opacity: 0; }
    40% { opacity: 1; transform: scale(1.2); }
    100% { transform: var(--spark-trans, translate(15px, -15px) scale(0)); opacity: 0; }
  }
  .sparkle-particle {
    animation: sparkFly 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes blockDropIn {
    0% { transform: scale(0.2); opacity: 0; }
    65% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .block-drop-in {
    animation: blockDropIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes highlightBoxGlow {
    0%, 100% { stroke: #f97316; stroke-width: 2.5; }
    50% { stroke: #ea580c; stroke-width: 4; filter: drop-shadow(0 0 8px rgba(249,115,22,0.6)); }
  }
  .highlight-dish {
    animation: highlightBoxGlow 1.5s infinite ease-in-out;
  }

  @keyframes boxPopIn {
    0% { transform: scale(0.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .group-box-blue {
    fill: rgba(239, 246, 255, 0.82);
    stroke: #3b82f6;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .group-box-purple {
    fill: rgba(250, 245, 255, 0.85);
    stroke: #a855f7;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .group-box-orange {
    fill: rgba(255, 247, 237, 0.85);
    stroke: #ea580c;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .ghost-box {
    fill: none;
    stroke: #cbd5e1;
    stroke-width: 1.5;
    stroke-dasharray: 4 4;
    opacity: 0.7;
  }
  .ghost-box-green {
    fill: none;
    stroke: #16a34a;
    stroke-width: 2;
    stroke-dasharray: 4 4;
    opacity: 0.9;
  }
  .multiply-source-box {
    fill: rgba(220, 252, 231, 0.32);
    stroke: #16a34a;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .group-ghost-box {
    fill: none;
    stroke: #93c5fd;
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    opacity: 0.65;
  }
  .remainder-stay-box {
    fill: rgba(255, 241, 242, 0.35);
    stroke: #fda4af;
    stroke-width: 1.5;
    stroke-dasharray: 5 4;
    opacity: 0.85;
  }
  .subtract-source-box {
    fill: rgba(254, 226, 226, 0.32);
    stroke: #dc2626;
    stroke-width: 2.5;
    stroke-dasharray: 6 4;
    animation: boxPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .bundle-unit, .block-unit {
    transform-box: fill-box;
  }

  /* NOTE: the old max-width:820px / max-height:720px reflow rules were
     removed for the same reason — #app's own logical size is now always
     1280x720, so those breakpoints never need to change its layout;
     small real screens are handled by scaling the whole canvas instead. */

  @media (prefers-reduced-motion: reduce){
    .shake, .fade-in, .pop, .wrong-row.strike .strike-line, .wrong-row.shatter{ animation: none !important; }
  }

  #keypad[hidden], #divisionHandwriting[hidden] { display:none; }
  .division-mode { font-size:.9rem; font-weight:700; display:flex; align-items:center; gap:8px; }
  .division-mode select { font:inherit; padding:5px 8px; border:2px solid var(--paper-line); border-radius:10px; background:white; }
  #divisionHandwriting { width:100%; max-width:300px; text-align:center; }
  #divisionHandwriting canvas { display:block; width:180px; height:180px; margin:5px auto; background:white; border:3px solid var(--accent); border-radius:12px; touch-action:none; }
  #divisionHandwriting [data-target] { font-size:.85rem; font-weight:700; }
  #divisionHandwriting [data-status] { min-height:32px; font-size:.78rem; margin:4px 0; }
  #divisionHandwriting button { font:inherit; font-weight:700; border:2px solid var(--paper-line); border-radius:9px; padding:5px 8px; background:white; color:var(--ink); cursor:pointer; }
  #divisionHandwriting button:disabled { opacity:.4; cursor:default; }
  #divisionHandwriting [data-candidates] { display:flex; justify-content:center; gap:9px; min-height:46px; }
  #divisionHandwriting [data-candidates] button { font-size:1.5rem; min-width:48px; }
  #divisionHandwriting .first-candidate { border-color:var(--accent); background:var(--accent-soft); }
  .input-panel #hintControls { flex-wrap:wrap; gap:6px; width:100%; }
  .input-panel #hintControls button { flex:0 0 auto; white-space:nowrap; font-size:.8rem; padding:7px 10px; }
  .input-panel .answer-display { font-size:.9rem; text-align:center; }
  #divisionShareSettings { position:absolute; right:14px; top:52px; }
  #divisionShareSettings .lesson-share-launcher { margin:0; padding:4px 8px; font-size:.8rem; }
</style>

<body>

<div id="stageOuter">
<div id="app">
  <header class="top">
    <h1>わり算れんしゅう</h1>

    <!-- 先生コード接続カード -->
    <div id="teacherConnectCard" style="display:flex; align-items:center; gap:6px; background:#fff; border:2px solid #dbe2e8; border-radius:999px; padding:3px 8px; flex-shrink:0;">
      <span style="font-size:.95rem;">🧑‍🏫</span>
      <span id="teacherConnSubText" style="font-size:.78rem; color:#64748b; white-space:nowrap;">先生コード</span>

      <div class="raid-code-box">
        <span style="font-size: .85rem;">🔑</span>
        <input type="text" id="studentRaidCode" placeholder="コード" maxlength="8">
        <button id="connectBtn" class="raid-btn" type="button">接続</button>
        <span id="connStatus" class="conn-status" title="接続状態">⚪</span>
      </div>

      <div id="bossMiniStatus" class="boss-mini-status">
        👾 <span id="miniBossName">ボス</span> <span id="miniBossHp"></span>
      </div>

      <div id="streakBadge" class="streak-badge">
        🔥 <span id="streakCount">0</span>れんぞく
      </div>

      <div class="user-profile-box">
        <button id="avatarBtn" class="avatar-select-btn" type="button">⚔️</button>
        <div class="name-input-box">
          <input type="text" id="studentName" value="たろう" placeholder="なまえ" maxlength="8">

        <div class="avatar-picker-popover" id="avatarPicker">
          <span class="avatar-option" data-avatar="⚔️">⚔️</span>

          <span class="avatar-option" data-avatar="🥷">🥷</span>
          <span class="avatar-option" data-avatar="🐱">🐱</span>
          <span class="avatar-option" data-avatar="🐶">🐶</span>
          <span class="avatar-option" data-avatar="🤖">🤖</span>

    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <div id="scoreBox"><span>いっぱつ正解</span><b id="scoreCorrect">0</b><span>/</span><span id="scoreTotal">0</span>もん</div>
      <button id="soundBtn" class="sound-btn" title="おと ON/OFF" type="button" aria-pressed="true">🔊</button>
    </div>
</header>
<div id="divisionShareSettings"></div>

  <!-- 先生対応中バナー（初期状態は非表示） -->
  <div id="teacherNoticeBanner" class="hidden" style="display:none; position:absolute; top:50px; left:50%; transform:translateX(-50%); z-index:95; background:#fffbeb; border:2px solid #f59e0b; border-radius:999px; padding:6px 18px; box-shadow:0 8px 24px rgba(0,0,0,0.12); align-items:center; gap:10px; font-weight:900; color:#92400e; white-space:nowrap;">
    <span id="teacherNoticeIcon" style="font-size:1.1rem;">🏃</span>
    <span id="teacherNoticeMain" style="font-size:.85rem;">先生が見に来ます</span>
    <span id="teacherNoticeSub" style="font-size:.78rem; color:#b45309; margin-left:4px;">この画面で待っていてね</span>
  </div>

<script src="js/division-handwriting.js"></script>
<script>
(function(){
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, txt){
    var e = document.createElementNS(SVGNS, tag);
    if(attrs){
      for(var k in attrs){
        if(attrs[k] === null || attrs[k] === undefined || attrs[k] === "") continue;
        e.setAttribute(k, attrs[k]);
      }
    }
    if(txt !== undefined){ e.textContent = txt; }
    return e;
  }
  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  // 「ひく」操作のとき、割られる数（ゴースト＋あまり）があった場所をまとめて
  // 赤い点線枠で囲むための共通ヘルパー。boxes は {x,y,w,h}（左上座標＋幅高さ）の配列。
  function frameAroundBoxes(sc, boxes, pad, label){
    if(!boxes || !boxes.length) return null;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    boxes.forEach(function(b){
      minX = Math.min(minX, b.x);
      minY = Math.min(minY, b.y);
      maxX = Math.max(maxX, b.x + b.w);
      maxY = Math.max(maxY, b.y + b.h);
    });
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    var frame = el("rect", {
      x: minX, y: minY, width: maxX - minX, height: maxY - minY,
      rx: 8, class: "subtract-source-box"
    });
    sc.gBoxes.appendChild(frame);
    if(label){
      var tag = el("text", {
        x: minX + 6, y: Math.max(12, minY - 4), fill: "#dc2626",
        "font-size": 9.5, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      tag.textContent = label;
      sc.gBoxes.appendChild(tag);
    }
    return frame;
  }

  // ------------------------------------------------------------------
  // fixed 16:9 stage scaling
  // ------------------------------------------------------------------
  // #app is a fixed 1280x720 logical canvas (see CSS). fitStage() scales
  // it uniformly to fit whatever real viewport the device has, so the
  // layout never reflows -- it's always the same 16:9 design, just
  // zoomed to fit. window.__stageScale exposes the current factor so
  // any JS that measures pixels via getBoundingClientRect() (which
  // returns post-scale/visual pixels) can convert back to the SVG/CSS
  // "local" pixel space #app itself is laid out in.
  var STAGE_W = 1280, STAGE_H = 720;
  window.__stageScale = 1;
  function fitStage(){
    var app = document.getElementById('app');
    if(!app) return;
    var scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    if(!isFinite(scale) || scale <= 0) scale = 1;
    app.style.transform = "scale(" + scale + ")";
    window.__stageScale = scale;
  }
  fitStage();
  window.addEventListener("resize", fitStage);
  window.addEventListener("orientationchange", fitStage);
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", fitStage);
  }
  if(window.ResizeObserver){
    new ResizeObserver(fitStage).observe(document.documentElement);
  }

  // ------------------------------------------------------------------
  // state
  // ------------------------------------------------------------------
  var state = {
    level: null,
    problem: null,
    hintStage: 0,
    maxHint: 0,
    inputDigits: "",
    inputRemainder: "",
    activeField: "q",
    answered: false,
    isWrongState: false,
    lastKey: null,
    score: { correct: 0, total: 0 },
    streak: 0,
    avatar: "⚔️",
    // 筆算入力モード：画面に見せる工程と、数字入力を要求する工程を分けて管理する。
    hissanTargets: [],       // 互換・テスト用の全入力セル一覧
    hissanFlow: [],          // [{stepIdx,cells:[...]}] 実際に児童が通る工程列
    hissanFlowPos: 0,        // hissanFlow上の現在位置
    hissanEntries: {},       // "stepIdx|r,c" -> 正答して確定した数字
    hissanBuffer: "",       // 現在工程で入力途中の数字列（工程単位で採点）
    hissanStepMistakes: {},  // stepIdx -> その工程での誤答回数
    hissanHintDepth: 0,      // 0=自力 / 1=考え方 / 2=具体ヒント
    hissanSkipHints: true,  // true=説明だけの工程は自動で飛ばし、必要な時だけヒントを見る
    hadMistake: false,
    usedConcreteHint: false,
    levelSolved: 0,          // 同じレベル内で解けた問題数（保存対象）
    masteryPoints: 0,        // 累積の参考値
    masteryRecent: [],       // 直近5問の質（2=一発 / 1=自己修正 / 0=具体ヒント）
    adaptiveTier: 1,         // 実際に難易度・支援へ使う段階 1〜4
    masterySinceTierChange: 0,
    problemSerial: 0
  };

  function isHissanInputLevel(p){
    if(!p || !p.isLongDivision) return false;
    if(p.hissanInput === true) return true;
    if(typeof p.level !== "string") return false;
    return p.level.slice(0, 2) === "5-" || p.level.slice(0, 2) === "6-" || p.level.slice(0, 2) === "7-";
  }

  function isTrialInteractiveStep(step, p){
    if(!step || !p) return false;
    var lvl = String(p.level || "");
    if(lvl !== "8-3" && lvl !== "8-4") return false;
    return step.phase === "trial-build" || step.phase === "trial-multiply" || step.phase === "trial-fix";
  }

  var MASTERY_STORAGE_KEY = "warizan_mastery_by_level_v1";

  function loadMasteryStore(){
    try{
      var raw = localStorage.getItem(MASTERY_STORAGE_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === "object") ? obj : {};
    }catch(e){ return {}; }
  }

  function saveCurrentMastery(){
    if(!state.level) return;
    try{
      var store = loadMasteryStore();
      store[String(state.level)] = {
        points: state.masteryPoints || 0,
        recent: (state.masteryRecent || []).slice(-5),
        tier: Math.max(1, Math.min(4, state.adaptiveTier || 1)),
        since: state.masterySinceTierChange || 0,
        solved: state.levelSolved || 0
      };
      localStorage.setItem(MASTERY_STORAGE_KEY, JSON.stringify(store));
    }catch(e){}
  }

  function restoreMasteryForLevel(lvl){
    var rec = loadMasteryStore()[String(lvl)] || {};
    state.masteryPoints = Number(rec.points) || 0;
    state.masteryRecent = Array.isArray(rec.recent) ? rec.recent.slice(-5).map(function(v){ return Math.max(0, Math.min(2, Number(v)||0)); }) : [];
    state.adaptiveTier = Math.max(1, Math.min(4, Number(rec.tier) || 1));
    state.masterySinceTierChange = Math.max(0, Number(rec.since) || 0);
    state.levelSolved = Math.max(0, Number(rec.solved) || 0);
  }

  function resetAllMastery(){
    try{ localStorage.removeItem(MASTERY_STORAGE_KEY); }catch(e){}
    state.masteryPoints = 0;
    state.masteryRecent = [];
    state.adaptiveTier = 1;
    state.masterySinceTierChange = 0;
    state.levelSolved = 0;
  }

  function masteryTier(){
    return Math.max(1, Math.min(4, state.adaptiveTier || 1));
  }

  function hissanSupportMode(){
    var tier = masteryTier();
    return tier === 1 ? "full" : (tier === 2 ? "guided" : (tier === 3 ? "compact" : "minimal"));
  }

  function awardMasteryForSolvedProblem(){
    var quality = state.usedConcreteHint ? 0 : (state.hadMistake ? 1 : 2);
    state.levelSolved = (state.levelSolved || 0) + 1;
    state.masteryPoints = (state.masteryPoints || 0) + quality;
    state.masteryRecent = (state.masteryRecent || []).concat([quality]).slice(-5);
    state.masterySinceTierChange = (state.masterySinceTierChange || 0) + 1;

    // 直近5問で判断する。良ければ上げ、苦戦が続けば1段階戻す。
    // 毎問上下して落ち着かなくならないよう、段階変更後は最低3問見る。
    if(state.masteryRecent.length >= 5 && state.masterySinceTierChange >= 3){
      var recentSum = state.masteryRecent.reduce(function(a,b){ return a+b; }, 0);
      var oldTier = masteryTier();
      if(recentSum >= 8 && oldTier < 4) state.adaptiveTier = oldTier + 1;
      else if(recentSum <= 3 && oldTier > 1) state.adaptiveTier = oldTier - 1;
      if(state.adaptiveTier !== oldTier) state.masterySinceTierChange = 0;
    }
    saveCurrentMastery();
    return quality;
  }

  // 通常問題は「最後のヒント」より前に答えが実質見えるレベルがある。
  // その段階へ到達した時点で具体ヒント使用として扱う。
  var NORMAL_REVEAL_STAGE = {
    "1":2, "2":2, "3-1":2, "3-2":2,
    "4-1":3, "4-2":3, "4-3":3,
    "8-1":2
  };
  function markConcreteHintIfRevealed(){
    var reveal = NORMAL_REVEAL_STAGE[String(state.level || "")];
    if(reveal !== undefined && state.hintStage >= reveal) state.usedConcreteHint = true;
  }

  function hissanCellIsInput(wc, step, p){
    if(!wc || wc.isGuide || wc.isLineExtend) return false;
    if(wc.char === "" || wc.char === undefined || wc.char === null) return false;
    if(wc.isAutoFill && !isTrialInteractiveStep(step, p)) return false;
    return true;
  }

  function hissanEntryKey(stepIdx, cell){
    return stepIdx + "|" + cell.r + "," + cell.c;
  }

  function inputCellsForHissanStep(step, stepIdx, p){
    var cells = [];
    (step && step.writeCells ? step.writeCells : []).forEach(function(wc){
      if(!hissanCellIsInput(wc, step, p)) return;
      cells.push({ r: wc.r, c: wc.c, char: String(wc.char), stepIdx: stepIdx });
    });
    return cells;
  }

  // 入力の無い工程も、学習上意味のあるものは必ず通す。
  // initだけは準備画面なのでフローから外す。
  function buildHissanFlow(appState, p){
    var flow = [];
    var flatTargets = [];
    if(!appState || !Array.isArray(appState.steps)) return { flow: flow, targets: flatTargets };
    var support = hissanSupportMode();
    // 数学的な4工程と特殊判断は常に残す。補助的な「全体を見る／隠す」は
    // 習熟に応じて徐々に省き、支援をフェードアウトする。
    var keepNoInput = { skip:true, subtract:true, drop:true, "trial-fix":true, complete:true };
    if(support === "full"){ keepNoInput.cover = true; keepNoInput.hide = true; }
    else if(support === "guided"){ keepNoInput.hide = true; }
    appState.steps.forEach(function(step, stepIdx){
      if(!step || step.phase === "init") return;
      var cells = inputCellsForHissanStep(step, stepIdx, p);
      cells.forEach(function(c){ flatTargets.push(c); });
      if(cells.length > 0 || keepNoInput[step.phase]){
        flow.push({ stepIdx: stepIdx, cells: cells });
      }
    });
    return { flow: flow, targets: flatTargets };
  }

  function currentHissanFlowItem(){
    var flow = state.hissanFlow || [];
    return (state.hissanFlowPos >= 0 && state.hissanFlowPos < flow.length) ? flow[state.hissanFlowPos] : null;
  }

  function currentHissanStep(){
    var item = currentHissanFlowItem();
    if(!item || !HissanSim.appState || !HissanSim.appState.steps) return null;
    return HissanSim.appState.steps[item.stepIdx] || null;
  }

  function currentHissanHasInput(){
    var item = currentHissanFlowItem();
    return !!(item && item.cells && item.cells.length);
  }

  function hissanFlowItemCompleted(item){
    if(!item || !item.cells || !item.cells.length) return false;
    return item.cells.every(function(cell){
      return state.hissanEntries[hissanEntryKey(item.stepIdx, cell)] === cell.char;
    });
  }

  function hissanPhaseLabel(step){
    if(!step) return "";
    if(step.phase === "trial-build") return "仮の商";
    if(step.phase === "trial-multiply") return "仮商をたしかめる";
    if(step.phase === "trial-fix") return "仮商を直す";
    if(["cover","hide","skip","build","build-zero"].includes(step.phase)) return "たてる";
    if(step.phase === "multiply") return "かける";
    if(step.phase === "subtract") return "ひく";
    if(step.phase === "drop") return "おろす";
    if(step.phase === "complete") return "完成";
    return "筆算";
  }

  function hissanFlowItemHasInput(item){
    return !!(item && item.cells && item.cells.length);
  }

  // 「ヒントをとばす」がONのときは、説明だけの工程には着地せず、
  // 次（または前）の実入力工程まで一気に移動する。
  // 児童が必要なときは入力工程の「ヒント▶」をいつでも使える。
  function findHissanRequiredPos(fromPos, direction){
    var flow = state.hissanFlow || [];
    var i = fromPos + direction;
    while(i >= 0 && i < flow.length){
      if(hissanFlowItemHasInput(flow[i])) return i;
      i += direction;
    }
    return -1;
  }

  function jumpToNextRequiredHissanStep(){
    var next = findHissanRequiredPos(state.hissanFlowPos, 1);
    if(next < 0){
      checkHissanAnswer();
      return;
    }
    setHissanFlowPos(next);
    renderAll(true);
  }

  function applyHissanSkipHintMode(immediate){
    if(!isHissanInputLevel(state.problem)) return;
    if(state.hissanSkipHints && !currentHissanHasInput()){
      var next = findHissanRequiredPos(state.hissanFlowPos - 1, 1);
      if(next >= 0){
        setHissanFlowPos(next);
        if(immediate) renderAll(false);
      }
    }
  }

  function toggleHissanSkipHints(){
    state.hissanSkipHints = !state.hissanSkipHints;
    if(state.hissanSkipHints) applyHissanSkipHintMode(false);
    renderAll(false);
  }

  function backHissanFlow(){
    if(state.answered || state.hissanFlowPos <= 0) return;
    if(state.hissanBuffer && state.hissanBuffer.length){
      feedback.textContent = "入力途中の数字を『けす』で消してから前の工程へ戻ろう。";
      feedback.className = "bad";
      return;
    }
    if(state.hissanSkipHints){
      var prevRequired = findHissanRequiredPos(state.hissanFlowPos, -1);
      if(prevRequired < 0) return;
      setHissanFlowPos(prevRequired);
    } else {
      setHissanFlowPos(state.hissanFlowPos - 1);
    }
    renderAll(false);
  }

  function setHissanFlowPos(pos){
    var flow = state.hissanFlow || [];
    if(!flow.length){
      state.hissanFlowPos = 0;
      state.hintStage = 0;
      return;
    }
    state.hissanFlowPos = Math.max(0, Math.min(pos, flow.length - 1));
    state.hintStage = flow[state.hissanFlowPos].stepIdx;
    state.hissanBuffer = "";
    state.hissanHintDepth = 0;
    state.isWrongState = false;
  }

  function advanceHissanFlow(){
    var flow = state.hissanFlow || [];
    if(!flow.length || state.answered) return;
    if(state.hissanSkipHints){
      jumpToNextRequiredHissanStep();
      return;
    }
    if(state.hissanFlowPos >= flow.length - 1){
      checkHissanAnswer();
      return;
    }
    setHissanFlowPos(state.hissanFlowPos + 1);
    var step = currentHissanStep();
    if(step && step.phase === "complete"){
      checkHissanAnswer();
    } else {
      renderAll(true);
    }
  }

  function hissanConceptHint(step){
    if(!step) return "今の工程を、筆算の順番にそって考えよう。";
    var phase = step.phase;
    if(phase === "trial-build") return "『仮の商』：上の位どうしを見て、まず入りそうな商を予想しよう。";
    if(phase === "trial-multiply") return "『たしかめる』：今の仮の商 × わる数 を計算して、わられる数をこえないか確かめよう。";
    if(phase === "trial-fix") return "大きすぎた仮の商は1小さくして、もう一度かけ算で確かめよう。";
    if(phase === "build" || phase === "build-zero" || phase === "skip" || phase === "hide" || phase === "cover"){
      return "『たてる』：今見ている数の中に、わる数がいくつ入るか考えよう。";
    }
    if(phase === "multiply") return "『かける』：今たてた商 × わる数 を計算しよう。";
    if(phase === "subtract") return "『ひく』：上の数から、今かけて出した数をひこう。";
    if(phase === "drop") return "『おろす』：となりの数字を、同じ位の列へまっすぐおろそう。";
    return "今の工程で何をするか、色とマスの位置を見て考えよう。";

  // initLevel4Scene / renderLevel4 が使う実行コンテキスト。
  // メインのレベル4ゲーム用と、レベル5の筆算パネル用とで、
  // 別々の svg・シーン・タイマーを持たせつつ同じ描画/アニメーションロジックを使い回す。
  function createLevel4Ctx(cfg){

      svg: cfg.svg,

  // 古い問題のコールバックが新しいDOMを書き換えることがある。問題切替時に
  // 一括破棄できる専用レジストリを使う。
  var level2Timers = [];
  function clearLevel2Timers(){
    level2Timers.forEach(function(t){ clearTimeout(t); });
    level2Timers = [];
  }
  function scheduleLevel2(fn, delay){
    var args = Array.prototype.slice.call(arguments, 2);
    var serial = state.problemSerial;
    var id = setTimeout(function(){
      if(serial !== state.problemSerial) return;
      fn.apply(null, args);
    }, delay);
    level2Timers.push(id);
    return id;
  }

  function playSound(type){
    if(!soundEnabled) return;
    try {
      initAudio();
      if(!audioCtx) return;
      if(audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
      var now = audioCtx.currentTime;

      if(type === 'click'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.06);
      } else if(type === 'switch'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
        g.gain.setValueAtTime(0.07, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.07);
      } else if(type === 'step'){
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.07);
        g.gain.setValueAtTime(0.06, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.08);
      } else if(type === 'correct'){
        [880, 1320].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          var st = now + i * 0.12;
          g.gain.setValueAtTime(0.12, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.38);
        });
      } else if(type === 'wrong'){
        [220, 200].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.value = f;
          var st = now + i * 0.14;
          g.gain.setValueAtTime(0.08, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.2);
        });
      } else if(type === 'critical'){
        [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          var st = now + i * 0.08;
          g.gain.setValueAtTime(0.12, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.28);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.3);
        });
      } else if(type === 'chariin'){
        // チャリーン！と弾けるコイン・ベルの綺麗な音

          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(st); osc.stop(st + 0.38);
        });
      }
    } catch(e){}
  }

  function loadExternalScript(src){
    return new Promise(function(resolve, reject){
      var existing = document.querySelector('script[data-lazy-src="' + src + '"]');
      if(existing){
        if(existing.getAttribute("data-loaded") === "1") return resolve();
        if(existing.getAttribute("data-failed") === "1"){ existing.remove(); existing = null; }
        else {
          existing.addEventListener("load", resolve, { once:true });
          existing.addEventListener("error", function(err){ existing.setAttribute("data-failed","1"); existing.remove(); reject(err); }, { once:true });
          return;
        }
      }
      var sc = document.createElement("script");
      sc.src = src;
      sc.async = true;
      sc.setAttribute("data-lazy-src", src);
      sc.addEventListener("load", function(){ sc.setAttribute("data-loaded", "1"); resolve(); }, { once:true });
      sc.addEventListener("error", function(err){ sc.setAttribute("data-failed","1"); sc.remove(); reject(err); }, { once:true });
      document.head.appendChild(sc);
    });
  }

  function ensureFirebase(){
    if(db) return Promise.resolve(true);
    if(firebaseLoadPromise) return firebaseLoadPromise;
    firebaseLoadPromise = loadExternalScript("https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js")
      .then(function(){ return loadExternalScript("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"); })
      .then(function(){ return loadExternalScript("https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"); })
      .then(function(){
        if(typeof firebase === "undefined" || !firebase.initializeApp) throw new Error("Firebase SDK unavailable");
        if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        authPromise = firebase.auth().signInAnonymously().catch(function(err){
          console.error("匿名認証エラー:", err);
          return null;
        });
        return true;
      })
      .catch(function(err){
        firebaseLoadPromise = null;
        console.error("Firebase遅延読込エラー:", err);
        return false;
      });
    return firebaseLoadPromise;
  }

    if(!isAuto) showRaidMsg("🔍 ルーム「" + cleanCode + "」を確認中...", "warn");

    var firebaseReady = await ensureFirebase();
    if(!firebaseReady || !db){
      updateConnStatus("error", "Firebaseを読み込めませんでした");
      showRaidMsg("⚠️ レイド機能を読み込めませんでした。通常練習はそのまま使えます", "error");
      return;
    }

    updateConnStatus("connecting", "接続確認中: ルーム " + cleanCode);
    if(authPromise){
      await authPromise;
    }

    currentRaidCode = cleanCode;
    try { localStorage.setItem("raid_boss_student_code", cleanCode); } catch(e){}

    if(studentRoomRef && currentRoomListener){
      studentRoomRef.off("value", currentRoomListener);
    }

    studentRoomRef = db.ref("rooms/" + cleanCode);
    var firstLoad = true;
    currentRoomListener = function(snapshot){
      var data = snapshot.val();
      var now = Date.now();

      if(!data || !data.boss || (data.expiresAt && data.expiresAt < now)){
        updateConnStatus("error", "レイドコードが見つからないか、期限切れです");
        showRaidMsg("⚠️ ルーム「" + cleanCode + "」が見つからないか期限切れです", "error");
        return;
      }

      updateConnStatus("connected", "接続中: ルーム " + cleanCode);
      var bossName = data.boss.name || "ボス";
      if(firstLoad){
        showRaidMsg("✅ ボス「" + bossName + "」に接続しました！", "good");
        firstLoad = false;

      if(miniBossName) miniBossName.textContent = bossName;

        miniBossHp.textContent = "(" + cur + "/" + (data.boss.maxHp || "?") + ")";
      }
    };

      updateConnStatus("error", "通信エラー: " + (err.message || "権限がありません"));
      showRaidMsg("⚠️ 通信エラーが発生しました", "error");
    });
  }

  function sendAttack(damage, detail){
    if(!db || !studentRoomRef || !currentRaidCode){
      return false; // local only
    }

    var name = (studentNameInput && studentNameInput.value.trim()) ? studentNameInput.value.trim() : "ななし";
    try { localStorage.setItem("raid_boss_student_name", name); } catch(e){}

    studentRoomRef.child("boss/currentHp").transaction(function(currentHp){
      // 複数端末から同時攻撃されてもHPが0未満にならないよう、
      // transaction 内で原子的に下限0へクランプする。
      return Math.max(0, (currentHp || 0) - damage);
    });

    studentRoomRef.child("logs").push({
      avatar: state.avatar,
      name: name,
      damage: damage,
      detail: detail,
      timestamp: Date.now()
    });

    return true;
  }

  function initRaidUI(){
    if(connectBtn){
      connectBtn.addEventListener("click", applyStudentRaidCode);
    }
    if(studentRaidCodeInput){
      studentRaidCodeInput.addEventListener("keydown", function(e){
        if(e.key === "Enter") applyStudentRaidCode();
      });
    }
    if(avatarBtn && avatarPicker){
      avatarBtn.addEventListener("click", function(e){
        e.stopPropagation();
        avatarPicker.classList.toggle("show");
      });
      avatarPicker.querySelectorAll(".avatar-option").forEach(function(opt){
        opt.addEventListener("click", function(e){
          e.stopPropagation();
          var av = opt.getAttribute("data-avatar");
          if(av){
            state.avatar = av;
            avatarBtn.textContent = av;
            try { localStorage.setItem("raid_boss_student_avatar", av); } catch(err){}
          }
          avatarPicker.classList.remove("show");
        });
      });
      document.addEventListener("click", function(e){
        if(!avatarPicker.contains(e.target) && e.target !== avatarBtn){
          avatarPicker.classList.remove("show");
        }
      });
    }

    // Restore saved settings
    try {
      var savedName = localStorage.getItem("raid_boss_student_name");
      if(savedName && studentNameInput) studentNameInput.value = savedName;

      var savedAvatar = localStorage.getItem("raid_boss_student_avatar");
      if(savedAvatar){
        state.avatar = savedAvatar;
        if(avatarBtn) avatarBtn.textContent = savedAvatar;
      }

      // レイドコードは初期状態では空欄で未接続（URLパラメータ ?code=XXXX が明示された場合のみ接続）
      var urlParams = new URLSearchParams(window.location.search);
      var codeParam = urlParams.get("code");
      var initialCode = (codeParam && codeParam.trim()) ? codeParam.trim() : "";
      if(studentRaidCodeInput) studentRaidCodeInput.value = initialCode;
      if(initialCode){
        connectToRaid(initialCode, true);

    } catch(e){}
  }

  // 「かりの商」がそのまま正しい商になるか(調整が要らない)を、実際に筆算
  // エンジンが使う見当のつけ方（わる数の上1けたで割ってみる）を先取りして
  // 判定するヘルパー。8-2(調整なし)と8-3(調整あり)の作り分けに使う。
  function estimateTrialQuotient(dividend, divisor){
    var d1 = parseInt(String(divisor)[0], 10);
    var topVal = Math.floor(dividend / 10);
    return Math.min(9, Math.floor(topVal / d1));
  }

  // 商が複数桁になる問題は、問題全体ではなく各ラウンドごとの仮商修正幅で難易度を見る。
  function maxTrialAdjustmentForDivision(dividend, divisor){
    var digits = String(dividend).split("");
    var d1 = parseInt(String(divisor)[0], 10);
    var rem = 0;
    var maxAdjust = 0;
    for(var i=0;i<digits.length;i++){
      var target = rem * 10 + parseInt(digits[i],10);
      if(target < divisor){ rem = target; continue; }
      var q = Math.floor(target / divisor);
      var trial = Math.min(9, Math.floor(Math.floor(target / 10) / d1));
      maxAdjust = Math.max(maxAdjust, Math.max(0, trial - q));
      rem = target - q * divisor;
    }
    return maxAdjust;
  }

    var problem, key, tries = 0;

      var dividend = divisor * quotient + remainder;
      if(dividend >= 10 && dividend < 100 && remainder < divisor){
        var trial = estimateTrialQuotient(dividend, divisor);
        var mt = masteryTier();
        var allowedAdjust = mt === 1 ? 1 : (mt === 2 ? 2 : 5);
        if(trial > quotient && (trial - quotient) <= allowedAdjust){
          problem = {
            level: "8-3", divisor: divisor, quotient: quotient, remainder: remainder,
            hasRemainder: hasRem, targetQuotientDigits: 1,
            dividend: dividend, isLongDivision: true, hissanInput: true,
            title: "レベル8-3　2けた÷2けたの筆算（かりの商を調整する型）"
          };
          key = problemKey(problem);
        }
      }
      tries++;
    } while((!problem || key === prevKey) && tries < 60);
    if(problem && key !== prevKey) return problem;
    var fallbacks = [
      { level:"8-3", divisor:23, quotient:3, remainder:17, hasRemainder:true, targetQuotientDigits:1, dividend:86, isLongDivision:true, hissanInput:true, title:"レベル8-3　2けた÷2けたの筆算（かりの商を調整する型）" },
      { level:"8-3", divisor:23, quotient:2, remainder:22, hasRemainder:true, targetQuotientDigits:1, dividend:68, isLongDivision:true, hissanInput:true, title:"レベル8-3　2けた÷2けたの筆算（かりの商を調整する型）" }
    ];
    return problemKey(fallbacks[0]) !== prevKey ? fallbacks[0] : fallbacks[1];
  }

  function genLevel8_4(prevKey){
    // 3けた÷2けたは内部で段階化する。
    // 習熟度で段階化する（問題数だけでは上げない）。
    // Tier1: 商1けた・わりきれる・仮商修正なし
    // Tier2: 商1けた・あまり可・仮商修正は最大1回
    // Tier3: 商2けた中心・まずはわりきれる
    // Tier4: 全範囲
    var tier = masteryTier();
    var problem, key, tries = 0;
    do{
      var divisor = rand(11, 89);
      var minQ = Math.max(2, Math.ceil(100 / divisor));
      var maxQ = Math.floor(999 / divisor);
      if(minQ > maxQ){ tries++; continue; }

      var quotient;
      var remainder = 0;
      if(tier <= 2){
        var qMin1 = Math.max(minQ, 2);
        var qMax1 = Math.min(maxQ, 9);
        if(qMin1 > qMax1){ tries++; continue; }
        quotient = rand(qMin1, qMax1);
        remainder = (tier === 2 && Math.random() < 0.45) ? rand(1, divisor - 1) : 0;
      } else if(tier === 3){
        var qMin2 = Math.max(minQ, 10);
        var qMax2 = Math.min(maxQ, 39);
        if(qMin2 > qMax2){ tries++; continue; }
        quotient = rand(qMin2, qMax2);
        remainder = 0;
      } else {
        quotient = rand(minQ, maxQ);
        remainder = Math.random() < 0.5 ? rand(1, divisor - 1) : 0;
      }

      var dividend = divisor * quotient + remainder;
      if(dividend < 100 || dividend > 999){ tries++; continue; }
      var maxRoundAdjust = maxTrialAdjustmentForDivision(dividend, divisor);
      if(tier === 1 && maxRoundAdjust !== 0){ tries++; continue; }
      if(tier === 2 && maxRoundAdjust > 1){ tries++; continue; }
      if(tier === 3 && maxRoundAdjust > 1){ tries++; continue; }
      problem = {
        level: "8-4", divisor: divisor, quotient: quotient, remainder: remainder,
        hasRemainder: remainder > 0, targetQuotientDigits: String(quotient).length,
        dividend: dividend, isLongDivision: true, hissanInput: true,
        difficultyTier: tier,
        title: "レベル8-4　3けた÷2けたの筆算"
      };
      key = problemKey(problem);
      tries++;
    } while((!problem || key === prevKey) && tries < 200);

    if(problem) return problem;
    var fallbackByTier = {
      1:{divisor:12,quotient:9,remainder:0,dividend:108},
      2:{divisor:24,quotient:6,remainder:9,dividend:153},
      3:{divisor:21,quotient:16,remainder:0,dividend:336},
      4:{divisor:21,quotient:16,remainder:9,dividend:345}
    };
    var f = fallbackByTier[tier];
    return {
      level:"8-4", divisor:f.divisor, quotient:f.quotient, remainder:f.remainder,
      hasRemainder:f.remainder>0, targetQuotientDigits:String(f.quotient).length,
      dividend:f.dividend, isLongDivision:true, hissanInput:true, difficultyTier:tier,
      title:"レベル8-4　3けた÷2けたの筆算"
    };
  }

  function newProblem(){
    if(handwriting) handwriting.clear();
    state.problemSerial++;
    clearLevel2Timers();
    clearHissanIllusTimers();
    if(typeof clearHissanRoundTimers === "function") clearHissanRoundTimers();
    if(typeof clearHissanRevealTimers === "function") clearHissanRevealTimers();
    level4Ctx.scene = null;
    clearCtxTimers(level4Ctx);
    var lvl = String(state.level || "1");
    var p;
    var maxH = 3;

    if(lvl === "1") { p = genLevel1(lastKey); maxH = 3; }
    else if(lvl === "2") { p = genLevel2(lastKey); maxH = 5; }
    else if(lvl === "3-1") { p = genLevel3_1(lastKey); maxH = 3; }
    else if(lvl === "3-2") { p = genLevel3_2(lastKey); maxH = 3; }
    else if(lvl === "4-1") { p = genLevel4_1(lastKey); maxH = 5; }
    else if(lvl === "4-2") { p = genLevel4_2(lastKey); maxH = 5; }
    else if(lvl === "4-3") { p = genLevel4_3(lastKey); maxH = 5; }
    else if(lvl === "5-1") { p = genLevel5_1(lastKey); maxH = 5; }
    else if(lvl === "5-2") { p = genLevel5_2(lastKey); maxH = 5; }
    else if(lvl === "5-3") { p = genLevel5_3(lastKey); maxH = 5; }
