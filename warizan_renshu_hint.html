  function initLevel4Scene(ctx, p){
    ctx.svg.setAttribute("viewBox", "0 0 460 275");
    // NOTE: clearSvg() はモジュール直下のグローバル svg（メインのレベル4ゲーム画面用）
    // を消すだけで、ctx.svg（レベル5の筆算パネルから呼ばれた場合は
    // hissan-illustration-svg）は消さない。これまでここで clearSvg() を呼んでいたため、
    // レベル5側では前のフェーズの要素（バッジ文字・ブロックなど）が消えずに残ったまま
    // 新しい要素が重ねて追加され、位置がずれたり古い文字が残って見えるバグになっていた。
    // 必ず今回描画する対象（ctx.svg）自体をクリアする。
    ctx.svg.innerHTML = "";

    var divisor = p.divisor;
    var dividend = p.dividend;
    var tenDigit = (p.tenDigit !== undefined) ? p.tenDigit : Math.floor(dividend / 10);
    var oneDigit = (p.oneDigit !== undefined) ? p.oneDigit : (dividend % 10);
    var tenRem = (p.tenRem !== undefined) ? p.tenRem : (tenDigit % divisor);
    var q_ten = (p.q_ten !== undefined) ? p.q_ten : Math.floor(tenDigit / divisor);
    var unbundlePart = (p.unbundlePart !== undefined) ? p.unbundlePart : (tenRem * 10 + oneDigit);
    var q_one = (p.q_one !== undefined) ? p.q_one : Math.floor(unbundlePart / divisor);
    var isUnbundle = (tenRem > 0);
    var hasRem = p.hasRemainder;

    // このラウンドの「10の位」「1の位」が、わられる数全体の中で実際に
    // 何の位（100/10/1...）にあたるかをラベルに反映する。
    // 例：3桁の最初のペア(75)は実際には「100の位」「10の位」を
    // 扱っているので、ブロックの見た目(束・丸)はそのままに、
    // 内部に書く数字だけ "100"/"10" に差し替える。
    var tenUnitExp = (p.tenDigitExponent !== undefined && p.tenDigitExponent !== null) ? p.tenDigitExponent : 1;
    var oneUnitExp = (p.oneDigitExponent !== undefined && p.oneDigitExponent !== null) ? p.oneDigitExponent : 0;
    var tenUnitLabel = String(Math.pow(10, tenUnitExp));
    var oneUnitLabel = String(Math.pow(10, oneUnitExp));

    // 前のラウンドまでに確定した累積ぶん（p.trayAccum）を、トレイ枠の中の
    // 下寄りに小さく常時表示するため、必要な行数からトレイ枠の高さを
    // あらかじめ広げておく（累積ぶんも同じトレイ枠の中に収める）。
    var ACCUM_SCALE = 0.5;
    var ACCUM_COLS = 4;
    var ACCUM_STEP_X = 15;
    var ACCUM_STEP_Y = 13;
    var accumMaxItems = 0;
    if (p.trayAccum) {
      p.trayAccum.forEach(function (personMap) {
        var cnt = 0;
        Object.keys(personMap).forEach(function (k) { cnt += personMap[k]; });
        accumMaxItems = Math.max(accumMaxItems, cnt);
      });
    }
    var accumRows = accumMaxItems > 0 ? Math.ceil(accumMaxItems / ACCUM_COLS) : 0;
    var accumExtraH = accumRows > 0 ? (accumRows * ACCUM_STEP_Y + 10) : 0;
    var trayBoxH = 68 + accumExtraH;

    // --------------------------------------------------
    // 1. 最上部: 計算式
    // --------------------------------------------------
    var gEq = el("g", {});
    gEq.appendChild(bigText(120, 26, dividend, null, {size: 28}));
    gEq.appendChild(bigText(165, 26, "÷", null, {size: 28}));
    gEq.appendChild(bigText(200, 26, divisor, null, {size: 28}));
    gEq.appendChild(bigText(235, 26, "=", null, {size: 28}));

    var targetDigits = p.targetQuotientDigits || 2;
    var qSlot = bigText(285, 26, "?".repeat(targetDigits), "slot-wait", {size: 30, id: "qSlot"});
    gEq.appendChild(qSlot);

    var rSlot = null;
    if(hasRem){
      gEq.appendChild(middleText(345, 26, "あまり", null, {size: 15}));
      rSlot = bigText(390, 26, "?", "slot-wait", {size: 26, id: "rSlot"});
      gEq.appendChild(rSlot);
    }
    ctx.svg.appendChild(gEq);

    // --------------------------------------------------
    // 2. ガイド解説バッジ & サブテキスト
    // --------------------------------------------------
    var gBadge = el("g", {});
    var badgeW = 440;
    var badgeH = 24;
    var badgeX = 230 - badgeW / 2;
    var badgeY = 38;
    var badgeBg = el("rect", {
      x: badgeX, y: badgeY, width: badgeW, height: badgeH, rx: 12,
      fill: "#f1f5f9", stroke: "#cbd5e1", "stroke-width": 1.5
    });
    gBadge.appendChild(badgeBg);
    var badgeTextEl = middleText(230, badgeY + 16, "", null, {size: 11.5, weight: 800});
    gBadge.appendChild(badgeTextEl);
    ctx.svg.appendChild(gBadge);

    var subTextEl = middleText(230, 75, "", null, {size: 13, weight: 800});
    ctx.svg.appendChild(subTextEl);

    // --------------------------------------------------
    // 3. レイヤーコンテナの準備（描画順）
    // --------------------------------------------------
    var gTrays = el("g", {});     // トレイ・受け皿
    var gGhosts = el("g", {});    // 移動元のゴースト点線枠
    var gBoxes = el("g", {});     // 青・オレンジの囲み枠とラベル
    var gUnion = el("g", {});     // 紫の合体枠
    var gBlocks = el("g", {});    // ブロック本体（束・バラ）
    var gEffects = el("g", {});   // スパークルなどの演出

    ctx.svg.appendChild(gTrays);
    ctx.svg.appendChild(gGhosts);
    ctx.svg.appendChild(gBoxes);
    ctx.svg.appendChild(gUnion);
    ctx.svg.appendChild(gBlocks);
    ctx.svg.appendChild(gEffects);

    // --------------------------------------------------
    // 4. トレイ（受け皿）の作成
    // --------------------------------------------------
    // あまりトレイ(幅44)+間隔(12)を先に確保してから、残りの幅でトレイ幅を割り出す。
    // (divisor-1)個ぶんの隙間(trayGap)も先に差し引いてから割ることで、
    // 何人分けでも totalTraysW が availTotalW を超えない（＝あまりトレイとの重なりが起きない）。
    var trayGap = 10;
    var remReserve = hasRem ? 56 : 0; // あまりトレイ幅44 + 手前の隙間12
    var availTotalW = 460 - remReserve;
    var trayW = Math.min(125, Math.floor((availTotalW - (divisor - 1) * trayGap) / divisor));
    var totalTraysW = divisor * trayW + (divisor - 1) * trayGap;
    var traysStartX = Math.round((availTotalW - totalTraysW) / 2);

    var trayBoxes = [];
    var trayPositions = [];
    var trayTenCoords = [];
    var trayOneCoords = [];

    for(var j = 0; j < divisor; j++){
      var curTrayX = traysStartX + j * (trayW + trayGap);
      var curCenterX = curTrayX + Math.round(trayW / 2);
      trayPositions.push({ x: curTrayX, y: 193, w: trayW, h: trayBoxH });

      // 人型アイコン
      var head = el("circle", { cx: curCenterX, cy: 174, r: 5.5, fill: "#2563eb" });
      var body = el("polygon", {
        points: (curCenterX - 2) + ",179 " + (curCenterX + 2) + ",179 " + (curCenterX + 6.5) + ",191 " + (curCenterX - 6.5) + ",191",
        fill: "#2563eb"
      });
      gTrays.appendChild(head);
      gTrays.appendChild(body);

      // トレイ枠（累積ぶんを収める分だけ縦に広げてある）
      var trayBox = el("rect", {
        x: curTrayX, y: 193, width: trayW, height: trayBoxH, rx: 8,
        fill: "#f8fafc", stroke: "#cbd5e1", "stroke-width": 1.5
      });
      gTrays.appendChild(trayBox);
      trayBoxes.push(trayBox);

      // トレイラベル
      var trayLabel = el("text", {
        x: curTrayX + 8, y: 205, fill: "#64748b",
        "font-size": 9.5, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      trayLabel.textContent = (j + 1) + "人目";
      gTrays.appendChild(trayLabel);

      // トレイ内 10の束スロット座標（左側配置）
      var tList = [];
      for(var k = 0; k < q_ten; k++){
        tList.push({
          x: curTrayX + 8,
          y: 211 + k * 21
        });
      }
      trayTenCoords.push(tList);

      // トレイ内 1のブロックスロット座標（右側配置）
      var oList = [];
      var oStartX = (q_ten > 0) ? (curTrayX + 46) : (curTrayX + 10);
      var maxCols3 = (q_ten > 0) ? 4 : 5;
      for(var m = 0; m < q_one; m++){
        oList.push({
          x: oStartX + (m % maxCols3) * 17 + 8,
          y: 214 + Math.floor(m / maxCols3) * 17
        });
      }
      trayOneCoords.push(oList);
    }

    // --------------------------------------------------
    // 3桁以上のわり算で、1つ前までの位ペアで確定した「累積の配布ぶん」を、
    // 各人のトレイ枠の中の下寄りに小さく縮小したアイコンとして常時表示する
    // （トレイ枠自体は上で trayBoxH ぶん縦に広げてある）。今回のラウンド
    // 自体の配布アニメーション(既存のステージ0〜5・trayTenCoords/
    // trayOneCoordsまわり)には一切手を入れていない。
    // --------------------------------------------------
    if (p.trayAccum && p.trayAccum.length && accumRows > 0) {
      var ACCUM_AREA_Y = 193 + 68 + 6; // 既存のトレイ枠(高さ68ぶん)の下、広げた枠内
      var gTrayAccum = el("g", { class: "tray-accum" });
      for (var aj = 0; aj < p.trayAccum.length && aj < trayPositions.length; aj++) {
        var personMap = p.trayAccum[aj];
        var items = [];
        Object.keys(personMap).sort(function (a, b) { return b - a; }).forEach(function (expKey) {
          var cnt = personMap[expKey];
          for (var ci = 0; ci < cnt; ci++) items.push(parseInt(expKey, 10));
        });
        if (!items.length) continue;
        var accumBaseX = trayPositions[aj].x + 5;
        for (var ii = 0; ii < items.length; ii++) {
          var unit = PLACE_VALUE_UNITS[items[ii]] || PLACE_VALUE_UNITS[2];
          var accObj = unit.create(String(Math.pow(10, items[ii])));
          var accCol = ii % ACCUM_COLS;
          var accRow = Math.floor(ii / ACCUM_COLS);
          var accX = accumBaseX + accCol * ACCUM_STEP_X;
          var accY = ACCUM_AREA_Y + accRow * ACCUM_STEP_Y;
          accObj.g.setAttribute("transform", "translate(" + accX + "," + accY + ") scale(" + ACCUM_SCALE + ")");
          gTrayAccum.appendChild(accObj.g);
        }
      }
      ctx.svg.appendChild(gTrayAccum);
    }
    // トレイ枠を広げた分、必要ならキャンバスの縦幅も広げる。
    if (trayBoxH > 68) {
      var neededH = 193 + trayBoxH + 14;
      if (neededH > 275) ctx.svg.setAttribute("viewBox", "0 0 460 " + neededH);
    }

    // 余りトレイ（余りがある場合）
    var remTrayX = traysStartX + totalTraysW + 12;
    if(hasRem){
      var rTrayBox = el("rect", {
        x: remTrayX, y: 193, width: 44, height: trayBoxH, rx: 8,
        fill: "#fff1f2", stroke: "#fda4af", "stroke-width": 1.5
      });
      gTrays.appendChild(rTrayBox);

      var rTrayLabel = el("text", {
        x: remTrayX + 22, y: 205, "text-anchor": "middle",
        fill: "#e11d48", "font-size": 9.5, "font-weight": 800,
        "font-family": "'M PLUS Rounded 1c', sans-serif"
      });
      rTrayLabel.textContent = "あまり";
      gTrays.appendChild(rTrayLabel);
    }

    // 1人分の持ち分合計＆最終まとめ（Stage 4, 5で中央に表示）
    var stage4SummaryG = el("g", { style: "display: none;" });
    var s4Txt1 = middleText(230, 114, "", "slot-orange", {size: 13.5, weight: 800});
    var s4Txt2 = middleText(230, 138, "", null, {size: 12.5});
    stage4SummaryG.appendChild(s4Txt1);
    stage4SummaryG.appendChild(s4Txt2);
    ctx.svg.appendChild(stage4SummaryG);

    var stage5SummaryG = el("g", { style: "display: none;" });
    var s5Txt1 = middleText(230, 114, "", "slot-orange", {size: 15.5, weight: 800});
    var s5Txt2 = middleText(230, 138, "", null, {size: 13});
    stage5SummaryG.appendChild(s5Txt1);
    stage5SummaryG.appendChild(s5Txt2);
    ctx.svg.appendChild(stage5SummaryG);

    // --------------------------------------------------
    // 5. 座標計算（初期配置・解体配置）
    // --------------------------------------------------
    // 上部初期座標（Stage 0）
    var initStartX = 230 - Math.round((tenDigit * 38 + oneDigit * 18 + 16) / 2);
    var initTenCoords = [];
    for(var b = 0; b < tenDigit; b++){
      initTenCoords.push({ x: initStartX + b * 38, y: 104 });
    }
    var oneInitX = initStartX + tenDigit * 38 + 14;
    var initOneCoords = [];
    for(var o = 0; o < oneDigit; o++){
      initOneCoords.push({ x: oneInitX + o * 18 + 8, y: 113 });
    }

    // --------------------------------------------------
    // 4.5 プレビュー：3桁以上のわり算の最初の一歩で、まだこの回では
    // 使わない残りの桁（例：804÷4の最初の80÷4なら「4」）を、
    // Stage 0（はじめの数）の画面だけ、うっすら・点線で右側に見せておく。
    // 「804がまるごとここにある」ことを実感してもらうためのもので、
    // Stage 1以降は（実際の計算にまだ関係しないので）非表示にする。
    // --------------------------------------------------
    var previewDigits = p.previewDigits || [];
    var gPreview = el("g", { style: "display: none;" });
    if(previewDigits.length){
      var lastBundleEndX = (tenDigit > 0) ? (initTenCoords[tenDigit - 1].x + 34) : null;
      var lastOneEndX = (oneDigit > 0) ? (initOneCoords[oneDigit - 1].x + 15) : null;
      var previewStartX = Math.max(lastBundleEndX || 0, lastOneEndX || 0, oneInitX) + 16;
      var previewTotalW = previewDigits.length * 30 - 4;

      if(previewStartX + previewTotalW <= 448){
        // 同じ行の右側にそのまま収まる場合：縦の点線区切り
        var dividerX = previewStartX - 8;
        gPreview.appendChild(el("line", {
          x1: dividerX, y1: 90, x2: dividerX, y2: 122,
          stroke: "#cbd5e1", "stroke-width": 1.5, "stroke-dasharray": "3,3"
        }));
        var previewCenterX = previewStartX + Math.max(0, previewDigits.length - 1) * 15 + 13;
        gPreview.appendChild(middleText(previewCenterX, 90, "つぎに使う数", null,
          {size: 8, weight: 800, fill: "#94a3b8"}));
        previewDigits.forEach(function(dch, di){
          var bx = previewStartX + di * 30;
          gPreview.appendChild(el("rect", {
            x: bx, y: 100, width: 26, height: 19, rx: 4,
            fill: "#f1f5f9", stroke: "#94a3b8", "stroke-width": 1.3,
            "stroke-dasharray": "3,2", opacity: 0.75
          }));
          gPreview.appendChild(middleText(bx + 13, 110, dch, null,
            {size: 11, weight: 800, fill: "#64748b", opacity: 0.9}));
        });
      } else {
        // 横に入りきらない場合：初期ブロックの下の余白（Stage0でしか
        // 使われない行）に、点線で区切って2段目として見せる。
        var rowY = 140;
        var wrapStartX = 230 - Math.round(previewTotalW / 2);
        gPreview.appendChild(el("line", {
          x1: 90, y1: rowY - 12, x2: 370, y2: rowY - 12,
          stroke: "#cbd5e1", "stroke-width": 1.5, "stroke-dasharray": "3,3"
        }));
        gPreview.appendChild(middleText(230, rowY - 20, "つぎに使う数", null,
          {size: 8, weight: 800, fill: "#94a3b8"}));
        previewDigits.forEach(function(dch, di){
          var bx = wrapStartX + di * 30;
          gPreview.appendChild(el("rect", {
            x: bx, y: rowY - 9, width: 26, height: 19, rx: 4,
            fill: "#f1f5f9", stroke: "#94a3b8", "stroke-width": 1.3,
            "stroke-dasharray": "3,2", opacity: 0.75
          }));
          gPreview.appendChild(middleText(bx + 13, rowY + 1, dch, null,
            {size: 11, weight: 800, fill: "#64748b", opacity: 0.9}));
        });
      }
    }
    ctx.svg.appendChild(gPreview);

    // Stage 2 の解体・合体座標
    var unbundledCount = tenRem * 10;
    var tenCols = (tenRem >= 2) ? 10 : 5;
    var tenRows = Math.max(1, Math.ceil(unbundledCount / tenCols));
    var oneCols = Math.max(1, Math.min(5, oneDigit));
    var tenWidth = (unbundledCount > 0) ? (tenCols * 17) : 0;
    var plusWidth = (unbundledCount > 0 && oneDigit > 0) ? 26 : 0;
    var oneWidth = (oneDigit > 0) ? (oneCols * 17) : 10;
    var eqWidth = 84;
    var totalWorkW = (unbundledCount > 0 ? (tenWidth + plusWidth) : 0) + oneWidth + eqWidth;
    var workStartX = Math.max(16, 230 - Math.round(totalWorkW / 2));
    var tenBlkX = workStartX;
    var tenBlkY = 96;
    var commonLabelY = tenBlkY + tenRows * 17 + 9;

    var burstOneCoords = [];
    for(var tk = 0; tk < unbundledCount; tk++){
      var tcol = tk % tenCols;
      var trow = Math.floor(tk / tenCols);
      burstOneCoords.push({
        x: tenBlkX + tcol * 17 + 8,
        y: tenBlkY + trow * 17
      });
    }

    var plusX = tenBlkX + tenWidth + 14;
    var oneBlkX = (unbundledCount > 0) ? (plusX + 18) : workStartX;
    var mergedOneCoords = [];
    for(var om = 0; om < oneDigit; om++){
      mergedOneCoords.push({
        x: oneBlkX + (om % 5) * 17 + 8,
        y: tenBlkY + Math.floor(om / 5) * 17
      });
    }

    // --------------------------------------------------
    // 6. ブロック生成（10の束たち・1のブロックたち）
    // createBundleEl/createOneEl/createHundredEl はモジュール直下の
    // トップレベル関数（このファイル内で「フルリビール演出」からも
    // 単独で呼び出すため、initLevel4Scene のクロージャの外に定義している）
    // --------------------------------------------------
    var bundles = [];
    for(var bi = 0; bi < tenDigit; bi++){
      var bObj = createBundleEl(tenUnitLabel);
      moveEl(bObj.g, initTenCoords[bi].x, initTenCoords[bi].y, false);
      gBlocks.appendChild(bObj.g);
      var isRemB = (bi >= divisor * q_ten);
      bundles.push({
        obj: bObj,
        initX: initTenCoords[bi].x,
        initY: initTenCoords[bi].y,
        isRem: isRemB,
        assignedPerson: isRemB ? -1 : (bi % divisor),
        assignedIndex: isRemB ? -1 : Math.floor(bi / divisor)
      });
    }

    // もとの1のブロックたち
    var initialOnes = [];
    for(var oi = 0; oi < oneDigit; oi++){
      var oObj = createOneEl(oneUnitLabel);
      moveEl(oObj.g, initOneCoords[oi].x, initOneCoords[oi].y, false);
      gBlocks.appendChild(oObj.g);
      initialOnes.push({
        obj: oObj,
        initX: initOneCoords[oi].x,
        initY: initOneCoords[oi].y,
        mergedX: mergedOneCoords[oi].x,
        mergedY: mergedOneCoords[oi].y
      });
    }

    // バラして生まれる1のブロックたち（初期は非表示）
    var burstOnes = [];
    for(var bti = 0; bti < unbundledCount; bti++){
      var burstObj = createOneEl(oneUnitLabel);
      moveEl(burstObj.g, burstOneCoords[bti].x, burstOneCoords[bti].y, false);
      burstObj.g.style.opacity = "0";
      burstObj.g.style.display = "none";
      gBlocks.appendChild(burstObj.g);
      burstOnes.push({
        obj: burstObj,
        burstX: burstOneCoords[bti].x,
        burstY: burstOneCoords[bti].y
      });
    }

    // 全ての1のブロックリスト（Stage 3の配分用: burstOnes + initialOnes）
    var allWorkOnes = [];
    for(var ai1 = 0; ai1 < burstOnes.length; ai1++){
      allWorkOnes.push({
        obj: burstOnes[ai1].obj,
        currX: burstOnes[ai1].burstX,
        currY: burstOnes[ai1].burstY
      });
    }
    for(var ai2 = 0; ai2 < initialOnes.length; ai2++){
      allWorkOnes.push({
        obj: initialOnes[ai2].obj,
        currX: isUnbundle ? initialOnes[ai2].mergedX : initialOnes[ai2].initX,
        currY: isUnbundle ? initialOnes[ai2].mergedY : initialOnes[ai2].initY
      });
    }
    for(var wi = 0; wi < allWorkOnes.length; wi++){
      var isRemW = (wi >= divisor * q_one);
      allWorkOnes[wi].isRem = isRemW;
      allWorkOnes[wi].assignedPerson = isRemW ? -1 : (wi % divisor);
      allWorkOnes[wi].assignedIndex = isRemW ? -1 : Math.floor(wi / divisor);
    }

    // --------------------------------------------------
    // 7. Stage 2 合体ラベル・紫枠
    // --------------------------------------------------
    var unbundleEqG = el("g", { style: "display: none; opacity: 0;" });
    if(isUnbundle){
      var unionBox = el("rect", {
        x: workStartX - 8, y: tenBlkY - 14,
        width: totalWorkW + 16, height: (commonLabelY - tenBlkY + 22),
        rx: 8, class: "group-box-purple"
      });
      unbundleEqG.appendChild(unionBox);

      var blockCenterY = tenBlkY + Math.floor((tenRows * 17) / 2);
      var tenLabel = middleText(tenBlkX + tenWidth / 2, commonLabelY, "バラした " + unbundledCount + "個", "slot-orange", {size: 10.5, weight: 800});
      unbundleEqG.appendChild(tenLabel);
      var plusTxt = middleText(plusX, blockCenterY, "＋", "slot-orange", {size: 18, weight: 800});
      unbundleEqG.appendChild(plusTxt);
      var oneLabel = middleText(oneBlkX + oneWidth / 2, commonLabelY, "もとの " + oneDigit + "個", null, {size: 10.5, weight: 800});
      unbundleEqG.appendChild(oneLabel);
      var eqTotalTxt = middleText(oneBlkX + oneWidth + 42, blockCenterY, "＝ " + unbundlePart + "個！", "slot-orange", {size: 17, weight: 800});
      unbundleEqG.appendChild(eqTotalTxt);
    }
    gUnion.appendChild(unbundleEqG);

    // 余った束のアラートバッジ（Stage 1用）
    var alertBadgeG = el("g", { style: "display: none; opacity: 0;" });
    var alertW = 200;
    var alertBg = el("rect", {
      x: 230 - alertW / 2, y: 134, width: alertW, height: 24, rx: 12,
      fill: "#fff7ed", stroke: "#f97316", "stroke-width": 1.5
    });
    alertBadgeG.appendChild(alertBg);
    alertBadgeG.appendChild(middleText(230, 150, "⚠️ " + tenRem + "束あまった！（分けられない）", "slot-orange", {size: 11, weight: 800}));
    ctx.svg.appendChild(alertBadgeG);

    // 十の位「かける」「ひく」専用の式バッジ（筆算モードのみ使用。role="first"のとき差し替える）
    var tensOpBadgeG = el("g", { style: "display: none; opacity: 0;" });
    var tensOpW = 220;
    var tensOpBg = el("rect", {
      x: 230 - tensOpW / 2, y: 132, width: tensOpW, height: 26, rx: 13,
      fill: "#fff7ed", stroke: "#f97316", "stroke-width": 1.5
    });
    tensOpBadgeG.appendChild(tensOpBg);
    var tensOpTxt = middleText(230, 149, "", "slot-orange", {size: 11, weight: 800});
    tensOpBadgeG.appendChild(tensOpTxt);
    ctx.svg.appendChild(tensOpBadgeG);

    ctx.scene = {
      problemKey: p.dividend + "-" + p.divisor + "-" + (p.remainder || 0),
      p: p,
      divisor: divisor,
      dividend: dividend,
      tenDigit: tenDigit,
      oneDigit: oneDigit,
      tenRem: tenRem,
      q_ten: q_ten,
      unbundlePart: unbundlePart,
      q_one: q_one,
      isUnbundle: isUnbundle,
      hasRem: hasRem,
      tenUnitLabel: tenUnitLabel,
      oneUnitLabel: oneUnitLabel,
      tenUnitExp: tenUnitExp,
      oneUnitExp: oneUnitExp,
      // elements
      qSlot: qSlot,
      rSlot: rSlot,
      badgeBg: badgeBg,
      badgeTextEl: badgeTextEl,
      subTextEl: subTextEl,
      trayBoxes: trayBoxes,
      stage4SummaryG: stage4SummaryG,
      s4Txt1: s4Txt1,
      s4Txt2: s4Txt2,
      stage5SummaryG: stage5SummaryG,
      s5Txt1: s5Txt1,
      s5Txt2: s5Txt2,
      gGhosts: gGhosts,
      gBoxes: gBoxes,
      gEffects: gEffects,
      alertBadgeG: alertBadgeG,
      tensOpBadgeG: tensOpBadgeG,
      tensOpBg: tensOpBg,
      tensOpTxt: tensOpTxt,
      unbundleEqG: unbundleEqG,
      bundles: bundles,
      initialOnes: initialOnes,
      burstOnes: burstOnes,
      allWorkOnes: allWorkOnes,
      trayPositions: trayPositions,
      trayTenCoords: trayTenCoords,
      trayOneCoords: trayOneCoords,
      initTenCoords: initTenCoords,
      initOneCoords: initOneCoords,
      remTrayX: remTrayX,
      totalTraysW: totalTraysW,
      traysStartX: traysStartX,
      tenBlkX: tenBlkX,
      tenBlkY: tenBlkY,
      tenWidth: tenWidth,
      tenRows: tenRows,
      gPreview: gPreview,
      hasPreview: previewDigits.length > 0
    };
  }

  function renderLevel4(ctx, forward){
    clearCtxTimers(ctx);
    var p = ctx.getProblem();
    var stage = ctx.getStage();
    var expectedKey = p.dividend + "-" + p.divisor + "-" + (p.remainder || 0);

    // シーンが存在しない、または別の問題になった場合は初期化
    if(!ctx.scene || ctx.scene.problemKey !== expectedKey){
      initLevel4Scene(ctx, p);
    }

    var sc = ctx.scene;
    var divisor = sc.divisor;
    var dividend = sc.dividend;
    var tenDigit = sc.tenDigit;
    var oneDigit = sc.oneDigit;
    var tenRem = sc.tenRem;
    var q_ten = sc.q_ten;
    var unbundlePart = sc.unbundlePart;
    var q_one = sc.q_one;
    var isUnbundle = sc.isUnbundle;
    var tenUnitLabel = sc.tenUnitLabel || "10";
    var oneUnitLabel = sc.oneUnitLabel || "1";
    var tenUnitExp = sc.tenUnitExp || 0;
    var oneUnitExp = sc.oneUnitExp || 0;
    var tenWord = tenUnitLabel + "の束";
    var oneWord = oneUnitLabel + "のブロック";
    // 100の位・10の位など、この束/ブロックが表す本当の値のときだけ、
    // 「じつは750のことだよ」のような実際の値の補足を一言添える。
    function realHint(val, exp) {
      if (!exp) return "";
      return "（じつは " + (val * Math.pow(10, exp)) + " のことだよ）";
    }
    function placeName(exp) {
      if (exp >= 2) return "百の位";
      if (exp === 1) return "十の位";
      return "一の位";
    }

    // ガイドテキストの設定
    var guideTxt = "";
    if(stage === 0){
      guideTxt = placeName(tenUnitExp) + "（" + tenWord + "）から じゅんばんに 分けていこう！";
    } else if(stage === 1){
      var __role1 = ctx.getGroupRole();
      var __phase1 = ctx.getPhase();
      if(__role1 === "first" && __phase1 === "multiply"){
        guideTxt = "② かける： " + divisor + "×" + q_ten + "＝" + (divisor * q_ten) + "束 くばった！";
      } else if(__role1 === "first" && __phase1 === "subtract"){
        guideTxt = isUnbundle
          ? "③ ひく： " + tenDigit + "－" + (divisor * q_ten) + "＝" + tenRem + "束 のこった（あまり）"
          : "③ ひく： " + tenDigit + "－" + (divisor * q_ten) + "＝0（ぴったり！）";
      } else {
        guideTxt = isUnbundle
          ? "① " + tenWord + " " + tenDigit + "つを " + divisor + "人に分けると… 1人" + q_ten + "束で " + tenRem + "束あまる！" + realHint(tenDigit, tenUnitExp)
          : "① " + tenWord + " " + tenDigit + "つを " + divisor + "人に分けると… 1人" + q_ten + "束！" + realHint(tenDigit, tenUnitExp);
      }
    } else if(stage === 2){
      guideTxt = isUnbundle
        ? "② あまった " + tenRem + "束を チャリーンとバラして " + (tenRem * 10) + "個＋" + oneDigit + "個＝" + unbundlePart + "個！"
        : "② " + tenWord + "はきれいに分かれたね！つぎは " + oneWord + " " + oneDigit + "個 を分けるよ！";
    } else if(stage === 3){
      guideTxt = "③ " + oneWord + " " + unbundlePart + "個 を " + divisor + "人に分けると… 1人" + q_one + "個" + (p.remainder > 0 ? "（あまり " + p.remainder + "個）" : "！") + realHint(unbundlePart, oneUnitExp);
    } else if(stage === 4){
      guideTxt = "④ 1人分は " + tenWord + q_ten + "つ（" + (q_ten * 10) + "）と 1が" + q_one + "個で… " + p.quotient + "！";
    } else {
      guideTxt = "⑤ だから 答えは " + p.quotient + (p.remainder > 0 ? " あまり " + p.remainder : "") + " ！" + realHint(p.quotient, oneUnitExp);
    }

    sc.badgeBg.setAttribute("fill", (stage === 2 && isUnbundle) ? "#fef3c7" : "#f1f5f9");
    sc.badgeBg.setAttribute("stroke", (stage === 2 && isUnbundle) ? "#f59e0b" : "#cbd5e1");
    sc.badgeTextEl.textContent = guideTxt;
    var guideSz = calcSvgFontSize(guideTxt, 420, 13, 10.5);
    sc.badgeTextEl.setAttribute("font-size", guideSz);
    sc.badgeTextEl.setAttribute("class", (stage === 2 && isUnbundle) ? "slot-orange" : "");

    // スロット状態
    var targetDigits = p.targetQuotientDigits || 2;
    var slotTxt = (stage >= 5) ? p.quotient : (ctx.getInputDigits().length ? ctx.getInputDigits() : "?".repeat(targetDigits));
    var slotCls = (stage >= 5) ? "slot-orange pop" : (ctx.getInputDigits().length ? "slot-blue" : "slot-wait");
    sc.qSlot.textContent = slotTxt;
    sc.qSlot.setAttribute("class", slotCls);

    if(sc.rSlot && p.hasRemainder){
      var rTxt = (stage >= 5) ? p.remainder : (ctx.getInputRemainder().length ? ctx.getInputRemainder() : "?");
      var rCls = (stage >= 5) ? "slot-orange pop" : (ctx.getInputRemainder().length ? "slot-blue" : "slot-wait");
      sc.rSlot.textContent = rTxt;
      sc.rSlot.setAttribute("class", rCls);
    }

    // トレイとサマリーの初期化
    sc.trayBoxes.forEach(function(box, i){
      var isFocus = (stage >= 4 && i === 0);
      box.setAttribute("fill", isFocus ? "#fff7ed" : "#f8fafc");
      box.setAttribute("stroke", isFocus ? "#ea580c" : "#cbd5e1");
      box.setAttribute("stroke-width", isFocus ? "2.5" : "1.5");
      box.setAttribute("class", isFocus ? "highlight-dish" : "");
    });
    sc.stage4SummaryG.style.display = (stage === 4) ? "block" : "none";
    sc.stage5SummaryG.style.display = (stage >= 5) ? "block" : "none";

    // 囲み枠・エフェクトのクリア
    sc.gGhosts.innerHTML = "";
    sc.gBoxes.innerHTML = "";
    sc.gEffects.innerHTML = "";
    sc.alertBadgeG.style.display = "none";
    sc.alertBadgeG.style.opacity = "0";
    sc.tensOpBadgeG.style.display = "none";
    sc.tensOpBadgeG.style.opacity = "0";
    sc.unbundleEqG.style.display = "none";
    sc.unbundleEqG.style.opacity = "0";
    // プレビュー（まだ登場していない残りの桁）は、Stage 0（はじめの数）のときだけ見せる
    sc.gPreview.style.display = (stage === 0 && sc.hasPreview) ? "block" : "none";

    // ==================================================
    // STAGE 0: はじめの数
    // ==================================================
    if(stage === 0){
      sc.subTextEl.textContent = "はじめの数 " + dividend + "（" + tenWord + "が" + tenDigit + "つ、" + oneWord + "が" + oneDigit + "個）";
      sc.subTextEl.setAttribute("class", "");

      // 10の束を上部初期位置にセット
      sc.bundles.forEach(function(b){
        b.obj.g.style.display = "block";
        b.obj.g.style.opacity = "1";
        b.obj.r.setAttribute("fill", "#e0f2fe");
        b.obj.r.setAttribute("stroke", "#0284c7");
        b.obj.r.setAttribute("stroke-width", "1.5");
        b.obj.t.setAttribute("fill", "#0369a1");
        b.obj.inner.classList.remove("ten-rem-pulse");
        b.obj.inner.classList.remove("bundle-burst");
        moveEl(b.obj.g, b.initX, b.initY, false);
      });

      // もとの1のブロックを上部初期位置にセット
      sc.initialOnes.forEach(function(o){
        o.obj.g.style.display = "block";
        o.obj.g.style.opacity = "1";
        o.obj.c.setAttribute("stroke", "#f59e0b");
        o.obj.t.setAttribute("fill", "#b45309");
        o.obj.inner.classList.remove("block-drop-in");
        moveEl(o.obj.g, o.initX, o.initY, false);
      });

      // バラしブロックは非表示
      sc.burstOnes.forEach(function(bo){
        bo.obj.g.style.display = "none";
        bo.obj.g.style.opacity = "0";
        bo.obj.inner.classList.remove("block-drop-in");
      });
    }

    // ==================================================
    // STAGE 1: 10の束を分ける（囲む ➔ スーッと移動 ➔ あまり強調）
    // ==================================================
    else if(stage === 1){
      var groupRole1 = ctx.getGroupRole();
      var phase1 = ctx.getPhase();
      if(groupRole1 === "first"){
        // 筆算モード：十の位だけの一桁計算に帰着させて見せる（例：8÷4＝2（80÷4＝20、100の位なら800÷4＝200））
        var tenScale = Math.pow(10, tenUnitExp);
        if(phase1 === "multiply"){
          sc.subTextEl.textContent = "かける： " + divisor + "×" + q_ten + "＝" + (divisor * q_ten) + "束" +
            (tenUnitExp ? "（" + (divisor * tenScale) + "×" + q_ten + "＝" + (divisor * q_ten * tenScale) + "）" : "");
        } else if(phase1 === "subtract"){
          sc.subTextEl.textContent = "ひく： " + tenDigit + "束－" + (divisor * q_ten) + "束＝" +
            (isUnbundle ? tenRem + "束（これがあまり）" : "0（ぴったり！）") +
            (tenUnitExp ? "（" + (tenDigit * tenScale) + "－" + (divisor * q_ten * tenScale) + "＝" + (tenRem * tenScale) + "）" : "");
        } else {
          sc.subTextEl.textContent = tenDigit + "÷" + divisor + "＝" + q_ten +
            "（" + (tenDigit * tenScale) + "÷" + divisor + "＝" + (q_ten * tenScale) + "）" +
            (isUnbundle ? "　あまり" + tenRem + "束" : "");
        }
      } else {
        sc.subTextEl.textContent = isUnbundle
          ? tenWord + "のわり算： " + tenDigit + "束 ÷ " + divisor + " ＝ 1人 " + q_ten + "束 （あまり " + tenRem + "束）"
          : tenWord + "のわり算： " + tenDigit + "束 ÷ " + divisor + " ＝ 1人 " + q_ten + "束（ぴったり！）";
      }
      sc.subTextEl.setAttribute("class", "slot-orange");

      // もとの1のブロックは初期位置のまま
      sc.initialOnes.forEach(function(o){
        o.obj.g.style.display = "block";
        o.obj.g.style.opacity = "1";
        o.obj.c.setAttribute("stroke", "#f59e0b");
        o.obj.t.setAttribute("fill", "#b45309");
        o.obj.inner.classList.remove("block-drop-in");
        moveEl(o.obj.g, o.initX, o.initY, false);
      });

      // バラしブロックは非表示
      sc.burstOnes.forEach(function(bo){
        bo.obj.g.style.display = "none";
        bo.obj.g.style.opacity = "0";
        bo.obj.inner.classList.remove("block-drop-in");
      });

      if(forward){
        // 【初期位置に整列】
        sc.bundles.forEach(function(b){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          b.obj.r.setAttribute("fill", "#e0f2fe");
          b.obj.r.setAttribute("stroke", "#0284c7");
          b.obj.r.setAttribute("stroke-width", "1.5");
          b.obj.t.setAttribute("fill", "#0369a1");
          b.obj.inner.classList.remove("ten-rem-pulse");
          b.obj.inner.classList.remove("bundle-burst");
          moveEl(b.obj.g, b.initX, b.initY, false);
        });

        var stepDelay = 90;
        var moveWait = 320;
        var moveDuration = 550;
        var roundDuration = moveWait + divisor * stepDelay + 300;

        // 各ラウンドの実行（1回目 divisor個、2回目 divisor個...）
        for(var rnd = 0; rnd < q_ten; rnd++){
          (function(r){
            var rStartTime = r * roundDuration;

            // 1. 囲み枠の表示（予告。ゴーストは1個ずつ動く瞬間に個別生成する）
            ctx.timers.push(setTimeout(function(){
              var firstIdx = r * divisor;
              var lastIdx = (r + 1) * divisor - 1;
              var bx = sc.initTenCoords[firstIdx].x - 4;
              var by = sc.initTenCoords[firstIdx].y - 4;
              var bw = (sc.initTenCoords[lastIdx].x + 34 + 4) - bx;
              var bh = 19 + 8;

              // 青い点線囲み枠
              var bBoxG = el("g", {});
              var bRect = el("rect", {
                x: bx, y: by, width: bw, height: bh, rx: 6, class: "group-box-blue"
              });
              var bTag = el("text", {
                x: bx + 6, y: by - 3, fill: "#2563eb",
                "font-size": 9.5, "font-weight": 800,
                "font-family": "'M PLUS Rounded 1c', sans-serif"
              });
              bTag.textContent = (r + 1) + "回目（1束ずつ）";
              bBoxG.appendChild(bRect);
              bBoxG.appendChild(bTag);
              sc.gBoxes.appendChild(bBoxG);

              // 2. moveWait 後に各人へ1束ずつディレイをかけて移動
              ctx.timers.push(setTimeout(function(){
                bBoxG.style.transition = "opacity 0.25s ease";
                bBoxG.style.opacity = "0";

                for(var j = 0; j < divisor; j++){
                  (function(personIdx){
                    ctx.timers.push(setTimeout(function(){
                      var bIdx = r * divisor + personIdx;
                      var b = sc.bundles[bIdx];
                      var target = sc.trayTenCoords[personIdx][r];

                      // 動き出す瞬間に、束1個ぶんのゴーストをもといた場所に残す
                      var gIx = sc.initTenCoords[bIdx].x - 4;
                      var gIy = sc.initTenCoords[bIdx].y - 4;
                      var gGhostItem = el("rect", {
                        x: gIx, y: gIy, width: 42, height: 27, rx: 6, class: "ghost-box"
                      });
                      sc.gGhosts.appendChild(gGhostItem);

                      moveEl(b.obj.g, target.x, target.y, true, moveDuration, 0);
                      playSound('step');
                    }, personIdx * stepDelay));
                  })(j);
                }
              }, moveWait));
            }, rStartTime));
          })(rnd);
        }

        // 全ラウンド完了後に、余った束があれば強調
        // （筆算モードのrole="first"では、あまりの強調は「ひく」の回に譲る）
        if(isUnbundle && groupRole1 !== "first"){
          var totalRoundsTime = q_ten * roundDuration;
          ctx.timers.push(setTimeout(function(){
            sc.bundles.forEach(function(b){
              if(b.isRem){
                b.obj.inner.classList.add("ten-rem-pulse");
                b.obj.r.setAttribute("fill", "#ffedd5");
                b.obj.r.setAttribute("stroke", "#ea580c");
                b.obj.r.setAttribute("stroke-width", "2.5");
                b.obj.t.setAttribute("fill", "#c2410c");
              }
            });
            sc.alertBadgeG.style.display = "block";
            sc.alertBadgeG.style.transition = "opacity 0.3s ease";
            sc.alertBadgeG.style.opacity = "1";
            sc.alertBadgeG.classList.add("pop");
          }, Math.max(0, totalRoundsTime + 100)));
        }
      } else {
        // 戻る操作（即時確定表示）：動いた束の数だけ、1個ずつゴーストを置く
        for(var bIdxBack = 0; bIdxBack < q_ten * divisor; bIdxBack++){
          var gIxB = sc.initTenCoords[bIdxBack].x - 4;
          var gIyB = sc.initTenCoords[bIdxBack].y - 4;
          var gGhostB = el("rect", {
            x: gIxB, y: gIyB, width: 42, height: 27, rx: 6, class: "ghost-box"
          });
          sc.gGhosts.appendChild(gGhostB);
        }

        var isTensOpView = (groupRole1 === "first" && (phase1 === "multiply" || phase1 === "subtract"));
        sc.bundles.forEach(function(b){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          b.obj.inner.classList.remove("bundle-burst");
          b.obj.inner.classList.remove("ten-rem-pulse");
          b.obj.inner.classList.remove("ten-multiply-pulse");
          if(!b.isRem){
            var targetB = sc.trayTenCoords[b.assignedPerson][b.assignedIndex];
            moveEl(b.obj.g, targetB.x, targetB.y, false);
            if(isTensOpView && phase1 === "multiply"){
              // かける：配った束（divisor×q_ten個ぶん）を緑で強調
              b.obj.r.setAttribute("fill", "#dcfce7");
              b.obj.r.setAttribute("stroke", "#16a34a");
              b.obj.r.setAttribute("stroke-width", "2.5");
              b.obj.t.setAttribute("fill", "#15803d");
              b.obj.inner.classList.add("ten-multiply-pulse");
            } else {
              b.obj.r.setAttribute("fill", "#e0f2fe");
              b.obj.r.setAttribute("stroke", "#0284c7");
              b.obj.r.setAttribute("stroke-width", "1.5");
              b.obj.t.setAttribute("fill", "#0369a1");
            }
          } else {
            moveEl(b.obj.g, b.initX, b.initY, false);
            if(isUnbundle){
              b.obj.inner.classList.add("ten-rem-pulse");
              b.obj.r.setAttribute("fill", "#ffedd5");
              b.obj.r.setAttribute("stroke", "#ea580c");
              b.obj.r.setAttribute("stroke-width", "2.5");
              b.obj.t.setAttribute("fill", "#c2410c");
            }
          }
        });
        if(isTensOpView){
          // 十の位の「かける」「ひく」専用バッジ：数字だけでなく式全体を明示する
          sc.tensOpTxt.textContent = (phase1 === "multiply")
            ? divisor + "×" + q_ten + "＝" + (divisor * q_ten) + "束　くばった！"
            : (isUnbundle
                ? tenDigit + "－" + (divisor * q_ten) + "＝" + tenRem + "束　あまった！"
                : tenDigit + "－" + (divisor * q_ten) + "＝0　ぴったり！");
          sc.tensOpBadgeG.style.display = "block";
          sc.tensOpBadgeG.style.opacity = "1";

          if(phase1 === "subtract"){
            // ひく：もとの十の位（ゴースト＋あまりの束）があった場所を
            // 赤い点線で囲み、「ここから ひかれた」ことを見せる
            var subtractBoxesTen = sc.initTenCoords.map(function(c){
              return { x: c.x - 4, y: c.y - 4, w: 42, h: 27 };
            });
            frameAroundBoxes(sc, subtractBoxesTen, 5, "ここから ひくよ");
          }
        } else if(isUnbundle){
          sc.alertBadgeG.style.display = "block";
          sc.alertBadgeG.style.opacity = "1";
        }
      }
    }

    // ==================================================
    // STAGE 2: 余った束をチャリーンと解体 ＆ もとのブロックがスーッと寄って合体！
    // ==================================================
    else if(stage === 2){
      // トレイの束はトレイ内確定位置
      sc.bundles.forEach(function(b){
        if(!b.isRem){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          var targetB2 = sc.trayTenCoords[b.assignedPerson][b.assignedIndex];
          moveEl(b.obj.g, targetB2.x, targetB2.y, false);
        }
      });

      if(isUnbundle){
        sc.subTextEl.textContent = "あまった" + tenWord + "を バラすと… " + (tenRem * 10) + "個の" + oneWord + "に変身！";
        sc.subTextEl.setAttribute("class", "slot-orange");

        // 余った束が解体される位置（バラしブロック群の中央）
        var remTargetX = sc.tenBlkX + Math.round((sc.tenWidth - 34) / 2);
        var remTargetY = sc.tenBlkY + Math.round((sc.tenRows * 17 - 19) / 2);

        if(forward){
          // 【ステップ2-A: 余った束がスーッと解体位置へスライド】
          sc.bundles.forEach(function(b){
            if(b.isRem){
              b.obj.inner.classList.remove("ten-rem-pulse");
              moveEl(b.obj.g, remTargetX, remTargetY, true, 300, 0);
            }
          });

          // 【ステップ2-B: 300ms後にチャリーン！と弾けて10個のブロックが出現】
          ctx.timers.push(setTimeout(function(){
            playSound('chariin');

            sc.bundles.forEach(function(b){
              if(b.isRem){
                b.obj.inner.classList.add("bundle-burst");
                setTimeout(function(){
                  b.obj.g.style.display = "none";
                  b.obj.g.style.opacity = "0";
                }, 400);
              }
            });

            // キラキラスパークル生成
            var spCx = remTargetX + 17;
            var spCy = remTargetY + 9.5;
            function addSparkle(cx, cy, color, delay, trans) {
              var spG = el("g", { class: "sparkle-particle" });
              spG.style.setProperty("--spark-trans", trans);
              spG.style.animationDelay = delay + "s";
              var path = el("path", {
                d: "M " + cx + " " + (cy - 8) + " Q " + cx + " " + cy + " " + (cx + 8) + " " + cy + " Q " + cx + " " + cy + " " + cx + " " + (cy + 8) + " Q " + cx + " " + cy + " " + (cx - 8) + " " + cy + " Z",
                fill: color
              });
              spG.appendChild(path);
              sc.gEffects.appendChild(spG);
            }
            addSparkle(spCx, spCy, "#f59e0b", 0, "translate(24px, -20px) scale(0)");
            addSparkle(spCx, spCy, "#fbbf24", 0.05, "translate(-26px, -18px) scale(0)");
            addSparkle(spCx, spCy, "#f97316", 0.08, "translate(28px, 16px) scale(0)");
            addSparkle(spCx, spCy, "#38bdf8", 0.1, "translate(-24px, 18px) scale(0)");
            addSparkle(spCx, spCy, "#a855f7", 0.12, "translate(0px, -26px) scale(0)");

            // バラしたブロックをポンポン出現
            sc.burstOnes.forEach(function(bo, idx){
              bo.obj.g.style.display = "block";
              bo.obj.g.style.opacity = "1";
              bo.obj.inner.classList.add("block-drop-in");
              bo.obj.inner.style.animationDelay = (0.05 + idx * 0.025) + "s";
              moveEl(bo.obj.g, bo.burstX, bo.burstY, false);
            });
          }, 300));

          // もとの1のブロックは初期位置からスタート
          sc.initialOnes.forEach(function(o){
            o.obj.g.style.display = "block";
            o.obj.g.style.opacity = "1";
            o.obj.inner.classList.remove("block-drop-in");
            moveEl(o.obj.g, o.initX, o.initY, false);
          });

          // 【ステップ2-C: 750ms後にもとのブロックがスーッと左へスライド合流】
          ctx.timers.push(setTimeout(function(){
            // もとのブロックの初期位置にゴースト枠を置く
            sc.initialOnes.forEach(function(o){
              var gGhostO = el("circle", {
                cx: o.initX, cy: o.initY, r: 7.5, class: "ghost-box"
              });
              sc.gGhosts.appendChild(gGhostO);
              // スーッと移動
              moveEl(o.obj.g, o.mergedX, o.mergedY, true, 700, 0);
            });
          }, 750));

          // 【ステップ2-D: 1500ms後に紫の合体枠と式が出現】
          ctx.timers.push(setTimeout(function(){
            sc.unbundleEqG.style.display = "block";
            sc.unbundleEqG.style.transition = "opacity 0.35s ease";
            sc.unbundleEqG.style.opacity = "1";
          }, 1500));
        } else {
          // 戻る操作（即時確定表示）
          sc.bundles.forEach(function(b){
            if(b.isRem){
              b.obj.g.style.display = "none";
              b.obj.g.style.opacity = "0";
              b.obj.inner.classList.remove("bundle-burst");
              b.obj.inner.classList.remove("ten-rem-pulse");
            }
          });
          sc.burstOnes.forEach(function(bo){
            bo.obj.g.style.display = "block";
            bo.obj.g.style.opacity = "1";
            bo.obj.inner.classList.remove("block-drop-in");
            moveEl(bo.obj.g, bo.burstX, bo.burstY, false);
          });
          sc.initialOnes.forEach(function(o){
            o.obj.g.style.display = "block";
            o.obj.g.style.opacity = "1";
            o.obj.inner.classList.remove("block-drop-in");
            moveEl(o.obj.g, o.mergedX, o.mergedY, false);
          });
          sc.unbundleEqG.style.display = "block";
          sc.unbundleEqG.style.opacity = "1";
        }
      } else {
        // 解体なし（4-1）
        sc.subTextEl.textContent = placeName(oneUnitExp) + "の" + oneWord + " " + oneDigit + "個 を見てみよう！";
        sc.initialOnes.forEach(function(o){
          o.obj.g.style.display = "block";
          o.obj.g.style.opacity = "1";
          o.obj.inner.classList.remove("block-drop-in");
          moveEl(o.obj.g, o.initX, o.initY, false);
        });
      }
    }

    // ==================================================
    // STAGE 3: 1のブロックを分ける（囲む ➔ スーッと各トレイへ移動）
    // ==================================================
    else if(stage === 3){
      var groupRole3 = ctx.getGroupRole();
      var phase3 = ctx.getPhase();
      // 筆算モード：一の位の「かける」「ひく」を、十の位と同じ言い回し・バッジで見せる
      var isOnesOpView = (groupRole3 === "second" && (phase3 === "multiply" || phase3 === "subtract"));

      // トレイ内の束はトレイ内確定
      sc.bundles.forEach(function(b){
        if(!b.isRem){
          b.obj.g.style.display = "block";
          b.obj.g.style.opacity = "1";
          var targetB3 = sc.trayTenCoords[b.assignedPerson][b.assignedIndex];
          moveEl(b.obj.g, targetB3.x, targetB3.y, false);
        } else {
          b.obj.g.style.display = "none";
        }
      });

      if(isOnesOpView){
        var oneScale = Math.pow(10, oneUnitExp);
        if(phase3 === "multiply"){
          sc.subTextEl.textContent = "かける： " + divisor + "×" + q_one + "＝" + (divisor * q_one) + "個 くばった！" +
            (oneUnitExp ? "（" + (divisor * oneScale) + "×" + q_one + "＝" + (divisor * q_one * oneScale) + "）" : "");
        } else {
          sc.subTextEl.textContent = "ひく： " + unbundlePart + "－" + (divisor * q_one) + "＝" +
            (p.remainder > 0 ? p.remainder + "個（これがあまり）" : "0（ぴったり！）") +
            (oneUnitExp ? "（" + (unbundlePart * oneScale) + "－" + (divisor * q_one * oneScale) + "＝" + (p.remainder * oneScale) + "）" : "");
        }
      } else {
        var eqStr3 = unbundlePart + " ÷ " + divisor + " ＝ " + q_one + (p.remainder > 0 ? "（あまり " + p.remainder + "）" : "");
        sc.subTextEl.textContent = oneWord + "のわり算： " + eqStr3 + realHint(unbundlePart, oneUnitExp);
      }
      sc.subTextEl.setAttribute("class", "slot-orange");

      if(forward){
        // まず全作業ブロックを合体位置（Stage 2の場所）に確実に配置して表示
        sc.allWorkOnes.forEach(function(wo){
          wo.obj.g.style.display = "block";
          wo.obj.g.style.opacity = "1";
          wo.obj.inner.classList.remove("block-drop-in");
          wo.obj.c.setAttribute("stroke", "#f59e0b");
          wo.obj.t.setAttribute("fill", "#b45309");
          moveEl(wo.obj.g, wo.currX, wo.currY, false);
        });

        var stepDelay3 = (q_one >= 5) ? 60 : 85;
        var moveWait3 = (q_one >= 5) ? 240 : 320;
        var moveDuration3 = (q_one >= 5) ? 450 : 550;
        var roundDuration3 = moveWait3 + divisor * stepDelay3 + ((q_one >= 5) ? 220 : 300);

        // 各ラウンドの実行（1回目 divisor個、2回目 divisor個...）
        for(var rnd3 = 0; rnd3 < q_one; rnd3++){
          (function(r){
            var rStartTime3 = r * roundDuration3;

            // 1. 囲み枠とゴースト枠の表示
            ctx.timers.push(setTimeout(function(){
              var currentOnes = sc.allWorkOnes.slice(r * divisor, (r + 1) * divisor);
              var xs3 = currentOnes.map(function(w){ return w.currX; });
              var ys3 = currentOnes.map(function(w){ return w.currY; });
              var minX3 = Math.min.apply(null, xs3) - 9;
              var minY3 = Math.min.apply(null, ys3) - 9;
              var maxX3 = Math.max.apply(null, xs3) + 9;
              var maxY3 = Math.max.apply(null, ys3) + 9;
              var bw3 = maxX3 - minX3;
              var bh3 = maxY3 - minY3;

              // 青い点線囲み枠（予告表示。ゴーストは1個ずつ動く瞬間に個別生成する）
              var bBoxG3 = el("g", {});
              var bRect3 = el("rect", {
                x: minX3, y: minY3, width: bw3, height: bh3, rx: 6, class: "group-box-blue"
              });
              var bTag3 = el("text", {
                x: minX3 + 6, y: Math.max(12, minY3 - 3), fill: "#2563eb",
                "font-size": 9.5, "font-weight": 800,
                "font-family": "'M PLUS Rounded 1c', sans-serif"
              });
              bTag3.textContent = (r + 1) + "回目";
              bBoxG3.appendChild(bRect3);
              bBoxG3.appendChild(bTag3);
              sc.gBoxes.appendChild(bBoxG3);

              // 2. moveWait3 後に各人へ1個ずつディレイをかけて移動
              ctx.timers.push(setTimeout(function(){
                bBoxG3.style.transition = "opacity 0.25s ease";
                bBoxG3.style.opacity = "0";

                for(var j3 = 0; j3 < divisor; j3++){
                  (function(personIdx){
                    ctx.timers.push(setTimeout(function(){
                      var itemObj = currentOnes[personIdx];
                      var tCoord = sc.trayOneCoords[personIdx][r];

                      // 動き出す瞬間に、ブロック1個ぶんのゴーストをもといた場所に残す
                      var gGhostItem3 = el("circle", {
                        cx: itemObj.currX, cy: itemObj.currY, r: 7.5, class: "ghost-box"
                      });
                      sc.gGhosts.appendChild(gGhostItem3);

                      moveEl(itemObj.obj.g, tCoord.x, tCoord.y, true, moveDuration3, 0);
                      playSound('step');
                    }, personIdx * stepDelay3));
                  })(j3);
                }
              }, moveWait3));
            }, rStartTime3));
          })(rnd3);
        }

        // 全ラウンド完了後に、余りブロックがあれば囲んであまりトレイへ移動
        if(p.remainder > 0){
          var totalRoundsTime3 = q_one * roundDuration3;
          var remStartIdx3 = divisor * q_one;
          var remOnes = sc.allWorkOnes.slice(remStartIdx3);

          ctx.timers.push(setTimeout(function(){
            var remXs = remOnes.map(function(w){ return w.currX; });
            var remYs = remOnes.map(function(w){ return w.currY; });
            var rMinX = Math.min.apply(null, remXs) - 9;
            var rMinY = Math.min.apply(null, remYs) - 9;
            var rMaxX = Math.max.apply(null, remXs) + 9;
            var rMaxY = Math.max.apply(null, remYs) + 9;
            var rBw = rMaxX - rMinX;
            var rBh = rMaxY - rMinY;

            var rBoxG = el("g", {});
            var rBox = el("rect", {
              x: rMinX, y: rMinY, width: rBw, height: rBh, rx: 6, class: "group-box-orange"
            });
            var rTag = el("text", {
              x: rMinX + 6, y: Math.max(12, rMinY - 3), fill: "#ea580c",
              "font-size": 9.5, "font-weight": 800,
              "font-family": "'M PLUS Rounded 1c', sans-serif"
            });
            rTag.textContent = "あまり " + p.remainder + "個";
            rBoxG.appendChild(rBox);
            rBoxG.appendChild(rTag);
            sc.gBoxes.appendChild(rBoxG);

            ctx.timers.push(setTimeout(function(){
              rBoxG.style.transition = "opacity 0.25s ease";
              rBoxG.style.opacity = "0";

              remOnes.forEach(function(rItem, ri_m){
                ctx.timers.push(setTimeout(function(){
                  // 動き出す瞬間に、ブロック1個ぶんのゴーストをもといた場所に残す
                  var rGhostItem = el("circle", {
                    cx: rItem.currX, cy: rItem.currY, r: 7.5, class: "ghost-box"
                  });
                  sc.gGhosts.appendChild(rGhostItem);

                  rItem.obj.c.setAttribute("stroke", "#e11d48");
                  rItem.obj.t.setAttribute("fill", "#e11d48");
                  moveEl(rItem.obj.g, sc.remTrayX + 22, 218 + ri_m * 17, true, moveDuration3, 0);
                  playSound('step');
                }, ri_m * 80));
              });
            }, moveWait3));
          }, totalRoundsTime3 + 120));
        }
      } else {
        // 戻る操作（即時確定表示）：動いたブロックの数だけ、1個ずつゴーストを置く
        for(var bIdxBack3 = 0; bIdxBack3 < divisor * q_one; bIdxBack3++){
          if(bIdxBack3 < sc.allWorkOnes.length){
            var gItemB3 = sc.allWorkOnes[bIdxBack3];
            var gGhostB3 = el("circle", {
              cx: gItemB3.currX, cy: gItemB3.currY, r: 7.5, class: "ghost-box"
            });
            sc.gGhosts.appendChild(gGhostB3);
          }
        }

        for(var k_b = 0; k_b < divisor * q_one; k_b++){
          if(k_b < sc.allWorkOnes.length){
            var item_b = sc.allWorkOnes[k_b];
            item_b.obj.g.style.display = "block";
            item_b.obj.g.style.opacity = "1";
            item_b.obj.inner.classList.remove("block-drop-in");
            item_b.obj.inner.classList.remove("ten-multiply-pulse");
            var tCoord_b = sc.trayOneCoords[item_b.assignedPerson][item_b.assignedIndex];
            moveEl(item_b.obj.g, tCoord_b.x, tCoord_b.y, false);
            if(isOnesOpView && phase3 === "multiply"){
              // かける：くばった1のブロックを緑で強調（十の位と色をそろえる）
              item_b.obj.c.setAttribute("fill", "#dcfce7");
              item_b.obj.c.setAttribute("stroke", "#16a34a");
              item_b.obj.c.setAttribute("stroke-width", "2.5");
              item_b.obj.t.setAttribute("fill", "#15803d");
              item_b.obj.inner.classList.add("ten-multiply-pulse");
            } else {
              item_b.obj.c.setAttribute("fill", "#fff");
              item_b.obj.c.setAttribute("stroke", "#f59e0b");
              item_b.obj.c.setAttribute("stroke-width", "1.5");
              item_b.obj.t.setAttribute("fill", "#b45309");
            }
          }

  function parseNumberMeta(numStr) {
    var dotIdx = numStr.indexOf('.');
    if (dotIdx === -1) {
      return { digits: numStr, dotAfter: numStr.length, hasDot: false, decimalPlaces: 0 };
    } else {
      return { digits: numStr.replace('.', ''), dotAfter: dotIdx, hasDot: true, decimalPlaces: numStr.length - 1 - dotIdx };
    }
  }

  function shouldSuppressDroppedZero(currentRemainder, nextDigit, hasNextDigit) {
    return hasNextDigit && currentRemainder === 0 && nextDigit === "0";
  }

  function buildMultiplyWriteCells(prodCells, row, targetCol, currentDvdPartCells, maxDropCol, totalCols) {
    var result = prodCells.map(function(cell){
      return Object.assign({}, cell, { borderBottom: true });
    });

    var startCol = targetCol;
    result.forEach(function(c){
      if (c.c < startCol) startCol = c.c;
    });
    if (currentDvdPartCells && currentDvdPartCells.length > 0) {
      currentDvdPartCells.forEach(function(c){
        if (c.c < startCol) startCol = c.c;
      });
    }

    var endCol = Math.max(targetCol, maxDropCol || targetCol);
    result.forEach(function(c){
      if (c.c > endCol) endCol = c.c;
    });
    if (currentDvdPartCells && currentDvdPartCells.length > 0) {
      currentDvdPartCells.forEach(function(c){
        if (c.c > endCol) endCol = c.c;
      });
    }

    for (var col = startCol; col <= endCol; col++) {
      var exists = result.some(function(c){ return c.c === col; });
      if (!exists) {
        result.push({
          r: row,
          c: col,
          char: "",
          borderBottom: true,
          isLineExtend: true
        });
      }
    }

    return result;
  }

  function makeHighlight(color, refCells, newCells) {
    var seen = new Map();
    (refCells || []).forEach(function(cell){
      if (!cell) return;
      seen.set(cell.r + "-" + cell.c, { r: cell.r, c: cell.c, color: color, isNew: false });
    });
    (newCells || []).forEach(function(cell){
      if (!cell) return;
      seen.set(cell.r + "-" + cell.c, { r: cell.r, c: cell.c, color: color, isNew: true });
    });
    return Array.from(seen.values());
  }

  function buildVerticalMultiplicationHtml(divisorInt, multiplierInt, productInt, titleText, options) {
    options = options || {};

    var bottomStr = String(multiplierInt);

      : "";

      ? "border:2px solid #fca5a5;background:#fff1f2;"

  function generateBrainWorkHtml(currentTargetValue, divisorInt, trialQuotient, trialHistory, options) {
    options = options || {};
    if (currentTargetValue === 0 || currentTargetValue < divisorInt) return "";
    var trueQuotient = Math.floor(currentTargetValue / divisorInt);

    if (divisorInt < 10) {

          '</div></div>';

        '</div></div>';
    }

    var divisorStr = divisorInt.toString();
    var d1 = parseInt(divisorStr[0], 10);
    var topLen = divisorStr.length;
    var topVal = Math.floor(currentTargetValue / Math.pow(10, topLen - 1));
    var displayTrial = (trialQuotient !== undefined) ? trialQuotient : trueQuotient;
    var trialProduct = divisorInt * displayTrial;

    if(options.concealAnswer){
      return '<div style="font-size:13px;color:#334155;">' +
        '<b>🔍 仮商を見つけよう！</b>' +
        '<div style="margin-top:6px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:6px 10px;line-height:1.6;">' +
        '<div style="color:#0369a1;">わる数 <b>' + divisorInt + '</b> の上1けた ➜ <b>' + d1 + '</b></div>' +
        '<div style="color:#0369a1;">わられる数 <b>' + currentTargetValue + '</b> の上' + topLen + 'けた ➜ <b>' + topVal + '</b></div>' +
        '<div style="margin-top:3px;color:#334155;"><b>' + topVal + ' ÷ ' + d1 + '</b> で、まず仮の商を自分で考えよう。</div>' +
        '</div></div>';
    }

    var html = '<div style="font-size:13px;color:#334155;">' +
      '<b>🔍 仮商を見つけよう！</b>' +
      '<div style="margin-top:6px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;padding:6px 10px;line-height:1.6;">' +
      '<div style="color:#0369a1;">わる数 <b>' + divisorInt + '</b> の上1けた ➜ <b>' + d1 + '</b></div>' +
      '<div style="color:#0369a1;">わられる数 <b>' + currentTargetValue + '</b> の上' + topLen + 'けた ➜ <b>' + topVal + '</b></div>' +
      '<div style="margin-top:3px;color:#334155;"><b>' + topVal + ' ÷ ' + d1 + '</b> で見当をつける ➜ 仮の商 <b style="color:#f97316;">' + displayTrial + '</b></div>' +
      '</div>';
    // 履歴が無いとき（＝最初のプレビュー表示など）も、あとから履歴が
    // 増えたときとまったく同じ「横並びレイアウト（左詰め）」で表示する。
    // ここを単独のbuildVerticalMultiplicationHtml呼び出し（枠いっぱいの
    // 幅に右寄せ表示）のままにすると、バッテンが付いて履歴表示に切り
    // 替わった瞬間だけ表示位置が右端→左端に変わって見えてしまう。
    if (Array.isArray(trialHistory) && trialHistory.length > 0) {
      html += buildTrialHistoryHtml(trialHistory);
    } else {
      html += buildTrialHistoryHtml([{
        divisorInt: divisorInt,
        multiplierInt: displayTrial,
        productInt: trialProduct,
        titleText: (trialQuotient !== undefined && trialQuotient !== trueQuotient) ? "仮の商の筆算" : "商の筆算",
        wrong: false
      }]);
    }
    html += '</div>';
    return html;
  }

  var AdvancedDivisionEngine = {
    generateSteps: function(dividendStr, divisorStr, route) {
      var divParse = parseNumberMeta(divisorStr);
      var dvdParse = parseNumberMeta(dividendStr);
      var D = divParse.decimalPlaces;

      var baseDvdDigits = dvdParse.digits;
      var finalDvdDotAfter = dvdParse.dotAfter + D;
      if (finalDvdDotAfter > baseDvdDigits.length) {
        baseDvdDigits += "0".repeat(finalDvdDotAfter - baseDvdDigits.length);
      }

      var divisorInt = parseInt(divParse.digits, 10);
      var dvdDigits = baseDvdDigits;
      var M = divParse.digits.length;
      var N = dvdDigits.length;

      var divisorCells = [];
      for (var j = 0; j < M; j++) divisorCells.push({ r: 1, c: j });

      var steps = [];
      var initialCells = [];

      for(var j = 0; j < M; j++) initialCells.push({ r: 1, c: j, char: divParse.digits[j] });
      for(var j = 0; j < dvdParse.digits.length; j++) initialCells.push({ r: 1, c: M + j, char: dvdParse.digits[j] });

      var currentMaskFromCol = null;

      steps.push({
        phase: "init",
        description: "まずは筆算の形に数字を書きましょう。",
        writeCells: [], maskFromCol: currentMaskFromCol, pulseBoxes: []
      });

      var currentRemainder = 0;
      var currentDividendStr = "";
      var currentRow = 2;
      var hasFirstQuotientStarted = false;
      var quotientPositions = Array(N).fill("");
      var skippedCols = [];
      var prevRemainderCells = [];
      var nextDigitCellOverride = null;
      var justBuiltZero = false;

      for (var i = 0; i < N; i++) {
        var currentDigit = dvdDigits[i];
        currentDividendStr = (currentRemainder === 0) ? currentDigit : (currentRemainder.toString() + currentDigit);
        var currentTargetValue = parseInt(currentDividendStr, 10);
        var targetCol = M + i;

        // ==================================================================
        // 図解用データ「1ラウンド分の情報」を作る。
        // ------------------------------------------------------------------
        // 実際の筆算と同じく「今回あらわれた1桁（＋前の位からの
        // あまりの繰り越し）」だけを1ラウンド分のデータとして持たせる。
        // 例：756÷7 の最初のラウンド(i=0)は carriedRemainder=0, digit=7 →
        // value=7（＝百の位の7がそのまま）。その次(i=1)は carriedRemainder=
        // （7の商とあまり計算後のあまり）, digit=5 → value=あまり*10+5。
        // exponent は「わられる数全体の中で今回の digit が実際に何の位
        // （百=2・十=1・一=0…）にあたるか」を表す。
        // ==================================================================
        var roundExponent = N - 1 - i;
        var roundQuotient = (divisorInt > 0) ? Math.floor(currentTargetValue / divisorInt) : 0;
        var roundRemainder = (divisorInt > 0) ? (currentTargetValue % divisorInt) : 0;
        // previewDigits: 最初のラウンド(i=0)だけ、まだこのラウンドでは
        // 登場していない残りの桁（例：756なら["5","6"]）を持たせておく。
        // フルリビール導入演出（実物の桁ブロックを全部見せてからカバーで隠す）で使う。
        var roundPreviewDigits = (i === 0 && N > 1) ? dvdDigits.slice(1).split("") : null;
        var hissanRoundData = {
          kind: (divisorInt < 10) ? "partitive" : "quotitive", // 1桁:等分除(人に配る) / 2桁以上:包含除(同じ数ずつのまとまり)
          exponent: roundExponent,          // このラウンドの位（0=一の位,1=十の位,2=百の位…）
          digit: parseInt(currentDigit, 10),// 今回新しく登場した1桁
          carriedRemainder: currentRemainder,// 前のラウンドから繰り越されたあまり
          value: currentTargetValue,        // carriedRemainder*10+digit（＝今回配る数）
          divisor: divisorInt,
          quotient: roundQuotient,
          remainder: roundRemainder,
          isFirstRound: (i === 0),
          isLastRound: (i === N - 1),
          previewDigits: roundPreviewDigits
        };

        var currentNewDigitCell = (i === 0) ? { r: 1, c: targetCol } : (nextDigitCellOverride || { r: 1, c: targetCol });
        var currentDvdPartCells = hasFirstQuotientStarted
          ? prevRemainderCells.concat([currentNewDigitCell])
          : Array.from({ length: targetCol - M + 1 }, function(_, j){ return { r: 1, c: M + j }; });

        var preTrialQ = undefined;
        if (divisorInt >= 10) {
          var _d1 = parseInt(divParse.digits[0], 10);
          var _topVal = Math.floor(currentTargetValue / Math.pow(10, divParse.digits.length - 1));
          var _trial = Math.min(9, Math.floor(_topVal / _d1));
          var _true  = Math.floor(currentTargetValue / divisorInt);
          preTrialQ = (_trial > _true) ? _trial : _true;
        }
        var brainHtml = generateBrainWorkHtml(currentTargetValue, divisorInt, preTrialQ, null, { concealAnswer: true });
        currentMaskFromCol = targetCol + 1;

        var canStand = (currentTargetValue >= divisorInt);

        // 「かくす」（まだ使わない桁を半透明カバーで隠した状態）を、
        // 独立した1ステップとして先に置く。ブロック図解の対象があり
        // （hissanRoundData）、かつわられる数が複数桁のときだけ意味を
        // 持つ（1桁の問題ではカバーの出番がない）。
        // ただし、これを独立ステップとして止めて見せるのは問題全体で
        // 最初の1回（i===0）だけにする。2桁目以降（i>0）は、直前の
        // 「④おろす」ステップの中で既に「カバー付きブロックのスライド
        // イン→カバーが外れて中身が見える」までを1画面で完結させて
        // いるため、ここで改めて俯瞰ビューを見せ直す必要がない
        // （途中の俯瞰ビューは削除）。
        if (hissanRoundData && N > 1 && i === 0) {
          var coverDesc = "わられる数ぜんぶを、じっさいの1000／100／10／1のブロックで見てみよう。まだ使わない位は、うすく透けたカバーでかくれているよ。";
          steps.push({
            phase: "cover",
            description: coverDesc,
            maskFromCol: currentMaskFromCol, pulseBoxes: [],
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), []),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ ？"),
            hissanRound: hissanRoundData
          });
        }

        if (divisorInt < 10) {
          steps.push({
            phase: "hide",
            description: "【ひらめき九九チェック】" + divisorInt + " のだんの九九で、" + currentTargetValue + " をこえない一番近い数をみつけよう！",
            maskFromCol: currentMaskFromCol, brainHtml: brainHtml, pulseBoxes: [],
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), []),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ ？"),
            hissanRound: hissanRoundData
          });
        } else {
          steps.push({
            phase: "hide",
            description: canStand
              ? "【商が立つかな？】" + currentTargetValue + " の中に " + divisorInt + " はあるかな？ → あるね！ 商には何が立つかな？"
              : "【商が立つかな？】" + currentTargetValue + " の中に " + divisorInt + " はあるかな？ → ないね！ 商は立ちません。",
            maskFromCol: currentMaskFromCol, brainHtml: brainHtml, pulseBoxes: [],
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), []),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ ？"),
            hissanRound: hissanRoundData
          });
        }

        if (currentTargetValue < divisorInt) {
          if (!hasFirstQuotientStarted) {
            skippedCols.push(targetCol);
            steps.push({
              phase: "skip",
              description: "商は立ちません。次の桁をいっしょに見ます。",
              writeCells: [{ r: 0, c: targetCol, char: "✕", isGuide: true }],
              maskFromCol: currentMaskFromCol, pulseBoxes: [],
              highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
              formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ 0（商は立たない）"),
              hissanRound: hissanRoundData
            });
            currentRemainder = currentTargetValue;
          } else {
            quotientPositions[i] = "0";
            steps.push({
              phase: "build-zero",
              description: "【たてる】商に「0」を書きます。",
              writeCells: [{ r: 0, c: targetCol, char: "0", isGuide: false }],
              pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
              highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
              formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ 0"),
              hissanRound: hissanRoundData
            });
            currentRemainder = currentTargetValue;
            prevRemainderCells = currentDvdPartCells.slice();
            justBuiltZero = true;
          }
        } else {
          hasFirstQuotientStarted = true;
          var q = Math.floor(currentTargetValue / divisorInt);
          quotientPositions[i] = q.toString();

          // ================================================================
          // 「かりの商」の修正ループ（わる数が2けた以上のときだけ）
          // ----------------------------------------------------------------
          // わる数の上1けただけで見当をつけた仮の商(trialQ)が、実際の
          // 正しい商(q)より大きいときは、実物の筆算とまったく同じ流れで
          // 「①仮の商をたてる→②かけて確認→（大きすぎたら）消して1つ
          // 小さい仮の商をたてなおす」を、trialQ===q になるまで繰り返す。
          // 仮商・確認の掛け算・1小さく直す操作も、8-3/8-4では
          // 児童が実際に入力して確かめる。工程番号付きで入力値を保持するため、
          // 同じ商のマスを何度使っても前の仮商と混線しない。
          // ================================================================
          var trialQ = q;
          if (divisorInt >= 10) {
            var td1 = parseInt(divParse.digits[0], 10);
            var tTopVal = Math.floor(currentTargetValue / Math.pow(10, divParse.digits.length - 1));
            trialQ = Math.min(9, Math.floor(tTopVal / td1));
          }
          var trialMultiplyCells = null;
          // 「仮の商」で試して大きすぎた組み合わせは、消してしまわずに
          // trialHistory に積み重ねておき、あたまの中パネル側でバッテン(✕)
          // 付きのまま横に並べて残す（warizan-hissanの仕組みを移植）。
          var trialHistory = [];
          if (trialQ > q) {
            var buildTrialCells = function(tq){
              var tProduct = tq * divisorInt;
              var tStr = tProduct.toString();
              var tCells = [];
              for (var tk = 0; tk < tStr.length; tk++) {
                tCells.push({ r: currentRow, c: targetCol - tStr.length + 1 + tk, char: tStr[tk] });
              }
              var extended = buildMultiplyWriteCells(tCells, currentRow, targetCol, currentDvdPartCells, targetCol, M + N);
              return extended.map(function(c){ return Object.assign({}, c, { isAutoFill: true }); });
            };

            var curTrialAttempt = { divisorInt: divisorInt, multiplierInt: trialQ, productInt: trialQ * divisorInt, titleText: "仮の商の筆算", wrong: false };
            trialHistory.push(curTrialAttempt);
            trialMultiplyCells = buildTrialCells(trialQ);
            steps.push({
              phase: "trial-build",
              description: "【仮の商をたてる】わる数の上1けたを見て、まずは仮の商「" + trialQ + "」をたててみます。",
              writeCells: [{ r: 0, c: targetCol, char: trialQ.toString(), isAutoFill: true }],
              pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
              brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQ, trialHistory),
              highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
              formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ " + trialQ + "（仮）"),
              hissanRound: hissanRoundData
            });
            // かけて確認した結果、大きすぎたと分かった時点ではじめて
            // バッテン(✕)をつける（たてた直後はまだ✕をつけない）。
            curTrialAttempt.wrong = true;
            steps.push({
              phase: "trial-multiply",
              description: "【かけて確認】" + divisorInt + " × " + trialQ + " ＝ " + (divisorInt * trialQ) + "。あ！" + currentTargetValue + " より大きくて、ひき算ができません！",
              writeCells: trialMultiplyCells,
              pulseBoxes: trialMultiplyCells.map(function(c){ return { r: c.r, c: c.c }; }),
              maskFromCol: currentMaskFromCol,
              brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQ, trialHistory),
              highlightCells: makeHighlight("green", [{ r: 0, c: targetCol }].concat(divisorCells), trialMultiplyCells.map(function(c){ return { r: c.r, c: c.c }; })),
              formulaHtml: formulaHtml("green", trialQ + " × " + divisorInt + " ＝ " + (divisorInt * trialQ)),
              hissanRound: hissanRoundData
            });

            while (trialQ > q) {
              var oldTrialQ = trialQ;
              trialQ--;
              var eraseCells = [{ r: 0, c: targetCol, char: trialQ.toString(), isAutoFill: true, isTrialCorrection: true }]
                .concat(trialMultiplyCells.map(function(mc){ return { r: mc.r, c: mc.c, char: "", borderBottom: false, isAutoFill: true }; }));
              steps.push({
                phase: "trial-fix",
                description: "【商の修正】「" + oldTrialQ + "」では大きすぎたね。商を1小さくすると、いくつになるかな？",
                writeCells: eraseCells,
                maskFromCol: currentMaskFromCol,
                brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, oldTrialQ, trialHistory, { concealAnswer: true }),
                highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r:0, c:targetCol }]),
                formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ ？（1小さくして直す）"),
                hissanRound: hissanRoundData
              });

              if (trialQ > q) {
                curTrialAttempt = { divisorInt: divisorInt, multiplierInt: trialQ, productInt: trialQ * divisorInt, titleText: "修正版の仮の商の筆算", wrong: false };
                trialHistory.push(curTrialAttempt);
                trialMultiplyCells = buildTrialCells(trialQ);
                steps.push({
                  phase: "trial-build",
                  description: "【もう一度仮の商】新しい仮の商「" + trialQ + "」をたててみます。",
                  writeCells: [{ r: 0, c: targetCol, char: trialQ.toString(), isAutoFill: true }],
                  pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
                  brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQ, trialHistory),
                  highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
                  formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ " + trialQ + "（仮）"),
                  hissanRound: hissanRoundData
                });
                curTrialAttempt.wrong = true;
                steps.push({
                  phase: "trial-multiply",
                  description: "【かけて確認】" + trialQ + " × " + divisorInt + " ＝ " + (divisorInt * trialQ) + "。まだ大きくてひけません！",
                  writeCells: trialMultiplyCells,
                  pulseBoxes: trialMultiplyCells.map(function(c){ return { r: c.r, c: c.c }; }),
                  maskFromCol: currentMaskFromCol,
                  brainHtml: generateBrainWorkHtml(currentTargetValue, divisorInt, trialQ, trialHistory),
                  highlightCells: makeHighlight("green", [{ r: 0, c: targetCol }].concat(divisorCells), trialMultiplyCells.map(function(c){ return { r: c.r, c: c.c }; })),
                  formulaHtml: formulaHtml("green", trialQ + " × " + divisorInt + " ＝ " + (divisorInt * trialQ)),
                  hissanRound: hissanRoundData
                });
              }
            }
          }

          // 最終的に正しかった商も、間違い履歴があるときはバッテン無しの
          // 「正しい筆算」として並べて見せ、どこがどう違ったか比べられるようにする。
          var correctAttempt = (trialHistory.length > 0)
            ? { divisorInt: divisorInt, multiplierInt: q, productInt: q * divisorInt, titleText: "正しい筆算", wrong: false }
            : null;
          var buildBrainHtml = (trialHistory.length > 0)
            ? generateBrainWorkHtml(currentTargetValue, divisorInt, q, trialHistory.concat([correctAttempt]))
            : generateBrainWorkHtml(currentTargetValue, divisorInt, q);

          steps.push({
            phase: "build",
            description: (divisorInt >= 10)
              ? "【たてる】これでバッチリ！正しい商「" + q + "」が立ちます。"
              : "【たてる】商に " + q + " を書きます。",
            writeCells: [{ r: 0, c: targetCol, char: q.toString(), isGuide: false, isAutoFill: trialHistory.length > 0 }],
            pulseBoxes: [{ r: 0, c: targetCol }], maskFromCol: currentMaskFromCol,
            brainHtml: buildBrainHtml,
            highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), [{ r: 0, c: targetCol }]),
            formulaHtml: formulaHtml("blue", currentTargetValue + " ÷ " + divisorInt + " ＝ " + q),
            hissanRound: hissanRoundData
          });

          var product = q * divisorInt;
          var prodStr = product.toString();
          var prodCells = [];
          for (var k = 0; k < prodStr.length; k++) {
            prodCells.push({
              r: currentRow,
              c: targetCol - prodStr.length + 1 + k,
              char: prodStr[k]
            });
          }
          var rem = currentTargetValue - product;
          var nextDropCol = targetCol;
          if (i < N - 1) {
            var lookRem = rem;
            var lookIdx = i + 1;
            while (lookIdx < N - 1) {
              var lookVal = lookRem * 10 + parseInt(dvdDigits[lookIdx], 10);
              if (lookVal < divisorInt) {
                lookRem = lookVal;
                lookIdx++;
              } else {
                break;
              }
            }
            nextDropCol = M + lookIdx;
          }
          var extendedProdCells = buildMultiplyWriteCells(prodCells, currentRow, targetCol, currentDvdPartCells, nextDropCol, M + N);

          steps.push({
            phase: "multiply",
            description: "【かける】わる数 " + divisorInt + " × たてた商 " + q + " ＝ " + product + " を書きます。",
            writeCells: extendedProdCells,
            maskFromCol: currentMaskFromCol,
            highlightCells: makeHighlight("green", divisorCells.concat([{ r: 0, c: targetCol }]), prodCells),
            formulaHtml: formulaHtml("green", divisorInt + " × " + q + " ＝ " + product),
            hissanRound: hissanRoundData
          });
          currentRow++;
          var remStr = rem.toString();
          var isLastDigit = (i === N - 1);
          var shouldWriteIntermediateZero = !(rem === 0 && !isLastDigit);
          var diffCells = [];
          if (shouldWriteIntermediateZero) {
            for (var k = 0; k < remStr.length; k++) {
              diffCells.push({
                r: currentRow,
                c: targetCol - remStr.length + 1 + k,
                char: remStr[k]
              });
            }
          }

          var subDesc = shouldWriteIntermediateZero
            ? ("【ひく】" + currentTargetValue + " － " + product + " ＝ " + rem + " を書きます。")
            : ("【ひく】" + currentTargetValue + " － " + product + " ＝ 0 ですが、次におろす数があるので「0」は書きません。");

          steps.push({
            phase: "subtract",
            description: subDesc,
            writeCells: diffCells,
            maskFromCol: currentMaskFromCol,
            highlightCells: makeHighlight("red", currentDvdPartCells.concat(prodCells), diffCells),
            formulaHtml: formulaHtml("red", currentTargetValue + " － " + product + " ＝ " + rem),
            hissanRound: hissanRoundData
          });

          currentRemainder = rem;
          prevRemainderCells = shouldWriteIntermediateZero ? diffCells.slice() : [];
          nextDigitCellOverride = null;
          justBuiltZero = false;
        }

        // 次の桁をおろす（商がまだ立っていない場合、筆算の紙面には
        // 何も書き足さないが、ブロック図解だけは「のこりを次の桁と
        // 合体させる」演出を挟み、①〜④のアニメーションが桁ごとに
        // 途切れないようにする）
        if (i < N - 1) {
          var nextDigit = dvdDigits[i + 1];
          var nextCol = targetCol + 1;

          if (hasFirstQuotientStarted) {
            var isSuppressDroppedZero = shouldSuppressDroppedZero(currentRemainder, nextDigit, (i + 1) < (N - 1));

            if (!isSuppressDroppedZero) {
              // 商が「0」だった位（justBuiltZero）の直後でも、おろす先の
              // 行は必ずまだ使っていない新しい行(currentRow)にする。
              // 以前はここで prevRemainderCells（＝わられる数の元の桁が
              // 並ぶ r:1 の行）をそのまま使っていたため、10の位が0で
              // 商も0になったケース（例：100÷4, 800÷4など）で、一の位を
              // おろす行が元の数字の行(r:1)と同じセルになってしまい、
              // 実際には何も動いていないように見える（＝一の位のおろす
              // 処理が見た目上スキップされたように見える）不具合があった。
              var dropRow = currentRow;

              steps.push({
                phase: "drop",
                description: "【おろす】となりの「" + nextDigit + "」をまっすぐ下におろします。",
                writeCells: [{ r: dropRow, c: nextCol, char: nextDigit }],
                maskFromCol: nextCol + 1,
                highlightCells: makeHighlight("orange", [{ r: 1, c: nextCol }], [{ r: dropRow, c: nextCol }]),
                formulaHtml: formulaHtml("orange", "「" + nextDigit + "」をおろす"),
                hissanRound: hissanRoundData
              });
              nextDigitCellOverride = { r: dropRow, c: nextCol };
              currentRow++;
            } else {
              nextDigitCellOverride = null;
            }
          } else {
            // まだ商が1回も立っていない（＝ここまでの桁だけでは
            // わる数より小さく、紙面上は何も書かずに次の桁を
            // 合わせて見るだけの段階）。紙面(writeCells)は変更
            // しないが、hissanRoundData があればブロック図解の
            // 「バラす→次の桁とスライドインで合体」だけは再生する。
            if (hissanRoundData) {
              steps.push({
                phase: "drop",
                description: "「" + currentTargetValue + "」だけでは " + divisorInt + " 人に配れないので、となりの「" + nextDigit + "」もいっしょに見てみよう！",
                writeCells: [],
                maskFromCol: currentMaskFromCol,
                highlightCells: makeHighlight("blue", currentDvdPartCells.concat(divisorCells), []),
                formulaHtml: formulaHtml("blue", currentTargetValue + " ＋ つぎの位 → まとめて考える"),
                hissanRound: hissanRoundData
              });
            }
            nextDigitCellOverride = null;
          }
        }
      }

      // 未使用の ✕ をクリア
      skippedCols.forEach(function(col){
        steps[steps.length - 1].writeCells.push({ r: 0, c: col, char: "", isGuide: false });
      });

      var finalQuotientStr = quotientPositions.filter(function(c){ return c !== "" && c !== "✕"; }).join("") || "0";
      var finalRemainderStr = currentRemainder.toString();

      steps.push({
        phase: "complete",
        description: "【完成！】商は " + finalQuotientStr + (currentRemainder > 0 ? "、あまりは " + finalRemainderStr : "（わりきれました）") + " です！",
        writeCells: [],
        maskFromCol: null,
        pulseBoxes: []
      });

      return { initialCells: initialCells, steps: steps, totalRows: currentRow + 2, totalCols: M + N, M: M, N: N };
    }
  };

  // ==================================================================
  // 筆算ステップ用 図解（レベル4のブロック分配の考え方を流用し、
  // 筆算の各工程（たてる/かける/ひく/おろす）に合わせてアニメーションする）
  // ==================================================================
  // 筆算ステップ用 図解（レベル5・6専用の新エンジン）
  // ------------------------------------------------------------------
  // 「1ラウンド＝1桁」を基本単位とする renderHissanRound（後述）を
  // 唯一の描画エンジンとして使う。レベル4本体（initLevel4Scene /
  // renderLevel4 / level4Ctx）には一切依存しない。
  // ==================================================================
  var hissanIllusState = {
    // このもんだいの全ラウンド（AdvancedDivisionEngineが生成した
    // hissanRoundデータの重複なし出現順リスト）。HissanSim.initSimulation
    // で1回だけ作り、各ラウンドの trayAccum / nextRoundDigit もこの時点で
    // 一括確定させる（＝ナビゲーション方向に依存しない）。
    rounds: [],
    // わられる数の全桁（例：756÷7 なら [7,5,6]）。フルリビール導入
    // 演出（「かくす」カバー）で使う。1桁÷1桁など、そもそも複数桁
    // ない問題では null のまま。
    fullDigits: null,
