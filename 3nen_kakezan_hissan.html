<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かけ算の筆算⑴</title>
<style>

*{box-sizing:border-box;margin:0}

.c1{background:#f4a1b5;width:1.3em;height:1.3em}.c10{background:#ffd93d}.c100{background:#7fb8ee}.c1000{background:#9bd68d}
.cols{display:flex;gap:.8em}.col{border:2px solid #0002;padding:.3em;border-radius:.5em;display:flex;flex-wrap:wrap;width:2.9em;justify-content:center}

.bl .c{font-size:.5em}.z{opacity:.3;font-style:normal}

button{font:inherit}#h button,footer button{border:0;border-radius:.6em;background:var(--g);color:#fff;padding:.2em .9em;cursor:pointer}button:disabled{background:#aaa!important;cursor:default}
footer{display:flex;justify-content:space-between;align-items:center;padding:.3em .8em;background:#fff}
.qq{display:flex;align-items:center;gap:.8em}
button:focus-visible,input:focus-visible{outline:3px solid #e08a1e}
.w0{background:#fcd5de}.w1{background:#fff0a8}.w2{background:#cfe6fb}.w3{background:#d7f0d2}
.groupDiagram{width:100%;font-size:.8em;text-align:center}.bagRow{display:flex;gap:.5em;justify-content:center;margin:.4em 0}.cookieBag{border:2px solid #789486;border-radius:.6em;padding:.35em;background:#f4f8f5}.cookieBag.selected,.cookie.selected{border:3px solid #c36b00;background:#fff0c4}.cookies{display:grid;grid-template-columns:repeat(var(--count),1fr);gap:.2em}.cookie{display:grid;place-items:center;border:2px solid #ac7951;border-radius:50%;background:#fff3e6;min-width:2.4em;min-height:2.4em;font-size:.85em}.countSelected .cookies{outline:3px solid #c36b00;outline-offset:2px;background:#fff0c4}.groupCaption{font-weight:bold;color:#945000;margin-top:.5em}.firstPair{background:#fff0c4;color:#945000;border-bottom:3px solid #c36b00}.methodBadge{font-weight:bold;padding:.2em .5em;background:#edf6ee;border-radius:.4em}.methodCompare{display:grid;gap:.4em;font-size:.9em}.methodCompare p{padding:.3em;background:#f3f6f3;border-radius:.4em}.mentalPlace{border-collapse:collapse;font-size:1.1em}.mentalPlace th,.mentalPlace td{border:1px solid #8aa;padding:.2em .6em;text-align:center}.calcChoices{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center}.calcChoices button{border:2px solid #8aa;border-radius:.4em;background:#fff;padding:.2em .4em;cursor:pointer}.calcChoices button[aria-pressed=true]{border-color:#c36b00;background:#fff0c4}.practiceWork{font-size:.95em;display:grid;gap:.4em}.practiceWork input{width:4.5em}.practiceWork label{display:block}.dualWritten{display:flex;align-items:center;gap:.4em;width:100%}.dualWritten>div{width:48%;text-align:center}.dualWritten .hw{max-width:100%}#h .calcFeedback{font-size:.9em}
.cookie{min-width:3em;white-space:nowrap}
</style></head><body><div id="app">
<header><b id="ttl"></b><nav id="nav"></nav><button id="settingsOpen" type="button">⚙ 設定</button></header>
<main><div id="q" class="pn"></div><div id="L"><div id="f" class="pn"></div><div id="e" class="pn"></div></div><div id="g" class="pn"></div><div id="hb"><span class="t" id="tag"></span><div id="h"></div></div><div id="m" class="pn"></div></main>
<footer><button id="bk" onclick="mv(-1)">← もどる</button><span id="dots"></span><button onclick="say()">📖 よむ</button><button id="sb" onclick="sm()"></button><button id="nx" onclick="mv(1)">つぎへ →</button></footer></div>
<dialog id="settings"><h2>設定</h2><label>筆算の入力方法 <select id="inputMode"><option value="keyboard">キーボード（順番に入力）</option><option value="handwriting">手書き（好きなマスから）</option></select></label><p>手書き：マスに直接書けます。ダブルタップで拡大します。補助計算は右上の小さいマスに書きます。</p><button type="button" id="settingsClose">とじる</button></dialog>
<link rel="stylesheet" href="css/multiplication-handwriting.css">
<script src="js/multiplication-handwriting.js"></script>
<script>
const $=s=>document.querySelector(s),K=['一','十','百','千'],D=a=>[...String(a)].map(Number),S=44;
const PC=['#f4a1b5','#ffd93d','#7fb8ee','#9bd68d'],PD=['#d94a73','#c98f00','#2a7fd0','#3c9a4a'];
const coin=(v,n=1)=>`<i class="c c${v}">${v}</i>`.repeat(n);
const tape=(u,n,un,cu='こ')=>{const x0=26,L=n>5?270:300,sw=L/n,x1=x0+L,m=(x0+x1)/2,fs=Math.min(15,sw/3.6);
let s=`<svg viewBox="0 0 360 190" style="width:100%;max-height:100%"><path d="M${x0},100C${x0},18 ${x1},18 ${x1},100" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/><rect x="${m-32}" y="26" width="64" height="28" rx="4" fill="#fff" stroke="#555"/><text x="${m}" y="40" font-size="20" text-anchor="middle" dominant-baseline="central">□${un}</text>`;
for(let i=0;i<n;i++){const a=x0+i*sw;s+=`<rect x="${a}" y="100" width="${sw}" height="40" fill="${i?'#fbe0dc':'#f09890'}" stroke="#e9a"/><path d="M${a+5},98Q${a+sw/2},68 ${a+sw-5},98" fill="none" stroke="#555" stroke-dasharray="3 3"/><text x="${a+sw/2}" y="72" font-size="${fs}" text-anchor="middle" dominant-baseline="central">${u}${un}</text>`}
s+=`<path d="M${x0},165H${x1+22}" stroke="#333" stroke-width="2"/>`;for(let i=0;i<=n;i++){const x=x0+i*sw;s+=`<path d="M${x},159V171" stroke="#333" stroke-width="2"/><text x="${x}" y="183" font-size="14" text-anchor="middle">${i}</text>`}
return s+`<text x="${x1+36}" y="168" font-size="13" text-anchor="middle">(${cu})</text></svg>`};
const SVG=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" style="height:5.4em;width:auto;flex:none">${b}</svg>`;
const tg=(x,y,t)=>`<g transform="translate(${x},${y}) rotate(-5)"><rect width="${8*t.length+14}" height="26" rx="3" fill="#fff8e1" stroke="#b98"/><circle cx="7" cy="7" r="2.5" fill="#b98"/><text x="${(8*t.length+14)/2}" y="14" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#7a4b1f">${t}</text></g>`;
const ILL={
ame:t=>SVG(170,120,`<ellipse cx="51" cy="113" rx="38" ry="5" fill="#0002"/><path d="M24,30Q19,42 18,62V100Q18,112 30,112H72Q84,112 84,100V62Q83,42 78,30Z" fill="#dff1f7" stroke="#8ab" stroke-width="2"/>${[...Array(22).keys()].map(i=>{const x=31+i*29%42,y=46+i*17%58;return `<circle cx="${x}" cy="${y}" r="7" fill="${['#e8504f','#f4b400','#4db26a','#4a8fe0','#d86bb4','#ff8a3d'][i%6]}" stroke="#0003"/><circle cx="${x-2}" cy="${y-2}" r="2" fill="#fff9"/>`}).join('')}<rect x="20" y="18" width="62" height="13" rx="5" fill="#c9a23d" stroke="#8a6a1a"/><path d="M26,40Q24,70 26,100" stroke="#fff" stroke-width="3" opacity=".6" fill="none"/>${tg(96,40,t)}`),
paper:t=>SVG(190,120,`${['#f7a8bd','#ffe08a','#9fd0f5','#a9dfb0'].map((c,i)=>`<g transform="translate(0,${-i*8})"><path d="M22,84L112,84L138,100L48,100Z" fill="${c}" stroke="#0003"/><path d="M48,100L138,100V108H48Z" fill="${c}" stroke="#0003"/><path d="M22,84V92L48,108V100Z" fill="${c}" stroke="#0003" opacity=".8"/></g>`).join('')}${tg(130,20,t)}`),
sq:t=>SVG(150,110,`<rect x="60" y="14" width="76" height="76" fill="#e6f3ff" stroke="#23312b" stroke-width="3"/><path d="M48,14V90M44,14H52M44,90H52" stroke="#555" stroke-width="2"/><text x="42" y="52" font-size="14" text-anchor="end" dominant-baseline="central">${t}</text>`),
ribbon:t=>SVG(180,120,`<ellipse cx="50" cy="112" rx="40" ry="5" fill="#0002"/><ellipse cx="54" cy="60" rx="36" ry="42" fill="#c2335f"/><ellipse cx="46" cy="58" rx="34" ry="40" fill="#f06292" stroke="#b02a55" stroke-width="2"/><ellipse cx="46" cy="58" rx="22" ry="27" fill="none" stroke="#b02a55" opacity=".5"/><ellipse cx="46" cy="58" rx="11" ry="14" fill="#fff" stroke="#b02a55"/><path d="M60,96C90,112 110,88 150,104L152,114C112,98 92,122 58,104Z" fill="#f06292" stroke="#b02a55"/>${tg(100,18,t)}`),
okashi:t=>SVG(190,110,`${[0,1].map(i=>`<g transform="translate(${8+i*92},44)"><rect width="82" height="44" rx="4" fill="#8d5a2b" stroke="#5a3515" stroke-width="2"/><rect x="5" y="5" width="72" height="34" rx="3" fill="#f3d9a8"/>${[0,1,2,3,4].map(j=>`<circle cx="${14+j*13.5}" cy="22" r="6" fill="#d9a35b" stroke="#8a5a22"/><circle cx="${13+j*13.5}" cy="21" r="1.5" fill="#5a3515"/>`).join('')}</g>`).join('')}${tg(60,8,t)}`),
tulip:()=>SVG(170,110,`<rect x="6" y="20" width="158" height="84" rx="6" fill="#8b6b4a"/>${[0,1,2].map(r=>[0,1,2,3,4].map(c=>`<g transform="translate(${26+c*30},${44+r*26})"><path d="M0,-8Q8,-2 0,10Q-8,-2 0,-8Z" fill="#f3e2b5" stroke="#a8884a"/><path d="M0,-8Q-1,-14 3,-17" stroke="#4db26a" stroke-width="2" fill="none"/></g>`).join('')).join('')}`),
juice:(t,n=3)=>SVG(190,120,`${[...Array(n).keys()].map(i=>`<g transform="translate(${14+i*52},8)"><rect x="12" y="0" width="14" height="12" rx="2" fill="#2f7d4f"/><path d="M12,12H26L36,30V98Q36,106 28,106H10Q2,106 2,98V30Z" fill="#ffb347" stroke="#b86a00" stroke-width="2"/><rect x="2" y="48" width="34" height="30" fill="#fff" opacity=".85"/><text x="19" y="63" font-size="9" text-anchor="middle" dominant-baseline="central" fill="#b86a00">${t}</text></g>`).join('')}`),
pear:()=>SVG(150,100,`<rect x="8" y="20" width="134" height="66" rx="6" fill="#c9a36b" stroke="#8a6a3a" stroke-width="2"/>${[...Array(8).keys()].map(i=>`<ellipse cx="${30+(i%4)*30}" cy="${44+(i>>2)*26}" rx="12" ry="13" fill="#ffa63d" stroke="#c46a00"/><path d="M${30+(i%4)*30},${31+(i>>2)*26}v-5" stroke="#6a4a2a" stroke-width="2"/>`).join('')}`)};
const eq=(...l)=>`<div class="eq">${l.map(x=>`<p>${x}</p>`).join('')}</div>`;
const big=(d,p,b)=>`<div class="cols">${`<div class="col w${String(p).length-1}">${coin(p,d)}</div>`.repeat(b)}</div>`;
const nd=n=>[...String(n)].reverse().map((c,i)=>`<i class="dg w${i}">${c}</i>`).reverse().join('');
const pat=(m,b,ms)=>{const r=[];ms.forEach((x,i)=>{if(i){const q=`↓${x/ms[i-1]}倍`;r.push(`<tr><td class="a">${q}</td><td></td><td></td><td></td><td class="a">${q}</td></tr>`)}r.push(`<tr><td></td><td class="r">${nd(m*x)}</td><td>×${b}＝</td><td class="r">${nd(m*x*b)}</td><td></td></tr>`)});
if(ms.length>2){const o=`<td class="bk" rowspan="${r.length}">${ms[ms.length-1]}倍</td>`;r[0]=r[0].replace('<tr>','<tr>'+o).replace('</tr>',o+'</tr>')}
return `<table class="pat">${r.join('')}</table>`};
function calc(a,b){let c=0;return D(a).reverse().map(d=>{const p0=d*b,p=p0+c,r={d,p0,cin:c,p,w:p%10,up:p/10|0};c=r.up;return r})}
function seq(a,b){const R=calc(a,b),n=R.length,q=[];R.forEach((r,i)=>{q.push(['r'+i,r.w]);if(i==n-1){if(r.up)q.push(['r'+n,r.up])}else if(r.up)q.push(['c'+(i+1),r.up])});return q}
function hs(a,b,o={}){const A=D(a),n=A.length,W=(n+2)*S,H=3*S,x=p=>(n+1-p)*S,c=p=>x(p)+S/2,V=o.vals||{},
T=(t,X,Y,z=34,f='#23312b',an='middle')=>`<text x="${X}" y="${Y}" font-size="${z}" text-anchor="${an}" dominant-baseline="central" fill="${f}">${t}</text>`;
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0L9,4.5L0,9z" fill="context-stroke"/></marker></defs>`;
for(let i=0;i<=n+2;i++)s+=`<path d="M${i*S},0V${H}" stroke="#d5dde0"/>`;
for(let j=0;j<=3;j++)s+=`<path d="M0,${j*S}H${W}" stroke="#d5dde0"/>`;
A.forEach((d,i)=>{const p=n-1-i;s+=`<rect x="${x(p)}" y="0" width="${S}" height="${S}" fill="${PC[p]}" opacity=".65"/>`});
for(let p=0;p<n;p++)s+=`<rect x="${x(p)+3}" y="${2*S+3}" width="${S-6}" height="${S-6}" fill="none" stroke="#9ab" stroke-dasharray="3 3"/>`;
const u=o.cur;if(u>=0&&u<n){s+=`<rect x="${x(u)}" y="${2*S}" width="${S}" height="${S}" fill="${PC[u]}" filter="url(#gl)"/><rect x="${x(u)}" y="${2*S}" width="${S}" height="${S}" fill="${PC[u]}" opacity=".7" stroke="${PD[u]}" stroke-width="2"/>`;
s+=`<path d="M${c(0)},${S+16}L${c(u)},${S-9}" stroke="${PD[u]}" stroke-width="3" marker-end="url(#ah)"/>`}
s+=`<path d="M${S*.4},${2*S}H${W}" stroke="#23312b" stroke-width="3"/>`+T('×',S*.5,1.5*S)+T(b,c(0),1.5*S);
A.forEach((d,i)=>{s+=T(d,c(n-1-i),S/2)});
if(!o.inp)calc(a,b).forEach((r,i)=>{if(i<(o.k||0)){s+=T(r.w,c(i),2.5*S);if(i==n-1){if(r.up)s+=T(r.up,c(n),2.5*S)}else if(r.up)s+=T(r.up,x(i+1)+S-4,2*S+12,17,'#d6493f','end')}});
else Object.entries(V).forEach(([k,v])=>{const p=+k.slice(1);s+=k[0]=='c'?T(v.val,x(p)+S-4,2*S+12,17,'#d6493f','end'):T(v.val,c(p),2.5*S)});
s+='</svg>';let ip='';
if(o.act){const p=+o.act.slice(1),cc=o.act[0]=='c',w=cc?S/2:S,h=cc?S*.45:S,l=cc?x(p)+S/2:x(p),t=2*S;
ip=`<input class="ci ${cc?'cc':''}" maxlength="1" inputmode="numeric" style="left:${l/W*100}%;top:${t/H*100}%;width:${w/W*100}%;height:${h/H*100}%;font-size:${(cc?20:34)/W*100}cqw">`}
return `<div class="hw" style="width:min(100%,${W*2}px)">${s}${ip}</div>`}
const parts=(a,b,hi=-1,sum=1)=>`<div class="pt">${D(a).reverse().map((d,i)=>`<p class="${i==hi?'on':''} w${i}">${d*10**i}×${b}＝<s>${d*b*10**i}</s></p>`).reverse().join('')}${sum?`<p class="sm">あわせて <s>${a*b}</s></p>`:''}</div>`;
const bl=(a,b)=>{const A=D(a),n=A.length;return `<div class="bl">${A.map((d,i)=>{const q=n-1-i,v=10**q;return `<div class="pc w${q}"><h5>${K[q]}</h5>${`<div class="r">${coin(v,d)||'<i class=z>0</i>'}</div>`.repeat(b)}<em>${d*v}×${b}</em></div>`}).join('')}</div>`};
const E={e:'',g:'',m:'',i:''};
function mk10(d,p,b,story){const a=d*p,A=a*b;return[
{t:'課題',q:story,...E,i:ILL.ame(`${a}円`),h:'まず 場面を 読もう。何を もとめるのかな。',f:tape(a,b,'円')},
{t:'式',h:`ねだん×買う数＝代金 だから、式は ${a}×${b}。${a}円は ${p}円玉が ${d}こ分。`,e:eq(`${a}×${b}`)},
{t:'図',h:`${p}円玉を ならべると、1つ分は ${d}こ。${b}つ分で、${p}円玉は ${d}×${b}＝${d*b}こ。`,f:big(d,p,b)},
{t:'ことば',h:`${p}が ${d*b}こ だから ${A}。答え ${A}円`,e:eq(`${d}×${b}＝${d*b}`,`${p}が ${d*b}こ → ${A}`),g:p==10?pat(d,b,[1,10]):'',m:`${p}を もとにすれば、九九を 使って 計算できる。`}]}
function mk2(story,sh,u,a,b,cu,ill){const A=D(a),n=A.length,R=calc(a,b),sp=A.map((d,i)=>d*10**(n-1-i)).filter(x=>x).join('と');return[
{t:'課題',q:story,...E,i:ill||'',h:'まず 場面を 読もう。',f:sh?tape(a,b,u,cu):eq(`${a}×${b}`)},
{t:'式',h:sh?`${sh} だから、式は ${a}×${b}。まだ 習っていない かけ算だね。どうしよう？`:`式は ${a}×${b}。位ごとに 分けて 考えよう。`,e:eq(`${a}×${b}`)},
