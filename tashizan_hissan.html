<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たし算の ひっ算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;background:#f5f0e8;}
body{font-family:'Noto Sans JP',sans-serif;}

/* ===== 画面フィット用ステージ =====
   数図表の大きさを先に守り、問題ごとに必要なときだけ設計幅を広げる。
   2桁・3桁など表が小さい問題では従来タイルの設計サイズを維持し、
   4桁や大きな数図表のときだけ表＋右パネルが収まる幅まで拡張する。
   最後に #stage 全体を画面内へ収めるが、右パネルを広げるためだけに
   数図表の最終表示倍率が下がらない範囲の「実際の余白」しか使わない。 */
#stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#f5f0e8;}
#stage{width:1040px;flex:none;background:#f5f0e8;transform-origin:center center;opacity:0;}

.app-header{background:linear-gradient(135deg,#4a9eff,#2d7dd2);color:#fff;text-align:center;
  padding:10px 16px 8px;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.app-header h1{font-size:20px;font-weight:900;letter-spacing:2px;}

.input-area{background:#fff;border-bottom:2px solid #ddd;padding:10px 12px;}
.input-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;}
.input-row label{font-size:13px;font-weight:bold;color:#555;}
.num-input{width:72px;padding:6px 8px;font-size:18px;font-weight:bold;text-align:center;
  border:2px solid #aaa;border-radius:8px;font-family:'Noto Sans JP',sans-serif;}
.num-input:focus{border-color:#4a9eff;outline:none;}
.plus-label{font-size:22px;font-weight:bold;color:#e67e22;}
.gen-btn{padding:7px 20px;font-size:14px;font-weight:bold;border:none;border-radius:20px;
  background:linear-gradient(135deg,#4a9eff,#2d7dd2);color:#fff;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;box-shadow:0 2px 6px rgba(74,158,255,.3);transition:all .2s;}
.gen-btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(74,158,255,.4);}
.err-msg{color:#e74c3c;font-size:12px;font-weight:bold;text-align:center;margin-top:4px;display:none;}

.settings-open-btn{padding:7px 16px;font-size:14px;font-weight:bold;border:2px solid #cbd5e1;border-radius:20px;
  background:#fff;color:#475569;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  font-family:'Noto Sans JP',sans-serif;box-shadow:0 2px 5px rgba(0,0,0,.06);transition:all .2s;margin-left:8px;}
.settings-open-btn:hover{background:#f1f5f9;border-color:#94a3b8;color:#1e293b;transform:translateY(-1px);}

/* 設定モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:9999;opacity:0;transition:opacity .2s ease;}
.modal-overlay.open{display:flex;opacity:1;}
.modal-card{background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(0,0,0,.22);width:90%;max-width:540px;
  overflow:hidden;transform:scale(.92);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  display:flex;flex-direction:column;}
.modal-overlay.open .modal-card{transform:scale(1);}
.modal-header{background:linear-gradient(135deg,#4a9eff,#2d7dd2);color:#fff;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;}
.modal-header h2{font-size:17px;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.modal-close-btn{background:none;border:none;color:#fff;font-size:24px;line-height:1;cursor:pointer;
  padding:2px 8px;border-radius:50%;transition:background .2s;display:flex;align-items:center;justify-content:center;}
.modal-close-btn:hover{background:rgba(255,255,255,.2);}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:18px;max-height:80vh;overflow-y:auto;}
.setting-section{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid #edf2f7;}
.setting-section:last-child{border-bottom:none;padding-bottom:0;}
.setting-title{font-size:14px;font-weight:bold;color:#334155;display:flex;align-items:center;gap:6px;}
.setting-desc{font-size:12px;color:#64748b;line-height:1.5;}
.setting-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.setting-btn{padding:8px 16px;font-size:13px;font-weight:bold;border:2px solid #cbd5e1;
  border-radius:12px;background:#fff;color:#475569;cursor:pointer;transition:all .18s;
  font-family:'Noto Sans JP',sans-serif;display:inline-flex;align-items:center;gap:6px;}
.setting-btn.active{background:#3b82f6;color:#fff;border-color:#2563eb;box-shadow:0 3px 8px rgba(59,130,246,.3);}
.setting-btn:hover:not(.active){background:#f8fafc;border-color:#94a3b8;}

.gap-setting-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding:8px 12px;background:#f8fafc;border-radius:10px;}
.gap-setting-label{font-size:12px;color:#64748b;font-weight:bold;}
.gap-input{width:60px;padding:4px 8px;font-size:14px;font-weight:bold;text-align:center;
  border:2px solid #cbd5e1;border-radius:8px;font-family:'Noto Sans JP',sans-serif;}
.gap-input:focus{border-color:#3b82f6;outline:none;}

/* ===== 数図表＋右パネルの可変レイアウト ===== */
.main-area{display:flex;gap:12px;padding:12px 8px;width:100%;max-width:none;margin:0;
  align-items:flex-start;justify-content:center;overflow:visible;}

/* 数図ブロックは問題ごとに縦横同比率で拡大する。transformはレイアウト寸法を
   変えないため、tile-slotが拡大後の実占有幅・高さを受け持つ。 */
.tile-slot{flex:0 0 auto;position:relative;overflow:visible;}

/* ===== タイル図エリア：<table>で列位置を保証 ===== */
.tile-area{width:max-content;display:inline-flex;justify-content:center;align-items:flex-start;
  background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);
  position:relative;overflow:visible;transform-origin:top left;}

#tile-table{border-collapse:collapse;table-layout:fixed;border-radius:12px;overflow:hidden;}

/* col要素は表示/非表示と幅をJSが一括設定する。
   theadとtbodyが同じ<col>を共有するため、列のズレは構造的に発生しない。*/
#tile-table col.col-label{width:28px;}
#tile-table col.col-sen{width:110px;}
#tile-table col.col-hyaku{width:124px;}
#tile-table col.col-juu{width:124px;}
#tile-table col.col-ichi{width:110px;}

#tile-table thead th{
  font-size:10px;font-weight:bold;padding:6px 0;height:30px;
  box-sizing:border-box;border-bottom:2px solid #ddd;
}
#tile-table th.th-label{background:#fafafa;}
#tile-table th.th-sen  {background:#ffffff;color:#555;   }
#tile-table th.th-hyaku{background:#cce8f4;color:#1a5276;}
#tile-table th.th-juu  {background:#fff9cc;color:#6b5700;}
#tile-table th.th-ichi {background:#fce4ec;color:#880e4f;}

#tile-table tbody td{
  position:relative;text-align:center;vertical-align:middle;
  box-sizing:border-box;height:110px;border-bottom:1px dashed #e0e0e0;
}
#tile-table tbody tr:last-child td{border-bottom:none;}
#tile-table tbody tr.tile-result-row td{border-top:3px solid #444;height:120px;}

#tile-table td.td-label{font-size:15px;font-weight:bold;color:#4a9eff;background:#fff;}
#tile-table td.td-label.plus{color:#e67e22;}
#tile-table td.td-label.equals{color:#27ae60;font-size:17px;}

#tile-table td.td-sen  {background:#ffffff;}
#tile-table td.td-hyaku{background:#e8f4fb;}
#tile-table td.td-juu  {background:#fffde7;}
#tile-table td.td-ichi {background:#fce4ec;}

#tile-table th.th-sen,  #tile-table td.td-sen  {border-right:2px solid #999;}
#tile-table th.th-hyaku,#tile-table td.td-hyaku{border-right:2px solid #85c1e9;}
#tile-table th.th-juu,  #tile-table td.td-juu  {border-right:2px solid #f0d800;}

#anim-layer{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:100;}
#mark-layer{position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;z-index:90;}

/* ===== 筆算＋説明：問題全体で固定する可変ズーム =====
   中身だけを拡大するが、outerの実レイアウト高も倍率に合わせて更新するため、
   transformだけが見た目を大きくして親要素からはみ出す状態を作らない。 */
.right-panel{flex:0 0 auto;width:auto;display:flex;flex-direction:column;gap:10px;min-width:0;}
#hissan-scale-outer{position:relative;}
#step-scale-outer{position:relative;}
#step-scale-inner{width:230px;margin:0 auto;}
.hissan-box{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);
  padding:10px 14px 14px;overflow:visible;}
.hissan-title{font-size:12px;font-weight:bold;color:#666;margin-bottom:4px;text-align:center;}
.hissan-inner{display:flex;justify-content:center;align-items:flex-start;}
#hissan-svg{display:block;}

.step-box{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);
  padding:14px 18px;min-height:100px;flex:none;overflow:visible;}
.step-number{display:inline-block;background:#4a9eff;color:#fff;border-radius:50%;
  width:26px;height:26px;line-height:26px;text-align:center;font-size:14px;
  font-weight:bold;margin-right:6px;}
.step-title{font-size:16px;font-weight:bold;color:#333;margin-bottom:10px;display:flex;align-items:center;}
.step-desc{font-size:15px;color:#444;line-height:2;height:auto;overflow:visible;}
.step-desc .ic{color:#c2185b;font-weight:bold;}
.step-desc .jc{color:#b7950b;font-weight:bold;}
.step-desc .hc{color:#1a5276;font-weight:bold;}
.step-desc .sc{color:#555;font-weight:bold;}
.step-desc .cc{color:#e74c3c;font-weight:bold;}
.step-desc .ac{color:#1a7f37;font-weight:bold;}
.step-desc .rc{color:#7f3fbf;font-weight:bold;}

.nav-area{display:flex;justify-content:center;align-items:center;gap:12px;
  padding:10px 12px;background:#fff;border-top:2px solid #eee;}
.nav-btn{padding:10px 24px;font-size:15px;font-weight:bold;border:none;border-radius:25px;
  cursor:pointer;transition:all .2s;font-family:'Noto Sans JP',sans-serif;
  box-shadow:0 3px 8px rgba(0,0,0,.12);}
.nav-btn.prev{background:#eee;color:#666;}
.nav-btn.prev:hover{background:#ddd;}
.nav-btn.next{background:linear-gradient(135deg,#4a9eff,#2d7dd2);color:#fff;}
.nav-btn.next:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(74,158,255,.35);}

.voice-btn{font-size:22px;line-height:1;border:none;background:none;cursor:pointer;
  padding:6px 10px;border-radius:50%;transition:all .2s;filter:none;opacity:1;}
.voice-btn:hover{background:#f0f0f0;}
.voice-btn.off{filter:grayscale(1);opacity:.45;}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.step-indicator{font-size:13px;color:#888;font-weight:bold;min-width:80px;text-align:center;}

@keyframes popIn{
  0%{opacity:0;transform:scale(.2);}
  65%{opacity:1;transform:scale(1.2);}
  100%{opacity:1;transform:scale(1);}
}
.pop-in{animation:popIn .4s cubic-bezier(.34,1.56,.64,1) forwards;}

/* 別ウィンドウ（iframe）埋め込み時は入力欄・見出しを隠して解説だけ表示 */
html.embed .app-header,html.embed .input-area{display:none !important;}
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage">
<div class="app-header"><h1>たし算の ひっ算</h1></div>

<div class="input-area">
  <div class="input-row">
    <label>たされる数：</label>
    <input type="number" id="inp-a" class="num-input" value="35" min="1" max="999">
    <span class="plus-label">＋</span>
    <label>たす数：</label>
    <input type="number" id="inp-b" class="num-input" value="12" min="1" max="999">
    <button class="gen-btn" onclick="generateFromInput()">説明生成 ▶</button>
    <button class="settings-open-btn" onclick="openSettingsModal()" title="せっていをひらく">⚙ 設定</button>
  </div>
  <div id="err-msg" class="err-msg">1〜999の整数を入力してください</div>
</div>

<!-- 設定モーダルダイアログ -->
<div id="settings-modal" class="modal-overlay" onclick="onModalOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-header">
      <h2>⚙ 設定</h2>
      <button class="modal-close-btn" onclick="closeSettingsModal()" title="とじる">×</button>
    </div>
    <div class="modal-body">
      <!-- 補助計算の位置 -->
      <div class="setting-section">
        <div class="setting-title">✏️ くり上がりの位置（補助計算）</div>
        <div class="setting-desc">繰り上がった「1」を書く位置と、ブロックの移動先・足す順序を選べます。</div>
        <div class="setting-options">
          <button class="setting-btn" id="carry-pos-top" onclick="setCarryPosMode('top')">
            <span>上のマス（たす数の上）</span>
          </button>
          <button class="setting-btn" id="carry-pos-ans" onclick="setCarryPosMode('ans-sub')">
            <span>直線の下（答えマスの右上・小さく）</span>
          </button>
        </div>
      </div>

      <!-- 図の表示 -->
      <div class="setting-section">
        <div class="setting-title">🟨 図のひょうじ</div>
        <div class="setting-desc">数図の表示スタイルを選べます。</div>
        <div class="setting-options">
          <button class="setting-btn active" id="mode-btn-tile" onclick="setDisplayMode('tile')">🟨 タイル</button>
          <button class="setting-btn" id="mode-btn-card" onclick="setDisplayMode('card')">🔢 カード</button>
        </div>
      </div>

      <!-- 動くタイミング -->
      <div class="setting-section">
        <div class="setting-title">⏱️ うごくタイミング</div>
        <div class="setting-desc">図と筆算のアニメーションの順序を設定します。</div>
        <div class="setting-options">
          <button class="setting-btn active" id="timing-btn-sync" onclick="setTimingMode('sync')">同時</button>
          <button class="setting-btn" id="timing-btn-tile-first" onclick="setTimingMode('tile-first')">図 → 筆算</button>
          <button class="setting-btn" id="timing-btn-hissan-first" onclick="setTimingMode('hissan-first')">筆算 → 図</button>
        </div>
        <div class="gap-setting-row" id="seq-gap-row" style="display:none;">
          <span class="gap-setting-label">アニメーションの間（ま）：</span>
          <input type="number" id="seq-gap-input" class="gap-input" value="0.4" min="0" max="5" step="0.1" onchange="setSeqGap(this.value)">
          <span class="gap-setting-label">秒</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="main-area">
  <div class="tile-slot" id="tile-slot">
  <div class="tile-area" id="tile-area">
    <table id="tile-table">
      <colgroup>
        <col class="col-label">
        <col class="col-sen"   id="colgrp-sen">
        <col class="col-hyaku" id="colgrp-hyaku">
        <col class="col-juu">
        <col class="col-ichi">
      </colgroup>
      <thead>
        <tr>
          <th class="th-label"></th>
          <th class="th-sen"   id="hdr-sen">せんのくらい</th>
          <th class="th-hyaku" id="hdr-hyaku">ひゃくのくらい</th>
          <th class="th-juu"   id="hdr-juu">じゅうのくらい</th>
          <th class="th-ichi" id="hdr-ichi">いちのくらい</th>
        </tr>
      </thead>
      <tbody>
        <!-- A行 -->
        <tr id="row-a">
          <td class="td-label" id="lbl-a"></td>
          <td class="td-sen"   id="col-sen-a">  <svg id="svg-sen-a"   width="110" height="110" viewBox="0 0 110 110"></svg></td>
          <td class="td-hyaku" id="col-hyaku-a"><svg id="svg-hyaku-a" width="124" height="110" viewBox="0 0 124 110"></svg></td>
          <td class="td-juu">                   <svg id="svg-juu-a"   width="124" height="110" viewBox="0 0 124 110"></svg></td>
          <td class="td-ichi">                  <svg id="svg-ichi-a"  width="110" height="110" viewBox="0 0 110 110"></svg></td>
        </tr>
        <!-- B行 -->
        <tr id="row-b">
          <td class="td-label plus">＋</td>
          <td class="td-sen"   id="col-sen-b">  <svg id="svg-sen-b"   width="110" height="110" viewBox="0 0 110 110"></svg></td>
          <td class="td-hyaku" id="col-hyaku-b"><svg id="svg-hyaku-b" width="124" height="110" viewBox="0 0 124 110"></svg></td>
          <td class="td-juu">                   <svg id="svg-juu-b"   width="124" height="110" viewBox="0 0 124 110"></svg></td>
          <td class="td-ichi">                  <svg id="svg-ichi-b"  width="110" height="110" viewBox="0 0 110 110"></svg></td>
        </tr>
        <!-- 答え行 -->
        <tr class="tile-result-row" id="row-ans">
          <td class="td-label equals">＝</td>
          <td class="td-sen"   id="col-sen-ans">  <svg id="svg-sen-ans"   width="110" height="120" viewBox="0 0 110 120"></svg></td>
          <td class="td-hyaku" id="col-hyaku-ans"><svg id="svg-hyaku-ans" width="124" height="120" viewBox="0 0 124 120"></svg></td>
          <td class="td-juu">                                  <svg id="svg-juu-ans"   width="124" height="120" viewBox="0 0 124 120"></svg></td>
          <td class="td-ichi">                                 <svg id="svg-ichi-ans"  width="110" height="120" viewBox="0 0 110 120"></svg></td>
        </tr>
      </tbody>
    </table>
    <svg id="mark-layer"></svg>
    <svg id="anim-layer"></svg>
  </div>
  </div><!-- /#tile-slot -->

  <div class="right-panel">
    <div class="hissan-box">
      <div class="hissan-title">ひっ算</div>
      <div id="hissan-scale-outer">
        <div class="hissan-inner">
          <svg id="hissan-svg" width="210" height="230" viewBox="0 0 210 230"></svg>
        </div>
      </div>
    </div>
    <div class="step-box">
      <div id="step-scale-outer">
        <div id="step-scale-inner">
          <div class="step-title">
            <span class="step-number" id="step-num">1</span>
            <span id="step-title-text"></span>
          </div>
          <div class="step-desc" id="step-desc"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="nav-area">
  <button class="nav-btn prev" id="btn-prev" onclick="goStep(-1)">◀ もどる</button>
  <span class="step-indicator" id="step-ind">1 / 1</span>
  <button class="nav-btn next" id="btn-next" onclick="goStep(1)">すすむ ▶</button>
  <button class="voice-btn" id="btn-voice" onclick="toggleVoice()" title="読み上げON/OFF">🔊</button>
</div>

</div></div><!-- /#stage /#stage-wrap -->

<script>
// ============================================================
// SVG ユーティリティ
// ============================================================
const NS='http://www.w3.org/2000/svg';
const U=7;
const FC='#f5c542', SC='#c8960a', SC5='#7a5500';

function mk(tag,a,parent){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(a))e.setAttribute(k,v);
  if(parent)parent.appendChild(e);
  return e;
}
function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

// ===== 十の位：棒1本 =====
function drawStick(parent,cx,cy,u,alpha,strokeColor){
  alpha=alpha??1; u=u??U; strokeColor=strokeColor??SC;
  const G=u*.15,S=u+G,H=10*u+9*G;
  const ox=cx-u/2,oy=cy-H/2;
  for(let i=0;i<10;i++)
    mk('rect',{x:ox,y:oy+i*S,width:u,height:u,fill:FC,stroke:strokeColor,'stroke-width':.6,rx:.3,opacity:alpha},parent);
  mk('line',{x1:ox-1,x2:ox+u+1,y1:oy+5*S-G/2,y2:oy+5*S-G/2,stroke:SC5,'stroke-width':1.2,opacity:alpha},parent);
  mk('rect',{x:ox-1,y:oy-1,width:u+2,height:H+2,fill:'none',stroke:strokeColor,'stroke-width':.8,rx:1,opacity:alpha},parent);
}

// ===== タイル画像（PNG, Base64埋め込み）=====

// ===== 百の位：正方形タイル1枚 =====
// PNG画像を<image>1枚で配置（格子100個のSVG描画をやめて軽量化）。
// くり上がりの強調表示(strokeColor指定時)は、画像の外周にreact枠を重ねて表現する。
function drawHyakuScaled(parent,cx,cy,u,alpha,strokeColor){
  alpha=alpha??1;
  const G=u*.15,TW=10*u+9*G,TH=10*u+9*G;
  const ox=cx-TW/2,oy=cy-TH/2;
  mk('image',{href:IMG_HYAKU,x:ox,y:oy,width:TW,height:TH,opacity:alpha,
    'preserveAspectRatio':'none'},parent);
  if(strokeColor && strokeColor!==SC){
    // くり上がり等の強調色が指定された場合のみ、外枠を重ねて目立たせる
    mk('rect',{x:ox-1,y:oy-1,width:TW+2,height:TH+2,fill:'none',
      stroke:strokeColor,'stroke-width':2,rx:3,opacity:alpha},parent);
  }
}

// ===== 千の位：百タイル10枚重ねの束 =====
// PNG画像(立体的な重なり・テープを描き込み済み)を<image>1枚で配置。
function drawSenScaled(parent,cx,cy,u,alpha,strokeColor){
  alpha=alpha??1;
  // 画像自体に奥行き(重なり)が含まれているため、表示領域は正方形(10u分)より
  // やや大きく取る必要がある。元のdrawSenScaledの見た目に合わせて1.34倍を確保。
  const G=u*.15,baseSide=10*u+9*G;
  const side=baseSide*1.34;
  const ox=cx-side/2*0.94, oy=cy-side/2*1.06; // 画像内の重心が右下寄りなので微調整
  mk('image',{href:IMG_SEN,x:ox,y:oy,width:side,height:side,opacity:alpha,
    'preserveAspectRatio':'none'},parent);
  if(strokeColor && strokeColor!==SC){
    const m=side*0.04;
    mk('rect',{x:ox-m,y:oy-m,width:side+m*2,height:side+m*2,
      fill:'none',stroke:strokeColor,'stroke-width':2,rx:3,opacity:alpha},parent);
  }
}

// ===== 一の位：個別ブロック =====
function drawIchi(parent,count,svgW,svgH,alpha,hColor){
  if(!count)return[];
  const u=U,gap=u*.18,S=u+gap,bGap=u*.7,BH=5*u+4*gap;
  const full=Math.floor(count/5),rem=count%5,nBlocks=full+(rem?1:0);
  const cols=nBlocks<=2?1:2,colPitch=u+10;
  const totW=cols*u+(cols-1)*(colPitch-u);
  const sx=svgW/2-totW/2+u/2;
  const pos=[];let drawn=0;
  for(let b=0;b<nBlocks&&drawn<count;b++){
    const col=b%cols,brow=Math.floor(b/cols);
    const inB=(b===nBlocks-1&&rem)?rem:5;
    const cx=sx+col*colPitch,botY=svgH-14;
    const blockBotY=botY-brow*(BH+bGap);
    for(let i=0;i<inB&&drawn<count;i++){
      const cy=blockBotY-i*S;
      mk('rect',{x:cx-u/2,y:cy-u/2,width:u,height:u,fill:FC,
        stroke:alpha<.5?'#aaa':SC,'stroke-width':1,rx:.6,opacity:alpha},parent);
      pos.push({cx,cy});drawn++;
    }
  }
  if(hColor){
    const xs=pos.map(p=>p.cx),ys=pos.map(p=>p.cy),m=5;
    mk('rect',{x:Math.min(...xs)-u/2-m,y:Math.min(...ys)-u/2-m,
      width:Math.max(...xs)-Math.min(...xs)+u+m*2,
      height:Math.max(...ys)-Math.min(...ys)+u+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},parent);
  }
  return pos;
}

// ===== render系（SVGに静的描画）=====
// 棒(十の位)
function renderSticks(svgEl,count,alpha,hColor,strokeColor){
  svgEl.innerHTML='';if(!count)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||110;
  const{xs,totW}=stickLayout(count);
  const sx0=(W-totW)/2,centers=[];
  for(let i=0;i<count;i++){
    const cx=sx0+xs[i]+STICK_W/2,cy=H/2;
    const g=mk('g',{},svgEl);
    drawStick(g,cx,cy,U,alpha??1,strokeColor||SC);
    centers.push({cx,cy});
  }
  if(hColor){
    const G=U*.15,TH=10*U+9*G,m=4;
    mk('rect',{x:sx0-m,y:H/2-TH/2-m,width:totW+m*2,height:TH+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return centers;
}

// ひゃくタイルを重ねて並べるときの「ずらす距離」（x軸・y軸）。ひき算アプリと同じ量にして視認性を確保する。
const HYAKU_STEP_X=24, HYAKU_STEP_Y=20, HYAKU_SIDE=10*U+9*U*.15;
// 1行あたりの最大枚数。6枚目以降は次の行として右にHYAKU_ROW2_OFFSET_TILES枚分ずらして開始する（ひき算アプリと同じロジック）。
// 足し算は答えの繰り上がり前で最大19枚まで表示しうるため、5枚を超えるたびに行を分けて「横には伸ばすが、縦には伸ばしすぎない」ようにする。
const HYAKU_ROW1_MAX=5;
const HYAKU_ROW2_OFFSET_TILES=2;

// 百の位タイルの「相対」配置(まだ中心寄せしていない生の座標)を計算する。ひき算アプリのhyakuRawPosを拡張したロジック。
// ・5枚ごとに1行とし、各行は「5枚のときの配置」に固定する（すでに埋まった行は後から枚数が増えても動かない）。
// ・最後の（まだ埋まっていない）行だけは、その行の枚数に応じて中央寄せする。
// ・2行目以降は、1行目と同じ高さ範囲のまま、HYAKU_ROW2_OFFSET_TILES枚分ずつ右にずらして重ねる
//   （縦方向の広がりを1行分に抑えつつ、横方向にはひき算アプリと同じ間隔で伸ばす）。
function hyakuRawPos(i,total,su){
  const side2=10*su+9*su*.15;
  const rowIdx=Math.floor(i/HYAKU_ROW1_MAX);
  const rowStart=rowIdx*HYAKU_ROW1_MAX;
  const rowLen=Math.min(HYAKU_ROW1_MAX,total-rowStart);
  const withinIdx=i-rowStart;
  const off=withinIdx-(rowLen-1)/2;
  const x=off*HYAKU_STEP_X+rowIdx*HYAKU_ROW2_OFFSET_TILES*side2;
  const y=-off*HYAKU_STEP_Y;
  return{x,y};
}
// total枚を配置したときの、生座標(hyakuRawPos)でのバウンディングボックス
function hyakuBBox(total,su){
  const side2=10*su+9*su*.15;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(let i=0;i<total;i++){
    const p=hyakuRawPos(i,total,su);
    minX=Math.min(minX,p.x-side2/2);maxX=Math.max(maxX,p.x+side2/2);
    minY=Math.min(minY,p.y-side2/2);maxY=Math.max(maxY,p.y+side2/2);
  }
  return{minX,maxX,minY,maxY};
}
// 百の位タイルの配置を計算する共通関数。バウンディングボックスの中心を枠の中心(W/2,H/2)に合わせる。
function hyakuTilePos(i,total,W,H,su){
  const bbox=hyakuBBox(total,su);
  const shiftX=W/2-(bbox.minX+bbox.maxX)/2;
  const shiftY=H/2-(bbox.minY+bbox.maxY)/2;
  const p=hyakuRawPos(i,total,su);
  return{cx:p.x+shiftX, cy:p.y+shiftY};
}
// total枚のタイルを配置したときに必要な、バウンディングボックスの幅・高さを返す（枠の自動サイズ計算用）。
function hyakuFootprint(total,su){
  const bbox=hyakuBBox(total,su);
  return{width:bbox.maxX-bbox.minX, height:bbox.maxY-bbox.minY};
}

// 百タイル
function renderHyakus(svgEl,count,alpha,hColor,strokeColor){
  svgEl.innerHTML='';if(!count)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||110;
  const u=U,G=u*.15,side=HYAKU_SIDE;
  const sc=Math.min((W-8)/side,(H-8)/side,1);
  const su=u*sc,centers=[];
  for(let i=0;i<count;i++){
    const{cx,cy}=hyakuTilePos(i,count,W,H,su);
    const g=mk('g',{},svgEl);
    drawHyakuScaled(g,cx,cy,su,alpha??1,strokeColor||SC);
    centers.push({cx,cy});
  }
  if(hColor){
    // 全タイルが収まるバウンディングボックスを求めて囲む
    const side2=10*su+9*su*.15,m=4;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    centers.forEach(({cx,cy})=>{
      minX=Math.min(minX,cx-side2/2);maxX=Math.max(maxX,cx+side2/2);
      minY=Math.min(minY,cy-side2/2);maxY=Math.max(maxY,cy+side2/2);
    });
    mk('rect',{x:minX-m,y:minY-m,width:(maxX-minX)+m*2,height:(maxY-minY)+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return centers;
}

// 千タイル
function renderSens(svgEl,count,alpha,hColor,strokeColor){
  svgEl.innerHTML='';if(!count)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||110;
  const u=U,G=u*.15,W10=10*u+9*G,H10=10*u+9*G;
  const OX=u*.35,OY=u*.35;
  const totalW=W10+(count-1)*OX*9+(count-1)*6;// rough
  // スケールをセルに収める
  const needW=W10+(9)*OX,needH=H10+(9)*OY;
  const sc=Math.min((W-8)/needW,(H-8)/needH);
  const su=u*sc,centers=[];
  // 1枚ずつ横に並べる（最大は通常1枚）
  const step=su*0.25;
  for(let i=0;i<count;i++){
    const cx=W/2+(i-(count-1)/2)*(10*su+9*su*.15+4);
    const cy=H/2;
    const g=mk('g',{},svgEl);
    drawSenScaled(g,cx,cy,su,alpha??1,strokeColor||SC);
    centers.push({cx,cy});
  }
  return centers;
}

// 一の位
function renderIchi(svgEl,count,alpha,hColor){
  svgEl.innerHTML='';if(!count)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||110;

// ============================================================
// カード方式（位取り表アプリを参考にしたSVG数字カード）
// タイル/棒/百タイル/千タイルの代わりに「1」「10」「100」「1000」と
// 数字を書いた長方形カードを使う表現。桁が増えても CARD_CFG に
// エントリを足すだけで対応できる（例：1万＝'man'を追加するだけ）。
// ============================================================
const CARD_CFG={
  ichi : {label:'1',    w:34,h:26,fs:13,bg:'#fce4ec',stroke:'#e91e63',tc:'#c2185b'},
  juu  : {label:'10',   w:34,h:26,fs:13,bg:'#fff9cc',stroke:'#d4ac0d',tc:'#b7950b'},
  hyaku: {label:'100',  w:34,h:26,fs:12,bg:'#cce8f4',stroke:'#2980b9',tc:'#1a5276'},
  sen  : {label:'1000', w:34,h:26,fs:11,bg:'#ffffff',stroke:'#222222',tc:'#222222'}
};

// ===== カード1枚描画（中心座標cx,cy基準。drawStick等と座標系をそろえる）=====
function drawCardSingle(parent,cx,cy,place,scale,alpha,strokeColor){
  const cfg=CARD_CFG[place];
  scale=scale??1;alpha=alpha??1;
  const w=cfg.w*scale,h=cfg.h*scale;
  const x=cx-w/2,y=cy-h/2;
  mk('rect',{x,y,width:w,height:h,fill:cfg.bg,
    stroke:strokeColor||cfg.stroke,'stroke-width':1.6*scale,rx:3*scale,opacity:alpha},parent);
  mk('text',{x:cx,y:cy+cfg.fs*scale*.36,'text-anchor':'middle',
    'font-size':cfg.fs*scale,'font-weight':'bold',fill:cfg.tc,
    'font-family':"'Noto Sans JP',sans-serif",opacity:alpha},parent).textContent=cfg.label;
}

// ===== カードの格子配置 =====
// 「縦5枚×横2列」を基本とする格子レイアウト。1列目に下から5枚積み、
// 6枚目からは2列目を使う。すべての位でカードサイズが同じなので、
// 列の横幅は常に「2列分」を基準に固定し、桁の列幅とぴったり合わせる
// （= はみ出しが起こらない）。縦に入りきらない場合のみスケールを縮小する。
// count枚のカードの中心座標配列を返す（描画はしない・座標計算のみ）。
function cardPositions(count,place,svgW,svgH){
  if(!count)return[];
  const cfg=CARD_CFG[place];
  const margin=6;
  const perCol=5;
  const nCols=Math.max(1,Math.ceil(count/perCol));
  const gapX0=10,gapYRatio=.22;

  // 横幅は「実際に必要な列数」で固定計算する（無限幅でプローブすると
  // 列数が暴走して位取り表からはみ出すため、常にperCol基準で決定する）
  const needW=nCols*cfg.w+(nCols-1)*gapX0;
  const needH=perCol*cfg.h+(perCol-1)*cfg.h*gapYRatio;
  let scale=1;
  if(needW>svgW-margin*2) scale=Math.min(scale,(svgW-margin*2)/needW);
  if(needH>svgH-margin*2) scale=Math.min(scale,(svgH-margin*2)/needH);
  scale=Math.max(scale,.45); // 縮小しすぎて読めなくなるのを防ぐ下限

  const w=cfg.w*scale,h=cfg.h*scale,gapX=gapX0*scale,gapY=h*gapYRatio,colW=w+gapX;
  const totW=nCols*w+(nCols-1)*gapX;
  const sx=svgW/2-totW/2+w/2;
  const botY=svgH-margin-h/2;
  const pos=[];let drawn=0;
  for(let c=0;c<nCols&&drawn<count;c++){
    const remain=count-drawn;
    const inCol=Math.min(perCol,remain);
    const cx=sx+c*colW;
    for(let i=0;i<inCol;i++){
      pos.push({cx,cy:botY-i*(h+gapY),scale});drawn++;
    }
  }
  return pos;
}

// ===== カード版render（タイル版render系と同じシグネチャ）=====
function renderCard(svgEl,count,place,alpha,hColor){
  svgEl.innerHTML='';if(!count)return[];
  const W=parseInt(svgEl.getAttribute('viewBox').split(' ')[2]),H=parseInt(svgEl.getAttribute('height'))||110;
  const pos=cardPositions(count,place,W,H);
  pos.forEach(p=>drawCardSingle(svgEl,p.cx,p.cy,place,p.scale??1,alpha??1,null));
  if(hColor){
    const cfg=CARD_CFG[place];
    const sc=pos[0].scale??1;
    const xs=pos.map(p=>p.cx),ys=pos.map(p=>p.cy),m=5;
    mk('rect',{x:Math.min(...xs)-cfg.w*sc/2-m,y:Math.min(...ys)-cfg.h*sc/2-m,
      width:Math.max(...xs)-Math.min(...xs)+cfg.w*sc+m*2,
      height:Math.max(...ys)-Math.min(...ys)+cfg.h*sc+m*2,
      fill:'none',stroke:hColor,'stroke-width':2.5,'stroke-dasharray':'5,3',rx:4},svgEl);
  }
  return pos;
}
// 桁ごとの薄い別名（paintTiles等から呼びやすくするため）
function renderIchiCard(svgEl,count,alpha,hColor){return renderCard(svgEl,count,'ichi',alpha,hColor);}
function renderJuuCard(svgEl,count,alpha,hColor){return renderCard(svgEl,count,'juu',alpha,hColor);}
function renderHyakuCard(svgEl,count,alpha,hColor){return renderCard(svgEl,count,'hyaku',alpha,hColor);}
function renderSenCard(svgEl,count,alpha,hColor){return renderCard(svgEl,count,'sen',alpha,hColor);}

// ============================================================
// 筆算SVG描画  viewBox="0 0 210 230"
// 位置: 千=35, 百=73, 十=111, 一=149  (2桁なら十=111,一=149)
// ============================================================
const HSX=35,H2X=73,HJX=111,HIX=149;
const HG=38; // ノートのマス目1個分の大きさ（数字1つ・記号1つがちょうど1マスに収まる）
const HCARRY_Y=30,HROW1_Y=70,HROW2_Y=108,HLINE_Y=114,HROW3_Y=146;

function drawHissan(svgEl,state){
  svgEl.innerHTML='';
  const S=state;

  // 実際に使う列だけを枠に収める（未使用の位の列ぶんの余白は作らない）。
  // これによりビューポートの横幅が必要な分だけに縮み、同じ表示幅(CSS側は
  // width:100%;height:auto)ではその分だけ縦方向に大きく表示される＝
  // 余っていた左右の白マスを縦の見やすさに回す。
  const leftmostCol=S.maxDigits>=3?H2X:(S.maxDigits===2?HJX:HIX);
  const usedLeftCol=S.has4?HSX:(S.has3?H2X:HJX); // 答えのくり上がりで桁が増える場合も含める
  const leftEdge=Math.min(leftmostCol-1.5*HG,usedLeftCol-HG/2);
  const VBX=Math.max(0,leftEdge),VBH=230,VBW=210-VBX;
  svgEl.setAttribute('viewBox',`${VBX} 0 ${VBW} ${VBH}`);
  svgEl.setAttribute('width',VBW);
  svgEl.setAttribute('height',VBH);

  // ノートのマス目（薄いグレーの格子）を背景に敷く。
  // 1マス＝1つの数字・記号の大きさ(HG)にして、数字の列・行とぴったり重なるようにする。
  const gx0=HSX-HG/2; // gx0：いちばん左の列(HSX)がマスの中心になるように原点をずらす
  for(let gx=gx0;gx<=210;gx+=HG)mk('line',{x1:gx,y1:0,x2:gx,y2:VBH,stroke:'#000','stroke-width':.5,opacity:.08},svgEl);
  for(let gy=0;gy<=VBH;gy+=HG)mk('line',{x1:VBX,y1:gy,x2:210,y2:gy,stroke:'#000','stroke-width':.5,opacity:.08},svgEl);

  function txt(content,x,y,fs,fw,color,cls){
    const t=mk('text',{x,y,'font-size':fs||34,'font-weight':fw||'bold',
      fill:color||'#222','text-anchor':'middle','font-family':'Noto Sans JP,sans-serif'},svgEl);
    t.textContent=content;
    if(cls)t.setAttribute('class',cls);
    return t;
  }
  function hl(x,y,w,h,color,a){
    mk('rect',{x,y,width:w,height:h,rx:5,fill:color,opacity:a||.18},svgEl);
  }

  // ＋記号（「たす数」＝B の桁数の、いちばん大きい位の1つ左のマスに書く。答えの桁数は関係ない）
  const plusX=leftmostCol-HG;
  if(S.showPlus) txt('＋',plusX,HROW2_Y+4,20,'bold','#e67e22');

  // 横線（＋記号の下のマスも含めて伸ばす）
  if(S.showLine){
    const lx1=plusX-HG/2;
    mk('line',{x1:lx1,y1:HLINE_Y,x2:168,y2:HLINE_Y,stroke:'#333','stroke-width':2.5},svgEl);
  }

  // 各位の計算中：その位の列全体を破線の色枠で囲む
  // グリッド境界: 0,38,76,114,152 — A行上端=38, こたえ行下端=152, くり上がり行上端=0
  {
    const m=2,gBot=Math.ceil(HROW3_Y/HG)*HG; // こたえ行の下端グリッド線 = 152
    // 一の位：ピンク（くり上がり行なし → A行上端から3マス）
    if(S.hlColIchi){
      const gTop=Math.floor(HROW1_Y/HG)*HG; // = 38
      const cx=HIX,cw=HG;
      mk('rect',{x:cx-cw/2+m,y:gTop+m,width:cw-m*2,height:gBot-gTop-m*2,
        fill:'none',stroke:'#e91e63','stroke-width':2,'stroke-dasharray':'5,3',rx:4},svgEl);
    }
    // 十の位：黄色（くり上がり補助数字があれば上端=0の4マス、なければ38の3マス）
    if(S.hlColJuu){
      const gTop=S.showCarryJ?Math.floor(HCARRY_Y/HG)*HG:Math.floor(HROW1_Y/HG)*HG;
      const cx=HJX,cw=HG;
      mk('rect',{x:cx-cw/2+m,y:gTop+m,width:cw-m*2,height:gBot-gTop-m*2,
        fill:'none',stroke:'#d4ac0d','stroke-width':2,'stroke-dasharray':'5,3',rx:4},svgEl);
    }
    // 百の位：水色（同様）
    if(S.hlColHyaku&&(S.has3||S.has4)){
      const gTop=S.showCarryH?Math.floor(HCARRY_Y/HG)*HG:Math.floor(HROW1_Y/HG)*HG;
      const cx=H2X,cw=HG;
      mk('rect',{x:cx-cw/2+m,y:gTop+m,width:cw-m*2,height:gBot-gTop-m*2,
        fill:'none',stroke:'#2980b9','stroke-width':2,'stroke-dasharray':'5,3',rx:4},svgEl);
    }
  }
  if(S.hlIchi){hl(HIX-18,HROW1_Y-32,38,38,'#fce4ec');hl(HIX-18,HROW2_Y-32,38,38,'#fce4ec');}
  if(S.hlJuu){
    hl(HJX-18,HROW1_Y-32,38,38,'#fff9cc');hl(HJX-18,HROW2_Y-32,38,38,'#fff9cc');
    if(S.showCarryJ)hl(HJX-14,HCARRY_Y-20,30,26,'#ffe0e0',.35);
  }
  if(S.hlHyaku&&(S.has3||S.has4)){
    hl(H2X-18,HROW1_Y-32,38,38,'#cce8f4');hl(H2X-18,HROW2_Y-32,38,38,'#cce8f4');
    if(S.showCarryH)hl(H2X-14,HCARRY_Y-20,30,26,'#ffe0e0',.35);
  }

  // 数字A行
  if(S.showAS&&S.has4) txt(S.aS,HSX,HROW1_Y,34,'bold','#222');
  if(S.showAH&&(S.has3||S.has4)) txt(S.aH,H2X,HROW1_Y,34,'bold','#222');
  if(S.showAJ) txt(S.aJ,HJX,HROW1_Y,34,'bold','#222');
  if(S.showAI) txt(S.aI,HIX,HROW1_Y,34,'bold','#222');
  // 数字B行
  if(S.showBS&&S.has4) txt(S.bS,HSX,HROW2_Y,34,'bold','#222');
  if(S.showBH&&(S.has3||S.has4)) txt(S.bH,H2X,HROW2_Y,34,'bold','#222');
  if(S.showBJ) txt(S.bJ,HJX,HROW2_Y,34,'bold','#222');
  if(S.showBI) txt(S.bI,HIX,HROW2_Y,34,'bold','#222');

  // くり上がり：数字「1」自体は showCarryJ/showCarryH が true の間ずっと表示するが、
  // ポップ（拡大縮小）アニメーションは carryJPop/carryHPop が true の最初の1ステップだけ再生する
  if(S.showCarryJ) {
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    const cx = isAnsSub ? (HJX + 11) : HJX;
    const cy = isAnsSub ? (HLINE_Y + 13) : HCARRY_Y;
    const fs = isAnsSub ? 13 : 19;
    const ct = mk('text',{x:cx,y:cy,'font-size':fs,'font-weight':'bold',fill:'#e74c3c','text-anchor':'middle','font-family':'Noto Sans JP,sans-serif'},svgEl);
    ct.textContent='1';
    if(S.carryJPop) ct.setAttribute('class','pop-in');
  }
  if(S.showCarryH&&(S.has3||S.has4)) {
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    const cx = isAnsSub ? (H2X + 11) : H2X;
    const cy = isAnsSub ? (HLINE_Y + 13) : HCARRY_Y;
    const fs = isAnsSub ? 13 : 19;
    const ct = mk('text',{x:cx,y:cy,'font-size':fs,'font-weight':'bold',fill:'#e74c3c','text-anchor':'middle','font-family':'Noto Sans JP,sans-serif'},svgEl);
    ct.textContent='1';
    if(S.carryHPop) ct.setAttribute('class','pop-in');
  }

  // こたえ
  // くり上がり前：その位の答え欄に「2桁の生の合計」を2つの数字として並べて表示する
  // （1つの位には1つの数字しか入らないことを視覚的に示すため、わざと桁の幅から
  //  はみ出すように見せる。後でくり上がりアニメーションがこれを2つに割る）
  function tempPair(raw,cx,id){
    const tens=Math.floor(raw/10),ones=raw%10,off=11;
    const t1=txt(String(tens),cx-off,HROW3_Y,34,'bold','#1a7f37');t1.id=id+'-tens';
    const t2=txt(String(ones),cx+off,HROW3_Y,34,'bold','#1a7f37');t2.id=id+'-ones';
  }
  if(S.showAnsITemp) tempPair(S.iSum,HIX,'hs-ansI');
  else if(S.showAnsI) txt(S.iAns,HIX,HROW3_Y,34,'bold','#1a7f37');
  if(S.showAnsJTemp) tempPair(S.jRaw,HJX,'hs-ansJ');
  else if(S.showAnsJ) txt(S.jAns,HJX,HROW3_Y,34,'bold','#1a7f37');
  if(S.showAnsHTemp&&(S.has3||S.has4)) tempPair(S.hRaw,H2X,'hs-ansH');
  else if(S.showAnsH&&(S.has3||S.has4)) txt(S.hAns,H2X,HROW3_Y,34,'bold','#1a7f37');
  if(S.showAnsS&&S.has4) txt(S.sAns,HSX,HROW3_Y,34,'bold','#1a7f37');

  // 完成枠（答えの行のマスにぴったり重ねる）
  if(S.ansBox){
    const bx=S.has4?16:(S.has3?54:92);
    mk('rect',{x:bx+1,y:HLINE_Y+1,width:168-bx-2,height:HG-2,
      fill:'none',stroke:'#1a7f37','stroke-width':2.5,rx:6},svgEl);
  }
}

// ============================================================
// アニメーションエンジン
// ============================================================
// 逐次モードでは筆算側・図解側のtweenが同時に走ることがある（syncモードのcarry-i/j/h等）ため、
// 単一のanimId変数ではcancelAnim()が片方しか止められず取りこぼしが起きうる。
// 実行中のrequestAnimationFrame IDをSetで管理し、cancelAnim()で全て確実に止める。
let animIds=new Set();
function cancelAnim(){animIds.forEach(id=>cancelAnimationFrame(id));animIds.clear();}
// SVG要素の現在のviewBox幅を取得（updateLayoutで動的変更されるため都度取得）
function vbW(id){
  const svg=document.getElementById(id);
  return parseFloat(svg.getAttribute('viewBox').split(' ')[2]);
}
// SVG要素の現在のviewBox高さを取得
function vbH(id){
  const svg=document.getElementById(id);
  return parseFloat(svg.getAttribute('viewBox').split(' ')[3]);
}

// じゅうの棒を「5本・すきま・5本」とグルーピングして並べたときのx座標(中心からの相対オフセット)を返す。
// renderSticksと、くり上がりアニメーション側で同じ式を使うことで、見た目の食い違いを防ぐ。
const STICK_W=U+1, STICK_GAP=5, STICK_GROUP_GAP=16;
function stickLayout(count){
  const xs=[0];
  for(let i=1;i<count;i++){
    const g=(i%5===0)?STICK_GROUP_GAP:STICK_GAP;
    xs.push(xs[i-1]+STICK_W+g);
  }
  const totW=count>0?(xs[xs.length-1]+STICK_W):0;
  return{xs,totW};
}

function tween(ms,onFrame,onDone){
  const t0=performance.now();
  let rafId;
  function loop(now){
    const t=Math.min((now-t0)/ms,1);
    onFrame(eio(t));
    if(t<1){rafId=requestAnimationFrame(loop);animIds.add(rafId);}
    else{animIds.delete(rafId);if(onDone)onDone();}
  }
  rafId=requestAnimationFrame(loop);
  animIds.add(rafId);
}

// ひっ算：くり上がり前に答え欄に表示した「2桁の生の合計」を、
// 「1の位はそのまま残る数字」と「くり上がってよそへ飛んでいく数字」の2つに分けるアニメーション。
// drawHissan(prevH)が描いた hs-ans{I/J/H}-tens / -ones の2つのテキスト要素をそのまま動かす。
function runHissanCarrySplit(svgEl,spec,onDone){
  const{raw,colX,destX,destY,idSuffix}=spec;
  const destFontSize=spec.destFontSize||19, destColor=spec.destColor||'#e74c3c';
  const off=11;
  const tEl=document.getElementById('hs-ans'+idSuffix+'-tens');
  const oEl=document.getElementById('hs-ans'+idSuffix+'-ones');
  if(!tEl||!oEl){onDone();return;}
  tween(480,t=>{
    // 1の位（残る数字）はわずかに中央へ寄るだけ
    oEl.setAttribute('x',String((colX+off)+(colX-(colX+off))*t));
    // くり上がる数字は、目的地へ移動しながら大きさ・色が変わる
    const x=(colX-off)+(destX-(colX-off))*t;
    const y=HROW3_Y+(destY-HROW3_Y)*t;
    const fs=34+(destFontSize-34)*t;
    tEl.setAttribute('x',String(x));
    tEl.setAttribute('y',String(y));
    tEl.setAttribute('font-size',String(fs));
    tEl.setAttribute('fill', t<0.5?'#1a7f37':destColor);
  },onDone);
}

// SVG座標 → アニメレイヤー座標
// ※ getBoundingClientRect()は「画面に見えている(STAGE_SCALEで拡大縮小された後の)ピクセル」を
//   返すが、mark-layer/anim-layerの内部座標系はレイアウト上のサイズ(拡大縮小前)のまま。
//   そのままだと二重にスケールされて位置がずれるため、STAGE_SCALE×数図ローカル倍率で割って戻す。
function svgToLayer(svgEl,svgX,svgY){
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const svgRect=svgEl.getBoundingClientRect();
  const vbW=parseFloat(svgEl.getAttribute('viewBox').split(' ')[2]);
  const vbH=parseFloat(svgEl.getAttribute('viewBox').split(' ')[3]);
  return{
    x:((svgRect.left-tileRect.left)+svgX*(svgRect.width/vbW))/(STAGE_SCALE*stableTilePanelFactor),
    y:((svgRect.top-tileRect.top)+svgY*(svgRect.height/vbH))/(STAGE_SCALE*stableTilePanelFactor)
  };
}

// ヘッダー要素の中心座標（layer基準）
function hdrCenter(id){
  const el=document.getElementById(id);
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  return{x:(r.left-tileRect.left+r.width/2)/(STAGE_SCALE*stableTilePanelFactor), y:(r.top-tileRect.top+r.height/2)/(STAGE_SCALE*stableTilePanelFactor)};
}

// ヘッダー要素の「真上」座標（ヘッダー上辺のすぐ外）
// ※ この-18(旧値)は見出しの上端から離れすぎており、くり上がりのタイル束
//    （高さ約79pxの棒／正方形）が画面上端よりさらに上まではみ出す原因になっていた。
//    見出しの文字は padding-top:6px の内側（おおむねy:8〜22あたり）にあり、
//    タイルの束はもともとその文字帯をまたぐ大きさのため、多少下げても
//    「文字が見えている／隠れている」の見え方はほぼ変わらない。
//    そこで、見出しのタイトル文字を消してしまわない範囲で値を小さくし、
//    上方向のはみ出しを最小限に抑える。
function aboveHdr(id){
  const el=document.getElementById(id);
  const tileRect=document.getElementById('tile-area').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  return{x:(r.left-tileRect.left+r.width/2)/(STAGE_SCALE*stableTilePanelFactor), y:(r.top-tileRect.top)/(STAGE_SCALE*stableTilePanelFactor)-8};
}

// 答えマスの「右上」座標（CARRY_POS_MODE === 'ans-sub' 用）
// 1つ上の位の答えのグリッドの右上（ブロックが約20%上にはみ出す位置）
function ansTopRight(place){
  const svgId = (place==='sen') ? 'svg-sen-ans' : ((place==='hyaku') ? 'svg-hyaku-ans' : 'svg-juu-ans');
  const svgEl = document.getElementById(svgId);
  const tileRect = document.getElementById('tile-area').getBoundingClientRect();
  const r = svgEl.getBoundingClientRect();
  // 横はグリッド右端から少し内側、縦は答えマスの最上部（B行との境界線）付近に置くことで、
  // ブロック（高さ79pxなど）の中心が境界線上〜やや上（約20%上にはみ出す）になる
  const x = (r.right - tileRect.left - 18) / (STAGE_SCALE * stableTilePanelFactor);
  const y = (r.top - tileRect.top + 10) / (STAGE_SCALE * stableTilePanelFactor);
  return {x, y};
}

// 音声読み上げ（すべての数字・演算記号を日本語の読みに変換してから話す）
// ============================================================
let voiceOn=true,ttsWarmedUp=false,currentUtter=null;

// 0〜9999の整数を日本語の読み（ひらがな）に変換する
function numToYomi(n){
  n=Math.round(n);
  if(n===0)return'ぜろ';
  if(n<0)return'まいなす '+numToYomi(-n);
  const ichiMap=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
  const juuMap  =['','じゅう','にじゅう','さんじゅう','よんじゅう','ごじゅう','ろくじゅう','ななじゅう','はちじゅう','きゅうじゅう'];
  const hyakuMap=['','ひゃく','にひゃく','さんびゃく','よんひゃく','ごひゃく','ろっぴゃく','ななひゃく','はっぴゃく','きゅうひゃく'];
  const senMap  =['','せん','にせん','さんぜん','よんせん','ごせん','ろくせん','ななせん','はっせん','きゅうせん'];
  const sen=Math.floor(n/1000)%10, hyaku=Math.floor(n/100)%10, juu=Math.floor(n/10)%10, ichi=n%10;
  let s='';
  s+=senMap[sen];
  s+=hyakuMap[hyaku];
  s+=juuMap[juu];
  s+=ichiMap[ichi];
  return s;
}

// HTML（タグ・数字・演算記号入り）を読み上げ用の日本語テキストに変換する
function toSpeechText(html){
  let s=String(html);
  s=s.replace(/<br\s*\/?>/gi,'。');     // 改行は「、」のように一拍おく
  s=s.replace(/<[^>]+>/g,'');           // 残りのタグは除去
  // 読み間違えやすい言葉は先に決まった読みへ置き換える（数字変換より前に処理する）
  s=s.replace(/1つ/g,'ひとつ');
  s=s.replace(/10こ/g,'じゅっこ');
  s=s.replace(/10本/g,'じゅっぽん');
  s=s.replace(/くり上/g,'くりあ');
  s=s.replace(/入らない/g,'はいらない');
  s=s.replace(/＋|\+/g,' たす ');
  s=s.replace(/－|-/g,' ひく ');
  s=s.replace(/×/g,' かける ');
  s=s.replace(/÷/g,' わる ');
  s=s.replace(/＝|=/g,' は ');
  s=s.replace(/▶|◀/g,'');
  s=s.replace(/\d+/g,m=>numToYomi(parseInt(m,10))); // 数字をすべて日本語の読みに変換
  s=s.replace(/\s+/g,' ').trim();
  return s;
}

// 無音のウォームアップ発話（一部のブラウザは最初の発話が無視されることがあるため、
// 起動直後（や音声ON直後）に1音だけ無音で読み上げてエンジンを起こしておく）
function warmupTTS(){
  if(ttsWarmedUp)return;
  if(!('speechSynthesis'in window))return;
  try{
    const u=new SpeechSynthesisUtterance('ん');
    u.lang='ja-JP';u.volume=0;
    window.speechSynthesis.speak(u);
    ttsWarmedUp=true;
  }catch(e){/* 読み上げ非対応環境では無視 */}
}

function speakText(text){
  if(!voiceOn)return;
  if(!('speechSynthesis'in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=.95;u.pitch=1.05;
    currentUtter=u;
    window.speechSynthesis.speak(u);
  }catch(e){/* 読み上げ非対応環境では無視 */}
}

function speakStep(descHtml){
  speakText(toSpeechText(descHtml));
}

function toggleVoice(){
  voiceOn=!voiceOn;
  const btn=document.getElementById('btn-voice');
  btn.classList.toggle('off',!voiceOn);
  if(voiceOn){
    warmupTTS();
  } else if('speechSynthesis'in window){
    window.speechSynthesis.cancel();
  }
}

function buildSteps(){
  const aH=Math.floor(numA/100),aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100),bJ=Math.floor((numB%100)/10),bI=numB%10;
  const ans=numA+numB;

  const hasCarryI=(aI+bI>=10);

  const jRaw=aJ+bJ+(hasCarryI?1:0);
  const hasCarryJ=(jRaw>=10);
  const jAns=jRaw%10;
  const hRaw=aH+bH+(hasCarryJ?1:0);
  const hasCarryH=(hRaw>=10);
  const hAns=hRaw%10;
  const sAns=hasCarryH?1:0; // 千の位答え（繰り上がり分のみ、入力<=999なので最大1）

  // 表示する列の判定
  // has3: 百の位の列が必要（入力が3桁、または答えが3桁以上）
  const has3=(aH>0||bH>0||ans>=100);
  // has4: 千の位の列が必要（答えが4桁、つまり1000以上）
  const has4=(ans>=1000);

  const aDigits=numA>=100?3:(numA>=10?2:1);
  const bDigits=numB>=100?3:(numB>=10?2:1);
  const maxDigits=Math.max(aDigits,bDigits); // ＋記号は「たす数・たされる数のうち多い方の桁数」で位置を決める
  const hBase={
    aS:0,aH,aJ,aI,bS:0,bH,bJ,bI,maxDigits,
    iSum,jRaw,hRaw, // くり上がり前の「2桁になってしまう」生の合計（くり上がり説明の表示用）
    iAns,jAns,hAns,sAns,has3,has4,
    showAS:false,showAH:false,showAJ:false,showAI:false,
    showBS:false,showBH:false,showBJ:false,showBI:false,
    showPlus:false,showLine:false,
    showCarryJ:false,showCarryH:false,
    carryJPop:false,carryHPop:false, // trueの間だけpop-inアニメを再生（くり上がり直後の1ステップのみ）
    showAnsI:false,showAnsJ:false,showAnsH:false,showAnsS:false,
    showAnsITemp:false,showAnsJTemp:false,showAnsHTemp:false, // くり上がり前：答え欄に2桁の生の合計を表示する
    hlIchi:false,hlJuu:false,hlHyaku:false,hlColIchi:false,hlColJuu:false,hlColHyaku:false,ansBox:false
  };

  const tBase={
    senA:{count:0,alpha:1,hl:null},   hyakuA:{count:0,alpha:1,hl:null},
    juuA:{count:0,alpha:1,hl:null},   ichiA:{count:0,alpha:1,hl:null},
    senB:{count:0,alpha:1,hl:null},   hyakuB:{count:0,alpha:1,hl:null},
    juuB:{count:0,alpha:1,hl:null},   ichiB:{count:0,alpha:1,hl:null},
    senAns:{count:0,alpha:1,hl:null}, hyakuAns:{count:0,alpha:1,hl:null},
    juuAns:{count:0,alpha:1,hl:null}, ichiAns:{count:0,alpha:1,hl:null},
    markJ:{show:false,alpha:1}, markH:{show:false,alpha:1}, // じゅう／ひゃくのヘッダー上に残るくり上がりマーク
    showAnsRow:false
  };

  const list=[];
  function prev(){
    if(!list.length)return{h:cloneState(hBase),t:cloneState(tBase),title:'',desc:'',anim:null,hissanSplit:null};
    const c=cloneState(list[list.length-1]);
    c.hissanSplit=null; // ワンショットの演出トリガーなので、次のステップには引き継がない
