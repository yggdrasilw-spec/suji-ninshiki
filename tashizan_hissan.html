    if(hasCarryJ&&has3)p.h.showAnsJTemp=true; else p.h.showAnsJ=true;
    p.h.carryJPop=false; // ここから先は静的表示（ポップ演出は再生しない）
    p.t.juuA={count:aJ,alpha:.25,hl:null};
    p.t.juuB={count:bJ,alpha:.25,hl:null};
    p.t.juuAns={count:jRaw,alpha:1,hl:null};
    if(hasCarryI)p.t.markJ={show:true,alpha:.35}; // 使われたので以後は半透明のまま残す
    p.anim='juu-calc';
    list.push(p);
  }

  // 十の位：1つの位には1つの数字しか入らないことの説明（くり上がりがあるときだけ）
  if(hasCarryJ&&has3){
    const p=prev();
    p.title='1つの位には1つの数字しか入らないよ';
    p.desc=`<span class="jc">${jRaw}</span> は 2けたの 数字です。<br>`
      +`<span class="cc">1つの位には、1つの数字しか入らないよ。</span><br>`
      +`10の まとまりを <span class="hc">ひゃくのくらい</span> に くり上げて かんがえます。`;
    p.anim=null;
    list.push(p);
  }

  // 十→百くり上がり（has3のとき）
  if(hasCarryJ&&has3){
    const p=prev();
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    p.title='10の たばが できた！ ひゃくに くり上げる';
    p.desc=`<span class="jc">じゅうのくらい</span>の <span class="jc">${jRaw}</span>本 のうち、<br>`
      +`<span class="cc">10本</span> が ひゃくの タイルに なります。<br>`
      +`その タイルを <span class="hc">ひゃくのくらい</span> に くり上げます。<br>`
      +`のこり <span class="jc">${jAns}本</span> が じゅうのくらいの こたえです。`;
    p.h.showAnsJTemp=false;p.h.showAnsJ=true;
    p.h.showCarryH=true;p.h.hlJuu=true;p.h.showAnsJ=true;p.h.hlColJuu=true;
    p.h.carryHPop=true; // この「くり上げる」ステップでだけポップ演出
    const destX = isAnsSub ? (H2X + 11) : H2X;
    const destY = isAnsSub ? (HLINE_Y + 13) : HCARRY_Y;
    const destFontSize = isAnsSub ? 13 : 19;
    p.hissanSplit={raw:jRaw,colX:HJX,destX,destY,destFontSize,idSuffix:'J'};
    p.t.juuAns={count:jAns,alpha:1,hl:null};
    p.t.hyakuAns={count:1,alpha:1,hl:'#e74c3c'};
    p.t.markH={show:true,alpha:1}; // くり上がりは、まだ使われていないのでしっかり表示
    p.anim='carry-j';
    list.push(p);
  }

  // 百の位計算（has3のとき）
  if(has3){
    const p=prev();
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    const totalH=hRaw;
    let titleStr, descMiddle;
    if(hasCarryJ){
      if(isAnsSub){
        titleStr = `ひゃくのくらいの けいさん：${aH}＋${bH}＋1＝${totalH}`;
        descMiddle = `<span class="hc">${aH} ＋ ${bH}</span> に くり上がった <span class="cc">1</span> を たして<br>`
          +`<span class="hc">${aH} ＋ ${bH} ＋ 1 ＝ ${totalH}</span>`;
      } else {
        titleStr = `ひゃくのくらいの けいさん：1＋${aH}＋${bH}＝${totalH}`;
        descMiddle = `くり上がった <span class="cc">1</span> と <span class="hc">${aH} ＋ ${bH}</span> で<br>`
          +`<span class="hc">1＋${aH} ＋ ${bH} ＝ ${totalH}</span>`;
      }
    } else {
      titleStr = `ひゃくのくらいの けいさん：${aH}＋${bH}＝${totalH}`;
      descMiddle = `<span class="hc">${aH} ＋ ${bH} ＝ ${totalH}</span>`;
    }
    p.title = titleStr;
    p.desc = `<span class="hc">ひゃくのくらい</span>を けいさんします。<br>`
      + descMiddle
      +(hasCarryH?`<br>10より おおきいので <span class="cc">くり上がり</span> があります。`:'');
    p.h.hlJuu=false;p.h.hlHyaku=true;p.h.hlColJuu=false;p.h.hlColHyaku=true;
    if(hasCarryH&&has4)p.h.showAnsHTemp=true; else p.h.showAnsH=true;
    p.h.carryHPop=false; // 十→百のポップ演出はここで終了（数字「1」自体は表示し続ける）
    p.t.hyakuA={count:aH,alpha:.25,hl:null};
    p.t.hyakuB={count:bH,alpha:.25,hl:null};
    p.t.hyakuAns={count:hRaw,alpha:1,hl:null};
    if(hasCarryJ)p.t.markH={show:true,alpha:.35}; // 下の段に降りて使われたので、以後は半透明のまま残す
    p.anim='hyaku-calc';
    list.push(p);
  }

  // 百の位：1つの位には1つの数字しか入らないことの説明（くり上がりがあるときだけ）
  if(hasCarryH&&has4){
    const p=prev();
    p.title='1つの位には1つの数字しか入らないよ';
    p.desc=`<span class="hc">${hRaw}</span> は 2けたの 数字です。<br>`
      +`<span class="cc">1つの位には、1つの数字しか入らないよ。</span><br>`
      +`10の まとまりを <span class="sc">せんのくらい</span> に くり上げて かんがえます。`;
    p.anim=null;
    list.push(p);
  }

  // 百→千くり上がり（has4のとき）
  if(hasCarryH&&has4){
    const p=prev();
    p.title='ひゃくが10まいに！ せんに くり上げる';
    p.desc=`<span class="hc">ひゃくのくらい</span>の <span class="hc">${hRaw}まい</span> のうち、<br>`
      +`<span class="cc">10まい</span> が せんのたばに なります。<br>`
      +`その たばを <span class="sc">せんのくらい</span> に くり上げます。<br>`
      +`のこり <span class="hc">${hAns}まい</span> が ひゃくのくらいの こたえです。`;
    p.h.showAnsHTemp=false;p.h.showAnsH=true;
    p.h.showAnsS=true;p.h.hlHyaku=true;p.h.hlColHyaku=true;
    // 千の位は他の桁のような「小さい赤字のくり上がり」ではなく、そのまま答えの数字になる
    p.hissanSplit={raw:hRaw,colX:H2X,destX:HSX,destY:HROW3_Y,destFontSize:34,destColor:'#1a7f37',idSuffix:'H'};
    p.t.hyakuAns={count:hAns,alpha:1,hl:null};
    p.t.senAns={count:0,alpha:1,hl:null}; // まだ答え行には降りていない(ヘッダー上に留まっている)
    p.anim='carry-h';
    list.push(p);
  }

  // せんのくらいの計算（has4のとき）：ヘッダー上のせんタイルが答え行に降りてくる
  if(has4){
    const p=prev();
    p.title=`せんのくらいの こたえ：${sAns}`;
    p.desc=`<span class="sc">せんのくらい</span>には、くり上がった `
      +`<span class="cc">1まい</span> がそのまま こたえになります。`;
    p.h.hlHyaku=false;
    p.t.senAns={count:sAns,alpha:1,hl:null};
    p.anim='sen-calc';
    list.push(p);
  }

  // 最終
  {
    const p=prev();
    p.title=`こたえは ${ans} です！`;
    const parts=[];
    if(has4) parts.push(`<span class="sc">せんのくらい ${sAns}</span>`);
    if(has3) parts.push(`<span class="hc">ひゃくのくらい ${hAns}</span>`);
    parts.push(`<span class="jc">じゅうのくらい ${jAns}</span>`);
    parts.push(`<span class="ic">いちのくらい ${iAns}</span>`);
    p.desc=parts.join('、')+`<br><span class="ac">${numA} ＋ ${numB} ＝ ${ans}</span>`;
    p.h.hlJuu=false;p.h.hlHyaku=false;p.h.ansBox=true;
    p.h.carryJPop=false;p.h.carryHPop=false;
    p.t.juuA={count:aJ,alpha:.25,hl:null};p.t.juuB={count:bJ,alpha:.25,hl:null};
    if(has3){p.t.hyakuA={count:aH,alpha:.25,hl:null};p.t.hyakuB={count:bH,alpha:.25,hl:null};}
    p.anim=null;
    list.push(p);
  }

  return list;
}

// ============================================================
// タイル描画
// ============================================================
function paintTiles(ts){
  const rSen  =DISPLAY_MODE==='card'?renderSenCard  :renderSens;
  const rHyaku=DISPLAY_MODE==='card'?renderHyakuCard:renderHyakus;
  const rJuu  =DISPLAY_MODE==='card'?renderJuuCard  :renderSticks;
  const rIchi =DISPLAY_MODE==='card'?renderIchiCard :renderIchi;

  rSen  (document.getElementById('svg-sen-a'),   ts.senA.count,  ts.senA.alpha,  ts.senA.hl);
  rHyaku(document.getElementById('svg-hyaku-a'), ts.hyakuA.count,ts.hyakuA.alpha,ts.hyakuA.hl);
  rJuu  (document.getElementById('svg-juu-a'),   ts.juuA.count,  ts.juuA.alpha,  ts.juuA.hl);
  rIchi (document.getElementById('svg-ichi-a'),  ts.ichiA.count, ts.ichiA.alpha, ts.ichiA.hl);
  rSen  (document.getElementById('svg-sen-b'),   ts.senB.count,  ts.senB.alpha,  ts.senB.hl);
  rHyaku(document.getElementById('svg-hyaku-b'), ts.hyakuB.count,ts.hyakuB.alpha,ts.hyakuB.hl);
  rJuu  (document.getElementById('svg-juu-b'),   ts.juuB.count,  ts.juuB.alpha,  ts.juuB.hl);
  rIchi (document.getElementById('svg-ichi-b'),  ts.ichiB.count, ts.ichiB.alpha, ts.ichiB.hl);

  // 答え欄の「枠」自体は最初から常に表示しておく（あとから枠が出現すると
  // レイアウトがガクッと変わって見えるため）。中身(タイル)はcount=0のときは
  // render関数側が何も描かないので、空の枠だけが見える状態になる。
  const rowAns=document.getElementById('row-ans');
  rowAns.style.display='table-row';
  rSen  (document.getElementById('svg-sen-ans'),   ts.senAns.count,  ts.senAns.alpha,  ts.senAns.hl);
  rHyaku(document.getElementById('svg-hyaku-ans'), ts.hyakuAns.count,ts.hyakuAns.alpha,ts.hyakuAns.hl);
  rJuu  (document.getElementById('svg-juu-ans'),   ts.juuAns.count,  ts.juuAns.alpha,  ts.juuAns.hl);
  rIchi (document.getElementById('svg-ichi-ans'),  ts.ichiAns.count, ts.ichiAns.alpha, ts.ichiAns.hl);

  drawHeaderMarks(ts);
}

// じゅう／ひゃくのヘッダーの真上に残る「くり上がりマーク」を描く。
// アニメーション専用のanim-layerとは別の常設レイヤー(mark-layer)に描くため、
// ステップを進めてもanim-layerがクリアされても消えずに残り続ける。
// くり上がった直後はしっかり表示（alpha:1）、下の段の計算に使われた後は
// 半透明（alpha:.35）になり、そのまま手順の最後まで残る。
function drawHeaderMarks(ts){
  const layer=document.getElementById('mark-layer');
  layer.innerHTML='';
  const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
  if(DISPLAY_MODE==='card'){
    if(ts.markJ&&ts.markJ.show){
      const pos=isAnsSub ? ansTopRight('juu') : aboveHdr('hdr-juu');
      drawCardSingle(mk('g',{},layer),pos.x,pos.y,'juu',1,ts.markJ.alpha,'#e74c3c');
    }
    if(ts.markH&&ts.markH.show){
      const pos=isAnsSub ? ansTopRight('hyaku') : aboveHdr('hdr-hyaku');
      drawCardSingle(mk('g',{},layer),pos.x,pos.y,'hyaku',1,ts.markH.alpha,'#e74c3c');
    }
  } else {
    if(ts.markJ&&ts.markJ.show){
      const pos=isAnsSub ? ansTopRight('juu') : aboveHdr('hdr-juu');
      const JH=10*U+9*U*.15,bx=pos.x-U/2,by=pos.y-JH/2;
      const g=mk('g',{opacity:ts.markJ.alpha},layer);
      for(let i=0;i<10;i++){const sh=JH/10;mk('rect',{x:bx,y:by+i*sh,width:U,height:sh-.3,fill:FC,stroke:SC,'stroke-width':.6,rx:.3},g);}
      mk('rect',{x:bx-1,y:by-1,width:U+2,height:JH+2,fill:'none',stroke:'#e74c3c','stroke-width':2,rx:1},g);
    }
    if(ts.markH&&ts.markH.show){
      const pos=isAnsSub ? ansTopRight('hyaku') : aboveHdr('hdr-hyaku');
      const HW=vbW('svg-hyaku-ans'),HH_SVG=vbH('svg-hyaku-ans');
      const su=U*Math.min((HW-8)/HYAKU_SIDE,(HH_SVG-8)/HYAKU_SIDE,1);
      drawHyakuScaled(mk('g',{},layer),pos.x,pos.y,su,ts.markH.alpha,'#e74c3c');
    }
  }
}

// ============================================================
// カード方式 専用アニメーション
// タイル版にある「appear / ○○-calc / carry-○」の3パターンを、
// 桁(place)を引数に取る汎用関数3つで表現する。
// 新しい桁（例：万の位 'man'）を追加したときも、CARD_CFGに
// エントリを足すだけでこの3関数がそのまま動く。
// ============================================================
const PLACE_HDR={ichi:'hdr-ichi',juu:'hdr-juu',hyaku:'hdr-hyaku',sen:'hdr-sen'};
const PLACE_SVG={ichi:'svg-ichi',juu:'svg-juu',hyaku:'svg-hyaku',sen:'svg-sen'};

// place方向の1つ上の桁を返す（ichi→juu→hyaku→sen）
function upperPlace(place){
  return {ichi:'juu',juu:'hyaku',hyaku:'sen'}[place]||null;
}

// --- カードが1枚ずつポップインで出現 ---
function runAppearCard(place,who,count,onDone){
  const svgEl=document.getElementById(`${PLACE_SVG[place]}-${who}`);
  svgEl.innerHTML='';
  const W=vbW(svgEl.id),H=parseInt(svgEl.getAttribute('height'))||110;
  const pos=cardPositions(count,place,W,H);
  let i=0;
  (function next(){
    if(i>=pos.length){onDone();return;}
    const g=mk('g',{opacity:0},svgEl);
    drawCardSingle(g,pos[i].cx,pos[i].cy,place,pos[i].scale??1,1,null);
    tween(180,t=>g.setAttribute('opacity',t),()=>{i++;next();});
  })();
}

// --- A・Bのカードが答え行へ集まる（くり上がり分は見出し上から合流）---
function runCalcCard(place,countA,countB,sumCount,hasCarryIn,onDone,layer){
  document.getElementById('row-ans').style.display='table-row';
  const svgA=document.getElementById(`${PLACE_SVG[place]}-a`);
  const svgB=document.getElementById(`${PLACE_SVG[place]}-b`);
  const svgAns=document.getElementById(`${PLACE_SVG[place]}-ans`);
  const Wa=vbW(svgA.id),Ha=parseInt(svgA.getAttribute('height'))||110;
  const Wb=vbW(svgB.id),Hb=parseInt(svgB.getAttribute('height'))||110;
  const Wans=vbW(svgAns.id),Hans=parseInt(svgAns.getAttribute('height'))||94;

  const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
  const carryAbove = hasCarryIn ? (isAnsSub ? ansTopRight(place) : aboveHdr(PLACE_HDR[place])) : null;
  const carrySrc=hasCarryIn?[{...carryAbove,scale:1}]:[];
  const posA=cardPositions(countA,place,Wa,Ha).map(p=>({...svgToLayer(svgA,p.cx,p.cy),scale:p.scale??1}));
  const posB=cardPositions(countB,place,Wb,Hb).map(p=>({...svgToLayer(svgB,p.cx,p.cy),scale:p.scale??1}));
  const dstAll=cardPositions(sumCount,place,Wans,Hans).map(p=>({...svgToLayer(svgAns,p.cx,p.cy),scale:p.scale??1}));
  const allSrc=[...carrySrc,...posA,...posB];

  renderCard(svgA,countA,place,.25);
  renderCard(svgB,countB,place,.25);
  svgAns.innerHTML='';layer.innerHTML='';

  const cardGs=allSrc.map((p,i)=>{
    const g=mk('g',{},layer);
    const isCarry=(hasCarryIn&&i===0);
    drawCardSingle(g,p.x,p.y,place,p.scale,1,isCarry?'#e74c3c':null);
    return g;
  });
  tween(560,t=>{
    cardGs.forEach((g,i)=>{
      const dst=dstAll[i]||dstAll[dstAll.length-1];
      const tx=allSrc[i].x+(dst.x-allSrc[i].x)*t;
      const ty=allSrc[i].y+(dst.y-allSrc[i].y)*t;
      const sc=allSrc[i].scale+(dst.scale-allSrc[i].scale)*t;
      g.innerHTML='';
      drawCardSingle(g,tx,ty,place,sc,1,(hasCarryIn&&i===0)?'#e74c3c':null);
    });
  },()=>{
    layer.innerHTML='';
    renderCard(svgAns,sumCount,place,1);
    onDone();
  });
}

// --- 10枚のカードが弾けて1枚の上位カードに変わり、上の桁へ移動 ---
function runCarryCard(place,totalCount,remainCount,onDone,layer){
  const upper=upperPlace(place);
  const svgAns=document.getElementById(`${PLACE_SVG[place]}-ans`);
  const W=vbW(svgAns.id),H=parseInt(svgAns.getAttribute('height'))||94;
  const allPos=cardPositions(totalCount,place,W,H);
  const baseScale=allPos[0]?.scale??1;
  const pos10L=allPos.slice(0,10).map(p=>({...svgToLayer(svgAns,p.cx,p.cy),scale:p.scale??1}));
  const posR=allPos.slice(10);

  const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
  const dest = isAnsSub ? ansTopRight(upper) : aboveHdr(PLACE_HDR[upper]);
  const srcCx=pos10L.reduce((s,p)=>s+p.x,0)/pos10L.length;
  const srcCy=pos10L.reduce((s,p)=>s+p.y,0)/pos10L.length;
  const cfg=CARD_CFG[place];
  const cw=cfg.w*baseScale,ch=cfg.h*baseScale;

  // 点線で「10枚のかたまり」だけを囲む。残りはそのまま通常表示で動かさない。
  const xs=pos10L.map(p=>p.x),ys=pos10L.map(p=>p.y),m=6;
  const bx0=Math.min(...xs)-cw/2-m, by0=Math.min(...ys)-ch/2-m;
  const bw0=Math.max(...xs)-Math.min(...xs)+cw+m*2, bh0=Math.max(...ys)-Math.min(...ys)+ch+m*2;
  const dash=mk('rect',{x:bx0,y:by0,width:bw0,height:bh0,fill:'none',stroke:'#e74c3c','stroke-width':2,'stroke-dasharray':'5,4',rx:5,opacity:0},layer);
  tween(220,t=>dash.setAttribute('opacity',t),()=>{
    setTimeout(()=>{
      // 囲んだ10枚を元の場所から外し、残りカードだけ通常表示で描き直す
      svgAns.innerHTML='';
      posR.forEach(p=>drawCardSingle(mk('g',{},svgAns),p.cx,p.cy,place,p.scale??1,1));
      // phase1: 点線で囲んだ部分（10枚＋枠）だけを中心に縮小する
      const gs=pos10L.map(p=>{
        const g=mk('g',{},layer);
        drawCardSingle(g,p.x,p.y,place,p.scale,1,'#e74c3c');
        return g;
      });
      tween(320,t=>{
        gs.forEach((g,i)=>{
          const sx=pos10L[i].x+(srcCx-pos10L[i].x)*t;
          const sy=pos10L[i].y+(srcCy-pos10L[i].y)*t;
          const sc=1-0.55*t;
          g.setAttribute('transform',`translate(${sx-pos10L[i].x},${sy-pos10L[i].y}) translate(${pos10L[i].x},${pos10L[i].y}) scale(${sc}) translate(${-pos10L[i].x},${-pos10L[i].y})`);
        });
        const bw=bw0*(1-.85*t), bh=bh0*(1-.85*t);
        dash.setAttribute('x',srcCx-bw/2);dash.setAttribute('y',srcCy-bh/2);
        dash.setAttribute('width',bw);dash.setAttribute('height',bh);
        dash.setAttribute('opacity',1-t);
      },()=>{
        layer.innerHTML='';
        // phase2: 1枚の上位カードに変わってポップ
        const gUp=mk('g',{opacity:0},layer);
        drawCardSingle(gUp,srcCx,srcCy,upper,baseScale*0.4,1,'#e74c3c');
        tween(260,t=>{
          const sc=baseScale*(0.4+0.6*Math.min(1,t*1.3));
          gUp.innerHTML='';
          drawCardSingle(gUp,srcCx,srcCy,upper,sc,1,'#e74c3c');
          gUp.setAttribute('opacity',Math.min(1,t*2));
        },()=>{
          // phase3: 上位の見出しの真上へ移動
          tween(360,t=>{
            const cx=srcCx+(dest.x-srcCx)*t;
            const cy=srcCy+(dest.y-srcCy)*t;
            gUp.innerHTML='';
            drawCardSingle(gUp,cx,cy,upper,baseScale,1,'#e74c3c');
          },()=>{
            layer.innerHTML='';
            // 元の桁：残りカードを正式に描画
            svgAns.innerHTML='';
            if(remainCount>0)renderCard(svgAns,remainCount,place,1);
            // 上位の見出しの真上にしっかり表示で残す（まだ使われていないので半透明にしない。
            // ichi→juu, juu→hyakuの場合はこの直後にpaintTilesがmark-layerへ引き継ぐ）
            const gRest=mk('g',{},layer);
            drawCardSingle(gRest,dest.x,dest.y,upper,baseScale,1,'#e74c3c');
            onDone();
          });
        });
      });
    },480);
  });
}

function runAnimCard(animType,n,layer,onDone){
  const{aH,aJ,aI,bH,bJ,bI,hasCarryI,iSum,iAns,jRaw,hasCarryJ,jAns,hRaw,hasCarryH,hAns}=n;

  if(animType==='appear-hyaku-a'){runAppearCard('hyaku','a',aH,onDone);return;}
  if(animType==='appear-hyaku-b'){runAppearCard('hyaku','b',bH,onDone);return;}
  if(animType==='appear-juu-a'){runAppearCard('juu','a',aJ,onDone);return;}
  if(animType==='appear-juu-b'){runAppearCard('juu','b',bJ,onDone);return;}
  if(animType==='appear-ichi-a'){runAppearCard('ichi','a',aI,onDone);return;}
  if(animType==='appear-ichi-b'){runAppearCard('ichi','b',bI,onDone);return;}

  if(animType==='ichi-calc'){runCalcCard('ichi',aI,bI,iSum,false,onDone,layer);return;}
  if(animType==='juu-calc'){runCalcCard('juu',aJ,bJ,jRaw,hasCarryI,onDone,layer);return;}
  if(animType==='hyaku-calc'){runCalcCard('hyaku',aH,bH,hRaw,hasCarryJ,onDone,layer);return;}

  if(animType==='carry-i'){runCarryCard('ichi',iSum,iAns,onDone,layer);return;}
  if(animType==='carry-j'){runCarryCard('juu',jRaw,jAns,onDone,layer);return;}
  if(animType==='carry-h'){runCarryCard('hyaku',hRaw,hAns,onDone,layer);return;}

  // --- sen-calc: ヘッダー真上のせんカードが答え行(せんのくらい)へ降りてくる ---
  if(animType==='sen-calc'){
    document.getElementById('row-ans').style.display='table-row';
    const svgSenAns=document.getElementById('svg-sen-ans');
    svgSenAns.innerHTML='';
    const src=aboveHdr('hdr-sen');
    const cx=vbW('svg-sen-ans')/2, cy=120/2;
    const dest=svgToLayer(svgSenAns,cx,cy);
    layer.innerHTML='';
    const g=mk('g',{},layer);
    drawCardSingle(g,src.x,src.y,'sen',1,1,'#e74c3c');
    tween(420,t=>{
      const tx=src.x+(dest.x-src.x)*t;
      const ty=src.y+(dest.y-src.y)*t;
      g.setAttribute('transform',`translate(${tx-src.x},${ty-src.y})`);
    },()=>{
      layer.innerHTML='';
      renderCard(svgSenAns,1,'sen',1);
      onDone();
    });
    return;
  }

  layer.innerHTML='';
  onDone();
}

// ============================================================
// アニメーション本体
// ============================================================
function runAnim(animType,prevState,nextState,onDone){
  const layer=document.getElementById('anim-layer');
  layer.innerHTML='';
  if(!animType){onDone();return;}

  const aH=Math.floor(numA/100),aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100),bJ=Math.floor((numB%100)/10),bI=numB%10;
  const ans=numA+numB;
  const hasCarryI=(aI+bI>=10);
  const iSum=aI+bI,iAns=iSum%10;
  const jRaw=aJ+bJ+(hasCarryI?1:0);
  const hasCarryJ=(jRaw>=10);
  const jAns=jRaw%10;
  const hRaw=aH+bH+(hasCarryJ?1:0);
  const hasCarryH=(hRaw>=10);
  const hAns=hRaw%10;
  const has3=(aH>0||bH>0||ans>=100);
  const has4=(ans>=1000);

  // 百タイル描画スケール（hyakuセル用：動的に広がった幅・高さに対応）
  const HW=vbW('svg-hyaku-ans'),HH_SVG=vbH('svg-hyaku-ans');
  const su=U*Math.min((HW-8)/HYAKU_SIDE,(HH_SVG-8)/HYAKU_SIDE,1);

  // ============================================================
  // カードモード：アニメーションはタイル版と完全に別ルートで処理する。
  // 桁の種類（ichi/juu/hyaku/sen）に関わらず同じ4つの汎用関数で
  // 表現できるため、桁数が増えても新しい分岐を追加する必要がない。
  // ============================================================
  if(DISPLAY_MODE==='card'){
    runAnimCard(animType,{aH,aJ,aI,bH,bJ,bI,ans,hasCarryI,iSum,iAns,jRaw,hasCarryJ,jAns,hRaw,hasCarryH,hAns,has3,has4},layer,onDone);
    return;
  }

  // --- appear-hyaku-a / b ---
  if(animType==='appear-hyaku-a'||animType==='appear-hyaku-b'){
    const id=animType==='appear-hyaku-a'?'svg-hyaku-a':'svg-hyaku-b';
    const count=animType==='appear-hyaku-a'?aH:bH;
    const svgEl=document.getElementById(id);
    svgEl.innerHTML='';
    // renderHyakusと完全に同じ式で位置・縮尺を計算する（最初の出現位置と最終位置を一致させる）
    const W=vbW(id),H=vbH(id),side=HYAKU_SIDE;
    const sc=Math.min((W-8)/side,(H-8)/side,1);
    const suA=U*sc;let si=0;
    (function next(){
      if(si>=count){onDone();return;}
      const{cx,cy}=hyakuTilePos(si,count,W,H,suA);
      const g=mk('g',{opacity:0},svgEl);
      drawHyakuScaled(g,cx,cy,suA,1,SC);
      tween(280,t=>g.setAttribute('opacity',t),()=>{si++;next();});
    })();
    return;
  }

  // --- appear-juu-a / b ---
  if(animType==='appear-juu-a'||animType==='appear-juu-b'){
    const id=animType==='appear-juu-a'?'svg-juu-a':'svg-juu-b';
    const count=animType==='appear-juu-a'?aJ:bJ;
    const svgEl=document.getElementById(id);
    svgEl.innerHTML='';
    // renderSticksと完全に同じ式で位置を計算する（最初の出現位置と最終位置を一致させる）
    const W=vbW(id),H=vbH(id);
    const{xs,totW}=stickLayout(count);
    const sx0=(W-totW)/2;
    let si=0;
    (function next(){
      if(si>=count){onDone();return;}
      const cx=sx0+xs[si]+STICK_W/2,cy=H/2;
      const g=mk('g',{opacity:0},svgEl);
      drawStick(g,cx,cy,U,1);
      tween(200,t=>g.setAttribute('opacity',t),()=>{si++;next();});
    })();
    return;
  }

  // --- appear-ichi-a / b ---
  if(animType==='appear-ichi-a'||animType==='appear-ichi-b'){
    const id=animType==='appear-ichi-a'?'svg-ichi-a':'svg-ichi-b';
    const count=animType==='appear-ichi-a'?aI:bI;
    const svgEl=document.getElementById(id);
    svgEl.innerHTML='';
    const W=110,H=110;
    const tmp=mk('svg',{width:0,height:0,style:'position:absolute;visibility:hidden'});
    document.body.appendChild(tmp);
    const pos=drawIchi(tmp,count,W,H,1,null);
    document.body.removeChild(tmp);
    let ii=0;
    (function next(){
      if(ii>=pos.length){onDone();return;}
      const{cx,cy}=pos[ii];
      const r=mk('rect',{x:cx-U/2,y:cy-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6,opacity:0},svgEl);
      tween(140,t=>r.setAttribute('opacity',t),()=>{ii++;next();});
    })();
    return;
  }

  // --- ichi-calc ---
  if(animType==='ichi-calc'){
    document.getElementById('row-ans').style.display='table-row';
    ['svg-sen-ans','svg-hyaku-ans','svg-juu-ans','svg-ichi-ans'].forEach(id=>document.getElementById(id).innerHTML='');
    const W=110,HH=110,HA=120;
    const svgA=document.getElementById('svg-ichi-a');
    const svgB=document.getElementById('svg-ichi-b');
    const svgAns=document.getElementById('svg-ichi-ans');
    const posA=drawIchi(mk('svg',{width:0,height:0}),aI,W,HH,1,null);
    const posB=drawIchi(mk('svg',{width:0,height:0}),bI,W,HH,1,null);
    const posAns=drawIchi(mk('svg',{width:0,height:0}),iSum,W,HA,1,null);
    const lA=posA.map(p=>svgToLayer(svgA,p.cx,p.cy));
    const lB=posB.map(p=>svgToLayer(svgB,p.cx,p.cy));
    const lAns=posAns.map((_,i)=>svgToLayer(svgAns,posAns[i].cx,posAns[i].cy));
    renderIchi(svgA,aI,.25);renderIchi(svgB,bI,.25);
    const allSrc=[...lA,...lB];
    const rects=allSrc.map(p=>mk('rect',{x:p.x-U/2,y:p.y-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6},layer));
    tween(520,t=>{
      rects.forEach((r,i)=>{
        const dst=lAns[i]||lAns[lAns.length-1];
        r.setAttribute('x',allSrc[i].x+(dst.x-allSrc[i].x)*t-U/2);
        r.setAttribute('y',allSrc[i].y+(dst.y-allSrc[i].y)*t-U/2);
      });
    },()=>{layer.innerHTML='';renderIchi(svgAns,iSum,1);onDone();});
    return;
  }

  // --- carry-i: 一→十くり上がり ---
  if(animType==='carry-i'){
    const svgAnsI=document.getElementById('svg-ichi-ans');
    const W=110,HA=120;
    const posAll=drawIchi(mk('svg',{width:0,height:0}),iSum,W,HA,1,null);
    const pos10=posAll.slice(0,10);
    const posR=posAll.slice(10);
    const l10=pos10.map(p=>svgToLayer(svgAnsI,p.cx,p.cy));
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    const dest = isAnsSub ? ansTopRight('juu') : aboveHdr('hdr-juu');
    const srcCx=l10.reduce((s,p)=>s+p.x,0)/10;
    const srcCy=l10.reduce((s,p)=>s+p.y,0)/10;

    // 点線で「10個のかたまり」だけを囲む。囲んでいない残りは通常表示のまま動かさない。
    const xs=l10.map(p=>p.x),ys=l10.map(p=>p.y),m=U*.8;
    const bx0=Math.min(...xs)-U/2-m, by0=Math.min(...ys)-U/2-m;
    const bw0=Math.max(...xs)-Math.min(...xs)+U+m*2, bh0=Math.max(...ys)-Math.min(...ys)+U+m*2;
    const dash=mk('rect',{x:bx0,y:by0,width:bw0,height:bh0,fill:'none',stroke:'#e74c3c','stroke-width':2,'stroke-dasharray':'5,4',rx:4,opacity:0},layer);
    tween(220,t=>dash.setAttribute('opacity',t),()=>{
      setTimeout(()=>{
        // 囲んだ10個を元の場所から外し、残り（iAns個）だけを通常表示で描き直す
        svgAnsI.innerHTML='';
        posR.forEach(p=>mk('rect',{x:p.cx-U/2,y:p.cy-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6},svgAnsI));
        // phase1: 点線で囲んだ部分（10個＋枠）だけを中心に縮小する
        const rects=l10.map(p=>mk('rect',{x:p.x-U/2,y:p.y-U/2,width:U,height:U,fill:FC,stroke:SC,'stroke-width':1,rx:.6},layer));
        tween(320,t=>{
          rects.forEach((r,i)=>{
            const cx=l10[i].x+(srcCx-l10[i].x)*t, cy=l10[i].y+(srcCy-l10[i].y)*t;
            const sz=U*(1-.5*t);
            r.setAttribute('x',cx-sz/2);r.setAttribute('y',cy-sz/2);
            r.setAttribute('width',sz);r.setAttribute('height',sz);
          });
          const bw=bw0+(U*1.2-bw0)*t, bh=bh0+(U*1.2-bh0)*t;
          dash.setAttribute('x',srcCx-bw/2);dash.setAttribute('y',srcCy-bh/2);
          dash.setAttribute('width',bw);dash.setAttribute('height',bh);
          dash.setAttribute('opacity',1-t);
        },()=>{
          // phase2: 棒に変形
          layer.innerHTML='';
          const JH=10*U+9*U*.15;
          tween(260,t=>{
            layer.innerHTML='';
            const curH=U+(JH-U)*t;
            const bx=srcCx-U/2,by=srcCy-curH/2;
            for(let i=0;i<10;i++){const sh=curH/10;mk('rect',{x:bx,y:by+i*sh,width:U,height:sh-.3,fill:FC,stroke:SC,'stroke-width':.6*(.2+t*.8),rx:.3,opacity:.4+.6*t},layer);}
            mk('rect',{x:bx-1,y:by-1,width:U+2,height:curH+2,fill:'none',stroke:'#e74c3c','stroke-width':2},layer);
          },()=>{
            // phase3: 目的地へ飛ぶ
            tween(380,t=>{
              layer.innerHTML='';
              const cx=srcCx+(dest.x-srcCx)*t;
              const cy=srcCy+(dest.y-srcCy)*t;
              const bx=cx-U/2,by=cy-JH/2;
              for(let i=0;i<10;i++){const sh=JH/10;mk('rect',{x:bx,y:by+i*sh,width:U,height:sh-.3,fill:FC,stroke:SC,'stroke-width':.6,rx:.3},layer);}
              mk('rect',{x:bx-1,y:by-1,width:U+2,height:JH+2,fill:'none',stroke:'#e74c3c','stroke-width':2*(1-t*.7),rx:1},layer);
            },()=>{
              layer.innerHTML='';
              onDone();
            });
          });
        });
      },480);
    });
    return;
  }

  // --- juu-calc: 十の位 ---
  if(animType==='juu-calc'){
    document.getElementById('row-ans').style.display='table-row';
    const svgJA=document.getElementById('svg-juu-a');
    const svgJB=document.getElementById('svg-juu-b');
    const svgJAns=document.getElementById('svg-juu-ans');
    const W=vbW('svg-juu-a'),H=vbH('svg-juu-a'),HA=vbH('svg-juu-ans'),stW=STICK_W;
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    // carry棒の出発位置
    const carryAbove = isAnsSub ? ansTopRight('juu') : aboveHdr('hdr-juu');
    const carrySrc=hasCarryI?[carryAbove]:[];
    // A棒・B棒出発位置（renderSticksと同じグループ間隔の式を使う）
    const layA=stickLayout(aJ),sxA0=(W-layA.totW)/2;
    const srcA=layA.xs.map(x=>svgToLayer(svgJA,sxA0+x+stW/2,H/2));
    const layB=stickLayout(bJ),sxB0=(W-layB.totW)/2;
    const srcB=layB.xs.map(x=>svgToLayer(svgJB,sxB0+x+stW/2,H/2));
    // 移動先
    const layAns=stickLayout(jRaw),sxAns0=(W-layAns.totW)/2;
    const dstAll=layAns.xs.map(x=>svgToLayer(svgJAns,sxAns0+x+stW/2,HA/2));
    const allSrc=[...carrySrc,...srcA,...srcB];
    renderSticks(svgJA,aJ,.25);renderSticks(svgJB,bJ,.25);
    svgJAns.innerHTML='';layer.innerHTML='';
    const stickGs=allSrc.map((p,i)=>{
      const g=mk('g',{},layer);
      const isC=(hasCarryI&&i===0);
      drawStick(g,p.x,p.y,U,1,isC?'#e74c3c':SC); // 移動するタイル自体は濃い色のまま
      return g;
    });
    // くり上がり棒が出発した瞬間に、残像（mark-layer）を半透明に切り替える
    if(hasCarryI){
      const ml=document.getElementById('mark-layer');ml.innerHTML='';
      const pos = isAnsSub ? ansTopRight('juu') : aboveHdr('hdr-juu');
      const JH=10*U+9*U*.15,bx=pos.x-U/2,by=pos.y-JH/2;
      const g=mk('g',{opacity:.35},ml);
      for(let i=0;i<10;i++){const sh=JH/10;mk('rect',{x:bx,y:by+i*sh,width:U,height:sh-.3,fill:FC,stroke:SC,'stroke-width':.6,rx:.3},g);}
    }
    tween(600,t=>{
      stickGs.forEach((g,i)=>{
        const tx=allSrc[i].x+(dstAll[i].x-allSrc[i].x)*t;
        const ty=allSrc[i].y+(dstAll[i].y-allSrc[i].y)*t;
        g.setAttribute('transform',`translate(${tx-allSrc[i].x},${ty-allSrc[i].y})`);
      });
    },()=>{
      layer.innerHTML='';
      renderSticks(svgJAns,jRaw,1);
      onDone();
    });
    return;
  }

  // --- carry-j: 十→百くり上がり ---
  if(animType==='carry-j'){
    const svgJAns=document.getElementById('svg-juu-ans');
    const HA=vbH('svg-juu-ans'),stW=STICK_W;
    const{xs,totW}=stickLayout(jRaw);
    const W=vbW('svg-juu-ans'),sx0=(W-totW)/2;
    const allPos=xs.map(x=>({x:sx0+x+stW/2,y:HA/2}));
    const pos10=allPos.slice(0,10);
    const posR=allPos.slice(10);
    const src10=pos10.map(p=>svgToLayer(svgJAns,p.x,p.y));
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    const dest = isAnsSub ? ansTopRight('hyaku') : aboveHdr('hdr-hyaku');
    const srcCx=src10.reduce((s,p)=>s+p.x,0)/10;
    const srcCy=src10.reduce((s,p)=>s+p.y,0)/10;

    // 点線で「10本のかたまり」だけを囲む。残り（jAns本）は通常表示のまま動かさない。
    // 縦方向は棒1本分の高さ(JH=10ユニット分)を基準にする（U単位の高さだと10倍狭すぎる）
    const JH0=10*U+9*U*.15;
    const xs2=src10.map(p=>p.x),m=4;
    const bx0=Math.min(...xs2)-stW/2-m, by0=srcCy-JH0/2-m;
    const bw0=Math.max(...xs2)-Math.min(...xs2)+stW+m*2, bh0=JH0+m*2;
    const dash=mk('rect',{x:bx0,y:by0,width:bw0,height:bh0,fill:'none',stroke:'#e74c3c','stroke-width':2,'stroke-dasharray':'5,4',rx:4,opacity:0},layer);
    tween(220,t=>dash.setAttribute('opacity',t),()=>{
      setTimeout(()=>{
        // 囲んだ10本を元の場所から外し、残りだけ通常表示で描き直す
        svgJAns.innerHTML='';
        posR.forEach(p=>{const g=mk('g',{},svgJAns);drawStick(g,p.x,p.y,U,1,SC);});
        // phase1: 点線で囲んだ部分（10本＋枠）だけを中心に縮小する
        const gs=src10.map(p=>{const g=mk('g',{},layer);drawStick(g,p.x,p.y,U,1,SC);return g;});
        tween(320,t=>{
          gs.forEach((g,i)=>{
            const cx=src10[i].x+(srcCx-src10[i].x)*t, cy=src10[i].y+(srcCy-src10[i].y)*t;
            const sc=1-.5*t;
            const dx=cx-src10[i].x, dy=cy-src10[i].y;
            g.setAttribute('transform',`translate(${dx},${dy}) translate(${src10[i].x},${src10[i].y}) scale(${sc}) translate(${-src10[i].x},${-src10[i].y})`);
          });
          const bw=bw0+(stW*1.2-bw0)*t, bh=bh0+(U*1.2-bh0)*t;
          dash.setAttribute('x',srcCx-bw/2);dash.setAttribute('y',srcCy-bh/2);
          dash.setAttribute('width',bw);dash.setAttribute('height',bh);
          dash.setAttribute('opacity',1-t);
        },()=>{
          // phase2: ひゃくタイルに変形しつつ目的地へ飛ぶ
          layer.innerHTML='';
          const g2=mk('g',{},layer);
          drawHyakuScaled(g2,srcCx,srcCy,su*.001,1,'#e74c3c'); // 初期はごく小さく
          tween(420,t=>{
            const cx=srcCx+(dest.x-srcCx)*t;
            const cy=srcCy+(dest.y-srcCy)*t;
            const sc=su*(.15+.85*t);
            layer.innerHTML='';
            const g3=mk('g',{},layer);
            drawHyakuScaled(g3,cx,cy,sc,1,'#e74c3c');
          },()=>{
            layer.innerHTML='';
            onDone();
          });
        });
      },480);
    });
    return;
  }

  // --- hyaku-calc: 百の位 ---
  if(animType==='hyaku-calc'){
    document.getElementById('row-ans').style.display='table-row';
    const svgHA=document.getElementById('svg-hyaku-a');
    const svgHB=document.getElementById('svg-hyaku-b');
    const svgHAns=document.getElementById('svg-hyaku-ans');
    const W=vbW('svg-hyaku-a'),H=vbH('svg-hyaku-a'),HB=vbH('svg-hyaku-b'),HA=vbH('svg-hyaku-ans');
    const isAnsSub = (CARRY_POS_MODE === 'ans-sub');
    // carry百タイルの出発位置
    const carryAbove = isAnsSub ? ansTopRight('hyaku') : aboveHdr('hdr-hyaku');
    const carrySrc=hasCarryJ?[carryAbove]:[];
    const srcA=Array.from({length:aH},(_,i)=>{
      const p=hyakuTilePos(i,aH,W,H,su);return svgToLayer(svgHA,p.cx,p.cy);});
    const srcB=Array.from({length:bH},(_,i)=>{
      const p=hyakuTilePos(i,bH,W,HB,su);return svgToLayer(svgHB,p.cx,p.cy);});
    const hTotal=hRaw;
    const dstAll=Array.from({length:hTotal},(_,i)=>{
      const p=hyakuTilePos(i,hTotal,W,HA,su);return svgToLayer(svgHAns,p.cx,p.cy);});
    const allSrc=[...carrySrc,...srcA,...srcB];
    renderHyakus(svgHA,aH,.25);renderHyakus(svgHB,bH,.25);
    svgHAns.innerHTML='';layer.innerHTML='';
    const hGs=allSrc.map((p,i)=>{
      const g=mk('g',{},layer);
      const isC=(hasCarryJ&&i===0);
      drawHyakuScaled(g,p.x,p.y,su,1,isC?'#e74c3c':SC); // 移動するタイル自体は濃い色のまま
      return g;
    });
    // くり上がりタイルが出発した瞬間に、残像（mark-layer）を半透明に切り替える。
    if(hasCarryJ){
      const ml=document.getElementById('mark-layer');ml.innerHTML='';
      // 十の位のくり上がり残像を先に再描画（消えないようにする）。棒と赤枠の両方を描く。
      if(prevState.markJ&&prevState.markJ.show){
        const posJ = isAnsSub ? ansTopRight('juu') : aboveHdr('hdr-juu');
        const JH=10*U+9*U*.15,bxJ=posJ.x-U/2,byJ=posJ.y-JH/2;
        const gJ=mk('g',{opacity:prevState.markJ.alpha},ml);
        for(let i=0;i<10;i++){const sh=JH/10;mk('rect',{x:bxJ,y:byJ+i*sh,width:U,height:sh-.3,fill:FC,stroke:SC,'stroke-width':.6,rx:.3},gJ);}
        mk('rect',{x:bxJ-1,y:byJ-1,width:U+2,height:JH+2,fill:'none',stroke:'#e74c3c','stroke-width':2,rx:1},gJ);
      }
      // 次に百の位のくり上がり残像を描く
      const pos = isAnsSub ? ansTopRight('hyaku') : aboveHdr('hdr-hyaku');
      const HW=vbW('svg-hyaku-ans'),HH_SVG=vbH('svg-hyaku-ans');
      const su2=U*Math.min((HW-8)/HYAKU_SIDE,(HH_SVG-8)/HYAKU_SIDE,1);
      const g=mk('g',{},ml);
      drawHyakuScaled(g,pos.x,pos.y,su2,.35,'#e74c3c');
    }
    tween(620,t=>{
      hGs.forEach((g,i)=>{
        const tx=allSrc[i].x+(dstAll[i].x-allSrc[i].x)*t;
        const ty=allSrc[i].y+(dstAll[i].y-allSrc[i].y)*t;
        g.setAttribute('transform',`translate(${tx-allSrc[i].x},${ty-allSrc[i].y})`);
      });
    },()=>{
      layer.innerHTML='';
      renderHyakus(svgHAns,hTotal,1);
      onDone();
    });
    return;
  }

  // --- carry-h: 百→千くり上がり ---
  if(animType==='carry-h'){
    const svgHAns=document.getElementById('svg-hyaku-ans');
    const W=vbW('svg-hyaku-ans'),HA=vbH('svg-hyaku-ans');
    // 現行の百タイル配置（斜めにずらし、5枚ごとに列を作る並び方）と同じ座標を使う。
    // 以前は横一列の仮の座標(stepずらし)を使っていたため、くり上がり時だけ並びが崩れて見えていた。
    const allPos=Array.from({length:hRaw},(_,i)=>{const p=hyakuTilePos(i,hRaw,W,HA,su);return{x:p.cx,y:p.cy};});
    const pos10=allPos.slice(0,10);
    const posR=allPos.slice(10);
    const src10=pos10.map(p=>svgToLayer(svgHAns,p.x,p.y));
    const dest=aboveHdr('hdr-sen');
    const srcCx=src10.reduce((s,p)=>s+p.x,0)/10;
    const srcCy=src10.reduce((s,p)=>s+p.y,0)/10;

    // 「10枚のかたまり（斜め5枚＋5枚の2列）」だけを六角形の点線で囲む。残り（hAns枚）は通常表示のまま動かさない。
    // 矩形で囲むと斜めに並ぶ他のタイルに重なってしまうため、1・5・6・10枚目のタイル四隅を結んだ六角形にする。
    const TW0=10*su+9*su*.15,hw=TW0/2,m=6;
    const p1=src10[0],p5=src10[4],p6=src10[5],p10=src10[9];
    const hexPts=[
      [p1.x-hw-m, p1.y+hw+m],   // ①1枚目の左下
      [p6.x+hw+m, p6.y+hw+m],   // ②6枚目の右下
      [p10.x+hw+m,p10.y+hw+m],  // ③10枚目の右下
      [p10.x+hw+m,p10.y-hw-m],  // ④10枚目の右上
      [p5.x-hw-m, p5.y-hw-m],   // ⑤5枚目の左上
      [p1.x-hw-m, p1.y-hw-m],   // ⑥1枚目の左上
    ];
    const dash=mk('polygon',{points:hexPts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#2980b9','stroke-width':2,'stroke-dasharray':'5,4',opacity:0},layer);
    tween(220,t=>dash.setAttribute('opacity',t),()=>{
      setTimeout(()=>{
        // 囲んだ10枚を元の場所から外し、残りだけ通常表示で描き直す
        svgHAns.innerHTML='';
        posR.forEach(p=>{const g=mk('g',{},svgHAns);drawHyakuScaled(g,p.x,p.y,su,1,SC);});
        // phase1: 点線で囲んだ部分（10枚＋六角形の枠）だけを中心に縮小する
        const gs=src10.map(p=>{const g=mk('g',{},layer);drawHyakuScaled(g,p.x,p.y,su,1,SC);return g;});
        tween(320,t=>{
          gs.forEach((g,i)=>{
            const cx=src10[i].x+(srcCx-src10[i].x)*t, cy=src10[i].y+(srcCy-src10[i].y)*t;
            const sc=1-.5*t;
            const dx=cx-src10[i].x, dy=cy-src10[i].y;
            g.setAttribute('transform',`translate(${dx},${dy}) translate(${src10[i].x},${src10[i].y}) scale(${sc}) translate(${-src10[i].x},${-src10[i].y})`);
          });
          const hsc=1-.85*t;
          dash.setAttribute('transform',`translate(${srcCx},${srcCy}) scale(${hsc}) translate(${-srcCx},${-srcCy})`);
          dash.setAttribute('opacity',1-t);
        },()=>{
          // phase2: せんタイルに変形しつつ真上へ飛ぶ
          layer.innerHTML='';
          const senSc=getSenScale();
          tween(420,t=>{
            const cx=srcCx+(dest.x-srcCx)*t;
            const cy=srcCy+(dest.y-srcCy)*t;
            const sc=senSc*(.15+.85*t);
            layer.innerHTML='';
            const g3=mk('g',{},layer);
            drawSenScaled(g3,cx,cy,sc,1,'#e74c3c');
          },()=>{
            layer.innerHTML='';
            // hAns枚残す（再描画はpaintTiles側でも行われるが、ここでも確定表示しておく）
            const svgH2=document.getElementById('svg-hyaku-ans');
            svgH2.innerHTML='';
            if(hAns>0)renderHyakus(svgH2,hAns,1);
            // 千タイルをヘッダー真上にしっかり表示で残す（まだ使われていないので半透明にしない）
            const gS=mk('g',{},layer);
            drawSenScaled(gS,dest.x,dest.y,senSc,1,'#e74c3c');
            onDone();
          });
        });
      },480);
    });
    return;
  }

  // --- sen-calc: ヘッダー真上のせんタイルが答え行(せんのくらい)へ降りてくる ---
  if(animType==='sen-calc'){
    document.getElementById('row-ans').style.display='table-row';
    const svgSenAns=document.getElementById('svg-sen-ans');
    svgSenAns.innerHTML='';
    const src=aboveHdr('hdr-sen');
    const senSc=getSenScale();
    const cx=vbW('svg-sen-ans')/2, cy=120/2;
    const dest=svgToLayer(svgSenAns,cx,cy);
    layer.innerHTML='';
    const g=mk('g',{},layer);
    drawSenScaled(g,src.x,src.y,senSc,1,SC);
    tween(450,t=>{
      const tx=src.x+(dest.x-src.x)*t;
      const ty=src.y+(dest.y-src.y)*t;
      g.setAttribute('transform',`translate(${tx-src.x},${ty-src.y})`);
    },()=>{
      layer.innerHTML='';
      renderSens(svgSenAns,1,1,null);
      onDone();
    });
    return;
  }

  layer.innerHTML='';
  onDone();
}

// 千タイルスケール計算
function getSenScale(){
  const W=110,H=110,u=U,G=u*.15,W10=10*u+9*G,H10=10*u+9*G,OX=u*.35,OY=u*.35;
  const needW=W10+9*OX,needH=H10+9*OY;
  return u*Math.min((W-6)/needW,(H-6)/needH);
}

// カードモード時の桁の必要幅を計算
// カードは「縦5枚×横の列」が基本のため、必要な列数はceil(枚数/5)で決まる
// （0〜10枚なら2列に収まる）。cardPositionsと同じ式を使うことで、
// 位取り表の列幅とカードの実際の描画幅が常に一致し、はみ出さない。
function cardNeedWidth(maxCount,place){
  const cfg=CARD_CFG[place];
  if(maxCount<=0)return cfg.w+20;
  const perCol=5;
  const cols=Math.max(1,Math.ceil(maxCount/perCol));
  const gapX=10;
  const needW=cols*cfg.w+(cols-1)*gapX;
  return Math.round(needW+16);
}

// ============================================================
// レイアウト更新（列の表示/非表示・幅の動的拡張・is-empty制御）
// <col>要素を1つ操作するだけで thead/tbody 両方の対応列が同時に
// 表示/非表示・幅変更される（tableの仕様）ため、ヘッダーとデータの
// ズレは構造的に発生しない。
// ============================================================
function updateLayout(){
  const aH=Math.floor(numA/100),aJ=Math.floor((numA%100)/10),aI=numA%10;
  const bH=Math.floor(numB/100),bJ=Math.floor((numB%100)/10),bI=numB%10;
  const ans=numA+numB;
  const has3=(aH>0||bH>0||ans>=100);
  const has4=(ans>=1000);

  // 百の位列（col要素の表示切替＋ th/td も同じ値で連動させ二重に保証する）
  const hyakuDisp=has3?'':'none';
  document.getElementById('colgrp-hyaku').style.display=has3?'table-column':'none';
  document.querySelectorAll('.th-hyaku, .td-hyaku').forEach(el=>{el.style.display=hyakuDisp;});
  // 千の位列
  const senDisp=has4?'':'none';
  document.getElementById('colgrp-sen').style.display=has4?'table-column':'none';
  document.querySelectorAll('.th-sen, .td-sen').forEach(el=>{el.style.display=senDisp;});

  const hasCarryI=(aI+bI>=10);
  const jRaw=aJ+bJ+(hasCarryI?1:0);
  const hasCarryJ=(jRaw>=10);
  const hRaw=aH+bH+(hasCarryJ?1:0);
  const maxJuuCount=Math.max(aJ,bJ,jRaw,1);
  const maxHyakuCount=Math.max(aH,bH,hRaw,1);

  let juuWidth,hyakuWidth;
  let hyakuHeights={'svg-hyaku-a':110,'svg-hyaku-b':110,'svg-hyaku-ans':120}; // 既定（カード方式や枚数が少ない場合はこのまま）
  if(DISPLAY_MODE==='card'){
    // カード方式：5枚で1ブロック・最大2列という固定レイアウトなので、
    // cardNeedWidthで実際に必要な幅を逆算する（桁数が増えても同じ式で対応）。
    juuWidth=Math.max(124,cardNeedWidth(maxJuuCount,'juu'));
    hyakuWidth=Math.max(124,cardNeedWidth(maxHyakuCount,'hyaku'));
  } else {
    // ---- 十の位の幅：この問題で表示しうる最大の棒の本数から逆算（5本ごとの間隔も含む）----
    const juuNeedW=stickLayout(maxJuuCount).totW+16; // 余白
    juuWidth=Math.max(124,Math.round(juuNeedW));
    // ---- 百の位：タイルの配置(hyakuRawPos/hyakuTilePosと同じ式)から必要な幅・高さを逆算し、
    //      枚数が多いときに6枚目以降の2列目分も含めてすべてのタイルが必ず収まるようにする ----
    const hyakuFp=n=>hyakuFootprint(n,U);
    hyakuWidth=Math.max(124,Math.round(hyakuFp(maxHyakuCount).width+8));
    hyakuHeights={
      'svg-hyaku-a':  Math.max(110,Math.round(hyakuFp(aH).height+8)),
      'svg-hyaku-b':  Math.max(110,Math.round(hyakuFp(bH).height+8)),
      'svg-hyaku-ans':Math.max(120,Math.round(hyakuFp(hRaw).height+8)),
    };
  }

  document.querySelector('col.col-juu').style.width=juuWidth+'px';
  ['svg-juu-a','svg-juu-b','svg-juu-ans'].forEach(id=>{
    const svg=document.getElementById(id);
    svg.setAttribute('width',juuWidth);
    const h=svg.getAttribute('viewBox').split(' ')[3];
    svg.setAttribute('viewBox',`0 0 ${juuWidth} ${h}`);
  });

  document.getElementById('colgrp-hyaku').style.width=hyakuWidth+'px';
  ['svg-hyaku-a','svg-hyaku-b','svg-hyaku-ans'].forEach(id=>{
    const svg=document.getElementById(id);
    const h=hyakuHeights[id];
    svg.setAttribute('width',hyakuWidth);
    svg.setAttribute('height',h);
    svg.setAttribute('viewBox',`0 0 ${hyakuWidth} ${h}`);
  });

  // (is-empty トグルは廃止)

  // 列幅・行高が確定してから、数図の表示倍率を落とさずに使える余白だけを
  // 右パネルへ割り当てる。倍率はこの問題の全ステップを基準に一度だけ決める。
  relayoutResponsiveCanvas();
}

// ============================================================
// 右カラム（筆算＋説明）の「問題全体で固定」ズーム
// ============================================================
// 【コンパクト縦長レイアウトの方針】
// ・右パネルは flex で余白を吸収させない。中身を表示するのに必要な幅だけ使う。
// ・問題生成時に全ステップの説明文と筆算外形を測り、問題全体で同じ倍率を使う。
// ・数図表より右パネルが低い場合だけ、中身そのものを拡大する。
// ・その拡大に必要な横幅だけ右パネルを広げる。空白を増やすためには広げない。
// ・右パネル拡大のために画面全体倍率が落ちるところまでは広げない。
// ・小さい問題では2枚の縦長カードを中央に寄せ、#stage自体は操作部を崩さない1040pxを維持。
//   最終表示は高さ優先のfitStageで画面の縦をできるだけ使う。
// ============================================================
const STEP_CONTENT_W=230;
const RP_ZOOM_MAX=2.2;
const BASE_STAGE_W=1040;
const MAX_STAGE_W=1600;
const RIGHT_PANEL_BOX_HPAD=36; // step-box の左右padding 18px×2（hissan-boxより大きい側）
const MAIN_AREA_HPAD=16;       // .main-area の左右padding 8px×2
const MAIN_AREA_GAP=12;
let stableRightPanelFactor=1;
let stableRightPanelHeightFactor=1;
let stableStepNaturalH=132;
let stableHissanNaturalW=210;
let stableHissanNaturalH=230;
let stableRightPanelW=266;
let stageDesignWidth=BASE_STAGE_W;
const TILE_ZOOM_MAX=2.4;
let stableTilePanelFactor=1;
let stableTileNaturalW=1;
let stableTileNaturalH=1;

// 全ステップの説明文を設計幅230pxで実際に流し込み、最も高いステップを測る。
// 現在ステップの文面は最後に必ず復元する。
function measureMaxStepNaturalHeight(){
  const stepInner=document.getElementById('step-scale-inner');
  const titleEl=document.getElementById('step-title-text');
  const descEl=document.getElementById('step-desc');
  if(!stepInner||!titleEl||!descEl)return 132;

  stepInner.style.transform='none';
  stepInner.style.width=STEP_CONTENT_W+'px';
  stepInner.style.height='auto';
  descEl.style.height='auto';
  descEl.style.overflow='visible';

  const current=steps[stepIdx]||steps[0];
  let maxH=0;
  const list=steps.length?steps:[{title:titleEl.innerHTML,desc:descEl.innerHTML}];
  for(const st of list){
    titleEl.innerHTML=st.title||'';
    descEl.innerHTML=st.desc||'';
    maxH=Math.max(maxH,stepInner.offsetHeight,stepInner.scrollHeight);
  }
  if(current){
    titleEl.innerHTML=current.title||'';
    descEl.innerHTML=current.desc||'';
  }
  return Math.max(100,Math.ceil(maxH));
}

// drawHissanそのものを一時SVGに対して全ステップ実行し、必要な最大外形を測る。
function measureHissanNaturalEnvelope(){
  if(!steps.length)return{w:210,h:230};
  let maxW=0,maxH=0;
  for(const st of steps){
    const probe=document.createElementNS(NS,'svg');
    drawHissan(probe,st.h);
    maxW=Math.max(maxW,parseFloat(probe.getAttribute('width'))||210);
    maxH=Math.max(maxH,parseFloat(probe.getAttribute('height'))||230);
  }
  return{w:Math.max(1,maxW),h:Math.max(1,maxH)};
}

function usefulBasePanelWidth(){
  return Math.ceil(Math.max(stableHissanNaturalW,STEP_CONTENT_W)+RIGHT_PANEL_BOX_HPAD);
}

// panelWを指定した場合、その幅の中で全ステップ共通倍率を適用する。
// panelW未指定時は「中身に必要な最小幅」を使う。
function applyStableRightPanelScale(panelW){
  const hissanOuter=document.getElementById('hissan-scale-outer');
  const hissanSvg=document.getElementById('hissan-svg');
  const stepOuter=document.getElementById('step-scale-outer');
  const stepInner=document.getElementById('step-scale-inner');
  const rightPanel=document.querySelector('.right-panel');
  const tileArea=document.querySelector('.tile-area');
  if(!hissanOuter||!hissanSvg||!stepOuter||!stepInner||!rightPanel||!tileArea)return;

  hissanSvg.style.transform='none';
  stepInner.style.transform='none';
  hissanOuter.style.height='';
  stepOuter.style.height='';
  stepInner.style.height='auto';
  stepInner.style.width=STEP_CONTENT_W+'px';

  stableStepNaturalH=measureMaxStepNaturalHeight();
  const env=measureHissanNaturalEnvelope();
  stableHissanNaturalW=env.w;
  stableHissanNaturalH=env.h;

  const basePanelW=usefulBasePanelWidth();
  stableRightPanelW=Math.max(basePanelW,Math.ceil(panelW||basePanelW));
  rightPanel.style.width=stableRightPanelW+'px';

  // 全ステップで同じ実レイアウト高を先に確保する。ステップ送りでは変更しない。
  hissanOuter.style.height=stableHissanNaturalH+'px';
  stepInner.style.height=stableStepNaturalH+'px';
  stepOuter.style.height=stableStepNaturalH+'px';

  const basePanelH=rightPanel.offsetHeight;
  const naturalContentH=stableHissanNaturalH+stableStepNaturalH;
  const fixedChromeH=Math.max(0,basePanelH-naturalContentH);
  const tileH=tileArea.offsetHeight;

  // 縦方向の有効倍率。右欄を数図より高くして全体を縮める拡大はしない。
  const targetPanelH=Math.max(basePanelH,tileH);
  const factorHeightRaw=(targetPanelH-fixedChromeH)/Math.max(1,naturalContentH);
  stableRightPanelHeightFactor=Math.min(RP_ZOOM_MAX,Math.max(1,factorHeightRaw));

  // 横方向は「実際の中身が収まるか」だけで制約する。
  const factorWidth=Math.min(
    hissanOuter.clientWidth/stableHissanNaturalW,
    stepOuter.clientWidth/STEP_CONTENT_W
  );
  let factor=Math.min(stableRightPanelHeightFactor,factorWidth,RP_ZOOM_MAX);
  factor=Math.max(0.1,factor);
  stableRightPanelFactor=factor;

  hissanSvg.style.transformOrigin='top center';
  hissanSvg.style.transform=`scale(${factor})`;
  hissanOuter.style.height=(stableHissanNaturalH*factor)+'px';

  stepInner.style.transformOrigin='top center';
  stepInner.style.transform=`scale(${factor})`;
  stepOuter.style.height=(stableStepNaturalH*factor)+'px';
}

function resetTilePanelScale(){
  const tileArea=document.getElementById('tile-area');
  const tileSlot=document.getElementById('tile-slot');
  if(!tileArea||!tileSlot)return;

  // 前回の拡大後サイズを測定に混ぜない。
  // tile-areaは表そのものにぴったり縮むため、ここで一度slotの固定寸法を解除してから
  // 自然幅・自然高を取り直す。これをしないと、前回のslot幅をtile-areaが吸収して
  // 「表の横の謎の余白」が自然幅として蓄積される。
  tileArea.style.transform='none';
  tileArea.style.width='max-content';
  tileSlot.style.width='auto';
  tileSlot.style.height='auto';
  stableTilePanelFactor=1;

  const table=document.getElementById('tile-table');
  stableTileNaturalW=Math.max(1,Math.ceil(table?table.offsetWidth:tileArea.offsetWidth));
  stableTileNaturalH=Math.max(1,Math.ceil(tileArea.offsetHeight));
  tileSlot.style.width=stableTileNaturalW+'px';
  tileSlot.style.height=stableTileNaturalH+'px';
}

function applyTilePanelScale(factor){
  const tileArea=document.getElementById('tile-area');
  const tileSlot=document.getElementById('tile-slot');
  if(!tileArea||!tileSlot)return;
  stableTilePanelFactor=Math.max(1,Math.min(TILE_ZOOM_MAX,factor||1));
  tileArea.style.transformOrigin='top left';
  tileArea.style.transform=`scale(${stableTilePanelFactor})`;
  tileSlot.style.width=(stableTileNaturalW*stableTilePanelFactor)+'px';
  tileSlot.style.height=(stableTileNaturalH*stableTilePanelFactor)+'px';
}

function currentTableWidth(){
  const tileSlot=document.getElementById('tile-slot');
  return tileSlot?Math.ceil(tileSlot.offsetWidth):0;
}

function stageWidthForPanel(panelW){
  return Math.max(BASE_STAGE_W,currentTableWidth()+MAIN_AREA_GAP+MAIN_AREA_HPAD+panelW);
}

function relayoutResponsiveCanvas(){
  const stage=document.getElementById('stage');
  const rightPanel=document.querySelector('.right-panel');
  const tileArea=document.getElementById('tile-area');
  if(!stage||!rightPanel||!tileArea||!steps.length)return;

  // 毎回まず数図のローカル拡大を解除し、問題そのものの自然寸法を基準に計算する。
  resetTilePanelScale();

  // Pass 1: 右欄を内容に必要な最小幅へ戻し、問題全体で固定する説明・筆算倍率を確定。
  stage.style.width=BASE_STAGE_W+'px';
  applyStableRightPanelScale();
  const basePanelW=usefulBasePanelWidth();
  const baselineW=Math.min(MAX_STAGE_W,stageWidthForPanel(basePanelW));
  stageDesignWidth=baselineW;
  stage.style.width=baselineW+'px';
  applyStableRightPanelScale(basePanelW);

  // この基準高さで画面縦を使い切る倍率を保ったまま、横に使える設計幅を求める。
  const baselineH=Math.max(1,stage.scrollHeight);
  const scaleByHeight=window.innerHeight/baselineH;
  const noShrinkMaxW=Math.min(MAX_STAGE_W,window.innerWidth/Math.max(.01,scaleByHeight));

  // 右側は従来どおり「中身を実際に拡大できる分だけ」横幅を増やす。
  const desiredPanelW=Math.ceil(
    Math.max(stableHissanNaturalW,STEP_CONTENT_W)*stableRightPanelHeightFactor+RIGHT_PANEL_BOX_HPAD
  );
  const maxPanelWithoutShrink=Math.max(
    basePanelW,
    Math.floor(noShrinkMaxW-stableTileNaturalW-MAIN_AREA_GAP-MAIN_AREA_HPAD)
  );
  const targetPanelW=Math.max(basePanelW,Math.min(desiredPanelW,maxPanelWithoutShrink));
  rightPanel.style.width=targetPanelW+'px';
  applyStableRightPanelScale(targetPanelW);

  // ここが今回の変更点。
  // 右パネルの方が高い場合は、その実高さまで数図ブロック全体を縦横同比率で拡大する。
  // ただし、その拡大で stage 全体の倍率が下がる直前（横幅制約）で止める。
  const desiredTileFactor=Math.max(1,rightPanel.offsetHeight/stableTileNaturalH);
  const availableTileW=Math.max(
    stableTileNaturalW,
    noShrinkMaxW-targetPanelW-MAIN_AREA_GAP-MAIN_AREA_HPAD
  );
  const maxTileFactorByWidth=Math.max(1,availableTileW/stableTileNaturalW);
  const targetTileFactor=Math.min(TILE_ZOOM_MAX,desiredTileFactor,maxTileFactorByWidth);
  applyTilePanelScale(targetTileFactor);

  stableRightPanelW=targetPanelW;
  const targetW=Math.min(MAX_STAGE_W,stageWidthForPanel(targetPanelW));
  stageDesignWidth=targetW;
  stage.style.width=targetW+'px';
  fitStage();
}

// ============================================================
// UI更新
// ============================================================

// 筆算側の1ステップ分を実行する。くり上がり分割アニメがあればそれを再生して
// 完了後に最終形を描き、なければ即座に最終形を描く。どちらの場合もonDoneを呼ぶ。
function runHissanSide(step,prevH,onDone){
  const hissanSvg=document.getElementById('hissan-svg');
  if(step.hissanSplit){
    drawHissan(hissanSvg,prevH); // くり上がり前（2桁の生の合計）をまず描く
    runHissanCarrySplit(hissanSvg,step.hissanSplit,()=>{drawHissan(hissanSvg,step.h);onDone();});
  } else {
    drawHissan(hissanSvg,step.h);
    onDone();
  }
}

// 図解側の1ステップ分を実行する。アニメ指定があれば再生して完了後に最終状態を描き、
// なければ即座に最終状態を描く。どちらの場合もonDoneを呼ぶ。
function runTileSide(step,prevT,onDone){
  if(!step.anim){
    paintTiles(step.t);
    onDone();
    return;
  }
  paintTiles(prevT);
  runAnim(step.anim,prevT,step.t,()=>{
    // carry-i後はjuuAnsを空にする（layerに棒がある）
    if(step.anim==='carry-i'){
      const ts=cloneState(step.t);
      ts.juuAns={count:0,alpha:1,hl:null};
      paintTiles(ts);
    } else if(step.anim==='carry-j'){
      // carry-j後はhyakuAnsを空にする
      const ts=cloneState(step.t);
      ts.hyakuAns={count:0,alpha:1,hl:null};
      paintTiles(ts);
    } else if(step.anim==='carry-h'){
      const ts=cloneState(step.t);
      ts.senAns={count:0,alpha:1,hl:null};
      paintTiles(ts);
    } else {
      paintTiles(step.t);
    }
    onDone();
  });
}

function updateUI(skipAnim){
  const step=steps[stepIdx];
  const total=steps.length;
  document.getElementById('step-num').textContent=stepIdx+1;
  document.getElementById('step-title-text').innerHTML=step.title;
  document.getElementById('step-desc').innerHTML=step.desc;
  speakStep(step.desc);
  document.getElementById('step-ind').textContent=`${stepIdx+1} / ${total}`;

  const prevH=stepIdx>0?steps[stepIdx-1].h:step.h;
  const prevT=stepIdx>0?steps[stepIdx-1].t:step.t;

  if(skipAnim){
    // 問題切り替え・モード切り替え・「戻る」など：アニメなしで最終状態を即座に描く
    drawHissan(document.getElementById('hissan-svg'),step.h);
    paintTiles(step.t);
    document.getElementById('btn-prev').disabled=(stepIdx===0);
    document.getElementById('btn-next').disabled=(stepIdx===total-1);
    return;
  }

  animBusy=true;
  document.getElementById('btn-prev').disabled=true;
  document.getElementById('btn-next').disabled=true;
  function finish(){
    animBusy=false;
    document.getElementById('btn-prev').disabled=(stepIdx===0);
    document.getElementById('btn-next').disabled=(stepIdx===total-1);
  }

  if(TIMING_MODE==='tile-first'){
    // 図解が終わってから一呼吸おいて筆算
    runTileSide(step,prevT,()=>{
      setTimeout(()=>{runHissanSide(step,prevH,finish);},SEQ_GAP_MS);
    });
  } else if(TIMING_MODE==='hissan-first'){
    // 筆算が終わってから一呼吸おいて図解
    runHissanSide(step,prevH,()=>{
      setTimeout(()=>{runTileSide(step,prevT,finish);},SEQ_GAP_MS);
    });
  } else {
    // sync：両方を同時に開始（従来どおり、間は入れない）
    let doneCount=0;
    function onOneDone(){doneCount++;if(doneCount>=2)finish();}
    runHissanSide(step,prevH,onOneDone);
    runTileSide(step,prevT,onOneDone);
  }
}

function goStep(dir){
  if(animBusy)return;
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  const newIdx=stepIdx+dir;
  if(newIdx<0||newIdx>=steps.length)return;
  stepIdx=newIdx;
  updateUI(dir<0);
}

// くり上がり位置（補助計算の位置）の切り替え
function setCarryPosMode(mode){
  if(animBusy||mode===CARRY_POS_MODE)return;
  cancelAnim();
  CARRY_POS_MODE=mode;
  try{localStorage.setItem('tashizan_carry_pos',mode);}catch(e){}
  syncSettingsUI();
  document.getElementById('anim-layer').innerHTML='';
  steps=buildSteps();
  updateLayout();
  updateUI(true);
}

// 設定モーダルの開閉
function openSettingsModal(){
  syncSettingsUI();
  const modal=document.getElementById('settings-modal');
  modal.style.display='flex';
  requestAnimationFrame(()=>{modal.classList.add('open');});
}

function closeSettingsModal(){
  const modal=document.getElementById('settings-modal');
  modal.classList.remove('open');
  setTimeout(()=>{modal.style.display='none';},250);
}

function onModalOverlayClick(e){
  if(e.target===document.getElementById('settings-modal')){
    closeSettingsModal();
  }
}

// 設定UIの選択状態を現在の変数に同期する
function syncSettingsUI(){
  const isTop = (CARRY_POS_MODE === 'top');
  document.getElementById('carry-pos-top').classList.toggle('active', isTop);
  document.getElementById('carry-pos-ans').classList.toggle('active', !isTop);

  document.getElementById('mode-btn-tile').classList.toggle('active', DISPLAY_MODE==='tile');
  document.getElementById('mode-btn-card').classList.toggle('active', DISPLAY_MODE==='card');

  document.getElementById('timing-btn-sync').classList.toggle('active', TIMING_MODE==='sync');
  document.getElementById('timing-btn-tile-first').classList.toggle('active', TIMING_MODE==='tile-first');
  document.getElementById('timing-btn-hissan-first').classList.toggle('active', TIMING_MODE==='hissan-first');
  document.getElementById('seq-gap-row').style.display = (TIMING_MODE==='sync') ? 'none' : 'flex';
  document.getElementById('seq-gap-input').value = (SEQ_GAP_MS / 1000).toFixed(1);
}

// タイル方式／カード方式の切り替え。
// stepsのデータ自体（数値・状態）はモードに依存しないので作り直さなくてよく、
// レイアウト幅の再計算と、現在のステップの再描画だけ行えばよい。
function setDisplayMode(mode){
  if(animBusy||mode===DISPLAY_MODE)return;
  cancelAnim();
  DISPLAY_MODE=mode;
  try{localStorage.setItem('tashizan_display_mode',mode);}catch(e){}
  syncSettingsUI();
  document.getElementById('anim-layer').innerHTML='';
  updateLayout();
  updateUI(true);
}

// 表示タイミングの切り替え（同時／図→筆算／筆算→図）。
// 問題やタイル/カード表示モードとは独立の設定で、問題を切り替えても保持する。
function setTimingMode(mode){
  if(animBusy||mode===TIMING_MODE)return;
  cancelAnim();
  TIMING_MODE=mode;
  try{localStorage.setItem('tashizan_timing_mode',mode);}catch(e){}
  syncSettingsUI();
}

// 「間」調整ボックスの値（秒）が変更されたときに呼ばれる。0.1秒単位、0〜5秒の範囲にクランプする。
function setSeqGap(val){
  let sec=parseFloat(val);
  if(!Number.isFinite(sec))sec=0.4;
  sec=Math.min(5,Math.max(0,Math.round(sec*10)/10));
  document.getElementById('seq-gap-input').value=sec;
  SEQ_GAP_MS=Math.round(sec*1000);
  try{localStorage.setItem('tashizan_seq_gap',sec.toString());}catch(e){}
}

function setProblem(a,b){
  if(animBusy)return;
  cancelAnim();
  numA=a;numB=b;stepIdx=0;
  document.getElementById('inp-a').value=a;
  document.getElementById('inp-b').value=b;
  document.querySelectorAll('.problem-btn').forEach(btn=>{
    btn.classList.toggle('active',btn.textContent.replace(/\s/g,'')==`${a}＋${b}`);
  });
  document.getElementById('anim-layer').innerHTML='';
  steps=buildSteps();
  updateLayout();
  updateUI(true);
}

function generateFromInput(){
  const va=parseInt(document.getElementById('inp-a').value);
  const vb=parseInt(document.getElementById('inp-b').value);
  const err=document.getElementById('err-msg');
  if(!Number.isInteger(va)||!Number.isInteger(vb)||va<1||va>999||vb<1||vb>999){
    err.style.display='block';setTimeout(()=>err.style.display='none',2500);return;
  }
  err.style.display='none';
  document.querySelectorAll('.problem-btn').forEach(btn=>btn.classList.remove('active'));
  numA=va;numB=vb;stepIdx=0;
  cancelAnim();
  document.getElementById('anim-layer').innerHTML='';
  steps=buildSteps();
  updateLayout();
  updateUI(true);
}

document.getElementById('inp-a').addEventListener('keydown',e=>{if(e.key==='Enter')generateFromInput();});
document.getElementById('inp-b').addEventListener('keydown',e=>{if(e.key==='Enter')generateFromInput();});

// キーボード操作：テキストボックス外でのEnter／←→キーでステップ送り
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  const inTextField=(tag==='INPUT'||tag==='TEXTAREA');
  if(e.key==='Escape'){
    closeSettingsModal();
    return;
  }
  if(e.key==='Enter'){
    if(inTextField)return; // 入力欄内のEnterは各入力欄のリスナーに任せる
    e.preventDefault();
    if(!document.getElementById('btn-next').disabled)goStep(1);
    return;
  }
  if(e.key==='ArrowRight'){
    if(inTextField)return; // 数値入力欄では矢印キーの本来の動作を優先する
    e.preventDefault();
    if(!document.getElementById('btn-next').disabled)goStep(1);
    return;
  }
  if(e.key==='ArrowLeft'){
    if(inTextField)return;
    e.preventDefault();
    if(!document.getElementById('btn-prev').disabled)goStep(-1);
    return;
  }
});

// ===== 画面サイズに合わせて、問題ごとに決めた設計幅のステージを拡大縮小 =====
// getBoundingClientRect()由来の画面ピクセルをアニメレイヤー座標へ戻すため、
// 最終的な全体倍率は従来どおり STAGE_SCALE に保持する。
let STAGE_SCALE=1;
function fitStage(){
  const stage=document.getElementById('stage');
  if(!stage)return;
  const h=stage.scrollHeight;
  const w=stage.offsetWidth||stageDesignWidth||BASE_STAGE_W;
  if(!h||!w)return;
  const scale=Math.min(window.innerWidth/w,window.innerHeight/h);
  STAGE_SCALE=scale;
  stage.style.transform=`scale(${scale})`;
  stage.style.opacity='1';
}

// 初期化：stepsを先に作り、全ステップの説明・筆算状態を測ってから倍率を確定する。
syncSettingsUI();
steps=buildSteps();
updateLayout();
warmupTTS();
updateUI(true);
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,warmupTTS,{once:true}));

window.addEventListener('resize',relayoutResponsiveCanvas);
window.addEventListener('orientationchange',relayoutResponsiveCanvas);
new ResizeObserver(fitStage).observe(document.getElementById('stage'));
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(()=>{relayoutResponsiveCanvas();});
}

</script>
